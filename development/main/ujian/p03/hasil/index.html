ya sendiri dan mengatakan urusannya sangat penting. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak memberikan data, menjelaskan bahwa data pribadi warga dilindungi, dan menawarkan menyampaikan pesannya melalui jalur resmi\"},{\"huruf\":\"B\",\"teks\":\"Menyarankan orang itu menanyakan alamat kerabatnya langsung ke kantor kelurahan tempat tinggal kerabatnya\"},{\"huruf\":\"C\",\"teks\":\"Memberikan data yang diminta karena orang itu menunjukkan KTP dan alasannya terdengar meyakinkan\"},{\"huruf\":\"D\",\"teks\":\"Menolak memberikan data dengan sopan dan menjelaskan bahwa data pribadi warga dilindungi undang-undang sehingga tidak dapat diberikan kepada orang lain\"},{\"huruf\":\"E\",\"teks\":\"Menyampaikan bahwa Anda tidak berwenang memutuskan dan meminta orang itu menunggu atasan Anda kembali ke kantor\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":2,\"C\":1,\"D\":4,\"E\":3},\"pembahasan\":{\"inti\":\"Data pribadi warga yang dikelola instansi wajib **dilindungi**. Pengakuan sebagai kerabat dan KTP milik pemohon sendiri tidak membuktikan bahwa pemilik data setuju datanya dibuka. Petugas yang baik menolak dengan sopan dan menjelaskan alasannya. Petugas yang lebih baik lagi juga **menawarkan jalan keluar yang sah**, misalnya menyampaikan pesan kepada pemilik data sehingga pemilik data sendiri yang memutuskan untuk menghubungi.\",\"opsi\":{\"A\":\"Paling ideal. Data terlindungi, alasannya jelas, dan kebutuhan pemohon tetap dibantu melalui cara yang sah.\",\"B\":\"Melempar masalah ke instansi lain, yang juga tidak boleh membuka data tersebut.\",\"C\":\"Paling buruk. Membocorkan data pribadi tanpa persetujuan pemiliknya dapat membahayakan warga dan melanggar hukum.\",\"D\":\"Sikap yang benar, tetapi berhenti pada penolakan tanpa menawarkan solusi bagi pemohon.\",\"E\":\"Tidak membocorkan data, tetapi ragu terhadap aturan yang jelas. Keputusan yang mestinya dapat diambil sendiri ditunda kepada atasan.\"},\"konsep\":\"**Pelindungan data pribadi:** data hanya dibuka kepada pemiliknya atau pihak yang berwenang sesuai aturan. Pola bobot: 5 = tolak + jelaskan + tawarkan cara sah; 4 = tolak + jelaskan; 3 = menunda kepada atasan; 2 = melempar; 1 = membocorkan.\"},\"tips\":\"Permintaan data orang lain dengan alasan kekerabatan atau urusan penting adalah pola **rekayasa sosial**. Jawaban terbaik selalu melindungi data dan menawarkan saluran yang sah.\",\"rujukan\":[\"UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi\"]},{\"id\":\"p03-074\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Pimpinan meminta Anda bekerja sama dengan karang taruna setempat untuk menyosialisasikan program pemeriksaan kesehatan gratis kepada warga. Langkah Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengirim bahan sosialisasi kepada pengurus karang taruna dan meminta mereka membagikannya kepada warga\"},{\"huruf\":\"B\",\"teks\":\"Mengerjakan sosialisasi sendiri karena khawatir anggota karang taruna kurang serius\"},{\"huruf\":\"C\",\"teks\":\"Menjanjikan uang saku besar dari anggaran kantor yang sebenarnya belum tersedia agar mereka bersedia membantu\"},{\"huruf\":\"D\",\"teks\":\"Mengajak pengurus karang taruna merencanakan kegiatan bersama, membagi peran, dan menyepakati cara melaporkan hasilnya\"},{\"huruf\":\"E\",\"teks\":\"Mengundang pengurus karang taruna ke rapat persiapan dan meminta mereka menjalankan rencana sosialisasi yang sudah disusun kantor\"}],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":2,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Kerja sama dengan organisasi masyarakat berhasil jika mitra **dilibatkan sejak perencanaan**. Karang taruna mengenal warga dan cara berkomunikasi yang cocok di lingkungannya. Merencanakan bersama memanfaatkan pengetahuan itu dan menumbuhkan rasa memiliki. Pembagian peran dan kesepakatan pelaporan membuat kerja sama jelas dan hasilnya dapat dipantau. Mitra diperlakukan sebagai rekan, bukan sekadar pelaksana perintah.\",\"opsi\":{\"A\":\"Ada kerja sama, tetapi minim. Mitra hanya menjadi penyalur bahan tanpa terlibat menentukan cara sosialisasi. Pesan sosialisasi juga belum tentu sesuai dengan cara warga setempat menerima informasi.\",\"B\":\"Menolak kerja sama yang diminta pimpinan karena prasangka terhadap mitra. Kekhawatiran itu tidak didasarkan pada pengalaman nyata, dan pengetahuan karang taruna tentang warga setempat terbuang.\",\"C\":\"Paling buruk. Menjanjikan anggaran yang tidak tersedia adalah tidak jujur dan merusak kepercayaan mitra.\",\"D\":\"Paling ideal. Partisipatif, perannya jelas, dan ada mekanisme pelaporan.\",\"E\":\"Melibatkan mitra, tetapi hanya sebagai pelaksana. Pengetahuan mereka tentang warga tidak dimanfaatkan dalam perencanaan.\"},\"konsep\":\"**Tingkat pelibatan mitra:** diberi tahu → diajak melaksanakan → **diajak merencanakan dan mengevaluasi**. Semakin tinggi tingkat pelibatan, semakin tinggi bobotnya dalam aspek jejaring kerja.\"},\"tips\":\"Dalam soal jejaring kerja, pilih opsi yang memperlakukan mitra sebagai **rekan sejajar**: merencanakan bersama, membagi peran, dan menyepakati evaluasi.\",\"rujukan\":[]},{\"id\":\"p03-075\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Atasan menugasi Anda, pegawai yang baru dua tahun bekerja, untuk membimbing rekan-rekan memakai aplikasi pengelolaan arsip yang baru. Seorang rekan senior menolak dan berkata bahwa ia tidak perlu diajari oleh pegawai muda. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melaporkan kepada atasan bahwa rekan senior itu menolak mengikuti bimbingan\"},{\"huruf\":\"B\",\"teks\":\"Membiarkan rekan senior itu dan hanya membantunya jika ia sendiri yang meminta\"},{\"huruf\":\"C\",\"teks\":\"Mengerjakan semua input arsip rekan senior itu memakai akunnya agar pekerjaannya tetap berjalan\"},{\"huruf\":\"D\",\"teks\":\"Menyiapkan panduan tertulis singkat bergambar dan menitipkannya di meja rekan senior itu tanpa banyak bicara agar ia bisa belajar sendiri\"},{\"huruf\":\"E\",\"teks\":\"Mendekatinya dengan santun, menanyakan kendalanya, dan menawarkan waktu belajar bersama yang ia pilih sendiri\"}],\"kunci\":\"E\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Penolakan rekan senior biasanya berasal dari rasa canggung atau khawatir terlihat tidak mampu, bukan dari kebencian. Pegawai muda yang bijak **menjaga harga diri** rekan senior. Ia mendekati secara pribadi, menanyakan kendalanya, dan membiarkan rekan senior memilih waktu. Posisi yang diambil adalah rekan belajar, bukan guru. Cara ini menjaga hubungan kerja dan tetap menjalankan tugas dari atasan.\",\"opsi\":{\"A\":\"Terlalu cepat membawa masalah ke atasan sebelum ada usaha pendekatan. Hubungan dengan rekan senior bisa memburuk.\",\"B\":\"Pasif. Tugas dari atasan tidak dijalankan untuk rekan ini, dan ia bisa tertinggal.\",\"C\":\"Paling buruk. Memakai akun orang lain melanggar keamanan sistem, dan rekan senior tetap tidak menguasai aplikasi.\",\"D\":\"Kreatif dan menghormati privasi rekan senior, tetapi tanpa komunikasi langsung kendalanya tidak diketahui.\",\"E\":\"Paling ideal. Santun, mencari akar masalah, menghargai rekan senior, dan tugas tetap berjalan.\"},\"konsep\":\"**Membangun jejaring lintas generasi:** hormati pengalaman senior, tawarkan bantuan sebagai rekan, dan beri ruang pilihan. Pola bobot: 5 = pendekatan pribadi yang santun; 4 = bantuan tidak langsung; 3 = menunggu; 2 = melapor terlalu cepat; 1 = melanggar aturan sistem.\"},\"tips\":\"Jika ada penolakan dari rekan, opsi bernilai 5 biasanya **mendekati secara pribadi dan mencari tahu kendalanya** sebelum melibatkan atasan.\",\"rujukan\":[]},{\"id\":\"p03-076\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Kantor Anda bekerja sama dengan sebuah organisasi masyarakat dalam program pelatihan keterampilan warga. Organisasi itu belum menyerahkan laporan kegiatannya, padahal laporan Anda kepada pimpinan bergantung pada data tersebut dan tenggatnya tinggal tiga hari. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menghubungi pengurus organisasi untuk menanyakan kendala, menawarkan format laporan yang lebih sederhana, dan menyepakati tenggat baru\"},{\"huruf\":\"B\",\"teks\":\"Mengirim surat resmi berisi pengingat tenggat laporan, lalu menunggu balasan dari organisasi tersebut\"},{\"huruf\":\"C\",\"teks\":\"Mengisi bagian laporan yang kosong dengan perkiraan Anda sendiri agar laporan dapat diserahkan tepat waktu\"},{\"huruf\":\"D\",\"teks\":\"Mengusulkan kepada pimpinan agar organisasi itu tidak diajak bekerja sama lagi pada program berikutnya\"},{\"huruf\":\"E\",\"teks\":\"Menyusun laporan dari data yang sudah ada dan memberi catatan jelas kepada pimpinan tentang bagian yang masih menunggu data dari organisasi mitra\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":1,\"D\":2,\"E\":4},\"pembahasan\":{\"inti\":\"Keterlambatan mitra perlu diselesaikan dengan **komunikasi langsung dan solusi bersama**. Bisa saja mitra kesulitan dengan format laporan atau kekurangan tenaga. Menanyakan kendala, menawarkan format yang lebih sederhana, dan menyepakati tenggat baru membantu mitra menyelesaikan tugasnya. Laporan Anda pun tetap dapat selesai tepat waktu. Hubungan kerja sama juga terjaga untuk program berikutnya.\",\"opsi\":{\"A\":\"Paling ideal. Mencari akar masalah, menawarkan bantuan konkret, dan menyepakati solusi bersama mitra.\",\"B\":\"Sesuai prosedur, tetapi pasif. Surat resmi saja mungkin tidak menyelesaikan kendala mitra dalam tiga hari. Kendala yang mungkin dialami mitra juga tidak tergali.\",\"C\":\"Paling buruk. Mengisi data dengan perkiraan sendiri sama dengan memalsukan laporan.\",\"D\":\"Menghukum mitra tanpa mencari tahu penyebabnya dan merusak jejaring kerja yang sudah dibangun. Masalah laporan saat ini juga tetap belum terselesaikan.\",\"E\":\"Jujur dan transparan, tetapi tidak berusaha membantu mitra melengkapi datanya. Laporan menjadi tidak lengkap.\"},\"konsep\":\"**Menghadapi mitra yang terlambat:** komunikasi langsung → cari kendala → tawarkan bantuan → sepakati ulang. Hindari memalsukan data atau memutus kerja sama tanpa klarifikasi.\"},\"tips\":\"Pada soal mitra bermasalah, opsi bernilai 5 biasanya **membantu mitra menyelesaikan kendalanya**, bukan sekadar menagih atau menghukum.\",\"rujukan\":[]},{\"id\":\"p03-077\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Pada hari yang sama, dua unit lain meminta bantuan Anda menyiapkan data untuk kegiatan mereka. Keduanya menyatakan permintaannya mendesak, dan Anda tidak mungkin mengerjakan keduanya secara penuh pada hari itu. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mendahulukan permintaan dari unit yang kepala unitnya lebih senior\"},{\"huruf\":\"B\",\"teks\":\"Mengerjakan permintaan yang datang lebih dulu dan memberi tahu unit kedua bahwa Anda sedang sibuk\"},{\"huruf\":\"C\",\"teks\":\"Menanyakan tenggat dan dampak setiap permintaan, menyampaikan kemampuan Anda kepada kedua unit, lalu menyepakati prioritas dengan atasan\"},{\"huruf\":\"D\",\"teks\":\"Membagi waktu sama rata untuk kedua unit agar terasa adil, walaupun hasil kedua permintaan itu mungkin belum selesai sepenuhnya pada hari itu\"},{\"huruf\":\"E\",\"teks\":\"Menyanggupi kedua permintaan walaupun Anda tahu tidak akan selesai, lalu menyerahkan hasil seadanya\"}],\"kunci\":\"C\",\"bobot\":{\"A\":2,\"B\":3,\"C\":5,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Dalam jejaring kerja, kepercayaan dibangun dengan **keterbukaan tentang kemampuan** dan **prioritas yang jelas**. Pegawai yang baik tidak menebak mana yang lebih penting. Ia menanyakan tenggat dan dampak setiap permintaan, menyampaikan secara jujur apa yang dapat dikerjakan, dan melibatkan atasan untuk menetapkan prioritas jika keduanya sama-sama penting. Kedua unit mendapat kepastian, dan keputusan prioritas memiliki dasar yang jelas.\",\"opsi\":{\"A\":\"Prioritas didasarkan pada senioritas pejabat, bukan pada kepentingan pekerjaan. Unit lain dapat merasa diperlakukan tidak adil.\",\"B\":\"Ada dasar yang masuk akal (urutan datang), tetapi unit kedua hanya diberi tahu sibuk tanpa kepastian kapan dibantu.\",\"C\":\"Paling ideal. Prioritas ditentukan berdasarkan dampak, komunikasinya terbuka, dan keputusan melibatkan atasan.\",\"D\":\"Niatnya adil, tetapi kurang efektif. Jika salah satu permintaan jauh lebih mendesak, pembagian sama rata bisa membuat keduanya gagal.\",\"E\":\"Paling buruk. Menyanggupi tanpa kemampuan dan menyerahkan hasil seadanya merugikan kedua unit dan merusak kepercayaan.\"},\"konsep\":\"**Mengelola permintaan yang bertabrakan:** nilai tenggat dan dampaknya, sampaikan kapasitas secara jujur, lalu tetapkan prioritas bersama pihak yang berwenang. Pola bobot: 5 = berbasis dampak + transparan + melibatkan atasan; 1 = menyanggupi tanpa kemampuan.\"},\"tips\":\"Jika ada dua tuntutan yang tidak mungkin dipenuhi bersamaan, pilih opsi yang **jujur tentang kapasitas** dan **menetapkan prioritas berdasarkan dampak**, bukan berdasarkan siapa yang meminta.\",\"rujukan\":[]},{\"id\":\"p03-078\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda ditunjuk sebagai penghubung kantor dengan sebuah perguruan tinggi untuk program magang mahasiswa. Kantor belum pernah menjalankan program serupa. Langkah Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyerahkan pengaturan program sepenuhnya kepada pihak kampus karena merekalah yang membutuhkan tempat magang\"},{\"huruf\":\"B\",\"teks\":\"Menyusun rencana bersama kampus tentang kebutuhan unit, pembimbing, dan jadwal evaluasi, lalu menetapkan kontak tetap\"},{\"huruf\":\"C\",\"teks\":\"Menghubungi kampus untuk menyepakati jumlah peserta dan jadwal magang yang sesuai dengan kebutuhan unit-unit di kantor\"},{\"huruf\":\"D\",\"teks\":\"Menerima mahasiswa yang direkomendasikan kerabat Anda lebih dulu tanpa melalui seleksi yang disepakati bersama kampus\"},{\"huruf\":\"E\",\"teks\":\"Mengirim surat penawaran magang ke kampus, lalu menunggu kampus mengirimkan daftar mahasiswa yang berminat\"}],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":4,\"D\":1,\"E\":3},\"pembahasan\":{\"inti\":\"Kerja sama antarlembaga membutuhkan **kesepakatan yang jelas sejak awal**: tujuan, kebutuhan, peran, dan cara evaluasi. Sebagai penghubung, Anda menyatukan kebutuhan kantor dan kampus. Rencana bersama yang memuat kebutuhan unit, pembimbing, dan jadwal evaluasi membuat program berjalan tertib dan bermanfaat bagi kedua pihak. Kontak tetap dari kedua lembaga memudahkan koordinasi jika ada masalah selama magang berlangsung.\",\"opsi\":{\"A\":\"Menghindar dari peran penghubung. Kantor kehilangan kendali atas program yang dijalankan di tempatnya sendiri.\",\"B\":\"Paling ideal. Perencanaan bersama, peran jelas, ada evaluasi, dan jalur komunikasi tetap.\",\"C\":\"Baik dan proaktif, tetapi baru menyentuh hal teknis (jumlah dan jadwal). Pembimbing dan evaluasi belum disepakati.\",\"D\":\"Paling buruk. Mendahulukan kenalan tanpa seleksi adalah nepotisme dan merusak kepercayaan mitra.\",\"E\":\"Sesuai prosedur, tetapi pasif. Penghubung hanya menunggu tanpa ikut merancang program.\"},\"konsep\":\"**Unsur kerja sama yang sehat:** tujuan bersama, pembagian peran, jalur komunikasi, dan evaluasi. Pola bobot: 5 = keempatnya ada; 4 = sebagian; 3 = prosedural dan pasif; 2 = menyerahkan semuanya; 1 = melanggar prinsip keadilan.\"},\"tips\":\"Untuk soal peran penghubung, pilih opsi yang **merancang bersama dan menyiapkan evaluasi**. Opsi yang hanya mengirim surat atau menunggu biasanya bernilai menengah.\",\"rujukan\":[]},{\"id\":\"p03-079\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda bersama seorang rekan dari unit lain menyusun kajian untuk pimpinan. Dalam rapat, rekan itu memaparkan kajian tersebut seolah-olah hasil kerjanya sendiri tanpa menyebut kontribusi Anda. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memotong paparannya di depan pimpinan dan menyatakan bahwa ia mengakui hasil kerja orang lain\"},{\"huruf\":\"B\",\"teks\":\"Diam saja selama rapat, tetapi menolak bekerja sama dengan rekan itu pada tugas-tugas berikutnya\"},{\"huruf\":\"C\",\"teks\":\"Membiarkannya karena yang terpenting adalah kajian diterima oleh pimpinan\"},{\"huruf\":\"D\",\"teks\":\"Menyampaikan kepada atasan Anda bahwa kajian itu hasil kerja bersama dengan melampirkan dokumen kerja yang menunjukkan bagian yang Anda kerjakan\"},{\"huruf\":\"E\",\"teks\":\"Menemui rekan itu secara pribadi untuk mengklarifikasi, lalu menyepakati agar kontribusi tim disebut dalam laporan tertulis kepada pimpinan\"}],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":2,\"C\":3,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Masalah dengan rekan kerja sebaiknya diselesaikan **langsung dan secara pribadi lebih dulu**, sebelum melibatkan pihak lain. Bisa jadi rekan itu lupa atau tidak bermaksud mengklaim. Klarifikasi pribadi menjaga hubungan baik dan memberi kesempatan memperbaiki. Kesepakatan agar kontribusi tim dicantumkan dalam laporan tertulis membuat pengakuan menjadi resmi dan adil tanpa mempermalukan siapa pun di depan pimpinan.\",\"opsi\":{\"A\":\"Paling buruk. Mempermalukan rekan di depan pimpinan merusak hubungan dan suasana rapat.\",\"B\":\"Menyimpan kekesalan dan memutus kerja sama merugikan jejaring kerja tanpa menyelesaikan masalahnya.\",\"C\":\"Menerima keadaan demi hasil, tetapi pasif. Masalah pengakuan kontribusi tidak diselesaikan dan bisa terulang. Rekan itu juga tidak mendapat kesempatan memperbaiki kekeliruannya.\",\"D\":\"Wajar dan berbasis bukti, tetapi langsung membawa masalah ke atasan tanpa memberi kesempatan rekan untuk menjelaskan.\",\"E\":\"Paling ideal. Klarifikasi langsung yang santun, lalu ada penyelesaian resmi yang adil bagi tim.\"},\"konsep\":\"**Urutan menyelesaikan konflik dengan rekan:** bicara langsung secara pribadi → sepakati perbaikan → libatkan atasan jika tidak berhasil. Hindari konfrontasi di depan umum.\"},\"tips\":\"Dalam konflik antarrekan, opsi bernilai 5 biasanya **klarifikasi pribadi dan solusi bersama**. Opsi yang melibatkan atasan dengan bukti bernilai 4 karena melewatkan langkah pertama.\",\"rujukan\":[]},{\"id\":\"p03-080\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda memimpin rapat koordinasi lintas instansi tentang penanganan banjir. Sudah tiga kali rapat tidak menghasilkan keputusan karena setiap instansi mempertahankan kepentingannya masing-masing. Langkah Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengusulkan agar pembahasan ditunda sampai pimpinan setiap instansi dapat hadir sendiri\"},{\"huruf\":\"B\",\"teks\":\"Mencatat semua pendapat peserta dan menyerahkan keputusan akhirnya kepada pimpinan Anda\"},{\"huruf\":\"C\",\"teks\":\"Menetapkan keputusan sesuai kepentingan instansi Anda karena Anda yang memimpin rapat\"},{\"huruf\":\"D\",\"teks\":\"Merangkum titik temu dan perbedaan, mengajak peserta menyepakati tujuan bersama, lalu menyusun pilihan solusi\"},{\"huruf\":\"E\",\"teks\":\"Mengusulkan pemungutan suara di antara para peserta agar keputusan dapat segera diambil dalam rapat kali ini tanpa perlu menunggu rapat berikutnya\"}],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Rapat lintas instansi sering buntu karena setiap pihak berangkat dari kepentingannya sendiri. Pemimpin rapat yang baik **memfasilitasi**, bukan memaksakan. Merangkum titik temu dan perbedaan membuat semua pihak melihat posisi masing-masing dengan jelas. Menyepakati tujuan bersama, misalnya keselamatan warga, mengalihkan fokus dari kepentingan instansi ke kepentingan publik. Pilihan solusi kemudian dapat dinilai bersama berdasarkan tujuan itu.\",\"opsi\":{\"A\":\"Menunda masalah. Rapat keempat dengan pimpinan belum tentu menyelesaikan perbedaan, dan penanganan banjir tertunda.\",\"B\":\"Mendokumentasikan dengan baik, tetapi tidak menjalankan peran memfasilitasi kesepakatan. Keputusan dilempar kepada atasan.\",\"C\":\"Paling buruk. Menyalahgunakan posisi pemimpin rapat dan merusak kepercayaan instansi lain.\",\"D\":\"Paling ideal. Fasilitatif, berorientasi tujuan bersama, dan menghasilkan pilihan solusi yang dapat diputuskan bersama.\",\"E\":\"Cepat menghasilkan keputusan, tetapi pihak yang kalah suara bisa tidak mendukung pelaksanaannya. Pemungutan suara sebaiknya menjadi langkah terakhir setelah musyawarah.\"},\"konsep\":\"**Fasilitasi kesepakatan:** pisahkan **posisi** (apa yang diminta) dari **kepentingan** (mengapa diminta), temukan tujuan bersama, lalu kembangkan pilihan. Musyawarah didahulukan, pemungutan suara menjadi jalan terakhir.\"},\"tips\":\"Untuk soal rapat buntu, opsi bernilai 5 biasanya **mencari tujuan bersama** dan **menawarkan pilihan solusi**. Voting bernilai baik, tetapi biasanya bukan yang tertinggi.\",\"rujukan\":[]},{\"id\":\"p03-081\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda baru kembali dari pelatihan tentang aplikasi pengadaan barang yang akan segera dipakai di kantor. Hanya Anda yang dikirim mengikuti pelatihan itu. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyimpan materi pelatihan dan memakainya untuk menyelesaikan pekerjaan Anda sendiri\"},{\"huruf\":\"B\",\"teks\":\"Membagikan pengetahuan dari pelatihan kepada rekan yang datang bertanya\"},{\"huruf\":\"C\",\"teks\":\"Tidak membagikan materi agar Anda tetap menjadi satu-satunya orang yang menguasai aplikasi itu\"},{\"huruf\":\"D\",\"teks\":\"Mengirim seluruh materi pelatihan ke grup kantor agar rekan-rekan dapat mempelajarinya sendiri kapan saja mereka sempat\"},{\"huruf\":\"E\",\"teks\":\"Menawarkan sesi berbagi singkat, menyusun ringkasan praktis, dan membuka diri untuk ditanya saat rekan menerapkannya\"}],\"kunci\":\"E\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Pegawai yang dikirim mengikuti pelatihan membawa pengetahuan yang dibiayai instansi. Pengetahuan itu bernilai paling besar jika **dibagikan secara aktif** kepada rekan yang akan memakainya. Sesi berbagi singkat membuat rekan memahami inti materi. Ringkasan praktis memudahkan mereka mengingat langkah-langkahnya. Kesediaan ditanya saat penerapan membantu rekan melewati kendala di lapangan. Hasilnya, seluruh tim siap memakai aplikasi baru.\",\"opsi\":{\"A\":\"Hanya Anda yang terbantu. Rekan lain harus belajar dari nol, padahal aplikasi akan dipakai bersama.\",\"B\":\"Bersedia membantu, tetapi pasif. Rekan yang tidak bertanya akan tertinggal.\",\"C\":\"Paling buruk. Menahan pengetahuan demi kepentingan pribadi merugikan tim dan bertentangan dengan nilai kolaboratif.\",\"D\":\"Berbagi secara terbuka, tetapi materi lengkap tanpa penjelasan belum tentu dipelajari atau dipahami rekan.\",\"E\":\"Paling ideal. Aktif, praktis, dan ada pendampingan saat rekan menerapkan pengetahuannya.\"},\"konsep\":\"**Berbagi pengetahuan (*knowledge sharing*)** adalah bagian dari nilai kolaboratif ASN. Pola bobot: 5 = aktif + praktis + pendampingan; 4 = membagikan bahan; 3 = membantu jika ditanya; 2 = dipakai sendiri; 1 = sengaja menahan pengetahuan.\"},\"tips\":\"Jika soal menyebut Anda satu-satunya yang mengikuti pelatihan, jawaban terbaik hampir selalu **membagikan pengetahuan secara aktif dan terstruktur**.\",\"rujukan\":[]},{\"id\":\"p03-082\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Kantor Anda mengadakan acara halalbihalal setelah Idulfitri. Anda tidak beragama Islam, tetapi ditunjuk menjadi anggota panitia bagian konsumsi. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Bersedia membantu persiapan, tetapi tidak menghadiri acara karena bukan perayaan agama Anda\"},{\"huruf\":\"B\",\"teks\":\"Menolak penunjukan karena merasa acara itu sebaiknya diurus oleh pegawai yang beragama Islam\"},{\"huruf\":\"C\",\"teks\":\"Menerima tugas, menyiapkan konsumsi dengan baik, dan hadir untuk bersilaturahmi bersama rekan-rekan\"},{\"huruf\":\"D\",\"teks\":\"Mengusulkan agar acara keagamaan tidak lagi diadakan di kantor karena pegawainya berbeda-beda agama\"},{\"huruf\":\"E\",\"teks\":\"Menerima tugas dan bekerja sama dengan panitia lain sampai seluruh kebutuhan konsumsi acara terpenuhi dengan baik\"}],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":2,\"C\":5,\"D\":1,\"E\":4},\"pembahasan\":{\"inti\":\"Halalbihalal adalah tradisi **silaturahmi** yang sudah menjadi bagian dari budaya kerja di banyak kantor di Indonesia. Pegawai yang berbeda agama dapat ikut membantu dan hadir tanpa ikut menjalankan ibadah agama lain. Sikap ini menunjukkan **toleransi aktif**: menghormati perayaan rekan, bekerja sama dengan baik, dan memperkuat kebersamaan. Kehadiran dalam acara silaturahmi juga mempererat hubungan antarrekan.\",\"opsi\":{\"A\":\"Tetap membantu, tetapi menjaga jarak dari kebersamaan yang menjadi inti acara. Rekan yang merayakan dapat merasa kurang dihargai.\",\"B\":\"Menolak tugas dengan alasan perbedaan agama. Sikap ini dapat menimbulkan kesan eksklusif. Penunjukan panitia juga bagian dari tugas kantor.\",\"C\":\"Paling ideal. Bertanggung jawab atas tugas, toleran, dan ikut mempererat kebersamaan.\",\"D\":\"Paling buruk. Mengusulkan penghapusan tradisi yang tidak melanggar aturan dapat memicu ketegangan dan tidak menghargai rekan yang merayakan.\",\"E\":\"Bertanggung jawab dan kooperatif, tetapi kehadiran untuk bersilaturahmi tidak disebut. Unsur kebersamaannya kurang.\"},\"konsep\":\"**Toleransi aktif:** menghormati dan membantu kegiatan kelompok lain tanpa ikut menjalankan ritual keyakinan yang berbeda. Membedakan **ibadah** dan **kegiatan sosial** dari sebuah perayaan membantu menentukan sikap.\"},\"tips\":\"Dalam soal keberagaman agama di kantor, opsi bernilai 5 biasanya **ikut berperan dan hadir dalam kebersamaan**, sambil tetap menghormati batas ibadah masing-masing.\",\"rujukan\":[]},{\"id\":\"p03-083\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda bertugas menyiapkan rapat koordinasi. Salah satu peserta dari instansi mitra adalah penyandang tunarungu. Langkah Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta peserta tersebut membaca notulen setelah rapat selesai agar tidak tertinggal informasi\"},{\"huruf\":\"B\",\"teks\":\"Berbicara lebih pelan dan jelas selama rapat agar peserta tersebut dapat membaca gerak bibir\"},{\"huruf\":\"C\",\"teks\":\"Menjalankan rapat seperti biasa karena kehadiran peserta itu sudah cukup sebagai perwakilan instansinya\"},{\"huruf\":\"D\",\"teks\":\"Menanyakan kebutuhan komunikasinya sebelum rapat, lalu menyiapkan juru bahasa isyarat atau teks langsung\"},{\"huruf\":\"E\",\"teks\":\"Menyediakan materi tertulis lengkap dan menyalakan fitur teks otomatis di layar selama rapat berlangsung\"}],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Peserta penyandang tunarungu berhak **berpartisipasi penuh** dalam rapat, bukan sekadar hadir. Kebutuhan komunikasi setiap orang berbeda: ada yang memakai bahasa isyarat, ada yang lebih nyaman dengan teks, ada yang membaca gerak bibir. Karena itu, langkah terbaik adalah **menanyakan langsung** sebelum rapat, lalu menyiapkan dukungan yang sesuai. Cara ini menghargai peserta dan memastikan ia dapat menyimak serta menyampaikan pendapat.\",\"opsi\":{\"A\":\"Peserta hanya menerima informasi setelah rapat dan tidak dapat ikut berdiskusi.\",\"B\":\"Niatnya baik, tetapi tidak semua penyandang tunarungu membaca gerak bibir, dan cara ini sulit diterapkan pada banyak pembicara.\",\"C\":\"Paling buruk. Kehadiran peserta dianggap formalitas, sehingga haknya untuk berpartisipasi diabaikan.\",\"D\":\"Paling ideal. Berbasis kebutuhan peserta, disiapkan sebelum rapat, dan memungkinkan partisipasi penuh.\",\"E\":\"Sangat membantu, tetapi berdasarkan dugaan. Teks otomatis bisa kurang akurat, dan peserta mungkin lebih membutuhkan juru bahasa isyarat.\"},\"konsep\":\"**Prinsip inklusi:** tanyakan kebutuhan, jangan menebak. Akomodasi yang tepat untuk penyandang tunarungu dapat berupa juru bahasa isyarat, teks langsung (*live caption*), atau materi tertulis.\"},\"tips\":\"Pada soal disabilitas, opsi yang **bertanya langsung kepada orangnya** tentang kebutuhannya biasanya bernilai lebih tinggi daripada opsi yang menebak.\",\"rujukan\":[\"UU No. 8 Tahun 2016 tentang Penyandang Disabilitas\"]},{\"id\":\"p03-084\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Sekelompok warga di lingkungan tempat tinggal Anda menolak pembangunan rumah ibadah agama lain, padahal panitia pembangunan telah mengurus izin sesuai aturan. Mereka mengajak Anda menandatangani petisi penolakan. Sikap Anda sebagai ASN dan warga adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak menandatangani, menjelaskan bahwa pendirian rumah ibadah punya prosedur resmi, dan mendorong keberatan dibahas melalui musyawarah\"},{\"huruf\":\"B\",\"teks\":\"Ikut mengorganisasi warga untuk menghalangi pekerjaan pembangunan rumah ibadah tersebut\"},{\"huruf\":\"C\",\"teks\":\"Tidak ikut menandatangani dan memilih tidak terlibat sama sekali dalam persoalan itu\"},{\"huruf\":\"D\",\"teks\":\"Menandatangani petisi karena sebagian besar warga di lingkungan Anda sudah ikut menandatanganinya\"},{\"huruf\":\"E\",\"teks\":\"Menolak menandatangani dan menyampaikan kepada ketua RT bahwa pembangunan itu sudah sesuai izin sehingga wajib dihormati oleh seluruh warga di lingkungan itu\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":1,\"C\":3,\"D\":2,\"E\":4},\"pembahasan\":{\"inti\":\"UUD menjamin kemerdekaan setiap penduduk untuk memeluk agama dan beribadat menurut agamanya. Pendirian rumah ibadah memiliki **prosedur resmi**, termasuk persyaratan dukungan dan rekomendasi Forum Kerukunan Umat Beragama (FKUB). Jika izin sudah diperoleh sesuai aturan, menolak pembangunan secara sepihak bertentangan dengan hukum dan kerukunan. ASN sebaiknya tidak ikut menolak, **menjelaskan prosedur resmi** kepada tetangga, dan mendorong keberatan disampaikan melalui musyawarah atau FKUB agar ketegangan mereda.\",\"opsi\":{\"A\":\"Paling ideal. Tegas tidak mendukung penolakan, edukatif, dan mengarahkan keberatan ke jalur yang damai dan resmi.\",\"B\":\"Paling buruk. Menghalangi pembangunan yang sah melanggar hukum dan dapat memicu konflik antarumat beragama.\",\"C\":\"Tidak ikut menolak, tetapi pasif. Ketegangan di lingkungan dibiarkan tanpa upaya meredakan.\",\"D\":\"Mengikuti mayoritas tanpa pertimbangan. Hak kelompok minoritas dikorbankan karena tekanan sosial.\",\"E\":\"Sikapnya benar dan menyampaikan fakta, tetapi cenderung menghakimi warga. Tidak ada ruang dialog untuk menyelesaikan kekhawatiran mereka.\"},\"konsep\":\"**Kerukunan umat beragama:** hak beribadah dijamin, prosedur pendirian rumah ibadah diatur, dan perselisihan diselesaikan melalui musyawarah dengan peran FKUB serta pemerintah daerah.\"},\"tips\":\"Dalam soal konflik keagamaan di masyarakat, opsi bernilai 5 biasanya **tidak ikut menolak**, **menjelaskan aturan**, dan **mendorong dialog**. Opsi yang ikut arus mayoritas bernilai rendah.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 29 ayat (2)\",\"Peraturan Bersama Menteri Agama dan Menteri Dalam Negeri No. 9 dan No. 8 Tahun 2006 tentang pemeliharaan kerukunan umat beragama, FKUB, dan pendirian rumah ibadat\"]},{\"id\":\"p03-085\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Seorang rekan baru yang dipindahkan dari provinsi lain terlihat sering menyendiri dan makan siang sendirian. Ia tampak belum akrab dengan rekan-rekan di kantor. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Bersikap ramah kepadanya jika ia menyapa lebih dulu\"},{\"huruf\":\"B\",\"teks\":\"Mengajaknya makan siang bersama tim, mengenalkannya kepada rekan lain, dan membantunya mengenal kota\"},{\"huruf\":\"C\",\"teks\":\"Menjadikan logat dan kebiasaannya bahan candaan agar suasana menjadi lebih cair\"},{\"huruf\":\"D\",\"teks\":\"Mengajaknya makan siang bersama dan menanyakan apakah ada hal di kantor atau di kota yang bisa Anda bantu\"},{\"huruf\":\"E\",\"teks\":\"Membiarkannya karena setiap pegawai baru perlu belajar beradaptasi sendiri\"}],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":1,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Pegawai yang dipindahkan dari daerah lain menghadapi lingkungan, budaya, dan kebiasaan baru sekaligus. Rekan yang peka **mengambil inisiatif** untuk menyambutnya. Mengajak makan siang bersama tim, mengenalkannya kepada rekan lain, dan membantunya mengenal kota membuat rekan baru merasa diterima. Dengan begitu, ia lebih cepat beradaptasi dan dapat bekerja secara optimal. Kebersamaan tim pun semakin kuat.\",\"opsi\":{\"A\":\"Ramah, tetapi menunggu. Rekan baru yang canggung mungkin tidak pernah menyapa lebih dulu.\",\"B\":\"Paling ideal. Proaktif, melibatkan tim, dan membantu adaptasi di dalam maupun di luar kantor.\",\"C\":\"Paling buruk. Menjadikan logat sebagai bahan candaan dapat menyinggung dan membuatnya semakin terasing.\",\"D\":\"Proaktif dan peduli, tetapi baru melibatkan Anda sendiri. Hubungannya dengan rekan lain belum dibangun.\",\"E\":\"Menghindar. Kesulitan rekan baru dianggap bukan urusan Anda.\"},\"konsep\":\"**Membangun inklusi di tempat kerja:** sambut, libatkan dalam kelompok, dan bantu memahami lingkungan baru. Pola bobot: 5 = proaktif + melibatkan tim; 4 = proaktif secara pribadi; 3 = ramah tetapi menunggu; 2 = membiarkan; 1 = merendahkan.\"},\"tips\":\"Opsi yang **melibatkan lebih banyak orang** untuk menyambut rekan baru biasanya bernilai lebih tinggi daripada opsi yang hanya melibatkan Anda sendiri.\",\"rujukan\":[]},{\"id\":\"p03-086\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda baru diangkat menjadi ketua tim survei lapangan. Selama ini tugas lapangan selalu diberikan kepada pegawai laki-laki, sementara pegawai perempuan hanya mengerjakan administrasi. Beberapa pegawai perempuan menyampaikan bahwa mereka juga ingin turun ke lapangan. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tetap mengikuti pembagian tugas lama karena tim sudah terbiasa dan pekerjaan selama ini berjalan lancar\"},{\"huruf\":\"B\",\"teks\":\"Menugaskan pegawai perempuan ke lapangan hanya jika ada pegawai laki-laki yang mendampinginya\"},{\"huruf\":\"C\",\"teks\":\"Menyampaikan bahwa tugas lapangan memang lebih cocok untuk pegawai laki-laki\"},{\"huruf\":\"D\",\"teks\":\"Menugaskan semua anggota tim ke lapangan secara bergiliran dengan jadwal tetap, tanpa melihat jenis kelamin maupun kemampuan masing-masing anggota\"},{\"huruf\":\"E\",\"teks\":\"Membagi tugas berdasarkan kompetensi dan minat setiap anggota, serta menyiapkan dukungan keselamatan lapangan bagi semua\"}],\"kunci\":\"E\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Setiap pegawai berhak atas **kesempatan yang sama** untuk berkembang tanpa dibedakan berdasarkan jenis kelamin. Ketua tim yang baik membagi tugas berdasarkan **kompetensi dan minat**, bukan anggapan lama tentang peran laki-laki dan perempuan. Dukungan keselamatan lapangan, seperti tim berpasangan dan jalur komunikasi, disiapkan bagi semua anggota, bukan hanya bagi pegawai perempuan. Dengan begitu, tim mendapatkan pegawai terbaik untuk setiap tugas.\",\"opsi\":{\"A\":\"Melestarikan kebiasaan yang tidak adil. Pegawai perempuan kehilangan kesempatan berkembang. Alasan *sudah terbiasa* tidak membenarkan perlakuan yang berbeda.\",\"B\":\"Membuka kesempatan, tetapi dengan syarat yang merendahkan, seolah-olah pegawai perempuan tidak mampu bekerja sendiri.\",\"C\":\"Paling buruk. Pernyataan ini adalah diskriminasi berdasarkan jenis kelamin. Pernyataan itu juga menutup kesempatan anggota tim untuk berkembang.\",\"D\":\"Adil dalam kesempatan, tetapi mengabaikan kompetensi. Tugas tertentu mungkin membutuhkan keahlian khusus.\",\"E\":\"Paling ideal. Adil, berbasis kompetensi dan minat, serta memperhatikan keselamatan seluruh anggota.\"},\"konsep\":\"**Kesetaraan gender di tempat kerja:** kesempatan sama, penilaian berdasarkan kompetensi, dan perlindungan yang berlaku bagi semua. Kesetaraan bukan berarti semua orang diperlakukan sama tanpa melihat kemampuan.\"},\"tips\":\"Bedakan **adil** dan **sama rata**. Opsi bergiliran tanpa melihat kemampuan biasanya bernilai 4, sedangkan opsi berbasis kompetensi dengan dukungan bagi semua bernilai 5.\",\"rujukan\":[]},{\"id\":\"p03-087\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda bertugas menyiapkan konsumsi untuk lokakarya yang diikuti peserta dari berbagai daerah dan latar belakang. Sebagian peserta diketahui memiliki pantangan makanan karena alasan agama, kesehatan, atau pilihan pribadi. Langkah Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memesan menu yang paling banyak disukai peserta berdasarkan pengalaman acara sebelumnya\"},{\"huruf\":\"B\",\"teks\":\"Meminta peserta yang memiliki pantangan makanan membawa bekal sendiri dari rumah\"},{\"huruf\":\"C\",\"teks\":\"Memesan menu termurah tanpa memeriksa kehalalan dan bahan-bahannya agar anggaran lebih hemat\"},{\"huruf\":\"D\",\"teks\":\"Mendata kebutuhan makanan saat pendaftaran, lalu menyiapkan menu halal dengan pilihan bagi yang memiliki pantangan\"},{\"huruf\":\"E\",\"teks\":\"Memesan menu halal untuk semua peserta karena sebagian besar peserta membutuhkannya dan menu itu dapat dimakan banyak orang\"}],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":2,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Penyelenggara acara yang baik **menghormati kebutuhan setiap peserta**. Cara paling tepat adalah mendata kebutuhan makanan sejak pendaftaran, sehingga keputusan menu didasarkan pada data, bukan dugaan. Menu halal dapat menjadi dasar karena dapat dimakan oleh banyak peserta. Pilihan tambahan bagi peserta vegetarian, alergi, atau pantangan kesehatan memastikan semua peserta terlayani. Langkah ini sederhana, tetapi membuat setiap peserta merasa dihargai.\",\"opsi\":{\"A\":\"Berdasarkan kebiasaan, bukan data. Peserta dengan pantangan khusus bisa tidak mendapat makanan yang sesuai.\",\"B\":\"Membebani peserta dan menunjukkan bahwa penyelenggara tidak mau mengakomodasi perbedaan.\",\"C\":\"Paling buruk. Mengabaikan kehalalan dan bahan makanan dapat melukai keyakinan atau membahayakan kesehatan peserta.\",\"D\":\"Paling ideal. Berbasis data, menghormati keyakinan, dan memperhatikan kebutuhan kesehatan serta pilihan pribadi peserta.\",\"E\":\"Menghormati kebutuhan mayoritas dan banyak peserta, tetapi peserta dengan alergi atau pantangan lain belum terlayani.\"},\"konsep\":\"**Menghargai keberagaman dalam acara:** kumpulkan kebutuhan peserta, sediakan pilihan dasar yang inklusif, dan tambahkan pilihan khusus. Pola bobot: 5 = berbasis data + pilihan bagi semua; 4 = inklusif untuk mayoritas; 1 = mengabaikan keyakinan atau kesehatan.\"},\"tips\":\"Kata kunci opsi bernilai 5 dalam soal keberagaman biasanya **mendata atau menanyakan kebutuhan** lalu **menyediakan pilihan**. Opsi yang menyamaratakan kebutuhan biasanya bernilai 3 atau 4.\",\"rujukan\":[]},{\"id\":\"p03-088\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Setelah pemilu, beberapa rekan di kantor sering saling menyindir karena berbeda pilihan politik. Suasana kerja menjadi tegang dan koordinasi tim terganggu. Sebagai pegawai senior di tim, sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menghindari semua obrolan politik dan fokus menyelesaikan pekerjaan Anda sendiri\"},{\"huruf\":\"B\",\"teks\":\"Mengajak rekan menyepakati agar pilihan politik tidak dibawa ke pekerjaan, mengingatkan netralitas ASN, dan memulihkan kerja sama tim\"},{\"huruf\":\"C\",\"teks\":\"Ikut menyindir rekan yang pilihannya berbeda agar ia menyadari pilihannya keliru\"},{\"huruf\":\"D\",\"teks\":\"Mengingatkan rekan-rekan dengan sopan di grup percakapan kantor bahwa ASN wajib netral dan perbedaan pilihan politik sebaiknya tidak dibahas di kantor\"},{\"huruf\":\"E\",\"teks\":\"Melaporkan semua rekan yang saling menyindir kepada atasan agar mereka diberi sanksi\"}],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":1,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"ASN wajib **netral** dalam politik praktis, dan perbedaan pilihan politik pribadi tidak boleh mengganggu kerja sama. Pegawai senior dapat menjadi **penengah**. Ia mengajak rekan menyepakati batas, yaitu pilihan politik tidak dibawa ke pekerjaan, sambil mengingatkan kewajiban netralitas ASN. Langkah berikutnya adalah memulihkan kerja sama tim, misalnya dengan kegiatan bersama atau pembagian tugas yang mempertemukan pihak yang bersitegang.\",\"opsi\":{\"A\":\"Aman bagi diri sendiri, tetapi pasif. Ketegangan tim dibiarkan dan koordinasi tetap terganggu.\",\"B\":\"Paling ideal. Menengahi, mengingatkan aturan, dan memulihkan hubungan kerja.\",\"C\":\"Paling buruk. Memperkeruh konflik dan menunjukkan keberpihakan politik di tempat kerja.\",\"D\":\"Mengingatkan aturan dengan sopan, tetapi hanya melalui grup. Tanpa dialog langsung dan upaya memulihkan kerja sama, ketegangan mungkin tetap ada.\",\"E\":\"Terlalu cepat membawa masalah ke ranah sanksi sebelum ada upaya menengahi. Suasana tim bisa makin tegang.\"},\"konsep\":\"**Netralitas ASN:** ASN tidak berpihak pada kepentingan politik mana pun dan tidak membiarkan pilihan politik memengaruhi pekerjaan. Perbedaan pilihan adalah hak pribadi, tetapi kerja sama tim adalah kewajiban profesional.\"},\"tips\":\"Untuk konflik antarrekan karena perbedaan pandangan, opsi bernilai 5 biasanya **menengahi dan memulihkan kerja sama**, bukan sekadar mengingatkan atau melaporkan.\",\"rujukan\":[\"UU No. 20 Tahun 2023 tentang Aparatur Sipil Negara (netralitas ASN)\"]},{\"id\":\"p03-089\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Saat mengambil hasil cetakan di printer bersama, Anda menemukan dokumen berlabel *rahasia* milik rekan dari bagian kepegawaian yang tertinggal sejak pagi. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengambil dokumen tanpa membacanya, menyerahkannya kepada pemiliknya, dan mengingatkan fitur cetak aman\"},{\"huruf\":\"B\",\"teks\":\"Membiarkan dokumen di printer karena dokumen itu bukan milik Anda\"},{\"huruf\":\"C\",\"teks\":\"Membaca isinya, lalu menceritakan informasi menarik di dalamnya kepada rekan lain\"},{\"huruf\":\"D\",\"teks\":\"Mengambil dokumen itu tanpa membaca isinya dan menyerahkannya langsung kepada pemiliknya di bagian kepegawaian\"},{\"huruf\":\"E\",\"teks\":\"Membuang dokumen itu ke tempat sampah agar tidak terbaca oleh orang lain\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":1,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Dokumen rahasia yang tertinggal di printer bersama adalah **celah keamanan informasi**. Siapa pun yang lewat dapat membacanya. Pegawai yang baik mengamankan dokumen tanpa membaca isinya dan menyerahkannya langsung kepada pemiliknya. Pegawai yang lebih baik juga membantu **mencegah kejadian berulang**, misalnya dengan mengingatkan fitur cetak aman yang meminta kode sebelum dokumen dicetak. Dengan begitu, informasi rahasia hanya keluar saat pemiliknya berada di depan printer.\",\"opsi\":{\"A\":\"Paling ideal. Dokumen aman, kerahasiaan dihormati, dan ada langkah pencegahan.\",\"B\":\"Tidak melanggar, tetapi membiarkan risiko kebocoran tetap ada. Dokumen bisa dibaca atau diambil siapa saja yang lewat.\",\"C\":\"Paling buruk. Membaca dan menyebarkan isi dokumen rahasia melanggar etika dan kerahasiaan jabatan.\",\"D\":\"Mengamankan dokumen dengan benar, tetapi tidak ada langkah agar kejadian serupa tidak terulang.\",\"E\":\"Niatnya menjaga kerahasiaan, tetapi dokumen di tempat sampah justru mudah diambil orang lain, dan pemiliknya kehilangan dokumen.\"},\"konsep\":\"**Keamanan dokumen cetak:** pakai fitur cetak aman (*secure print*), segera ambil hasil cetakan, dan hancurkan dokumen rahasia dengan mesin penghancur kertas, bukan dibuang utuh.\"},\"tips\":\"Dalam soal keamanan informasi, opsi bernilai 5 biasanya **mengamankan saat itu** dan **mencegah kejadian berulang**. Opsi yang membaca atau menyebarkan isi dokumen selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p03-090\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Instansi Anda menerapkan kebijakan bekerja dari mana saja. Hari ini Anda bekerja dari sebuah kafe dan perlu mengakses sistem yang memuat data pribadi warga. Satu-satunya jaringan di kafe itu adalah wifi publik tanpa kata sandi. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengerjakan bagian yang tidak memerlukan akses sistem, lalu menunda sisanya sampai berada di jaringan yang aman\"},{\"huruf\":\"B\",\"teks\":\"Memakai jaringan data seluler pribadi untuk mengakses sistem karena lebih aman, walaupun tanpa menyalakan VPN kantor terlebih dulu\"},{\"huruf\":\"C\",\"teks\":\"Memakai jaringan pribadi yang aman dan VPN kantor sesuai panduan, serta memastikan layar tidak terlihat orang lain\"},{\"huruf\":\"D\",\"teks\":\"Memakai wifi publik kafe tanpa pengaman dan membiarkan sistem tetap terbuka saat Anda meninggalkan meja\"},{\"huruf\":\"E\",\"teks\":\"Memakai wifi publik kafe karena paling cepat, tetapi segera keluar dari sistem setelah pekerjaan selesai\"}],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":4,\"C\":5,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Kebijakan bekerja dari mana saja memberi keleluasaan tempat, tetapi **standar keamanan data tetap sama** seperti di kantor. Wifi publik tanpa kata sandi rentan disadap, sehingga tidak boleh dipakai untuk mengakses data pribadi warga. Langkah terbaik adalah memakai jaringan pribadi yang aman ditambah **VPN kantor** sesuai panduan, sambil menjaga layar agar tidak terlihat orang di sekitar. Pekerjaan tetap berjalan dan data warga tetap terlindungi.\",\"opsi\":{\"A\":\"Aman, tetapi menunda pekerjaan yang sebenarnya dapat diselesaikan dengan cara yang aman.\",\"B\":\"Lebih aman daripada wifi publik, tetapi tanpa VPN koneksi ke sistem belum terlindungi sesuai standar kantor.\",\"C\":\"Paling ideal. Jaringan aman, VPN aktif, privasi layar dijaga, dan pekerjaan tetap selesai.\",\"D\":\"Paling buruk. Dua pelanggaran sekaligus: jaringan rentan dan sistem dibiarkan terbuka tanpa pengawasan.\",\"E\":\"Keluar dari sistem setelah selesai itu baik, tetapi data sudah terpapar risiko penyadapan selama dikirim melalui wifi publik.\"},\"konsep\":\"**Kebersihan siber saat bekerja jarak jauh:** jaringan tepercaya, VPN kantor, kunci layar saat ditinggal, dan waspadai orang yang dapat melihat layar (*shoulder surfing*).\"},\"tips\":\"Dalam soal keamanan data, urutkan opsi berdasarkan **tingkat risikonya**. Opsi yang paling aman dan tetap menyelesaikan pekerjaan bernilai 5, sedangkan opsi yang menambah risiko bernilai 1.\",\"rujukan\":[\"UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi\"]},{\"id\":\"p03-091\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Anda bertugas di bagian hubungan masyarakat. Beredar pesan berantai yang mengatasnamakan instansi Anda dan berisi tautan undian berhadiah. Warga diminta mengisi data pribadi untuk mengklaim hadiah. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memastikan pesan itu palsu, menerbitkan klarifikasi di kanal resmi instansi, dan melaporkan penyebarnya melalui kanal aduan\"},{\"huruf\":\"B\",\"teks\":\"Menyampaikan kepada keluarga dan teman-teman Anda bahwa pesan undian itu palsu dan tidak perlu ditanggapi\"},{\"huruf\":\"C\",\"teks\":\"Meneruskan pesan itu ke grup-grup lain untuk berjaga-jaga jika undiannya ternyata benar\"},{\"huruf\":\"D\",\"teks\":\"Membuat unggahan di media sosial instansi yang menyatakan bahwa pesan undian tersebut tidak berasal dari instansi Anda dan meminta warga berhati-hati\"},{\"huruf\":\"E\",\"teks\":\"Mengabaikan pesan itu karena warga seharusnya sudah tahu bahwa undian semacam itu biasanya penipuan\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":1,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Pesan penipuan yang memakai nama instansi dapat **merugikan warga** dan **merusak kepercayaan publik**. Petugas humas perlu bertindak cepat dan tepat. Langkah pertama adalah memastikan pesan itu memang bukan dari instansi. Setelah itu, terbitkan klarifikasi di kanal resmi agar warga tidak tertipu. Laporkan penyebarnya melalui kanal aduan agar penyebaran dihentikan. Ketiga langkah itu melindungi warga sekaligus nama baik instansi.\",\"opsi\":{\"A\":\"Paling ideal. Diverifikasi, diklarifikasi secara resmi, dan dilaporkan untuk dihentikan.\",\"B\":\"Membantu orang terdekat, tetapi jangkauannya sempit. Sebagai humas, Anda memiliki kanal resmi untuk menjangkau semua warga.\",\"C\":\"Paling buruk. Meneruskan pesan penipuan memperluas jumlah korban.\",\"D\":\"Klarifikasi resmi sudah tepat, tetapi tanpa verifikasi dan laporan, penyebaran pesan palsu tidak dihentikan.\",\"E\":\"Menghindar. Warga yang tidak tahu bisa menyerahkan data pribadinya kepada penipu. Sebagai humas, menanggapi informasi yang mencatut instansi justru bagian dari tugas Anda.\"},\"konsep\":\"**Penanganan hoaks yang mencatut instansi:** verifikasi → klarifikasi di kanal resmi → laporkan → pantau. Pesan yang meminta data pribadi dengan iming-iming hadiah adalah pola *phishing* yang umum.\"},\"tips\":\"Untuk soal hoaks atau penipuan, opsi bernilai 5 biasanya memuat **verifikasi**, **klarifikasi resmi**, dan **pelaporan**. Opsi yang hanya memuat satu atau dua unsur bernilai 3 atau 4.\",\"rujukan\":[]},{\"id\":\"p03-092\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Anda ditugasi memindahkan data penerima bantuan dari lembar kerja lama ke sistem baru. Ternyata banyak data ganda dan kolom yang kosong. Tenggat migrasi tinggal satu minggu, dan atasan berharap sistem baru segera dipakai. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memindahkan semua data apa adanya agar tenggat terpenuhi, lalu menyerahkan perbaikan data kepada tim lain\"},{\"huruf\":\"B\",\"teks\":\"Membersihkan seluruh data lebih dulu walaupun tenggat migrasi terlewat, tanpa memberi tahu atasan\"},{\"huruf\":\"C\",\"teks\":\"Memetakan masalah data, menyampaikan risikonya kepada atasan, lalu mengusulkan migrasi bertahap mulai dari data yang sudah bersih\"},{\"huruf\":\"D\",\"teks\":\"Menghapus data yang tidak lengkap atau ganda tanpa memeriksanya agar sistem baru terlihat rapi\"},{\"huruf\":\"E\",\"teks\":\"Memindahkan data sesuai tenggat sambil menandai setiap data yang bermasalah agar dapat diperbaiki satu per satu setelah sistem baru berjalan\"}],\"kunci\":\"C\",\"bobot\":{\"A\":2,\"B\":3,\"C\":5,\"D\":1,\"E\":4},\"pembahasan\":{\"inti\":\"Data penerima bantuan menentukan siapa yang berhak menerima. Memindahkan data yang salah ke sistem baru hanya memindahkan masalah, sedangkan menghapus data tanpa memeriksa dapat menghilangkan hak warga. Langkah terbaik adalah **memetakan masalah**, **menyampaikan risiko kepada atasan** agar keputusan diambil dengan informasi lengkap, lalu mengusulkan **migrasi bertahap**. Data yang sudah bersih dapat segera dipakai, sementara data bermasalah diperbaiki secara teliti.\",\"opsi\":{\"A\":\"Tenggat terpenuhi, tetapi data yang salah ikut pindah, dan tanggung jawab perbaikan dilempar kepada tim lain.\",\"B\":\"Teliti, tetapi tidak komunikatif. Atasan tidak tahu bahwa tenggat akan terlewat dan tidak dapat mengambil keputusan.\",\"C\":\"Paling ideal. Berbasis data, transparan kepada atasan, dan menawarkan solusi yang menjaga mutu sekaligus kemajuan.\",\"D\":\"Paling buruk. Data warga yang berhak dapat terhapus, sehingga warga kehilangan bantuan.\",\"E\":\"Tenggat terpenuhi dan masalah tercatat, tetapi data bermasalah sudah terpakai di sistem baru sebelum diperbaiki, dan atasan tidak diberi tahu risikonya.\"},\"konsep\":\"**Mutu data dalam transformasi digital:** bersihkan sebelum atau selama migrasi, komunikasikan risiko kepada pengambil keputusan, dan pilih pendekatan bertahap jika waktu terbatas.\"},\"tips\":\"Jika ada pertentangan antara **tenggat** dan **mutu**, opsi bernilai 5 biasanya **menyampaikan risikonya kepada atasan** dan menawarkan jalan tengah yang menjaga keduanya.\",\"rujukan\":[]},{\"id\":\"p03-093\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Anda melihat seorang rekan mengunggah berkas berisi data warga ke akun penyimpanan awan pribadinya agar dapat dikerjakan di rumah. Kantor sebenarnya menyediakan penyimpanan resmi yang dapat diakses dari luar kantor. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Membiarkannya karena itu urusan rekan Anda, tetapi Anda sendiri tidak melakukan hal yang sama\"},{\"huruf\":\"B\",\"teks\":\"Ikut menyimpan berkas kerja Anda di akun pribadi karena cara itu terlihat lebih praktis\"},{\"huruf\":\"C\",\"teks\":\"Langsung melaporkan perbuatan rekan itu kepada atasan tanpa membicarakannya lebih dulu dengannya\"},{\"huruf\":\"D\",\"teks\":\"Mengingatkan rekan tentang risiko kebocoran data, membantunya memindahkan berkas ke penyimpanan resmi, dan menunjukkan cara aksesnya\"},{\"huruf\":\"E\",\"teks\":\"Mengingatkan rekan secara pribadi bahwa berkas kantor sebaiknya disimpan di penyimpanan resmi yang sudah disediakan kantor, bukan akun pribadi\"}],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":2,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Data warga yang disimpan di akun pribadi berada di luar kendali instansi. Jika akun itu diretas atau dipakai bersama keluarga, data dapat bocor. Rekan Anda kemungkinan hanya ingin praktis dan belum tahu cara memakai penyimpanan resmi dari rumah. Langkah terbaik adalah **mengingatkan risikonya**, **membantu memindahkan berkas** ke penyimpanan resmi, dan **menunjukkan cara aksesnya**. Masalah selesai dan kebutuhan rekan tetap terpenuhi.\",\"opsi\":{\"A\":\"Tidak ikut melanggar, tetapi membiarkan risiko kebocoran data warga tetap ada.\",\"B\":\"Paling buruk. Ikut melanggar dan menambah jumlah data warga yang berisiko bocor.\",\"C\":\"Terlalu cepat melapor. Rekan tidak diberi kesempatan memperbaiki, dan hubungan kerja bisa rusak.\",\"D\":\"Paling ideal. Mengingatkan, membantu memindahkan, dan memberi solusi agar rekan tidak kembali ke cara lama.\",\"E\":\"Mengingatkan dengan tepat, tetapi tanpa bantuan praktis rekan mungkin tetap memakai akun pribadi karena belum tahu cara mengakses penyimpanan resmi.\"},\"konsep\":\"**Shadow IT** adalah pemakaian layanan di luar sistem resmi kantor demi kepraktisan. Cara menanganinya bukan hanya melarang, tetapi juga **memudahkan pemakaian sistem resmi**.\"},\"tips\":\"Jika rekan melanggar karena ingin praktis, opsi bernilai 5 biasanya **mengingatkan sekaligus memberi solusi praktis** yang sesuai aturan.\",\"rujukan\":[]},{\"id\":\"p03-094\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Atasan meminta Anda mengunggah dokumentasi kegiatan posyandu ke media sosial instansi. Banyak foto menampilkan wajah anak-anak dan ibu mereka dengan jelas, dan beberapa foto memperlihatkan kartu yang memuat nama serta alamat. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengunggah semua foto apa adanya, termasuk yang memperlihatkan nama dan alamat, agar unggahan lebih informatif\"},{\"huruf\":\"B\",\"teks\":\"Mengunggah hanya foto petugas dan suasana tempat kegiatan tanpa menampilkan peserta sama sekali\"},{\"huruf\":\"C\",\"teks\":\"Menolak mengunggah dokumentasi kegiatan karena khawatir melanggar privasi peserta\"},{\"huruf\":\"D\",\"teks\":\"Mengunggah foto kegiatan setelah mengaburkan wajah anak-anak dan menutup semua tulisan pada kartu yang memuat nama serta alamat peserta\"},{\"huruf\":\"E\",\"teks\":\"Memilih foto yang tidak menampilkan identitas anak dan data pribadi, atau yang orang tuanya sudah setuju, lalu mengunggahnya\"}],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":3,\"C\":2,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Media sosial instansi perlu menampilkan kegiatan secara menarik, tetapi **data pribadi dan privasi anak** wajib dilindungi. Foto yang memperlihatkan nama dan alamat dapat disalahgunakan. Langkah terbaik adalah memilih foto yang tidak menampilkan identitas anak dan data pribadi, atau memakai foto yang sudah mendapat **persetujuan orang tua**. Dengan begitu, tugas dari atasan tetap terlaksana dan hak peserta terlindungi.\",\"opsi\":{\"A\":\"Paling buruk. Menyebarkan nama, alamat, dan wajah anak secara terbuka melanggar pelindungan data pribadi dan membahayakan anak.\",\"B\":\"Aman, tetapi kurang menggambarkan manfaat kegiatan bagi warga. Masih ada pilihan foto yang aman sekaligus informatif.\",\"C\":\"Menghindar. Tugas tidak dijalankan, padahal ada cara mengunggah yang aman.\",\"D\":\"Melindungi identitas, tetapi berdasarkan penyuntingan, bukan persetujuan. Pengaburan yang kurang rapi juga masih bisa mengungkap identitas.\",\"E\":\"Paling ideal. Informatif, menghormati privasi, dan berdasarkan persetujuan orang tua.\"},\"konsep\":\"**Etika dokumentasi publik:** minimalkan data pribadi, utamakan persetujuan, dan beri perlindungan lebih bagi anak. Data seperti nama lengkap, alamat, dan wajah anak termasuk informasi yang perlu dijaga.\"},\"tips\":\"Dalam soal unggahan media sosial, opsi bernilai 5 biasanya **tetap menjalankan tugas** dengan cara yang **melindungi data pribadi**, terutama data anak.\",\"rujukan\":[\"UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi\"]},{\"id\":\"p03-095\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Sistem pelaporan daring yang baru diterapkan di kantor Anda sering bermasalah. Beberapa rekan mulai kembali memakai laporan kertas, sehingga sebagian data tidak masuk ke sistem. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Ikut memakai laporan kertas untuk sementara sampai sistem diperbaiki oleh pengelolanya\"},{\"huruf\":\"B\",\"teks\":\"Mencatat jenis dan waktu gangguan, melaporkannya ke pengelola sistem, dan menyepakati prosedur cadangan yang datanya tetap masuk ke sistem\"},{\"huruf\":\"C\",\"teks\":\"Mencoba memperbaiki sistem sendiri dengan mengubah pengaturan server tanpa izin pengelola sistem\"},{\"huruf\":\"D\",\"teks\":\"Mengunggah keluhan tentang sistem kantor di media sosial pribadi agar cepat ditanggapi oleh pimpinan\"},{\"huruf\":\"E\",\"teks\":\"Melaporkan gangguan kepada pengelola sistem dan meminta rekan-rekan tetap mencoba memakai sistem daring walaupun pekerjaan mereka menjadi lebih lambat\"}],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":1,\"D\":2,\"E\":4},\"pembahasan\":{\"inti\":\"Sistem baru sering mengalami gangguan pada masa awal. Pegawai yang profesional membantu **memperbaiki sistem** dengan memberikan laporan gangguan yang rinci, seperti jenis kesalahan dan waktunya, kepada pengelola. Selama perbaikan berjalan, dibutuhkan **prosedur cadangan** yang disepakati, misalnya pencatatan sementara yang kemudian dimasukkan ke sistem. Dengan begitu, pekerjaan tetap berjalan dan tidak ada data yang hilang dari sistem.\",\"opsi\":{\"A\":\"Pekerjaan berjalan, tetapi data terus berada di luar sistem dan gangguan tidak dilaporkan untuk diperbaiki. Pengelola juga tidak tahu bahwa sistem bermasalah.\",\"B\":\"Paling ideal. Gangguan didokumentasikan dan dilaporkan, serta ada prosedur cadangan yang menjaga kelengkapan data.\",\"C\":\"Paling buruk. Mengubah pengaturan tanpa izin dapat merusak sistem dan melanggar aturan keamanan.\",\"D\":\"Membuka masalah internal ke publik dapat merusak nama baik instansi, padahal ada saluran resmi.\",\"E\":\"Melaporkan gangguan sudah tepat, tetapi tidak ada solusi sementara. Rekan dipaksa memakai sistem yang bermasalah.\"},\"konsep\":\"**Laporan gangguan yang baik** memuat apa yang terjadi, kapan, langkah yang dilakukan, dan pesan kesalahan yang muncul. Laporan rinci mempercepat perbaikan.\"},\"tips\":\"Untuk soal sistem baru yang bermasalah, opsi bernilai 5 biasanya **melaporkan secara rinci** dan **menyediakan cara sementara** agar pekerjaan dan data tetap terjaga.\",\"rujukan\":[]},{\"id\":\"p03-096\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Anda menyelesaikan tugas penyusunan rekap data dua hari lebih cepat dari tenggat yang ditetapkan atasan. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memeriksa ulang hasil kerja, menyerahkannya, lalu menawarkan bantuan untuk tugas lain yang sedang dikerjakan tim\"},{\"huruf\":\"B\",\"teks\":\"Menyerahkan hasil kerja kepada atasan, lalu menunggu sampai diberi tugas berikutnya\"},{\"huruf\":\"C\",\"teks\":\"Menyimpan hasil kerja dan baru menyerahkannya mendekati tenggat agar tidak diberi tugas tambahan\"},{\"huruf\":\"D\",\"teks\":\"Memeriksa ulang seluruh hasil kerja dengan teliti, lalu menyerahkannya kepada atasan dua hari lebih cepat dari jadwal yang ditetapkan\"},{\"huruf\":\"E\",\"teks\":\"Memakai sisa waktu kerja untuk menyelesaikan urusan pribadi di kantor\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":1,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Profesionalisme terlihat dari **mutu kerja** dan **pemanfaatan waktu kerja untuk organisasi**. Menyelesaikan tugas lebih cepat adalah hal baik, tetapi hasilnya tetap perlu diperiksa ulang agar tidak ada kesalahan. Setelah menyerahkan hasil, sisa waktu dapat dipakai untuk membantu tim. Sikap ini menunjukkan tanggung jawab, inisiatif, dan semangat kolaboratif. Atasan juga mendapat gambaran yang jujur tentang kapasitas kerja Anda.\",\"opsi\":{\"A\":\"Paling ideal. Mutu dijaga, hasil diserahkan lebih cepat, dan sisa waktu dipakai untuk membantu tim.\",\"B\":\"Menyerahkan hasil sudah tepat, tetapi pasif dan tanpa pemeriksaan ulang.\",\"C\":\"Paling buruk. Menahan hasil kerja untuk menghindari tugas tambahan adalah sikap tidak jujur terhadap organisasi.\",\"D\":\"Teliti dan tepat waktu, tetapi tidak menawarkan diri untuk membantu tugas lain.\",\"E\":\"Memakai waktu kerja untuk urusan pribadi tidak sesuai dengan kewajiban ASN, walaupun tugas utama sudah selesai.\"},\"konsep\":\"**Pola bobot efisiensi kerja:** 5 = periksa + serahkan + berinisiatif membantu; 4 = periksa + serahkan; 3 = serahkan lalu menunggu; 2 = memakai waktu kerja untuk urusan pribadi; 1 = menahan hasil kerja dengan sengaja.\"},\"tips\":\"Opsi yang memuat **pemeriksaan mutu** dan **inisiatif membantu tim** biasanya bernilai 5. Opsi yang menyembunyikan kapasitas kerja hampir selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p03-097\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Instansi memberi Anda kesempatan bekerja dari mana saja dua hari setiap pekan, dengan syarat tetap bekerja penuh dan mudah dihubungi pada jam kerja. Pada salah satu hari tersebut, keluarga mengajak Anda berlibur ke tempat yang sinyalnya sangat terbatas. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Ikut berlibur dan tetap mengisi presensi daring seolah-olah bekerja seperti biasa\"},{\"huruf\":\"B\",\"teks\":\"Ikut berlibur dan baru mengerjakan tugas setibanya di rumah, tanpa memberi tahu atasan\"},{\"huruf\":\"C\",\"teks\":\"Bekerja dari tempat yang sinyalnya memadai pada hari itu, atau mengajukan cuti sesuai aturan jika ingin ikut berlibur\"},{\"huruf\":\"D\",\"teks\":\"Tetap bekerja dari rumah pada hari itu dan mengusulkan kepada keluarga agar liburan diadakan pada akhir pekan saja\"},{\"huruf\":\"E\",\"teks\":\"Ikut berlibur setelah memberi tahu atasan bahwa Anda mungkin sulit dihubungi, sambil berusaha menyelesaikan tugas tepat waktu\"}],\"kunci\":\"C\",\"bobot\":{\"A\":1,\"B\":2,\"C\":5,\"D\":4,\"E\":3},\"pembahasan\":{\"inti\":\"Bekerja dari mana saja **bukan hari libur**. Kewajiban jam kerja, ketersediaan, dan capaian tetap berlaku. Pegawai yang profesional memastikan dapat bekerja penuh dan dihubungi pada hari itu. Jika ingin ikut berlibur, jalurnya adalah **mengajukan cuti sesuai aturan**. Pilihan ini jujur kepada instansi dan tetap memberi ruang bagi kebutuhan keluarga melalui hak cuti yang sah.\",\"opsi\":{\"A\":\"Paling buruk. Mengisi presensi seolah-olah bekerja adalah ketidakjujuran dan pelanggaran disiplin.\",\"B\":\"Menyembunyikan ketidaktersediaan dari atasan. Pekerjaan pada jam kerja terbengkalai. Atasan juga tidak dapat menghubungi Anda saat dibutuhkan.\",\"C\":\"Paling ideal. Taat syarat bekerja dari mana saja, jujur, dan memakai hak cuti jika memang ingin berlibur.\",\"D\":\"Bertanggung jawab dan taat syarat, tetapi tidak mempertimbangkan pilihan cuti yang sah, sehingga kebutuhan keluarga dikesampingkan.\",\"E\":\"Jujur kepada atasan, tetapi tetap melanggar syarat mudah dihubungi pada jam kerja. Kejujuran tidak mengubah kewajiban. Pekerjaan tim yang membutuhkan Anda tetap terganggu.\"},\"konsep\":\"**Fleksibilitas kerja disertai akuntabilitas:** tempat boleh fleksibel, tetapi jam kerja, ketersediaan, dan hasil tetap dapat dipertanggungjawabkan. Kebutuhan pribadi diurus dengan hak cuti.\"},\"tips\":\"Pada soal kebijakan kerja fleksibel, opsi bernilai 5 biasanya **menaati syarat kebijakan** dan **memakai jalur resmi** (cuti, izin) untuk kebutuhan pribadi.\",\"rujukan\":[]},{\"id\":\"p03-098\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Capaian program unit Anda tahun ini hanya 70% dari target. Atasan meminta Anda menuliskan capaian 95% dalam laporan tahunan agar unit tidak mendapat penilaian buruk. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengubah angka capaian sesuai permintaan atasan karena atasanlah yang menandatangani laporan\"},{\"huruf\":\"B\",\"teks\":\"Menolak dengan santun, menjelaskan risikonya, dan menawarkan penyajian capaian apa adanya disertai kendala serta rencana perbaikan\"},{\"huruf\":\"C\",\"teks\":\"Menolak mengubah data dan mempersilakan atasan mengubah angka itu sendiri jika ia tetap menghendakinya\"},{\"huruf\":\"D\",\"teks\":\"Menolak mengubah angka capaian dan menjelaskan kepada atasan bahwa laporan tahunan wajib disusun sesuai fakta dan data yang tercatat di unit\"},{\"huruf\":\"E\",\"teks\":\"Menyusun laporan sesuai data asli tanpa membahas permintaan atasan, lalu langsung mengirimkannya\"}],\"kunci\":\"B\",\"bobot\":{\"A\":1,\"B\":5,\"C\":2,\"D\":4,\"E\":3},\"pembahasan\":{\"inti\":\"Memalsukan capaian dalam laporan resmi adalah pelanggaran **integritas** dan dapat menyesatkan pengambilan keputusan. Pegawai yang profesional **menolak**, tetapi tetap menjaga hubungan kerja dengan atasan. Ia menjelaskan risikonya, lalu menawarkan jalan keluar: capaian disajikan apa adanya bersama penjelasan kendala dan rencana perbaikan. Laporan seperti ini jujur dan tetap menunjukkan bahwa unit memahami masalahnya serta siap memperbaikinya.\",\"opsi\":{\"A\":\"Paling buruk. Ikut memalsukan laporan resmi. Tanda tangan atasan tidak menghapus tanggung jawab penyusun laporan.\",\"B\":\"Paling ideal. Tegas menolak, santun, menjelaskan risiko, dan memberi solusi yang jujur.\",\"C\":\"Menolak, tetapi membiarkan pemalsuan tetap terjadi dan lepas tangan dari akibatnya. Penyusun laporan tetap ikut bertanggung jawab jika pemalsuan terungkap.\",\"D\":\"Tegas dan benar, tetapi tanpa solusi. Kekhawatiran atasan tentang penilaian buruk tidak terjawab.\",\"E\":\"Jujur, tetapi menghindari komunikasi. Atasan dapat merasa diabaikan, dan konflik bisa muncul kemudian. Jalan keluar bagi kekhawatiran atasan juga tidak ditawarkan.\"},\"konsep\":\"**Menolak perintah yang melanggar:** tolak dengan santun, jelaskan dasar aturannya, tawarkan alternatif yang sah. Jika tekanan berlanjut, gunakan saluran pengaduan resmi.\"},\"tips\":\"Dalam soal perintah atasan yang melanggar aturan, opsi bernilai 5 biasanya **menolak sambil menawarkan solusi yang sah**. Opsi yang menuruti perintah selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p03-099\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Pukul 15.30, atasan memberi Anda tugas tambahan yang harus selesai besok pukul 08.00. Saat itu Anda sedang mengerjakan tugas lain yang tenggatnya lusa. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak tugas tambahan karena jam kerja hampir berakhir\"},{\"huruf\":\"B\",\"teks\":\"Menerima tugas tambahan dan baru mengerjakannya besok pagi sebelum pukul 08.00\"},{\"huruf\":\"C\",\"teks\":\"Menerima tugas, lalu menyuruh rekan junior mengerjakannya atas nama Anda tanpa sepengetahuan atasan agar Anda bisa pulang\"},{\"huruf\":\"D\",\"teks\":\"Menerima tugas tambahan dan langsung mengerjakannya sampai selesai hari ini juga, walaupun harus bekerja lembur hingga larut malam\"},{\"huruf\":\"E\",\"teks\":\"Menerima tugas, menanyakan hasil yang diharapkan, mendahulukannya dari tugas bertenggat lusa, dan menyelesaikannya tepat waktu\"}],\"kunci\":\"E\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Tugas mendadak adalah bagian dari dinamika kerja. Pegawai profesional **menerima tugas**, **memastikan hasil yang diharapkan**, dan **mengatur ulang prioritas** berdasarkan tenggat. Karena tugas lain tenggatnya lusa, tugas tambahan dapat didahulukan tanpa mengorbankan tugas lama. Menanyakan hasil yang diharapkan sejak awal mencegah kesalahan yang harus diulang. Hasilnya, kedua tugas dapat selesai tepat waktu.\",\"opsi\":{\"A\":\"Menghindar dengan alasan jam kerja, padahal tugas itu masih dapat diatur.\",\"B\":\"Menerima tugas, tetapi berisiko. Waktu besok pagi sangat sempit untuk memperbaiki jika ada masalah.\",\"C\":\"Paling buruk. Melempar tugas kepada junior tanpa sepengetahuan atasan adalah tidak jujur dan tidak bertanggung jawab.\",\"D\":\"Bertanggung jawab dan bersedia lembur, tetapi tanpa memastikan hasil yang diharapkan dan tanpa mengatur prioritas.\",\"E\":\"Paling ideal. Jelas hasilnya, prioritas diatur, dan kedua tugas tetap terkendali.\"},\"konsep\":\"**Mengelola prioritas:** bandingkan tenggat dan dampak, klarifikasi harapan, lalu susun urutan kerja. Pola bobot: 5 = terima + klarifikasi + atur prioritas; 4 = terima + kerja keras; 3 = terima tetapi menunda; 2 = menolak; 1 = melempar tugas secara tidak jujur.\"},\"tips\":\"Opsi bernilai 5 pada soal tugas mendadak biasanya memuat kata **memastikan** atau **menanyakan** harapan, ditambah **mengatur prioritas**. Kerja keras saja biasanya bernilai 4.\",\"rujukan\":[]},{\"id\":\"p03-100\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Laporan analisis yang Anda susun selama satu minggu dikembalikan atasan dengan catatan singkat bahwa laporan itu belum sesuai harapan dan harus diulang. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengulang laporan sambil mengeluh kepada rekan-rekan bahwa atasan terlalu banyak menuntut\"},{\"huruf\":\"B\",\"teks\":\"Mengulang laporan sesuai pemahaman Anda sendiri tanpa menanyakan apa yang dimaksud atasan\"},{\"huruf\":\"C\",\"teks\":\"Menolak mengulang laporan karena Anda yakin laporan itu sudah benar\"},{\"huruf\":\"D\",\"teks\":\"Menanyakan bagian yang perlu diperbaiki dan standar yang diharapkan, lalu mengulang dan memeriksanya sebelum diserahkan\"},{\"huruf\":\"E\",\"teks\":\"Menerima keputusan atasan dengan lapang dada dan segera mengulang laporan dengan lebih teliti dan lebih rinci daripada sebelumnya\"}],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Penolakan hasil kerja adalah **umpan balik**, bukan serangan pribadi. Catatan atasan yang singkat belum menjelaskan bagian mana yang kurang. Karena itu, langkah pertama adalah **menanyakan** bagian yang perlu diperbaiki dan standar yang diharapkan. Setelah jelas, laporan diulang dan diperiksa sebelum diserahkan. Cara ini menghemat waktu, karena perbaikan tepat sasaran dan tidak perlu diulang berkali-kali.\",\"opsi\":{\"A\":\"Mengerjakan, tetapi mengeluh di belakang atasan merusak suasana kerja dan citra profesional Anda. Keluhan semacam itu juga tidak membantu Anda memahami apa yang harus diperbaiki.\",\"B\":\"Bertanggung jawab, tetapi tanpa kejelasan, hasil yang baru bisa saja kembali tidak sesuai harapan.\",\"C\":\"Paling buruk. Menolak perintah kerja yang sah tanpa dialog menunjukkan sikap tidak profesional. Tanpa bertanya, Anda juga tidak tahu alasan laporan dikembalikan.\",\"D\":\"Paling ideal. Mencari kejelasan, memperbaiki dengan tepat, dan menjaga mutu.\",\"E\":\"Sikapnya positif dan cepat bertindak, tetapi tanpa bertanya, *lebih teliti dan lebih rinci* belum tentu sesuai dengan harapan atasan.\"},\"konsep\":\"**Menerima umpan balik secara profesional:** dengarkan, klarifikasi, perbaiki, dan periksa ulang. Mengulang tanpa klarifikasi sering menghasilkan kesalahan yang sama.\"},\"tips\":\"Jika umpan balik yang diterima **kurang jelas**, opsi bernilai 5 biasanya **bertanya lebih dulu** sebelum memperbaiki.\",\"rujukan\":[]},{\"id\":\"p03-101\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Seorang teman dekat di kantor sering meninggalkan kantor pada jam kerja untuk mengurus usaha pribadinya. Ia meminta Anda mengatakan bahwa ia sedang rapat di unit lain jika atasan menanyakannya. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menutupi teman Anda dengan mengatakan ia sedang rapat di unit lain setiap kali atasan bertanya\"},{\"huruf\":\"B\",\"teks\":\"Menghindari teman Anda agar tidak dimintai tolong lagi, tanpa membicarakan permintaannya\"},{\"huruf\":\"C\",\"teks\":\"Menolak menutupi, mengingatkannya secara pribadi tentang kewajiban jam kerja, menyarankan izin resmi, dan menjawab jujur jika ditanya\"},{\"huruf\":\"D\",\"teks\":\"Menolak menutupi teman Anda dan menjawab dengan jujur sesuai yang Anda ketahui jika suatu saat atasan bertanya tentang keberadaan teman Anda\"},{\"huruf\":\"E\",\"teks\":\"Langsung melaporkan kebiasaan teman Anda kepada atasan tanpa membicarakannya lebih dulu dengannya\"}],\"kunci\":\"C\",\"bobot\":{\"A\":1,\"B\":2,\"C\":5,\"D\":4,\"E\":3},\"pembahasan\":{\"inti\":\"Persahabatan tidak boleh mengalahkan **kejujuran dan disiplin kerja**. Menutupi ketidakhadiran teman berarti ikut berbohong kepada atasan. Sikap terbaik adalah menolak dengan jelas, lalu **mengingatkan teman secara pribadi** tentang kewajiban jam kerja dan menyarankan izin resmi jika memang ada keperluan. Jika atasan bertanya, Anda menjawab jujur. Teman diberi kesempatan memperbaiki diri, dan integritas Anda tetap terjaga.\",\"opsi\":{\"A\":\"Paling buruk. Ikut berbohong kepada atasan dan membiarkan pelanggaran disiplin terus terjadi.\",\"B\":\"Menghindar. Tidak ikut berbohong, tetapi masalah tidak dibicarakan dan teman tidak diingatkan. Kebiasaan teman Anda juga terus berlanjut.\",\"C\":\"Paling ideal. Jujur, peduli kepada teman, memberi solusi yang sah, dan tetap terbuka kepada atasan.\",\"D\":\"Jujur dan tegas, tetapi tidak berusaha mengingatkan teman agar ia berubah. Teman Anda tidak mendapat kesempatan memperbaiki diri sebelum masalahnya diketahui atasan.\",\"E\":\"Tidak salah secara aturan, tetapi melewatkan kesempatan mengingatkan teman secara pribadi lebih dulu. Hubungan pertemanan juga bisa rusak karena teman merasa dilaporkan diam-diam.\"},\"konsep\":\"**Integritas dalam relasi pertemanan:** tolak ikut melanggar, ingatkan secara pribadi, tunjukkan jalur yang sah, dan tetap jujur kepada pihak berwenang.\"},\"tips\":\"Jika teman meminta ditutupi, opsi bernilai 5 biasanya **menolak + mengingatkan + memberi jalan keluar yang sah**. Opsi yang ikut berbohong selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p03-102\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Anda mendapat surat penugasan untuk dimutasi ke kantor cabang di daerah terpencil selama tiga tahun. Keluarga Anda selama ini tinggal di kota tempat Anda bekerja sekarang. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta bantuan kerabat yang berpengaruh agar penugasan Anda dibatalkan\"},{\"huruf\":\"B\",\"teks\":\"Menolak penugasan karena tidak ingin tinggal jauh dari keluarga\"},{\"huruf\":\"C\",\"teks\":\"Menerima penugasan, tetapi berencana segera mengajukan pindah kembali begitu tiba di tempat baru\"},{\"huruf\":\"D\",\"teks\":\"Menerima penugasan dan mempersiapkan kepindahan diri serta keluarga sebaik-baiknya sebelum tanggal berangkat yang ditetapkan\"},{\"huruf\":\"E\",\"teks\":\"Menerima penugasan, mempelajari kebutuhan daerah tujuan, menyiapkan keluarga, dan menyusun rencana kerja awal\"}],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":2,\"C\":3,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"ASN wajib bersedia **ditempatkan di seluruh wilayah Indonesia** sesuai kebutuhan organisasi. Penugasan ke daerah terpencil adalah kesempatan untuk mengabdi dan mengembangkan diri. Pegawai yang profesional menerimanya dengan **persiapan yang matang**, tidak hanya urusan pindah rumah. Mempelajari kondisi dan kebutuhan daerah tujuan serta menyusun rencana kerja awal membuat ia dapat langsung berkontribusi begitu tiba. Kesiapan keluarga juga dijaga.\",\"opsi\":{\"A\":\"Paling buruk. Memakai pengaruh kerabat untuk membatalkan penugasan adalah bentuk nepotisme.\",\"B\":\"Menolak penugasan yang sah karena kepentingan pribadi tidak sesuai dengan kewajiban ASN.\",\"C\":\"Menerima secara formal, tetapi tanpa komitmen. Rencana segera pindah kembali membuat tugas di daerah tidak dijalankan sepenuh hati.\",\"D\":\"Menerima dan bersiap dengan baik, tetapi persiapannya baru menyangkut kepindahan, belum menyangkut pekerjaan di daerah tujuan.\",\"E\":\"Paling ideal. Menerima dengan komitmen, siap secara pribadi, dan siap bekerja di tempat baru.\"},\"konsep\":\"**Komitmen terhadap organisasi:** menerima penugasan yang sah, bersiap secara profesional, dan menjalankannya dengan sungguh-sungguh. Keberatan pribadi yang serius disampaikan melalui jalur resmi, bukan melalui koneksi.\"},\"tips\":\"Pada soal mutasi atau penugasan, opsi bernilai 5 biasanya **menerima dan bersiap untuk berkontribusi**. Opsi yang memakai koneksi untuk menghindari tugas selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p03-103\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Bendahara kegiatan meminta Anda menandatangani daftar hadir sebuah pelatihan agar laporan pertanggungjawabannya lengkap. Anda sebenarnya tidak menghadiri pelatihan itu karena sedang bertugas di luar kantor. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak menandatangani, menjelaskan bahwa daftar hadir harus sesuai kenyataan, dan menyarankan laporan disusun sesuai peserta yang hadir\"},{\"huruf\":\"B\",\"teks\":\"Menolak menandatangani daftar hadir tanpa memberikan penjelasan apa pun kepada bendahara\"},{\"huruf\":\"C\",\"teks\":\"Menandatangani dan menerima uang transpor pelatihan karena peserta lain juga menerimanya\"},{\"huruf\":\"D\",\"teks\":\"Menandatangani daftar hadir, tetapi menolak menerima uang transpor yang tercantum atas nama Anda\"},{\"huruf\":\"E\",\"teks\":\"Menolak menandatangani dan menyampaikan kepada bendahara bahwa pada hari pelatihan itu Anda sedang bertugas di luar kantor sehingga tidak hadir\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":1,\"D\":2,\"E\":4},\"pembahasan\":{\"inti\":\"Daftar hadir adalah **bukti pertanggungjawaban keuangan negara**. Menandatangani daftar hadir kegiatan yang tidak diikuti berarti membuat dokumen yang tidak sesuai kenyataan, dan jika ada uang yang dicairkan atas dasar itu, perbuatannya dapat merugikan negara. Sikap yang tepat adalah **menolak**, **menjelaskan alasannya**, dan **memberi jalan keluar yang sah**, yaitu menyusun laporan sesuai peserta yang benar-benar hadir. Bendahara tetap dapat menyelesaikan laporannya dengan benar.\",\"opsi\":{\"A\":\"Paling ideal. Menolak dengan alasan yang jelas dan memberi solusi yang sesuai aturan.\",\"B\":\"Menolak itu benar, tetapi tanpa penjelasan bendahara bisa tidak memahami masalahnya dan meminta orang lain.\",\"C\":\"Paling buruk. Memalsukan kehadiran sekaligus menerima uang negara yang bukan haknya.\",\"D\":\"Tidak menerima uang, tetapi tetap memalsukan dokumen. Laporan yang tidak sesuai kenyataan tetap merupakan pelanggaran.\",\"E\":\"Menolak dan jujur, tetapi belum membantu bendahara menemukan cara yang benar untuk melengkapi laporan.\"},\"konsep\":\"**Akuntabilitas keuangan:** setiap dokumen pertanggungjawaban harus sesuai fakta. Pola bobot: 5 = tolak + jelaskan + solusi sah; 4 = tolak + jujur; 3 = tolak tanpa penjelasan; 2 = ikut memalsukan tanp
