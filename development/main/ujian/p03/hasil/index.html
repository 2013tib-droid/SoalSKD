unks/872-106933cc9ee264a4.js\",\"910\",\"static/chunks/910-935933d202d9be45.js\",\"352\",\"static/chunks/app/ujian/%5Bpaket%5D/hasil/page-86dcf7905e580023.js\"],\"LayarHasil\"]\n"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$c\",null,{\"children\":[\"$\",\"$Lf\",null,{\"paket\":\"p03\",\"dataStatik\":{\"soal\":[{\"id\":\"p03-001\",\"kategori\":\"TWK\",\"subtopik\":\"Pancasila\",\"pertanyaan\":\"Di sebuah puskesmas, petugas melayani pasien sesuai nomor antrean dan tingkat kegawatan. Pakaian, jabatan, dan asal daerah pasien tidak memengaruhi urutan pelayanan. Sikap petugas tersebut paling sesuai dengan sila ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Kedua, karena setiap orang diperlakukan setara sesuai harkat dan martabatnya sebagai manusia\"},{\"huruf\":\"B\",\"teks\":\"Kelima, karena setiap pasien menerima jumlah obat yang sama banyak tanpa memandang kebutuhan medisnya\"},{\"huruf\":\"C\",\"teks\":\"Ketiga, karena pasien dari berbagai daerah dilayani di gedung yang sama\"},{\"huruf\":\"D\",\"teks\":\"Pertama, karena kesehatan adalah anugerah dari Tuhan Yang Maha Esa\"},{\"huruf\":\"E\",\"teks\":\"Keempat, karena urutan pelayanan ditentukan melalui musyawarah\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Sila kedua, **Kemanusiaan yang adil dan beradab**, menuntut pengakuan atas persamaan derajat, hak, dan kewajiban setiap manusia tanpa membedakan suku, agama, keturunan, kedudukan sosial, atau warna kulit. Petugas dalam soal tidak memberi keistimewaan kepada pasien yang tampak kaya atau berjabatan. Ia memakai ukuran yang adil, yaitu urutan datang dan kondisi medis. Sikap ini adalah wujud perlakuan yang **adil dan beradab** terhadap sesama manusia, sehingga paling tepat dikaitkan dengan sila kedua.\",\"opsi\":{\"B\":\"Keadilan sosial bukan berarti semua orang menerima jumlah yang sama. Obat harus diberikan sesuai kebutuhan medis. Selain itu, soal membahas urutan pelayanan, bukan pembagian obat.\",\"C\":\"Pasien dari berbagai daerah memang dilayani bersama, tetapi inti perilaku dalam soal adalah perlakuan setara, bukan upaya menjaga persatuan wilayah.\",\"D\":\"Pernyataan bahwa kesehatan adalah anugerah Tuhan benar, tetapi tidak menjelaskan alasan petugas melayani tanpa membeda-bedakan pasien.\",\"E\":\"Tidak ada musyawarah dalam soal. Urutan ditentukan oleh nomor antrean dan tingkat kegawatan.\"},\"konsep\":\"**Ciri sila kedua:** mengakui persamaan derajat manusia, saling mencintai, tenggang rasa, tidak semena-mena, dan berani membela kebenaran serta keadilan. Kata kunci di soal: *tanpa membedakan*, *martabat*, *perlakuan setara*.\"},\"tips\":\"Bedakan sila kedua dan kelima. Sila kedua berbicara tentang **perlakuan terhadap sesama manusia** (setara, tidak semena-mena). Sila kelima berbicara tentang **pembagian hasil dan kesempatan** dalam masyarakat (adil, sesuai kebutuhan dan kontribusi).\",\"rujukan\":[]},{\"id\":\"p03-002\",\"kategori\":\"TWK\",\"subtopik\":\"Pancasila\",\"pertanyaan\":\"Dua kabupaten bertetangga berselisih soal pemanfaatan sumber air di perbatasan. Kedua bupati akhirnya sepakat membagi pemanfaatan air sesuai kebutuhan warga di kedua sisi dan membentuk tim pengelola bersama, walaupun masing-masing daerah melepaskan sebagian tuntutannya. Nilai Pancasila yang paling menonjol dalam kesepakatan itu adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Ketuhanan, karena kedua bupati sama-sama menjalankan ajaran agama untuk berdamai\"},{\"huruf\":\"B\",\"teks\":\"Persatuan, karena kedua daerah menempatkan kepentingan bersama di atas kepentingan daerahnya sendiri\"},{\"huruf\":\"C\",\"teks\":\"Kerakyatan, karena kesepakatan dicapai oleh dua kepala daerah yang dipilih langsung oleh rakyat melalui pemilu\"},{\"huruf\":\"D\",\"teks\":\"Keadilan sosial, karena air harus dibagi sama rata kepada seluruh warga Indonesia\"},{\"huruf\":\"E\",\"teks\":\"Kemanusiaan, karena warga di perbatasan tidak boleh diperlakukan berbeda\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Sila ketiga, **Persatuan Indonesia**, menuntut kesediaan menempatkan persatuan, kesatuan, serta kepentingan dan keselamatan bangsa di atas kepentingan pribadi atau golongan. Dalam soal, kedua kabupaten sama-sama melepaskan sebagian tuntutannya dan memilih mengelola sumber air bersama. Mereka tidak membiarkan sengketa wilayah memecah hubungan antardaerah. Sikap ini adalah contoh nyata **rela berkorban demi kepentingan bersama**, yang menjadi ciri pengamalan sila ketiga.\",\"opsi\":{\"A\":\"Soal tidak menyebut ajaran agama sebagai dasar kesepakatan. Mengaitkan semua perdamaian dengan sila pertama terlalu umum.\",\"C\":\"Pengecoh terkuat. Kesepakatan memang lahir dari perundingan, tetapi yang ditonjolkan adalah **pengorbanan kepentingan daerah demi persatuan**. Status bupati sebagai pejabat hasil pemilu tidak relevan dengan pertanyaan.\",\"D\":\"Air tidak dibagi sama rata ke seluruh Indonesia, melainkan sesuai kebutuhan warga di dua kabupaten. Pernyataan opsi ini juga keliru memaknai keadilan sosial.\",\"E\":\"Kesetaraan perlakuan memang baik, tetapi bukan inti cerita. Inti cerita adalah menyelesaikan sengketa antardaerah demi kepentingan bersama.\"},\"konsep\":\"**Ciri sila ketiga:** menempatkan kepentingan bangsa di atas kepentingan pribadi atau golongan, rela berkorban untuk bangsa, cinta tanah air, bangga sebagai bangsa Indonesia, dan memajukan pergaulan demi persatuan.\"},\"tips\":\"Jika soal menggambarkan pihak yang **melepaskan kepentingan kelompok atau daerahnya** demi keutuhan bersama, pilih sila ketiga. Jika yang ditonjolkan adalah **cara mengambil keputusan**, baru pertimbangkan sila keempat.\",\"rujukan\":[]},{\"id\":\"p03-003\",\"kategori\":\"TWK\",\"subtopik\":\"Pancasila\",\"pertanyaan\":\"Sidang pertama BPUPKI berlangsung pada 29 Mei–1 Juni 1945. Pernyataan yang tepat tentang sidang tersebut adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Sidang mengesahkan UUD 1945 dan memilih Soekarno sebagai presiden\"},{\"huruf\":\"B\",\"teks\":\"Sidang menghasilkan Piagam Jakarta yang disusun oleh Panitia Sembilan pada hari terakhir sidang\"},{\"huruf\":\"C\",\"teks\":\"Sidang membahas dasar negara, dengan usulan antara lain dari Muhammad Yamin, Soepomo, dan Soekarno\"},{\"huruf\":\"D\",\"teks\":\"Sidang dipimpin oleh Soekarno dan dihadiri oleh perwakilan Sekutu\"},{\"huruf\":\"E\",\"teks\":\"Sidang membahas rancangan undang-undang dasar dan bentuk wilayah negara yang akhirnya disepakati melalui pemungutan suara\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Agenda sidang pertama BPUPKI (29 Mei–1 Juni 1945) adalah **merumuskan dasar negara** Indonesia merdeka. Dalam sidang ini beberapa tokoh menyampaikan gagasan, antara lain **Muhammad Yamin** (29 Mei), **Soepomo** (31 Mei), dan **Soekarno** (1 Juni). Soekarno menamai usulan lima dasarnya *Pancasila*, sehingga 1 Juni kemudian diperingati sebagai Hari Lahir Pancasila. Sidang ini belum menghasilkan rumusan yang disepakati, sehingga dibentuk panitia kecil untuk melanjutkan perumusan.\",\"opsi\":{\"A\":\"Pengesahan UUD 1945 serta pemilihan presiden dan wakil presiden adalah hasil **sidang PPKI 18 Agustus 1945**, bukan sidang BPUPKI.\",\"B\":\"Piagam Jakarta disusun Panitia Sembilan dan ditandatangani pada **22 Juni 1945**, setelah sidang pertama berakhir, bukan pada hari terakhir sidang.\",\"D\":\"Ketua BPUPKI adalah **dr. K.R.T. Radjiman Wedyodiningrat**, bukan Soekarno. Tidak ada perwakilan Sekutu, karena BPUPKI dibentuk pada masa pendudukan Jepang.\",\"E\":\"Rancangan undang-undang dasar dan bentuk negara dibahas pada **sidang kedua** BPUPKI (10–17 Juli 1945). Opsi ini mencampur agenda dua sidang yang berbeda.\"},\"konsep\":\"**Urutan peristiwa:** sidang pertama BPUPKI (29 Mei–1 Juni, dasar negara) → Piagam Jakarta (22 Juni) → sidang kedua BPUPKI (10–17 Juli, rancangan UUD) → sidang PPKI (18 Agustus, pengesahan UUD dan pemilihan presiden).\"},\"tips\":\"Hafalkan **pasangan lembaga–tanggal–hasil**. Pengecoh soal sejarah biasanya menukar hasil satu sidang dengan sidang lain, misalnya hasil PPKI diletakkan pada sidang BPUPKI.\",\"rujukan\":[]},{\"id\":\"p03-004\",\"kategori\":\"TWK\",\"subtopik\":\"Pancasila\",\"pertanyaan\":\"Sila-sila Pancasila disebut bersifat *hierarkis piramidal*. Berdasarkan sifat tersebut, kedudukan sila keempat yang tepat adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Sila keempat berdiri sendiri karena mengatur tata cara demokrasi yang tidak berkaitan dengan sila lain\"},{\"huruf\":\"B\",\"teks\":\"Sila keempat menjiwai sila pertama, kedua, dan ketiga karena kedaulatan rakyat adalah dasar negara\"},{\"huruf\":\"C\",\"teks\":\"Sila keempat dijiwai oleh sila kelima dan menjiwai sila pertama\"},{\"huruf\":\"D\",\"teks\":\"Sila keempat hanya dijiwai oleh sila ketiga karena persatuan adalah syarat musyawarah\"},{\"huruf\":\"E\",\"teks\":\"Sila keempat dijiwai oleh sila pertama, kedua, dan ketiga, serta menjiwai sila kelima\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Dalam susunan **hierarkis piramidal**, sila yang di atas menjadi dasar bagi sila di bawahnya. Sila pertama menjiwai semua sila lainnya. Sebaliknya, setiap sila sesudahnya merupakan pengkhususan dari sila-sila sebelumnya. Jadi, sila keempat **dijiwai oleh sila pertama, kedua, dan ketiga**. Artinya, kerakyatan yang dipimpin oleh hikmat kebijaksanaan harus berketuhanan, berperikemanusiaan, dan menjaga persatuan. Sila keempat juga **menjiwai sila kelima**, karena keadilan sosial dicapai melalui kedaulatan rakyat.\",\"opsi\":{\"A\":\"Kelima sila adalah satu kesatuan yang utuh. Tidak ada sila yang berdiri sendiri. Opsi ini bertentangan dengan sifat Pancasila sebagai satu sistem.\",\"B\":\"Arahnya terbalik. Sila yang lebih awal menjiwai sila sesudahnya, bukan sebaliknya. Kedaulatan rakyat juga bukan satu-satunya dasar negara.\",\"C\":\"Arahnya terbalik dua kali. Sila kelima justru dijiwai sila keempat, dan sila pertama menjiwai sila keempat.\",\"D\":\"Sila ketiga memang menjiwai sila keempat, tetapi tidak sendirian. Sila pertama dan kedua juga menjiwainya. Kata *hanya* membuat opsi ini salah.\"},\"konsep\":\"**Rumus cepat hierarkis piramidal:** sila ke-*n* **dijiwai** oleh sila 1 sampai *n* − 1 dan **menjiwai** sila *n* + 1 sampai 5. Sila pertama tidak dijiwai sila mana pun, sedangkan sila kelima tidak menjiwai sila lain.\"},\"tips\":\"Bayangkan piramida dengan sila pertama di puncak sebagai sumber. Semakin ke bawah, sila semakin khusus dan menerima semangat dari semua sila di atasnya. Waspadai kata mutlak seperti *hanya* atau *berdiri sendiri*.\",\"rujukan\":[]},{\"id\":\"p03-005\",\"kategori\":\"TWK\",\"subtopik\":\"Pancasila\",\"pertanyaan\":\"Perhatikan tiga tanggal berikut dalam sejarah Pancasila.\\n\\n1. 1 Juni 1945\\n2. 22 Juni 1945\\n3. 18 Agustus 1945\\n\\nPasangan tanggal dan peristiwa yang tepat adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"(1) penetapan Pancasila sebagai dasar negara; (2) pidato Soekarno; (3) penandatanganan Piagam Jakarta\"},{\"huruf\":\"B\",\"teks\":\"(1) pembentukan BPUPKI; (2) sidang kedua BPUPKI; (3) proklamasi kemerdekaan\"},{\"huruf\":\"C\",\"teks\":\"(1) penandatanganan Piagam Jakarta; (2) pidato Soekarno; (3) pembentukan PPKI\"},{\"huruf\":\"D\",\"teks\":\"(1) pidato Soekarno yang menamai usulannya Pancasila; (2) penandatanganan Piagam Jakarta; (3) penetapan Pancasila dalam Pembukaan UUD 1945\"},{\"huruf\":\"E\",\"teks\":\"(1) pidato Soepomo tentang negara integralistik; (2) penandatanganan Piagam Jakarta; (3) pembubaran BPUPKI\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Tiga tanggal ini sering ditukar dalam soal.\\n\\n- **1 Juni 1945**: Soekarno berpidato dalam sidang pertama BPUPKI dan menamai lima dasar usulannya *Pancasila*. Tanggal ini diperingati sebagai Hari Lahir Pancasila.\\n- **22 Juni 1945**: Panitia Sembilan menandatangani rumusan yang dikenal sebagai **Piagam Jakarta**.\\n- **18 Agustus 1945**: PPKI mengesahkan UUD 1945. Rumusan Pancasila yang sah tercantum dalam **Pembukaan** UUD tersebut, dengan sila pertama yang sudah diubah.\",\"opsi\":{\"A\":\"Urutannya teracak. Penetapan dasar negara terjadi 18 Agustus, pidato Soekarno 1 Juni, dan Piagam Jakarta 22 Juni.\",\"B\":\"BPUPKI dibentuk sebelum 1 Juni, sidang keduanya berlangsung 10–17 Juli, dan proklamasi terjadi 17 Agustus. Ketiga pasangan salah.\",\"C\":\"Piagam Jakarta dan pidato Soekarno tertukar. PPKI dibentuk pada 7 Agustus 1945, sedangkan 18 Agustus adalah tanggal sidang pertamanya.\",\"E\":\"Pengecoh terkuat karena pasangan kedua benar. Namun, Soepomo berpidato pada 31 Mei, bukan 1 Juni, dan 18 Agustus adalah tanggal pengesahan UUD, bukan pembubaran BPUPKI.\"},\"konsep\":\"**Hari Lahir Pancasila** (1 Juni) berbeda dengan **tanggal pengesahan Pancasila sebagai dasar negara** (18 Agustus). Rumusan yang berlaku adalah rumusan dalam Pembukaan UUD 1945 yang disahkan PPKI.\"},\"tips\":\"Pada soal pasangan tanggal, periksa satu tanggal yang paling Anda yakini dulu, misalnya 22 Juni = Piagam Jakarta. Coret semua opsi yang salah pada tanggal itu, lalu periksa sisanya.\",\"rujukan\":[\"Keputusan Presiden No. 24 Tahun 2016 tentang Hari Lahir Pancasila\"]},{\"id\":\"p03-006\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Menurut UUD NRI Tahun 1945 setelah amandemen, hal berikut **bukan** wewenang Majelis Permusyawaratan Rakyat (MPR) adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengubah dan menetapkan Undang-Undang Dasar\"},{\"huruf\":\"B\",\"teks\":\"Melantik Presiden dan/atau Wakil Presiden\"},{\"huruf\":\"C\",\"teks\":\"Memberhentikan Presiden dan/atau Wakil Presiden dalam masa jabatannya menurut Undang-Undang Dasar\"},{\"huruf\":\"D\",\"teks\":\"Memilih Wakil Presiden dari dua calon yang diusulkan Presiden jika terjadi kekosongan jabatan\"},{\"huruf\":\"E\",\"teks\":\"Memilih Presiden dan Wakil Presiden dalam pemilihan umum lima tahunan\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 3 UUD NRI Tahun 1945 mengatur tiga wewenang MPR: **mengubah dan menetapkan UUD** (ayat 1), **melantik Presiden dan/atau Wakil Presiden** (ayat 2), dan **memberhentikan Presiden dan/atau Wakil Presiden** dalam masa jabatannya menurut UUD (ayat 3). Sejak amandemen ketiga, Presiden dan Wakil Presiden **dipilih langsung oleh rakyat** dalam satu pasangan (Pasal 6A ayat 1). Karena itu, memilih Presiden dan Wakil Presiden dalam pemilu lima tahunan bukan lagi wewenang MPR.\",\"opsi\":{\"A\":\"Wewenang MPR menurut Pasal 3 ayat (1). Perubahan UUD diatur lebih lanjut dalam Pasal 37.\",\"B\":\"Wewenang MPR menurut Pasal 3 ayat (2).\",\"C\":\"Wewenang MPR menurut Pasal 3 ayat (3). Prosesnya melibatkan DPR dan Mahkamah Konstitusi lebih dulu (Pasal 7B).\",\"D\":\"Pengecoh terkuat karena terdengar seperti pemilihan. Wewenang ini memang ada pada MPR menurut Pasal 8 ayat (2), yaitu saat jabatan Wakil Presiden kosong di tengah masa jabatan.\"},\"konsep\":\"**Sebelum amandemen**, MPR adalah lembaga tertinggi yang memilih Presiden. **Setelah amandemen**, MPR sejajar dengan lembaga negara lain, dan Presiden dipilih langsung oleh rakyat. MPR hanya memilih Presiden atau Wakil Presiden dalam keadaan kekosongan jabatan (Pasal 8).\"},\"tips\":\"Untuk soal wewenang lembaga, ingat perubahan besar setelah amandemen. Opsi yang menggambarkan keadaan **sebelum amandemen** sering dipakai sebagai jawaban soal *bukan wewenang*.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 3 ayat (1), (2), dan (3)\",\"UUD NRI Tahun 1945 Pasal 6A ayat (1)\",\"UUD NRI Tahun 1945 Pasal 8 ayat (2)\"]},{\"id\":\"p03-007\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Badan Pemeriksa Keuangan (BPK) selesai memeriksa pengelolaan keuangan sebuah pemerintah provinsi. Menurut UUD NRI Tahun 1945, hasil pemeriksaan tersebut diserahkan kepada ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Presiden, karena Presiden memegang kekuasaan pengelolaan keuangan negara\"},{\"huruf\":\"B\",\"teks\":\"Komisi Pemberantasan Korupsi, untuk langsung ditindaklanjuti dengan penyidikan\"},{\"huruf\":\"C\",\"teks\":\"DPRD provinsi tersebut, sesuai dengan kewenangannya\"},{\"huruf\":\"D\",\"teks\":\"Mahkamah Agung, karena hasil pemeriksaan bersifat putusan hukum\"},{\"huruf\":\"E\",\"teks\":\"Menteri Dalam Negeri sebagai pembina pemerintahan daerah, yang kemudian meneruskannya kepada gubernur\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 23E ayat (1) menyatakan bahwa BPK dibentuk untuk memeriksa pengelolaan dan tanggung jawab tentang keuangan negara dan bersifat **bebas dan mandiri**. Ayat (2) menyatakan bahwa hasil pemeriksaan keuangan negara **diserahkan kepada DPR, DPD, dan DPRD sesuai dengan kewenangannya**. Karena yang diperiksa adalah keuangan pemerintah provinsi, lembaga perwakilan yang berwenang menerima hasilnya adalah **DPRD provinsi**. Lembaga perwakilan inilah yang menjalankan fungsi pengawasan terhadap pemerintah daerah.\",\"opsi\":{\"A\":\"Presiden memang memegang kekuasaan pengelolaan keuangan negara, tetapi justru karena itu Presiden adalah pihak yang diperiksa. Hasil pemeriksaan diserahkan ke lembaga perwakilan.\",\"B\":\"UUD tidak mengatur penyerahan hasil pemeriksaan ke KPK. Ayat (3) menyebut hasil pemeriksaan **ditindaklanjuti oleh lembaga perwakilan dan/atau badan sesuai dengan undang-undang**, tetapi penerima utamanya tetap lembaga perwakilan.\",\"D\":\"Hasil pemeriksaan BPK bukan putusan pengadilan, sehingga tidak diserahkan ke Mahkamah Agung.\",\"E\":\"Pengecoh terkuat karena Menteri Dalam Negeri memang membina pemerintahan daerah. Namun, Pasal 23E ayat (2) menyebut lembaga perwakilan, bukan kementerian.\"},\"konsep\":\"**Pasal 23E–23G:** BPK bebas dan mandiri (23E), anggotanya dipilih DPR dengan memperhatikan pertimbangan DPD dan diresmikan Presiden (23F), berkedudukan di ibu kota negara dan memiliki perwakilan di setiap provinsi (23G).\"},\"tips\":\"Ingat logika pengawasan: lembaga yang **diperiksa** (pemerintah) tidak menjadi penerima hasil pemeriksaan. Hasilnya diserahkan kepada **wakil rakyat** yang mengawasi pemerintah tersebut.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 23E ayat (1), (2), dan (3)\",\"UUD NRI Tahun 1945 Pasal 23F ayat (1) dan Pasal 23G ayat (1)\"]},{\"id\":\"p03-008\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Panitia pemilihan di sebuah desa menyediakan tempat pemungutan suara khusus di rumah sakit dan lembaga pemasyarakatan, sehingga pasien dan warga binaan yang memenuhi syarat tetap dapat menggunakan hak pilihnya. Kebijakan tersebut paling mencerminkan asas pemilu ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Rahasia, karena pemilih memberikan suara di bilik tertutup\"},{\"huruf\":\"B\",\"teks\":\"Langsung, karena pemilih tidak boleh diwakilkan kepada orang lain\"},{\"huruf\":\"C\",\"teks\":\"Bebas, karena pemilih tidak mendapat tekanan dari pihak mana pun\"},{\"huruf\":\"D\",\"teks\":\"Umum, karena semua warga negara yang memenuhi syarat dijamin dapat memilih\"},{\"huruf\":\"E\",\"teks\":\"Jujur, karena penyelenggara wajib melaporkan jumlah pemilih di rumah sakit dan lembaga pemasyarakatan dengan benar\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 22E ayat (1) UUD NRI Tahun 1945 menyatakan bahwa pemilu dilaksanakan secara **langsung, umum, bebas, rahasia, jujur, dan adil** setiap lima tahun sekali. Asas **umum** berarti pemilu menjamin kesempatan yang berlaku menyeluruh bagi semua warga negara yang memenuhi syarat, tanpa diskriminasi. Dalam soal, panitia menyediakan TPS khusus agar pasien dan warga binaan tetap dapat memilih. Fokus kebijakan ini adalah **menjangkau semua pemilih yang berhak**, sehingga paling mencerminkan asas umum.\",\"opsi\":{\"A\":\"Asas rahasia menjamin pilihan seseorang tidak diketahui orang lain. Soal tidak membahas kerahasiaan pilihan.\",\"B\":\"Asas langsung berarti pemilih memberikan suaranya sendiri tanpa perantara. Kebijakan dalam soal tidak menekankan hal itu.\",\"C\":\"Asas bebas berarti pemilih memilih tanpa paksaan. Soal tidak membahas tekanan terhadap pemilih.\",\"E\":\"Pengecoh terkuat karena terdengar sebagai kewajiban penyelenggara. Namun, inti kebijakan adalah membuka akses bagi pemilih, bukan kejujuran pelaporan.\"},\"konsep\":\"**Akronim LUBER JURDIL:** *langsung* (tanpa perantara), *umum* (semua yang memenuhi syarat), *bebas* (tanpa paksaan), *rahasia* (pilihan tidak diketahui orang lain), *jujur* (semua pihak bertindak jujur), *adil* (perlakuan sama bagi peserta dan pemilih).\"},\"tips\":\"Cocokkan **masalah yang diatasi** dengan asasnya: akses pemilih → umum; tekanan → bebas; kerahasiaan → rahasia; perwakilan suara → langsung; kecurangan → jujur; perlakuan berbeda bagi peserta → adil.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 22E ayat (1)\"]},{\"id\":\"p03-009\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Pernyataan yang sesuai dengan bunyi Pasal 23D UUD NRI Tahun 1945 tentang bank sentral adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Bank Indonesia adalah bank sentral yang berada di bawah koordinasi Menteri Keuangan\"},{\"huruf\":\"B\",\"teks\":\"Negara memiliki suatu bank sentral yang susunan, kedudukan, kewenangan, tanggung jawab, dan independensinya diatur dengan undang-undang\"},{\"huruf\":\"C\",\"teks\":\"Bank sentral dipimpin oleh gubernur yang dipilih dan diangkat langsung oleh Presiden tanpa melibatkan lembaga lain\"},{\"huruf\":\"D\",\"teks\":\"Bank sentral bertanggung jawab kepada MPR atas kebijakan moneter yang ditetapkannya\"},{\"huruf\":\"E\",\"teks\":\"Bank sentral berwenang menetapkan Anggaran Pendapatan dan Belanja Negara setiap tahun\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 23D UUD NRI Tahun 1945 berbunyi: *Negara memiliki suatu bank sentral yang susunan, kedudukan, kewenangan, tanggung jawab, dan independensinya diatur dengan undang-undang.* Ada dua hal penting. Pertama, UUD **tidak menyebut nama** bank sentral. Nama Bank Indonesia ditetapkan dalam undang-undang. Kedua, UUD menyebut **independensi** bank sentral sebagai hal yang diatur undang-undang. Rincian seperti cara pengangkatan pimpinan dan tugasnya ada di tingkat undang-undang, bukan di UUD.\",\"opsi\":{\"A\":\"Pasal 23D tidak menyebut nama Bank Indonesia dan tidak menempatkannya di bawah Menteri Keuangan. Gagasan independensi justru bertentangan dengan posisi di bawah kementerian.\",\"C\":\"UUD tidak mengatur cara memilih pimpinan bank sentral. Hal itu diatur dalam undang-undang, yang melibatkan DPR dalam prosesnya.\",\"D\":\"UUD tidak menyebut pertanggungjawaban bank sentral kepada MPR. Pasal 23D menyerahkan pengaturan tanggung jawab kepada undang-undang.\",\"E\":\"APBN ditetapkan setiap tahun dengan undang-undang yang dibahas Presiden dan DPR (Pasal 23), bukan oleh bank sentral.\"},\"konsep\":\"**Pasal-pasal keuangan negara:** APBN (Pasal 23), pajak dan pungutan bersifat memaksa diatur dengan UU (23A), macam dan harga mata uang ditetapkan dengan UU (23B), hal keuangan negara lainnya diatur dengan UU (23C), bank sentral (23D), BPK (23E–23G).\"},\"tips\":\"Soal *bunyi pasal* sering menguji detail kecil, misalnya nama lembaga yang tidak disebut dalam UUD. Pilih opsi yang paling dekat dengan teks pasal dan waspadai opsi yang menambahkan rincian teknis.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 23D\",\"UUD NRI Tahun 1945 Pasal 23 ayat (1) dan (2)\"]},{\"id\":\"p03-010\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Pasal 28I ayat (1) UUD NRI Tahun 1945 menyebut sejumlah hak asasi yang tidak dapat dikurangi dalam keadaan apa pun. Hak berikut yang termasuk di dalamnya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Hak untuk tidak dituntut atas dasar hukum yang berlaku surut\"},{\"huruf\":\"B\",\"teks\":\"Hak untuk berserikat, berkumpul, dan mengeluarkan pendapat di muka umum\"},{\"huruf\":\"C\",\"teks\":\"Hak untuk memperoleh pekerjaan serta imbalan dan perlakuan yang adil dan layak dalam hubungan kerja\"},{\"huruf\":\"D\",\"teks\":\"Hak untuk bertempat tinggal dan mendapatkan lingkungan hidup yang baik dan sehat\"},{\"huruf\":\"E\",\"teks\":\"Hak untuk berkomunikasi dan memperoleh informasi melalui segala jenis saluran yang tersedia\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 28I ayat (1) menyebut tujuh hak yang **tidak dapat dikurangi dalam keadaan apa pun** (*non-derogable rights*): hak untuk hidup, hak untuk tidak disiksa, hak kemerdekaan pikiran dan hati nurani, hak beragama, hak untuk tidak diperbudak, hak untuk diakui sebagai pribadi di hadapan hukum, dan **hak untuk tidak dituntut atas dasar hukum yang berlaku surut**. Opsi A tercantum dalam daftar itu. Hak lain di opsi tetap dijamin UUD, tetapi dapat dibatasi dengan undang-undang menurut Pasal 28J ayat (2).\",\"opsi\":{\"B\":\"Hak berserikat dan berkumpul dijamin Pasal 28E ayat (3), tetapi pelaksanaannya dapat dibatasi undang-undang, misalnya untuk menjaga ketertiban umum.\",\"C\":\"Hak atas pekerjaan dan imbalan yang layak dijamin Pasal 28D ayat (2), tetapi tidak termasuk dalam daftar Pasal 28I ayat (1).\",\"D\":\"Hak bertempat tinggal dan atas lingkungan hidup yang baik dijamin Pasal 28H ayat (1), tetapi tidak termasuk hak yang tidak dapat dikurangi.\",\"E\":\"Hak berkomunikasi dan memperoleh informasi dijamin Pasal 28F. Opsi ini sengaja dibuat panjang dan meyakinkan, tetapi tidak termasuk daftar Pasal 28I ayat (1).\"},\"konsep\":\"**Hubungan Pasal 28I ayat (1) dan Pasal 28J ayat (2):** sebagian besar HAM dapat dibatasi dengan undang-undang untuk menghormati hak orang lain dan memenuhi tuntutan yang adil. Tujuh hak dalam Pasal 28I ayat (1) dikecualikan dari pembatasan dalam keadaan apa pun.\"},\"tips\":\"Hafalkan tujuh hak dengan singkatan **HiSiPiBeBuPriSu**: hidup, (tidak) disiksa, pikiran dan hati nurani, beragama, (tidak) diperbudak, pribadi di hadapan hukum, (tidak dituntut hukum) surut.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 28I ayat (1)\",\"UUD NRI Tahun 1945 Pasal 28J ayat (2)\",\"UUD NRI Tahun 1945 Pasal 28D ayat (2), Pasal 28E ayat (3), Pasal 28F, dan Pasal 28H ayat (1)\"]},{\"id\":\"p03-011\",\"kategori\":\"TWK\",\"subtopik\":\"UUD 1945\",\"pertanyaan\":\"Menurut UUD NRI Tahun 1945, kekuasaan Presiden berikut yang dilaksanakan **dengan persetujuan** DPR adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memberi grasi dan rehabilitasi kepada terpidana\"},{\"huruf\":\"B\",\"teks\":\"Mengangkat duta dan menerima penempatan duta negara lain\"},{\"huruf\":\"C\",\"teks\":\"Memberi amnesti dan abolisi\"},{\"huruf\":\"D\",\"teks\":\"Menyatakan perang, membuat perdamaian, dan membuat perjanjian dengan negara lain\"},{\"huruf\":\"E\",\"teks\":\"Menyatakan keadaan bahaya yang syarat-syarat dan akibatnya ditetapkan dengan undang-undang\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 11 ayat (1) UUD NRI Tahun 1945 menyatakan bahwa Presiden **dengan persetujuan DPR** menyatakan perang, membuat perdamaian, dan perjanjian dengan negara lain. Soal ini menguji perbedaan kata **persetujuan** dan **pertimbangan**. Persetujuan berarti tindakan Presiden tidak dapat dilakukan tanpa DPR setuju. Pertimbangan berarti Presiden wajib mendengar masukan lembaga lain, tetapi keputusan tetap di tangan Presiden. Dari kelima opsi, hanya kekuasaan dalam Pasal 11 yang memerlukan persetujuan DPR.\",\"opsi\":{\"A\":\"Grasi dan rehabilitasi diberikan dengan memperhatikan **pertimbangan Mahkamah Agung** (Pasal 14 ayat 1), bukan persetujuan DPR.\",\"B\":\"Pengangkatan duta dilakukan dengan memperhatikan **pertimbangan DPR**, dan penerimaan duta negara lain juga dengan memperhatikan pertimbangan DPR (Pasal 13). Bentuknya pertimbangan, bukan persetujuan.\",\"C\":\"Amnesti dan abolisi diberikan dengan memperhatikan **pertimbangan DPR** (Pasal 14 ayat 2). Pengecoh ini menjebak peserta yang menyamakan pertimbangan dengan persetujuan.\",\"E\":\"Pasal 12 menyatakan Presiden menyatakan keadaan bahaya, dengan syarat-syarat dan akibatnya ditetapkan undang-undang. Pasal ini tidak mensyaratkan persetujuan DPR.\"},\"konsep\":\"**Peta Pasal 10–15:** 10 (panglima tertinggi AD, AL, AU), 11 (perang, damai, perjanjian: *persetujuan* DPR), 12 (keadaan bahaya), 13 (duta dan konsul: *pertimbangan* DPR), 14 (grasi dan rehabilitasi: *pertimbangan* MA; amnesti dan abolisi: *pertimbangan* DPR), 15 (gelar dan tanda jasa).\"},\"tips\":\"Garis bawahi kata **persetujuan** atau **pertimbangan** di soal. Pengecoh biasanya diambil dari pasal tetangga (Pasal 13 dan 14) yang melibatkan DPR dalam bentuk pertimbangan.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 11 ayat (1)\",\"UUD NRI Tahun 1945 Pasal 12, Pasal 13 ayat (2) dan (3), serta Pasal 14 ayat (1) dan (2)\"]},{\"id\":\"p03-012\",\"kategori\":\"TWK\",\"subtopik\":\"NKRI\",\"pertanyaan\":\"Keistimewaan Daerah Istimewa Yogyakarta dan otonomi khusus di Aceh serta Papua memiliki dasar konstitusional dalam UUD NRI Tahun 1945, yaitu ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Pasal 18 ayat (2), karena setiap daerah mengatur dan mengurus sendiri urusan pemerintahannya\"},{\"huruf\":\"B\",\"teks\":\"Pasal 18B ayat (2), karena negara mengakui kesatuan masyarakat hukum adat beserta hak tradisionalnya\"},{\"huruf\":\"C\",\"teks\":\"Pasal 25A, karena Indonesia adalah negara kepulauan berciri Nusantara\"},{\"huruf\":\"D\",\"teks\":\"Pasal 18A ayat (1), karena hubungan wewenang pusat dan daerah memperhatikan kekhususan dan keragaman daerah\"},{\"huruf\":\"E\",\"teks\":\"Pasal 18B ayat (1), karena negara mengakui satuan pemerintahan daerah yang bersifat khusus atau istimewa\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 18B ayat (1) berbunyi: *Negara mengakui dan menghormati satuan-satuan pemerintahan daerah yang bersifat khusus atau bersifat istimewa yang diatur dengan undang-undang.* Pasal inilah dasar konstitusional bagi daerah yang memiliki keistimewaan atau otonomi khusus, seperti DIY, Aceh, dan Papua. Setiap kekhususan itu kemudian diatur dalam undang-undang tersendiri. Jadi, kekhususan tersebut tidak bertentangan dengan bentuk negara kesatuan, karena justru diakui oleh UUD.\",\"opsi\":{\"A\":\"Pasal 18 ayat (2) mengatur asas otonomi dan tugas pembantuan yang berlaku bagi **semua** daerah, bukan kekhususan daerah tertentu.\",\"B\":\"Pasal 18B ayat (2) mengatur pengakuan terhadap **masyarakat hukum adat**, bukan satuan pemerintahan daerah yang khusus atau istimewa. Pengecoh ini memakai nomor pasal yang sama dengan ayat berbeda.\",\"C\":\"Pasal 25A mengatur wilayah negara kepulauan, bukan bentuk pemerintahan daerah.\",\"D\":\"Pengecoh terkuat. Pasal 18A ayat (1) memang menyebut kekhususan dan keragaman daerah, tetapi isinya tentang **hubungan wewenang** pusat dan daerah, bukan pengakuan atas satuan pemerintahan yang khusus atau istimewa.\"},\"konsep\":\"**Peta Pasal 18:** 18 (pembagian daerah, asas otonomi, DPRD, kepala daerah), 18A (hubungan wewenang dan keuangan pusat–daerah), 18B ayat (1) (daerah khusus atau istimewa), 18B ayat (2) (masyarakat hukum adat).\"},\"tips\":\"Bedakan dua ayat Pasal 18B: ayat (1) tentang **pemerintahan daerah** yang khusus atau istimewa, ayat (2) tentang **masyarakat hukum adat**. Jika soal menyebut DIY, Aceh, atau Papua, pilih ayat (1).\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 18B ayat (1) dan (2)\",\"UUD NRI Tahun 1945 Pasal 18 ayat (2) dan Pasal 18A ayat (1)\"]},{\"id\":\"p03-013\",\"kategori\":\"TWK\",\"subtopik\":\"NKRI\",\"pertanyaan\":\"Pemerintah pusat menugaskan pemerintah kabupaten untuk melaksanakan sebagian urusan pemerintahan yang menjadi kewenangan pusat. Biayanya disediakan oleh pusat, dan kabupaten wajib melaporkan pelaksanaannya kepada pusat. Asas penyelenggaraan pemerintahan dalam kasus ini adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Desentralisasi, karena urusan pemerintahan diserahkan kepada daerah otonom\"},{\"huruf\":\"B\",\"teks\":\"Dekonsentrasi, karena kewenangan pusat dilimpahkan kepada daerah dan pelaksanaannya dilaporkan kembali kepada pusat\"},{\"huruf\":\"C\",\"teks\":\"Tugas pembantuan, karena daerah otonom ditugaskan melaksanakan sebagian urusan kewenangan pusat\"},{\"huruf\":\"D\",\"teks\":\"Sentralisasi, karena urusan tetap dikendalikan oleh pemerintah pusat\"},{\"huruf\":\"E\",\"teks\":\"Otonomi khusus, karena kabupaten mendapat kewenangan tambahan dari pemerintah pusat\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"UU No. 23 Tahun 2014 membedakan tiga asas.\\n\\n- **Desentralisasi**: penyerahan urusan pemerintahan oleh pusat kepada daerah otonom berdasarkan asas otonomi. Urusan itu menjadi milik daerah.\\n- **Dekonsentrasi**: pelimpahan sebagian urusan kewenangan pusat kepada **gubernur sebagai wakil pemerintah pusat**, kepada instansi vertikal, dan/atau kepada gubernur dan bupati/wali kota sebagai penanggung jawab urusan pemerintahan umum.\\n- **Tugas pembantuan**: **penugasan** dari pusat kepada daerah otonom untuk melaksanakan sebagian urusan kewenangan pusat.\\n\\nDalam soal, urusannya tetap milik pusat, pelaksananya pemerintah kabupaten sebagai daerah otonom, dan biayanya dari pusat. Ini adalah tugas pembantuan.\",\"opsi\":{\"A\":\"Pada desentralisasi, urusan **diserahkan** dan menjadi kewenangan daerah. Dalam soal, urusan tetap kewenangan pusat dan daerah hanya menjalankan tugas.\",\"B\":\"Pengecoh terkuat. Dekonsentrasi adalah **pelimpahan** kepada gubernur sebagai wakil pemerintah pusat atau kepada instansi vertikal, bukan **penugasan** kepada pemerintah kabupaten sebagai daerah otonom.\",\"D\":\"Sentralisasi berarti semua urusan dikerjakan pusat sendiri. Dalam soal, pelaksananya pemerintah daerah.\",\"E\":\"Otonomi khusus adalah kekhususan bagi daerah tertentu yang diatur undang-undang tersendiri, bukan penugasan urusan pusat kepada kabupaten biasa.\"},\"konsep\":\"**Kata kunci asas:** *diserahkan* → desentralisasi; *dilimpahkan* kepada wakil pemerintah pusat atau instansi vertikal → dekonsentrasi; *ditugaskan* kepada daerah otonom, dengan biaya dari pemberi tugas → tugas pembantuan.\"},\"tips\":\"Tanyakan dua hal: **urusan itu milik siapa** setelah dijalankan, dan **siapa penerimanya**. Jika urusan tetap milik pusat dan penerimanya pemerintah daerah otonom, jawabannya tugas pembantuan.\",\"rujukan\":[\"UU No. 23 Tahun 2014 tentang Pemerintahan Daerah Pasal 1 (definisi desentralisasi, dekonsentrasi, dan tugas pembantuan)\"]},{\"id\":\"p03-014\",\"kategori\":\"TWK\",\"subtopik\":\"NKRI\",\"pertanyaan\":\"Pasal 18 ayat (1) UUD NRI Tahun 1945 menyatakan bahwa Negara Kesatuan Republik Indonesia **dibagi atas** daerah-daerah provinsi, dan daerah provinsi itu dibagi atas kabupaten dan kota. Pemakaian frasa *dibagi atas*, bukan *terdiri atas*, menegaskan bahwa ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Daerah merupakan bagian dari negara kesatuan, bukan negara bagian yang bergabung membentuk negara\"},{\"huruf\":\"B\",\"teks\":\"Provinsi, kabupaten, dan kota memiliki kedaulatan sendiri yang setara dengan pemerintah pusat dalam negara\"},{\"huruf\":\"C\",\"teks\":\"Pembagian wilayah hanya bersifat administratif sehingga daerah tidak memiliki pemerintahan sendiri\"},{\"huruf\":\"D\",\"teks\":\"Pemerintah pusat dapat menghapus provinsi kapan saja tanpa dasar undang-undang\"},{\"huruf\":\"E\",\"teks\":\"Setiap daerah berhak memisahkan diri apabila mayoritas penduduknya menghendaki\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Frasa **dibagi atas** menunjukkan bahwa yang ada lebih dulu adalah **negara kesatuan**, lalu wilayahnya dibagi menjadi daerah. Daerah bukan entitas berdaulat yang kemudian bergabung, seperti dalam negara federal. Frasa *terdiri atas* dapat ditafsirkan bahwa negara tersusun dari bagian-bagian yang sudah ada sebelumnya. Dengan demikian, kedaulatan tetap berada pada negara, sedangkan daerah memiliki **otonomi** untuk mengatur dan mengurus urusan pemerintahannya dalam kerangka NKRI.\",\"opsi\":{\"B\":\"Daerah tidak memiliki kedaulatan. Daerah memiliki otonomi, yaitu hak dan kewenangan mengurus urusan pemerintahan, yang berbeda dengan kedaulatan negara.\",\"C\":\"Pasal 18 ayat (1) justru menyebut bahwa tiap provinsi, kabupaten, dan kota **mempunyai pemerintahan daerah**. Pembagian ini bukan sekadar administratif.\",\"D\":\"Pasal 18 ayat (1) menyebut bahwa pemerintahan daerah **diatur dengan undang-undang**, sehingga perubahan daerah tidak dapat dilakukan tanpa dasar undang-undang.\",\"E\":\"Tidak ada hak memisahkan diri dalam UUD. Bentuk negara kesatuan bahkan tidak dapat diubah menurut Pasal 37 ayat (5).\"},\"konsep\":\"**Negara kesatuan dengan otonomi daerah:** kedaulatan satu dan berada pada negara; daerah menerima kewenangan melalui undang-undang. Bandingkan dengan **negara federal**, tempat negara bagian memiliki kedaulatan asal dan bergabung membentuk negara.\"},\"tips\":\"Soal tentang bentuk negara sering memakai pengecoh *kedaulatan daerah* atau *hak memisahkan diri*. Dalam NKRI, yang dimiliki daerah adalah **otonomi**, bukan kedaulatan.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 18 ayat (1)\",\"UUD NRI Tahun 1945 Pasal 37 ayat (5)\"]},{\"id\":\"p03-015\",\"kategori\":\"TWK\",\"subtopik\":\"Bhinneka Tunggal Ika\",\"pertanyaan\":\"Semboyan Bhinneka Tunggal Ika disebut secara tegas dalam UUD NRI Tahun 1945 pada pasal yang mengatur ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Bahasa negara, yaitu Bahasa Indonesia (Pasal 36)\"},{\"huruf\":\"B\",\"teks\":\"Lambang negara, yaitu Garuda Pancasila (Pasal 36A)\"},{\"huruf\":\"C\",\"teks\":\"Bendera negara, yaitu Sang Merah Putih (Pasal 35)\"},{\"huruf\":\"D\",\"teks\":\"Lagu kebangsaan, yaitu Indonesia Raya (Pasal 36B)\"},{\"huruf\":\"E\",\"teks\":\"Pengaturan lebih lanjut tentang bendera, bahasa, lambang negara, dan lagu kebangsaan dengan undang-undang (Pasal 36C)\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 36A UUD NRI Tahun 1945 berbunyi: *Lambang Negara ialah Garuda Pancasila dengan semboyan Bhinneka Tunggal Ika.* Jadi, semboyan Bhinneka Tunggal Ika disebut secara tegas dalam pasal tentang **lambang negara**. Pasal ini ditambahkan melalui amandemen kedua. Semboyan tersebut tertulis pada pita yang dicengkeram Garuda Pancasila. Maknanya, bangsa Indonesia beragam dalam suku, agama, bahasa, dan budaya, tetapi tetap satu sebagai bangsa.\",\"opsi\":{\"A\":\"Pasal 36 hanya menyatakan bahwa Bahasa Negara ialah Bahasa Indonesia. Pasal ini tidak menyebut semboyan.\",\"C\":\"Pasal 35 hanya menyatakan bahwa Bendera Negara Indonesia ialah Sang Merah Putih.\",\"D\":\"Pasal 36B hanya menyatakan bahwa Lagu Kebangsaan ialah Indonesia Raya.\",\"E\":\"Pengecoh terpanjang. Pasal 36C menyatakan bahwa ketentuan lebih lanjut tentang keempat simbol negara diatur dengan undang-undang, tetapi tidak menyebut semboyan. Undang-undang yang dimaksud adalah UU No. 24 Tahun 2009.\"},\"konsep\":\"**Simbol negara dalam UUD:** Pasal 35 (bendera), 36 (bahasa), 36A (lambang dan semboyan), 36B (lagu kebangsaan), 36C (pengaturan lebih lanjut dengan undang-undang). Keempatnya dirinci dalam UU No. 24 Tahun 2009.\"},\"tips\":\"Hafalkan urutan **bendera–bahasa–lambang–lagu** untuk Pasal 35, 36, 36A, dan 36B. Pasal 36C selalu berisi perintah pengaturan dengan undang-undang.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 35, Pasal 36, Pasal 36A, Pasal 36B, dan Pasal 36C\",\"UU No. 24 Tahun 2009 tentang Bendera, Bahasa, dan Lambang Negara, serta Lagu Kebangsaan\"]},{\"id\":\"p03-016\",\"kategori\":\"TWK\",\"subtopik\":\"Bhinneka Tunggal Ika\",\"pertanyaan\":\"Sebuah sekolah menengah memiliki siswa dari banyak suku. Sekolah mewajibkan bahasa Indonesia sebagai bahasa pengantar di kelas, sekaligus membuka kegiatan ekstrakurikuler bahasa dan seni daerah dari berbagai suku siswanya. Kebijakan tersebut paling mencerminkan makna Bhinneka Tunggal Ika, yaitu ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Perbedaan budaya perlu dihapus secara bertahap agar siswa menjadi seragam\"},{\"huruf\":\"B\",\"teks\":\"Budaya suku mayoritas di daerah itu dijadikan acuan bagi semua siswa\"},{\"huruf\":\"C\",\"teks\":\"Setiap suku sebaiknya mengembangkan budayanya sendiri tanpa perlu bahasa yang sama\"},{\"huruf\":\"D\",\"teks\":\"Bahasa daerah lebih penting daripada bahasa nasional dalam membentuk identitas siswa\"},{\"huruf\":\"E\",\"teks\":\"Keragaman tetap dihargai dan dipelihara dalam satu ikatan kebangsaan\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Bhinneka Tunggal Ika berarti **berbeda-beda, tetapi tetap satu**. Persatuan tidak dicapai dengan menghapus perbedaan, melainkan dengan memberi ruang bagi perbedaan dalam satu ikatan kebangsaan. Kebijakan sekolah dalam soal memiliki dua sisi yang seimbang. Bahasa Indonesia dipakai sebagai **pemersatu** di kelas, sementara bahasa dan seni daerah tetap **dipelihara** melalui ekstrakurikuler. Keduanya berjalan bersama, sehingga siswa belajar bahwa identitas daerah dan identitas nasional tidak saling meniadakan.\",\"opsi\":{\"A\":\"Menghapus perbedaan adalah **penyeragaman**, yang bertentangan dengan kata *bhinneka*. Sekolah justru membuka kegiatan budaya daerah.\",\"B\":\"Menjadikan budaya mayoritas sebagai acuan adalah sikap dominasi. Kebijakan sekolah memberi ruang bagi budaya dari berbagai suku, bukan hanya mayoritas.\",\"C\":\"Tanpa bahasa bersama, setiap kelompok berjalan sendiri-sendiri dan unsur *tunggal ika* hilang. Sekolah tetap mewajibkan bahasa Indonesia di kelas.\",\"D\":\"Kebijakan sekolah tidak mempertentangkan bahasa daerah dan bahasa nasional. Keduanya diberi tempat sesuai fungsinya.\"},\"konsep\":\"**Dua kesalahan memaknai keragaman:** *penyeragaman* (perbedaan dihapus, biasanya mengikuti kelompok dominan) dan *fragmentasi* (setiap kelompok berjalan sendiri tanpa ikatan bersama). Bhinneka Tunggal Ika berada di antara keduanya.\"},\"tips\":\"Jawaban soal Bhinneka Tunggal Ika hampir selalu memuat **dua unsur sekaligus**: menghargai perbedaan dan menjaga persatuan. Opsi yang hanya memuat satu unsur biasanya salah.\",\"rujukan\":[]},{\"id\":\"p03-017\",\"kategori\":\"TWK\",\"subtopik\":\"Nasionalisme\",\"pertanyaan\":\"Peringatan Hari Ibu setiap 22 Desember berakar dari peristiwa ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Kongres Perempuan Indonesia pertama di Yogyakarta pada Desember 1928\"},{\"huruf\":\"B\",\"teks\":\"Kelahiran R.A. Kartini, yang tulisannya memperjuangkan pendidikan bagi kaum perempuan\"},{\"huruf\":\"C\",\"teks\":\"Pembentukan organisasi Putri Mardika di Batavia\"},{\"huruf\":\"D\",\"teks\":\"Pembacaan ikrar Sumpah Pemuda oleh para pemuda dari berbagai daerah\"},{\"huruf\":\"E\",\"teks\":\"Pendirian Sekolah Kautamaan Istri oleh Dewi Sartika di Bandung\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Hari Ibu berakar dari **Kongres Perempuan Indonesia pertama** yang dibuka pada **22 Desember 1928** di Yogyakarta, hanya sekitar dua bulan setelah Sumpah Pemuda. Kongres ini mempertemukan berbagai organisasi perempuan dari banyak daerah. Mereka membahas persatuan perempuan, pendidikan, perkawinan anak, dan kedudukan perempuan dalam keluarga dan masyarakat. Tanggal dibukanya kongres kemudian ditetapkan sebagai Hari Ibu untuk mengenang peran perempuan dalam pergerakan kebangsaan.\",\"opsi\":{\"B\":\"Kartini lahir pada 21 April, yang diperingati sebagai **Hari Kartini**, bukan Hari Ibu. Opsi ini menjebak peserta yang menyamakan dua peringatan tokoh perempuan.\",\"C\":\"Putri Mardika adalah salah satu organisasi perempuan awal, tetapi pendiriannya bukan dasar penetapan Hari Ibu.\",\"D\":\"Sumpah Pemuda terjadi pada 28 Oktober 1928 dan diperingati sebagai Hari Sumpah Pemuda. Kongres Perempuan memang terinspirasi semangat persatuan itu, tetapi peristiwanya berbeda.\",\"E\":\"Dewi Sartika adalah pelopor pendidikan perempuan di Jawa Barat. Pendirian sekolahnya tidak terkait dengan tanggal 22 Desember.\"},\"konsep\":\"**Pergerakan perempuan** adalah bagian dari pergerakan nasional. Kongres Perempuan 1928 menunjukkan bahwa persatuan yang diikrarkan dalam Sumpah Pemuda juga diwujudkan oleh organisasi-organisasi perempuan.\"},\"tips\":\"Pasangkan tanggal peringatan dengan peristiwanya: 21 April (Hari Kartini, kelahiran tokoh), 28 Oktober (Sumpah Pemuda), 22 Desember (Hari Ibu, pembukaan Kongres Perempuan 1928).\",\"rujukan\":[\"Keputusan Presiden No. 316 Tahun 1959 tentang Hari-Hari Nasional yang Bukan Hari Libur (Hari Ibu 22 Desember)\"]},{\"id\":\"p03-018\",\"kategori\":\"TWK\",\"subtopik\":\"Nasionalisme\",\"pertanyaan\":\"Pernyataan yang tepat tentang Sarekat Islam pada masa awal pergerakan nasional adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Organisasi kaum priyayi Jawa yang didirikan mahasiswa STOVIA dan bergerak di bidang pendidikan dan kebudayaan\"},{\"huruf\":\"B\",\"teks\":\"Partai politik yang didirikan Tiga Serangkai dan terbuka bagi semua penduduk Hindia\"},{\"huruf\":\"C\",\"teks\":\"Berawal dari perkumpulan pedagang muslim, lalu berkembang menjadi organisasi massa dengan anggota dari berbagai lapisan rakyat\"},{\"huruf\":\"D\",\"teks\":\"Organisasi pelajar Indonesia di negeri Belanda yang menerbitkan majalah *Indonesia Merdeka*\"},{\"huruf\":\"E\",\"teks\":\"Lembaga pendidikan yang didirikan Ki Hajar Dewantara dengan semboyan *Tut Wuri Handayani*\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Sarekat Islam berawal dari **Sarekat Dagang Islam**, perkumpulan pedagang muslim, terutama pedagang batik, yang dirintis oleh **Haji Samanhudi** di Surakarta. Tujuannya semula memperkuat posisi pedagang bumiputra dalam persaingan dagang. Setelah berganti nama menjadi Sarekat Islam dan dipimpin **H.O.S. Tjokroaminoto**, organisasi ini berkembang pesat menjadi **organisasi massa** dengan anggota dari berbagai lapisan rakyat, tidak hanya kaum terpelajar. Keanggotaannya yang luas membuat SI menjadi salah satu kekuatan penting pergerakan nasional.\",\"opsi\":{\"A\":\"Ciri ini milik **Budi Utomo** (1908), yang didirikan oleh mahasiswa STOVIA dan pada awalnya beranggotakan kalangan priyayi Jawa.\",\"B\":\"Ciri ini milik **Indische Partij** (1912), yang didirikan oleh Douwes Dekker, Tjipto Mangoenkoesoemo, dan Soewardi Soerjaningrat.\",\"D\":\"Ciri ini milik **Perhimpunan Indonesia**, organisasi pelajar Indonesia di Belanda.\",\"E\":\"Ciri ini milik **Taman Siswa** (1922). Pengecoh ini menjebak peserta yang menghafal nama tokoh tanpa organisasinya.\"},\"konsep\":\"**Ciri pembeda organisasi awal:** Budi Utomo (priyayi, pendidikan-budaya), Sarekat Islam (pedagang muslim → organisasi massa), Indische Partij (politik, menuntut kemerdekaan), Perhimpunan Indonesia (pelajar di Belanda), Taman Siswa (pendidikan nasional).\"},\"tips\":\"Untuk soal organisasi pergerakan, hafalkan **satu ciri khas** setiap organisasi: pendiri, basis anggota, dan bidang gerak. Pengecoh biasanya berisi ciri organisasi lain yang sezaman.\",\"rujukan\":[]},{\"id\":\"p03-019\",\"kategori\":\"TWK\",\"subtopik\":\"Nasionalisme\",\"pertanyaan\":\"Pernyataan berikut yang **benar** tentang Indische Partij adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Didirikan oleh H.O.S. Tjokroaminoto dan diakui pemerintah kolonial sebagai badan hukum\"},{\"huruf\":\"B\",\"teks\":\"Hanya menerima anggota bumiputra dan menolak keturunan Indo-Eropa\"},{\"huruf\":\"C\",\"teks\":\"Bergerak di bidang pendidikan dan kebudayaan, serta menghindari kegiatan politik agar tidak dibubarkan\"},{\"huruf\":\"D\",\"teks\":\"Didirikan Tiga Serangkai, terbuka bagi semua penduduk Hindia, dan secara tegas mencita-citakan Hindia yang merdeka\"},{\"huruf\":\"E\",\"teks\":\"Didirikan pada 1912 dan berkembang menjadi partai terbesar di Volksraad setelah para pendirinya pulang dari pembuangan\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Indische Partij didirikan pada 1912 oleh **Tiga Serangkai**: Ernest Douwes Dekker, Tjipto Mangoenkoesoemo, dan Soewardi Soerjaningrat (Ki Hajar Dewantara). Organisasi ini dikenal sebagai **organisasi politik pertama** yang secara terang-terangan mencita-citakan **Hindia merdeka**. Keanggotaannya terbuka bagi semua penduduk yang menganggap Hindia sebagai tanah airnya, termasuk keturunan Indo-Eropa. Karena sikap politiknya, permohonan badan hukumnya ditolak dan organisasi ini tidak bertahan lama. Ketiga pendirinya kemudian diasingkan.\",\"opsi\":{\"A\":\"Tjokroaminoto memimpin Sarekat Islam, bukan Indische Partij. Pemerintah kolonial juga **menolak** memberikan status badan hukum kepada Indische Partij.\",\"B\":\"Justru sebaliknya. Indische Partij terbuka bagi siapa pun yang menganggap Hindia sebagai tanah airnya. Douwes Dekker sendiri berdarah Indo.\",\"C\":\"Indische Partij adalah organisasi **politik** yang tegas, sehingga tidak menghindari politik. Ciri pendidikan dan kebudayaan lebih cocok untuk Budi Utomo pada awalnya.\",\"E\":\"Pengecoh terkuat karena tahun 1912 benar. Namun, Indische Partij tidak berkembang menjadi partai terbesar di Volksraad. Organisasi ini dibubarkan tidak lama setelah berdiri, dan para pendirinya diasingkan.\"},\"konsep\":\"**Mengapa Indische Partij penting:** organisasi ini memperkenalkan gagasan nasionalisme kewilayahan, yaitu kebangsaan yang didasarkan pada tanah air bersama, bukan keturunan atau suku. Gagasan ini memengaruhi pergerakan sesudahnya.\"},\"tips\":\"Pada soal *pernyataan yang benar*, periksa **setiap bagian** opsi. Opsi panjang yang separuhnya benar, seperti tahun yang tepat tetapi kelanjutan cerita yang salah, adalah pengecoh yang umum.\",\"rujukan\":[]},{\"id\":\"p03-020\",\"kategori\":\"TWK\",\"subtopik\":\"Nasionalisme\",\"pertanyaan\":\"Perhimpunan Indonesia di negeri Belanda menyampaikan Manifesto Politik pada 1925. Salah satu prinsip perjuangan yang terkandung dalam manifesto tersebut adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Kooperasi, yaitu memperjuangkan kemerdekaan melalui kerja sama dengan pemerintah kolonial di dewan perwakilan\"},{\"huruf\":\"B\",\"teks\":\"Nonkooperasi, yaitu memperjuangkan kemerdekaan tanpa bekerja sama dengan pemerintah kolonial\"},{\"huruf\":\"C\",\"teks\":\"Kedaerahan, yaitu setiap suku memperjuangkan kemerdekaan wilayahnya sendiri-sendiri\"},{\"huruf\":\"D\",\"teks\":\"Federalisme, yaitu membentuk negara serikat yang terdiri atas negara-negara bagian\"},{\"huruf\":\"E\",\"teks\":\"Ketergantungan, yaitu meminta bantuan negara lain untuk mengusir penjajah dari Hindia\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Manifesto Politik Perhimpunan Indonesia 1925 memuat prinsip yang biasa diringkas menjadi **persatuan nasional, solidaritas, nonkooperasi, dan swadaya** (kemandirian). Isinya antara lain menegaskan bahwa rakyat Indonesia berhak diperintah oleh pemerintahan yang dipilih sendiri, bahwa perjuangan itu tidak memerlukan bantuan pihak lain, dan bahwa tanpa persatuan berbagai unsur rakyat tujuan tersebut sulit dicapai. **Nonkooperasi** berarti menolak bekerja sama dengan pemerintah kolonial dalam memperjuangkan kemerdekaan.\",\"opsi\":{\"A\":\"Kooperasi justru berlawanan dengan sikap Perhimpunan Indonesia. Sikap kooperatif lebih dekat dengan organisasi yang bersedia duduk di Volksraad.\",\"C\":\"Manifesto menekankan **persatuan nasional**, bukan perjuangan per suku atau per daerah.\",\"D\":\"Manifesto tidak membahas negara federal. Gagasan negara serikat baru muncul jauh kemudian dalam konteks yang berbeda, yaitu masa Republik Indonesia Serikat.\",\"E\":\"Manifesto menekankan **swadaya**, yaitu perjuangan dengan kekuatan sendiri tanpa bergantung pada bantuan pihak lain.\"},\"konsep\":\"**Perhimpunan Indonesia** adalah organisasi pelajar Indonesia di Belanda (tokohnya antara lain Mohammad Hatta). Manifesto 1925 dianggap sebagai salah satu tonggak penting yang mendorong Sumpah Pemuda 1928.\"},\"tips\":\"Ingat empat prinsip Manifesto Politik 1925 dengan singkatan **PSNS**: persatuan, solidaritas, nonkooperasi, swadaya. Opsi yang menyebut bantuan asing atau kerja sama dengan penjajah pasti salah.\",\"rujukan\":[]},{\"id\":\"p03-021\",\"kategori\":\"TWK\",\"subtopik\":\"Integritas\",\"pertanyaan\":\"Seorang pegawai ditugasi memegang kendaraan dinas untuk operasional kantor. Menjelang libur panjang, keluarganya meminta kendaraan itu dipakai untuk mudik karena kantor sedang tutup. Sikap yang menunjukkan integritas adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memakai kendaraan itu karena tidak ada kegiatan kantor selama libur dan bahan bakarnya dibayar sendiri\"},{\"huruf\":\"B\",\"teks\":\"Memakai kendaraan itu asalkan dikembalikan dalam keadaan bersih sebelum hari kerja dimulai\"},{\"huruf\":\"C\",\"teks\":\"Menolak memakai kendaraan dinas untuk mudik dan mencari kendaraan lain untuk keluarga\"},{\"huruf\":\"D\",\"teks\":\"Meminta izin lisan kepada rekan satu ruangan agar ada yang mengetahui pemakaian kendaraan\"},{\"huruf\":\"E\",\"teks\":\"Memakai kendaraan itu hanya untuk perjalanan berangkat, lalu pulang dengan kendaraan umum\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Integritas berarti **konsisten antara aturan, ucapan, dan tindakan**, termasuk saat tidak ada yang mengawasi. Kendaraan dinas adalah barang milik negara yang disediakan untuk **kepentingan dinas**. Memakainya untuk mudik keluarga berarti memanfaatkan fasilitas jabatan demi kepentingan pribadi, walaupun kantor sedang tutup dan biaya bahan bakar ditanggung sendiri. Pegawai yang berintegritas menolak permintaan itu dan mencari kendaraan lain. Ia memisahkan dengan tegas milik negara dan milik pribadi.\",\"opsi\":{\"A\":\"Pengecoh terkuat. Membayar bahan bakar sendiri tidak mengubah status kendaraan sebagai milik negara. Risiko kerusakan, kecelakaan, dan penyusutan tetap ditanggung negara.\",\"B\":\"Kebersihan kendaraan bukan ukuran kepatuhan. Pemakaiannya tetap di luar kepentingan dinas.\",\"D\":\"Rekan satu ruangan tidak berwenang memberi izin. Diketahui orang lain juga tidak membuat pemakaian pribadi menjadi sah.\",\"E\":\"Memakai fasilitas dinas setengah perjalanan tetap pemakaian pribadi. Mengurangi frekuensi pelanggaran tidak menghapus pelanggarannya.\"},\"konsep\":\"**Prinsip pemisahan kepentingan:** fasilitas jabatan (kendaraan, ruang, perangkat, anggaran) hanya untuk tugas dinas. Alasan *tidak sedang dipakai* atau *biaya ditanggung sendiri* tidak mengubah status milik negara.\"},\"tips\":\"Pada soal integritas, jawaban benar biasanya **menolak secara tegas** dan **mencari jalan keluar yang sah**. Opsi yang berisi syarat seperti *asalkan* atau *hanya sebagian* biasanya pengecoh.\",\"rujukan\":[]},{\"id\":\"p03-022\",\"kategori\":\"TWK\",\"subtopik\":\"Integritas\",\"pertanyaan\":\"Seorang kepala dinas meminta panitia seleksi pegawai kontrak meloloskan keponakannya, padahal nilai keponakannya berada di bawah ambang batas. Akibatnya, peserta lain yang nilainya lebih tinggi tidak lolos. Menurut UU No. 28 Tahun 1999, perbuatan kepala dinas tersebut paling tepat disebut ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Nepotisme, karena menguntungkan keluarganya secara melawan hukum\"},{\"huruf\":\"B\",\"teks\":\"Kolusi, karena terjadi kerja sama antara kepala dinas dan panitia yang merugikan peserta lain\"},{\"huruf\":\"C\",\"teks\":\"Gratifikasi, karena keponakannya menerima pekerjaan dari pejabat\"},{\"huruf\":\"D\",\"teks\":\"Pemerasan, karena panitia terpaksa menuruti permintaan atasannya\"},{\"huruf\":\"E\",\"teks\":\"Penggelapan dalam jabatan, karena formasi pegawai adalah milik negara yang dikuasai kepala dinas\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"UU No. 28 Tahun 1999 mendefinisikan **nepotisme** sebagai setiap perbuatan penyelenggara negara secara melawan hukum yang **menguntungkan kepentingan keluarganya dan/atau kroninya** di atas kepentingan masyarakat, bangsa, dan negara. Dalam soal, kepala dinas memakai jabatannya untuk meloloskan keponakan yang nilainya di bawah ambang batas. Pihak yang diuntungkan adalah **keluarga**, dan peserta lain yang lebih layak dirugikan. Unsur pembeda yang paling menonjol adalah hubungan keluarga, sehingga perbuatan ini paling tepat disebut nepotisme.\",\"opsi\":{\"B\":\"Pengecoh terkuat. Kolusi adalah permufakatan atau kerja sama melawan hukum antarpenyelenggara negara atau dengan pihak lain. Dalam soal, panitia diminta oleh atasan, tetapi ciri yang paling khas adalah **keuntungan bagi keluarga**. Itulah yang membedakan nepotisme.\",\"C\":\"Gratifikasi adalah pemberian yang **diterima** oleh pegawai negeri atau penyelenggara negara. Dalam soal, kepala dinas tidak menerima pemberian.\",\"D\":\"Pemerasan adalah memaksa seseorang **memberikan sesuatu**, misalnya uang. Panitia tidak diminta memberikan harta kepada kepala dinas.\",\"E\":\"Penggelapan menyangkut uang atau barang yang berada dalam penguasaan pejabat karena jabatannya. Formasi pegawai bukan barang yang dapat digelapkan.\"},\"konsep\":\"**Tiga istilah dalam UU 28/1999:** *korupsi* (tindak pidana korupsi menurut UU Tipikor), *kolusi* (permufakatan melawan hukum yang merugikan orang lain atau negara), *nepotisme* (menguntungkan keluarga atau kroni secara melawan hukum).\"},\"tips\":\"Cari **siapa yang diuntungkan**. Jika penerima keuntungan adalah keluarga atau kroni pejabat, pilih nepotisme. Jika inti cerita adalah kesepakatan rahasia antarpihak, pilih kolusi.\",\"rujukan\":[\"UU No. 28 Tahun 1999 tentang Penyelenggaraan Negara yang Bersih dan Bebas dari Korupsi, Kolusi, dan Nepotisme, Pasal 1 angka 4 dan angka 5\"]},{\"id\":\"p03-023\",\"kategori\":\"TWK\",\"subtopik\":\"Integritas\",\"pertanyaan\":\"Pernyataan yang sesuai dengan kewajiban penyelenggara negara tentang harta kekayaan menurut UU No. 28 Tahun 1999 adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Kekayaan cukup dilaporkan kepada atasan langsung dan bersifat rahasia sehingga tidak boleh diumumkan\"},{\"huruf\":\"B\",\"teks\":\"Kekayaan hanya wajib dilaporkan setelah pejabat berhenti dari jabatannya\"},{\"huruf\":\"C\",\"teks\":\"Kekayaan dilaporkan kepada BPK karena BPK memeriksa pengelolaan keuangan negara\"},{\"huruf\":\"D\",\"teks\":\"Penyelenggara negara wajib melaporkan dan mengumumkan kekayaannya sebelum dan setelah menjabat\"},{\"huruf\":\"E\",\"teks\":\"Penyelenggara negara hanya wajib bersedia diperiksa kekayaannya setelah ada laporan masyarakat atau temuan aparat penegak hukum\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 5 UU No. 28 Tahun 1999 memuat kewajiban penyelenggara negara, antara lain **bersedia diperiksa kekayaannya sebelum, selama, dan setelah menjabat** (angka 2) serta **melaporkan dan mengumumkan kekayaan sebelum dan setelah menjabat** (angka 3). Laporan ini dikenal sebagai **LHKPN** (Laporan Harta Kekayaan Penyelenggara Negara) dan disampaikan kepada **KPK**. Tujuannya adalah mencegah korupsi dengan membuat perubahan kekayaan pejabat dapat dipantau publik. Jadi, opsi D sesuai dengan undang-undang.\",\"opsi\":{\"A\":\"Undang-undang justru mewajibkan kekayaan **diumumkan**, sehingga tidak bersifat rahasia. Penerima laporannya juga bukan atasan langsung.\",\"B\":\"Kewajiban melapor berlaku **sebelum dan setelah** menjabat, bukan hanya setelah berhenti. Laporan awal penting sebagai pembanding saat pejabat selesai menjabat.\",\"C\":\"BPK memeriksa keuangan negara, bukan harta pribadi pejabat. LHKPN disampaikan kepada KPK. LHKPN tetap disampaikan kepada KPK, yang juga berwenang memeriksa kebenaran isinya.\",\"E\":\"Pengecoh terkuat. Kesediaan diperiksa berlaku **sebelum, selama, dan setelah** menjabat, tanpa menunggu laporan masyarakat atau temuan aparat.\"},\"konsep\":\"**Dua kewajiban yang sering ditukar:** *diperiksa* kekayaannya → sebelum, **selama**, dan setelah menjabat; *melaporkan dan mengumumkan* kekayaan → sebelum dan setelah menjabat.\"},\"tips\":\"Waspadai kata pembatas seperti *hanya*, *cukup*, atau *setelah ada laporan*. Kewajiban pencegahan korupsi dirancang untuk berjalan **tanpa menunggu** ada masalah.\",\"rujukan\":[\"UU No. 28 Tahun 1999 tentang Penyelenggaraan Negara yang Bersih dan Bebas dari Korupsi, Kolusi, dan Nepotisme, Pasal 5 angka 2 dan angka 3\"]},{\"id\":\"p03-024\",\"kategori\":\"TWK\",\"subtopik\":\"Integritas\",\"pertanyaan\":\"Seorang ASN ikut menyusun rancangan kebijakan tarif layanan yang belum diumumkan. Seorang kenalannya meminta salinan rancangan itu dengan alasan ingin menyiapkan usahanya lebih awal. ASN tersebut menolak dan menyatakan bahwa dokumen hanya dapat dibagikan setelah resmi diumumkan. Nilai dasar BerAKHLAK yang paling menonjol dalam sikap ini adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Adaptif, karena ASN tersebut menyesuaikan diri dengan perubahan kebijakan tarif\"},{\"huruf\":\"B\",\"teks\":\"Kompeten, karena ASN tersebut menguasai isi rancangan kebijakan\"},{\"huruf\":\"C\",\"teks\":\"Harmonis, karena ASN tersebut menjaga hubungan baik dengan kenalannya\"},{\"huruf\":\"D\",\"teks\":\"Kolaboratif, karena ASN tersebut akan membagikan dokumen kepada publik setelah diumumkan\"},{\"huruf\":\"E\",\"teks\":\"Loyal, karena ASN tersebut menjaga rahasia jabatan dan kepentingan instansi\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Nilai **loyal** dalam BerAKHLAK mencakup setia kepada Pancasila, UUD 1945, NKRI, dan pemerintahan yang sah, menjaga nama baik instansi, serta **menjaga rahasia jabatan dan negara**. Rancangan kebijakan yang belum diumumkan adalah informasi jabatan. Jika dibocorkan, pihak tertentu dapat memperoleh keuntungan yang tidak adil dibanding warga lain. ASN dalam soal menolak membagikannya sampai resmi diumumkan. Sikap ini paling tepat menggambarkan nilai loyal.\",\"opsi\":{\"A\":\"Adaptif berkaitan dengan kemampuan menyesuaikan diri dan berinovasi menghadapi perubahan. Soal tidak membahas penyesuaian diri.\",\"B\":\"Kompeten berkaitan dengan kemampuan dan mutu kerja. Menguasai isi rancangan bukan inti sikap yang ditanyakan.\",\"C\":\"Harmonis berkaitan dengan menghargai perbedaan dan membangun suasana kerja yang kondusif. Penolakan dalam soal justru menunjukkan bahwa ASN tidak mendahulukan hubungan pribadi.\",\"D\":\"Kolaboratif berkaitan dengan kerja sama dan keterbukaan untuk menghasilkan nilai tambah. Rencana membagikan dokumen setelah diumumkan bukan inti sikap yang ditanyakan.\"},\"konsep\":\"**BerAKHLAK:** Berorientasi Pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif. Kata kunci *rahasia jabatan* dan *nama baik instansi* → **loyal**.\"},\"tips\":\"Cocokkan **kata kunci perilaku** dengan nilainya: rahasia jabatan → loyal; tanggung jawab dan tidak menyalahgunakan wewenang → akuntabel; meningkatkan kemampuan → kompeten; menghargai perbedaan → harmonis; inovasi → adaptif; kerja sama → kolaboratif.\",\"rujukan\":[\"UU No. 20 Tahun 2023 tentang Aparatur Sipil Negara (nilai dasar ASN)\",\"Surat Edaran Menteri PANRB No. 20 Tahun 2021 tentang Implementasi Core Values dan Employer Branding ASN\"]},{\"id\":\"p03-025\",\"kategori\":\"TWK\",\"subtopik\":\"Bela Negara\",\"pertanyaan\":\"Menurut Pasal 30 ayat (2) UUD NRI Tahun 1945, usaha pertahanan dan keamanan negara dilaksanakan melalui sistem pertahanan dan keamanan rakyat semesta dengan pembagian peran ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"TNI sebagai kekuatan utama, sedangkan Polri dan rakyat sebagai kekuatan pendukung\"},{\"huruf\":\"B\",\"teks\":\"TNI dan Polri sebagai kekuatan utama, dan rakyat sebagai kekuatan pendukung\"},{\"huruf\":\"C\",\"teks\":\"Rakyat sebagai kekuatan utama, sedangkan TNI dan Polri sebagai kekuatan pendukung\"},{\"huruf\":\"D\",\"teks\":\"TNI, Polri, dan rakyat sebagai kekuatan utama yang kedudukannya setara\"},{\"huruf\":\"E\",\"teks\":\"Polri sebagai kekuatan utama di bidang keamanan, TNI di bidang pertahanan, dan Komponen Cadangan sebagai pendukung keduanya\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 30 ayat (2) berbunyi: *Usaha pertahanan dan keamanan negara dilaksanakan melalui sistem pertahanan dan keamanan rakyat semesta oleh Tentara Nasional Indonesia dan Kepolisian Negara Republik Indonesia, sebagai kekuatan utama, dan rakyat, sebagai kekuatan pendukung.* Jadi, **TNI dan Polri** bersama-sama menjadi **kekuatan utama**, sedangkan **rakyat** menjadi **kekuatan pendukung**. Kata *semesta* menunjukkan bahwa seluruh warga negara, wilayah, dan sumber daya nasional dilibatkan dalam pertahanan dan keamanan negara.\",\"opsi\":{\"A\":\"Polri tidak ditempatkan sebagai kekuatan pendukung. UUD menyebut TNI **dan** Polri sebagai kekuatan utama.\",\"C\":\"Arahnya terbalik. Rakyat adalah kekuatan pendukung, bukan kekuatan utama.\",\"D\":\"UUD membedakan kekuatan utama dan kekuatan pendukung, sehingga ketiganya tidak disebut setara.\",\"E\":\"Pengecoh terkuat karena tugas TNI (pertahanan) dan Polri (keamanan) memang dibedakan di Pasal 30 ayat (3) dan (4). Namun, ayat (2) menyebut **rakyat**, bukan Komponen Cadangan, sebagai kekuatan pendukung.\"},\"konsep\":\"**Peta Pasal 30:** ayat (1) hak dan kewajiban warga negara ikut serta dalam usaha pertahanan dan keamanan; ayat (2) sistem rakyat semesta; ayat (3) tugas TNI; ayat (4) tugas Polri; ayat (5) pengaturan lebih lanjut dengan undang-undang.\"},\"tips\":\"Ingat rumus **2 + 1**: dua kekuatan utama (TNI dan Polri) ditambah satu kekuatan pendukung (rakyat). Opsi yang memindahkan Polri atau rakyat ke posisi lain adalah pengecoh.\",\"rujukan\":[\"UUD NRI Tahun 1945 Pasal 30 ayat (1) sampai (5)\"]},{\"id\":\"p03-026\",\"kategori\":\"TWK\",\"subtopik\":\"Bela Negara\",\"pertanyaan\":\"Menurut UU No. 3 Tahun 2002 tentang Pertahanan Negara, keikutsertaan warga negara dalam upaya bela negara diselenggarakan antara lain melalui ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Keanggotaan wajib dalam organisasi kemasyarakatan yang diakui pemerintah\"},{\"huruf\":\"B\",\"teks\":\"Pengabdian sebagai prajurit TNI yang hanya dapat dilakukan secara sukarela\"},{\"huruf\":\"C\",\"teks\":\"Pengabdian sesuai dengan profesi\"},{\"huruf\":\"D\",\"teks\":\"Wajib militer selama dua tahun bagi setiap warga negara yang berusia 18 tahun\"},{\"huruf\":\"E\",\"teks\":\"Keikutsertaan dalam pemilihan umum sebagai bentuk dukungan terhadap pemerintahan yang sah\"}],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pasal 9 ayat (2) UU No. 3 Tahun 2002 menyebut empat bentuk keikutsertaan warga negara dalam upaya bela negara:\\n\\n1. pendidikan kewarganegaraan;\\n2. pelatihan dasar kemiliteran secara wajib;\\n3. pengabdian sebagai prajurit TNI secara sukarela atau secara wajib; dan\\n4. **pengabdian sesuai dengan profesi**.\\n\\nPengabdian sesuai profesi berarti warga negara membela negara melalui keahliannya, misalnya dokter, guru, insinyur, atau ASN yang bekerja dengan sungguh-sungguh untuk kepentingan bangsa. Opsi C tercantum dalam daftar tersebut.\",\"opsi\":{\"A\":\"Undang-undang tidak menyebut keanggotaan wajib dalam organisasi kemasyarakatan sebagai bentuk bela negara.\",\"B\":\"Pengecoh terkuat. Pengabdian sebagai prajurit TNI memang disebut, tetapi bentuknya **sukarela atau wajib**. Kata *hanya* membuat opsi ini salah.\",\"D\":\"Undang-undang menyebut *pelatihan dasar kemiliteran secara wajib*, bukan wajib militer dua tahun bagi setiap warga berusia 18 tahun. Angka dan rinciannya dikarang.\",\"E\":\"Mengikuti pemilu adalah hak politik warga negara, tetapi tidak disebut sebagai bentuk keikutsertaan bela negara dalam Pasal 9 ayat (2).\"},\"konsep\":\"**Bela negara tidak selalu berarti angkat senjata.** Pendidikan kewarganegaraan dan pengabdian sesuai profesi menunjukkan bahwa setiap warga negara dapat membela negara melalui perannya sehari-hari.\"},\"tips\":\"Hafalkan empat bentuk dengan singkatan **PePeLaPro**: *Pe*ndidikan kewarganegaraan, *Pe*ngabdian sebagai prajurit, *La*tihan dasar kemiliteran, *Pro*fesi. Opsi yang menambahkan angka atau syarat yang tidak ada di undang-undang biasanya pengecoh.\",\"rujukan\":[\"UU No. 3 Tahun 2002 tentang Pertahanan Negara Pasal 9 ayat (1) dan (2)\"]},{\"id\":\"p03-027\",\"kategori\":\"TWK\",\"subtopik\":\"Bela Negara\",\"pertanyaan\":\"Sebuah video yang menuduh suku tertentu sebagai dalang kerusuhan beredar di grup percakapan warga. Video itu belum jelas sumbernya dan banyak warga mulai terpancing amarah. Tindakan yang paling mencerminkan sikap bela negara di ruang digital adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meneruskan video itu ke grup lain agar lebih banyak orang waspada terhadap suku tersebut\"},{\"huruf\":\"B\",\"teks\":\"Keluar dari grup agar tidak ikut terseret dalam perdebatan yang memanas\"},{\"huruf\":\"C\",\"teks\":\"Membalas dengan video lain yang menuduh kelompok berbeda sebagai pelaku sebenarnya\"},{\"huruf\":\"D\",\"teks\":\"Diam saja karena masalah itu sudah ditangani aparat keamanan\"},{\"huruf\":\"E\",\"teks\":\"Memeriksa kebenaran video, mengingatkan warga untuk tidak menyebarkannya, dan melaporkannya melalui kanal aduan resmi\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Bela negara di era digital mencakup upaya **menjaga persatuan bangsa dari ancaman nonmiliter**, seperti hoaks dan ujaran kebencian yang dapat memicu konflik antarkelompok. Video dalam soal belum jelas sumbernya dan menyudutkan satu suku. Langkah yang tepat adalah **memeriksa kebenaran** informasi, **mencegah penyebarannya** dengan mengingatkan warga, dan **melaporkannya** melalui kanal aduan resmi. Tindakan ini aktif, tidak menambah ketegangan, dan melibatkan pihak yang berwenang.\",\"opsi\":{\"A\":\"Meneruskan konten yang belum jelas sumbernya justru memperluas hoaks dan memperbesar kebencian terhadap satu suku. Ini bertentangan dengan semangat bela negara.\",\"B\":\"Keluar dari grup menghindarkan diri dari konflik, tetapi membiarkan hoaks terus menyebar tanpa ada yang meluruskan.\",\"C\":\"Membalas tuduhan dengan tuduhan lain menambah hoaks baru dan memperluas konflik.\",\"D\":\"Belum tentu aparat sudah mengetahui konten itu. Diam juga membiarkan warga lain terpancing.\"},\"konsep\":\"**Rumus menghadapi konten provokatif:** *saring* (periksa sumber dan kebenaran), *jangan sebar*, *luruskan* dengan santun, dan *laporkan* melalui kanal resmi. Sikap ini sejalan dengan nilai cinta tanah air dan menjaga persatuan.\"},\"tips\":\"Pada soal bela negara yang berupa kasus, pilih tindakan yang **aktif**, **meredakan konflik**, dan **melibatkan pihak berwenang**. Opsi yang diam atau menghindar biasanya kurang tepat.\",\"rujukan\":[]},{\"id\":\"p03-028\",\"kategori\":\"TWK\",\"subtopik\":\"Bahasa Indonesia\",\"pertanyaan\":\"Kalimat yang seluruh katanya baku adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Hasil analisa itu menunjukkan resiko yang cukup besar.\"},{\"huruf\":\"B\",\"teks\":\"Ia menyerahkan kwitansi pembayaran ke bagian keuangan.\"},{\"huruf\":\"C\",\"teks\":\"Pegawai itu mengajukan ijin cuti selama tiga hari.\"},{\"huruf\":\"D\",\"teks\":\"Apoteker memberi nasihat tentang risiko obat itu.\"},{\"huruf\":\"E\",\"teks\":\"Jadwal praktek dokter spesialis di rumah sakit itu berubah setiap hari Senin.\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Kalimat D memakai kata baku seluruhnya: **apoteker**, **nasihat**, dan **risiko**. Bentuk nonbaku yang sering muncul adalah *nasehat* dan *resiko*. Kata baku dapat dipastikan melalui KBBI. Banyak kata nonbaku muncul karena pengaruh lafal sehari-hari atau bahasa asal kata serapan. Misalnya, *risiko* berasal dari bahasa Belanda *risico*, sehingga huruf vokalnya *i*, bukan *e*. Kata *nasihat* berasal dari bahasa Arab dan dibakukan dengan *i*.\",\"opsi\":{\"A\":\"Mengandung dua kata nonbaku: *analisa* (baku: **analisis**) dan *resiko* (baku: **risiko**). Bentuk *analisis* mengikuti pola kata serapan dari bahasa Inggris *analysis*, seperti *sintesis* dan *diagnosis*.\",\"B\":\"Kata *kwitansi* tidak baku. Bentuk bakunya **kuitansi**. Kata *kuitansi* diserap dari bahasa Belanda *kwitantie* dan dibakukan dengan huruf *u*.\",\"C\":\"Kata *ijin* tidak baku. Bentuk bakunya **izin**. Kata ini diserap dari bahasa Arab dan dibakukan dengan huruf *z*, seperti pada *izin usaha* dan *surat izin*.\",\"E\":\"Kata *praktek* tidak baku. Bentuk bakunya **praktik**. Kata *jadwal* dan kata lain dalam kalimat ini sudah baku, sehingga opsi ini menjebak peserta yang hanya memeriksa kata pertama.\"},\"konsep\":\"**Pasangan baku–nonbaku yang sering diuji:** analisis–analisa, risiko–resiko, kuitansi–kwitansi, izin–ijin, praktik–praktek, nasihat–nasehat, apotek–apotik, objek–obyek, hakikat–hakekat, teoretis–teoritis.\"},\"tips\":\"Periksa **setiap kata** dalam kalimat, bukan hanya kata yang paling mencurigakan. Satu kata nonbaku sudah cukup membuat opsi salah.\",\"rujukan\":[\"Kamus Besar Bahasa Indonesia (KBBI)\"]},{\"id\":\"p03-029\",\"kategori\":\"TWK\",\"subtopik\":\"Bahasa Indonesia\",\"pertanyaan\":\"Kalimat berikut yang bermakna ganda (ambigu) adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Anak dokter yang cerdas itu memenangi lomba.\"},{\"huruf\":\"B\",\"teks\":\"Dokter yang cerdas itu memiliki seorang anak.\"},{\"huruf\":\"C\",\"teks\":\"Anak yang cerdas itu adalah putra seorang dokter.\"},{\"huruf\":\"D\",\"teks\":\"Lomba itu dimenangi oleh anak seorang dokter.\"},{\"huruf\":\"E\",\"teks\":\"Anak yang cerdas itu memenangi lomba sains tingkat provinsi bersama timnya.\"}],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Kalimat A ambigu karena frasa **yang cerdas itu** dapat menerangkan dua kata. Pertama, yang cerdas adalah **anak**: *anak (dokter) yang cerdas itu*. Kedua, yang cerdas adalah **dokter**: *anak (dokter yang cerdas itu)*. Pembaca tidak dapat memastikan makna mana yang dimaksud penulis. Keambiguan seperti ini disebut **ambiguitas gramatikal**, karena muncul dari susunan kata, bukan dari makna kata itu sendiri. Kalimat dapat diperbaiki dengan menyusun ulang, misalnya *Anak yang cerdas itu, putra seorang dokter, memenangi lomba*.\",\"opsi\":{\"B\":\"Frasa *yang cerdas itu* hanya dapat menerangkan *dokter*, karena tidak ada kata benda lain di depannya. Maknanya tunggal.\",\"C\":\"Yang cerdas jelas *anak*, dan keterangan bahwa ia putra dokter diletakkan terpisah. Maknanya tunggal.\",\"D\":\"Tidak ada frasa sifat yang dapat menerangkan dua kata. Kalimat hanya menyatakan siapa pemenang lomba.\",\"E\":\"Pengecoh terpanjang. Kalimat ini panjang, tetapi setiap keterangan jelas induknya: *yang cerdas itu* menerangkan *anak*, dan *bersama timnya* menerangkan cara memenangi lomba.\"},\"konsep\":\"**Pola kalimat ambigu yang sering diuji:** *kata benda + kata benda + yang + sifat*, misalnya *istri pejabat yang ramah* atau *rumah pengusaha yang besar*. Frasa *yang + sifat* dapat menerangkan kata benda pertama atau kedua.\"},\"tips\":\"Cari pola **dua kata benda berurutan diikuti frasa *yang …***. Uji dengan bertanya: *siapa yang cerdas?* Jika ada dua jawaban yang masuk akal, kalimat itu ambigu.\",\"rujukan\":[]},{\"id\":\"p03-030\",\"kategori\":\"TWK\",\"subtopik\":\"Bahasa Indonesia\",\"pertanyaan\":\"Kalimat yang penulisan bilangannya sesuai dengan kaidah ejaan adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"50 peserta mengikuti pelatihan pada hari pertama.\"},{\"huruf\":\"B\",\"teks\":\"Lima puluh peserta mengikuti pelatihan pada hari pertama.\"},{\"huruf\":\"C\",\"teks\":\"Pelatihan itu diadakan untuk ke-dua kalinya tahun ini.\"},{\"huruf\":\"D\",\"teks\":\"Biaya pendaftaran pelatihan sebesar Rp. 150.000,00 dibayar di muka.\"},{\"huruf\":\"E\",\"teks\":\"Peserta pelatihan berasal dari 3 provinsi, yaitu Jawa Barat, Banten, dan Lampung.\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Menurut kaidah ejaan bahasa Indonesia (EYD), **bilangan di awal kalimat ditulis dengan huruf**. Jika bilangan itu panjang, susunan kalimat diubah agar bilangan tidak berada di awal. Kalimat B menuliskan *Lima puluh* dengan huruf di awal kalimat, sehingga penulisannya tepat. Kaidah lain yang diuji di opsi adalah penulisan bilangan tingkat, lambang mata uang, dan bilangan yang dapat dinyatakan dengan satu atau dua kata.\",\"opsi\":{\"A\":\"Bilangan di awal kalimat tidak boleh ditulis dengan angka. Bentuk yang benar adalah *Lima puluh peserta …*.\",\"C\":\"Bilangan tingkat yang ditulis dengan huruf dirangkai tanpa tanda hubung: **kedua**. Tanda hubung hanya dipakai jika bilangannya ditulis dengan angka, misalnya *ke-2*.\",\"D\":\"Lambang mata uang ditulis **tanpa titik** dan **tanpa spasi** dengan angkanya: **Rp150.000,00**.\",\"E\":\"Bilangan yang dapat dinyatakan dengan satu atau dua kata ditulis dengan huruf, kecuali dalam rincian atau perhitungan. Bentuk yang benar adalah **tiga provinsi**.\"},\"konsep\":\"**Kaidah bilangan yang sering diuji:** huruf di awal kalimat; huruf untuk bilangan satu atau dua kata; *ke-* + angka memakai tanda hubung (*ke-2*), *ke* + huruf dirangkai (*kedua*); lambang mata uang tanpa titik dan spasi (*Rp5.000,00*).\"},\"tips\":\"Periksa **awal kalimat** lebih dulu. Jika ada opsi yang diawali angka, opsi itu hampir pasti salah. Setelah itu, periksa tanda hubung bilangan tingkat dan penulisan *Rp*.\",\"rujukan\":[\"Ejaan Bahasa Indonesia yang Disempurnakan (EYD) Edisi V, bagian penulisan angka dan bilangan\"]}],\"judul\":\"Paket 03\",\"format\":{\"urutan\":[\"TWK\",\"TIU\",\"TKP\"],\"sumber\":null,\"durasiResmiMenit\":null,\"subtes\":{\"TWK\":{\"jumlahSoal\":30,\"nilaiBenar\":5,\"nilaiSalah\":0,\"ambangBatas\":null},\"TIU\":{\"jumlahSoal\":35,\"nilaiBenar\":5,\"nilaiSalah\":0,\"ambangBatas\":null},\"TKP\":{\"jumlahSoal\":45,\"nilaiBenar\":0,\"nilaiSalah\":0,\"ambangBatas\":null}}}}}]}]\n"])</script></body></html>
