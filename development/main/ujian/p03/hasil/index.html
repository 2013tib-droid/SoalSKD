a menerima uang; 1 = memalsukan dan menerima uang.\"},\"tips\":\"Menandatangani dokumen yang tidak sesuai kenyataan **selalu bernilai rendah**, sekalipun Anda tidak menerima uangnya. Cari opsi yang menolak sekaligus menawarkan cara yang benar.\",\"rujukan\":[]},{\"id\":\"p03-104\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Di sebuah grup percakapan, beredar ajakan berdonasi untuk “membantu saudara yang sedang berjuang”. Rekening yang dicantumkan atas nama pribadi, dan pesan itu disertai video yang memuji aksi bom bunuh diri. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tidak berdonasi dan keluar dari grup itu agar tidak terseret\"},{\"huruf\":\"B\",\"teks\":\"Berdonasi karena tujuannya terdengar untuk membantu sesama\"},{\"huruf\":\"C\",\"teks\":\"Tidak berdonasi dan tidak menanggapi pesan itu sama sekali\"},{\"huruf\":\"D\",\"teks\":\"Tidak berdonasi, mengingatkan anggota grup bahwa dana itu bisa membiayai kekerasan, dan melaporkannya ke pihak berwenang\"},{\"huruf\":\"E\",\"teks\":\"Tidak berdonasi dan mengingatkan anggota grup agar tidak berdonasi ke lembaga yang tidak jelas dan rekening pribadi yang tidak dikenal\"}],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":2,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Ajakan donasi yang memakai rekening pribadi dan disertai konten yang memuji kekerasan adalah tanda **pendanaan terorisme**. Mendanai kegiatan terorisme merupakan tindak pidana tersendiri. Sikap yang tepat bukan hanya menolak berdonasi, melainkan juga **mencegah orang lain terjebak** dengan mengingatkan anggota grup dan **melaporkannya ke pihak berwenang**. Laporan memungkinkan aparat menelusuri aliran dana dan menghentikannya.\",\"opsi\":{\"A\":\"Melindungi diri sendiri, tetapi anggota grup lain bisa terjebak berdonasi.\",\"B\":\"Paling buruk. Donasi itu berpotensi membiayai aksi kekerasan dan dapat melibatkan Anda secara hukum.\",\"C\":\"Tidak ikut berdonasi, tetapi pasif dan membiarkan ajakan itu terus beredar di grup.\",\"D\":\"Paling ideal. Menolak, mencegah orang lain terjebak, dan melapor agar aliran dana dapat dihentikan.\",\"E\":\"Mengingatkan dengan tepat, tetapi tidak melapor. Penggalang dana tetap dapat menyebarkan ajakan di tempat lain.\"},\"konsep\":\"**Ciri penggalangan dana mencurigakan:** rekening pribadi, lembaga tidak jelas, tujuan samar, dan narasi yang membenarkan kekerasan. Pola bobot: 5 = tolak + ingatkan + laporkan; 4 = tolak + ingatkan; 1 = ikut berdonasi.\"},\"tips\":\"Jika ajakan **memuji kekerasan**, jawaban terbaik selalu memuat **pelaporan kepada pihak berwenang**, bukan hanya menolak atau menghindar.\",\"rujukan\":[\"UU No. 9 Tahun 2013 tentang Pencegahan dan Pemberantasan Tindak Pidana Pendanaan Terorisme\"]},{\"id\":\"p03-105\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Seorang rekan membagikan video ceramah di grup percakapan kantor. Isinya menyebut pemerintah tidak sah dan mengajak pendengar untuk tidak menaati hukum negara. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Keluar dari grup kantor agar tidak terlibat dalam pembahasan video tersebut\"},{\"huruf\":\"B\",\"teks\":\"Mengingatkan rekan secara pribadi bahwa isi video itu bertentangan dengan kewajiban ASN, memintanya menghapus, dan melapor jika berulang\"},{\"huruf\":\"C\",\"teks\":\"Ikut memberi komentar setuju karena penceramahnya terkenal\"},{\"huruf\":\"D\",\"teks\":\"Tidak menanggapi video itu dan melanjutkan pekerjaan seperti biasa\"},{\"huruf\":\"E\",\"teks\":\"Menanggapi langsung di grup dengan menjelaskan bahwa ASN wajib setia kepada Pancasila, UUD 1945, dan pemerintahan yang sah serta menaati hukum\"}],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":1,\"D\":3,\"E\":4},\"pembahasan\":{\"inti\":\"ASN wajib **setia kepada Pancasila, UUD 1945, NKRI, dan pemerintahan yang sah**. Konten yang mengajak tidak menaati hukum negara bertentangan dengan kewajiban itu. Rekan yang membagikannya mungkin tidak menyadari dampaknya. Langkah terbaik adalah **mengingatkan secara pribadi** agar ia tidak merasa dipermalukan, memintanya menghapus konten, dan **melaporkan** kepada atasan jika konten serupa terus dibagikan. Cara ini tegas, santun, dan mencegah penyebaran.\",\"opsi\":{\"A\":\"Menghindar. Konten tetap beredar di grup dan dibaca rekan lain. Rekan yang membagikan juga tidak diingatkan.\",\"B\":\"Paling ideal. Santun, mengoreksi, meminta konten dihapus, dan siap melapor jika berulang.\",\"C\":\"Paling buruk. Mendukung ajakan menolak hukum negara bertentangan dengan sumpah ASN.\",\"D\":\"Pasif. Diam dapat dianggap sebagai persetujuan, dan konten tetap beredar.\",\"E\":\"Meluruskan dengan tepat, tetapi di depan umum. Rekan dapat merasa dipermalukan dan perdebatan di grup bisa memanas.\"},\"konsep\":\"**Menangkal konten radikal di lingkungan kerja:** koreksi dengan santun, cegah penyebaran, dan laporkan jika berulang. Kesetiaan kepada Pancasila dan pemerintahan yang sah adalah bagian dari nilai loyal ASN.\"},\"tips\":\"Dalam soal konten radikal yang dibagikan rekan, opsi bernilai 5 biasanya **mengingatkan secara pribadi + meminta konten dihapus + melapor jika berulang**.\",\"rujukan\":[\"UU No. 20 Tahun 2023 tentang Aparatur Sipil Negara (nilai dasar ASN)\"]},{\"id\":\"p03-106\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Sebuah keluarga baru pindah ke lingkungan tempat tinggal Anda. Sang suami berjanggot lebat dan istrinya bercadar. Beberapa tetangga mulai menyebut mereka teroris dan mengusulkan agar keluarga itu diusir, padahal tidak ada kejadian apa pun. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Ikut mendesak ketua RT agar keluarga itu diminta pindah dari lingkungan\"},{\"huruf\":\"B\",\"teks\":\"Menghindari keluarga itu dan melarang anak Anda bermain dengan anak mereka\"},{\"huruf\":\"C\",\"teks\":\"Mengingatkan tetangga agar tidak menilai dari penampilan, mengajak warga mengenal keluarga itu, dan menyerahkan kepada aparat jika ada bukti\"},{\"huruf\":\"D\",\"teks\":\"Tidak ikut-ikutan dan menunggu perkembangan selanjutnya\"},{\"huruf\":\"E\",\"teks\":\"Mengingatkan tetangga bahwa cara berpakaian dan penampilan seseorang tidak dapat dijadikan bukti bahwa ia terlibat dalam jaringan terorisme\"}],\"kunci\":\"C\",\"bobot\":{\"A\":1,\"B\":2,\"C\":5,\"D\":3,\"E\":4},\"pembahasan\":{\"inti\":\"Sikap antiradikalisme bukan berarti **mencurigai orang berdasarkan penampilan atau cara beragamanya**. Prasangka seperti itu justru dapat memecah masyarakat dan membuat kelompok tertentu merasa terasing. Sikap yang tepat adalah mengingatkan tetangga agar tidak menghakimi tanpa bukti, mengajak warga **mengenal** keluarga baru itu, dan menyerahkan kepada aparat hanya jika memang ada bukti kegiatan yang mencurigakan. Kewaspadaan didasarkan pada perbuatan, bukan penampilan.\",\"opsi\":{\"A\":\"Paling buruk. Mengusir warga tanpa bukti adalah diskriminasi dan dapat memicu konflik.\",\"B\":\"Ikut memperkuat prasangka dan mengucilkan keluarga itu, termasuk anak-anaknya. Anak-anak ikut menanggung akibat prasangka orang dewasa.\",\"C\":\"Paling ideal. Menangkal prasangka, membangun kebersamaan, dan tetap waspada secara proporsional.\",\"D\":\"Tidak ikut menghakimi, tetapi membiarkan prasangka terus berkembang di lingkungan. Tanpa ada yang meluruskan, rumor dapat berubah menjadi tindakan yang merugikan keluarga itu.\",\"E\":\"Meluruskan prasangka dengan tepat, tetapi belum mengajak warga membangun hubungan dengan keluarga itu.\"},\"konsep\":\"**Bedakan religiusitas dan radikalisme.** Cara berpakaian dan ketaatan beragama adalah hak setiap warga. Radikalisme ditandai oleh sikap intoleran, menolak dasar negara, atau membenarkan kekerasan, bukan oleh penampilan.\"},\"tips\":\"Soal antiradikalisme juga menguji **sikap tidak berprasangka**. Opsi yang menghakimi berdasarkan penampilan atau agama selalu bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p03-107\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Seorang rekan kerja bercerita kepada Anda bahwa ia berencana berangkat ke wilayah konflik di luar negeri untuk bergabung dengan sebuah kelompok bersenjata. Belakangan ia mulai menjual barang-barangnya. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menasihatinya satu kali, lalu menghormati keputusannya sebagai urusan pribadi\"},{\"huruf\":\"B\",\"teks\":\"Mengajaknya bicara untuk memahami alasannya, mengingatkan bahayanya, dan segera melaporkan rencana itu kepada atasan dan aparat\"},{\"huruf\":\"C\",\"teks\":\"Merahasiakan rencananya karena ia teman dekat Anda dan bercerita secara pribadi\"},{\"huruf\":\"D\",\"teks\":\"Menjauhinya agar Anda tidak dianggap terlibat dalam rencananya\"},{\"huruf\":\"E\",\"teks\":\"Segera melaporkan rencana itu kepada aparat berwenang tanpa membicarakannya lebih jauh dengan rekan Anda, agar ia tidak sempat berangkat lebih dulu\"}],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":1,\"D\":3,\"E\":4},\"pembahasan\":{\"inti\":\"Rencana bergabung dengan kelompok bersenjata di luar negeri adalah **ancaman serius** bagi keselamatan rekan Anda dan masyarakat. Perbuatan itu juga dapat dipidana. Tanda-tanda seperti menjual barang menunjukkan bahwa rencananya semakin dekat. Sikap terbaik menggabungkan **kepedulian** dan **ketegasan**: mengajaknya bicara untuk memahami alasan dan mengingatkan bahayanya, lalu **segera melaporkan** kepada atasan dan aparat agar ada pendampingan dan pencegahan sebelum ia berangkat.\",\"opsi\":{\"A\":\"Menganggap ancaman serius sebagai urusan pribadi. Nasihat satu kali tidak cukup mencegah keberangkatan.\",\"B\":\"Paling ideal. Peduli kepada rekan, memahami alasannya, dan segera melibatkan pihak berwenang untuk mencegah bahaya.\",\"C\":\"Paling buruk. Merahasiakan rencana itu membiarkan bahaya terjadi dan dapat melibatkan Anda secara hukum.\",\"D\":\"Melindungi diri sendiri, tetapi rekan Anda tidak dicegah dan aparat tidak tahu.\",\"E\":\"Tindakan pelaporannya tepat dan cepat, tetapi kesempatan memahami alasan rekan dan membantunya secara pribadi terlewat.\"},\"konsep\":\"**Pencegahan terorisme dimulai dari orang terdekat.** Tanda bahaya: niat bergabung dengan kelompok bersenjata, memutus hubungan, menjual harta, dan membenarkan kekerasan. Laporan dini memberi kesempatan pendampingan sebelum terlambat.\"},\"tips\":\"Untuk ancaman yang **serius dan mendesak**, opsi bernilai 5 selalu memuat **pelaporan segera kepada pihak berwenang**. Kepedulian pribadi menambah nilai, tetapi tidak menggantikan laporan.\",\"rujukan\":[\"UU No. 5 Tahun 2018 tentang Perubahan atas UU No. 15 Tahun 2003 tentang Penetapan Perpu No. 1 Tahun 2002 tentang Pemberantasan Tindak Pidana Terorisme menjadi Undang-Undang\"]},{\"id\":\"p03-108\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Di grup percakapan alumni sekolah Anda, beberapa anggota mulai mengolok-olok lambang negara dan menyerukan boikot pemilu karena menganggap demokrasi bertentangan dengan agama. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Diam saja karena grup itu adalah grup alumni, bukan grup kantor\"},{\"huruf\":\"B\",\"teks\":\"Ikut menyebarkan seruan boikot pemilu itu ke grup lain\"},{\"huruf\":\"C\",\"teks\":\"Keluar dari grup alumni tanpa memberikan tanggapan apa pun\"},{\"huruf\":\"D\",\"teks\":\"Menanggapi dengan santun bahwa Pancasila dan demokrasi disepakati para pendiri bangsa, termasuk tokoh agama, lalu mengajak berdiskusi dengan sehat\"},{\"huruf\":\"E\",\"teks\":\"Meminta pengelola grup menghapus unggahan yang menghina lambang negara dan mengingatkan semua anggota agar tidak mengulanginya lagi di grup alumni itu\"}],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":2,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Narasi bahwa demokrasi bertentangan dengan agama sering dipakai untuk **menjauhkan warga dari dasar negara**. Narasi ini paling efektif dilawan dengan **penjelasan yang santun dan berbasis fakta**, misalnya bahwa Pancasila dan UUD 1945 disepakati para pendiri bangsa dari berbagai golongan, termasuk tokoh-tokoh agama. Mengajak diskusi yang sehat membuka ruang bagi anggota grup untuk berpikir ulang. Kewajiban menjaga nilai kebangsaan tetap berlaku di luar lingkungan kantor.\",\"opsi\":{\"A\":\"Pasif. Sikap ASN untuk menjaga nilai kebangsaan tidak berhenti di grup kantor. Anggota lain dapat menganggap seruan itu wajar karena tidak ada yang menanggapi.\",\"B\":\"Paling buruk. Ikut menyebarkan seruan yang merendahkan dasar negara dan proses demokrasi.\",\"C\":\"Menghindar. Narasi yang keliru dibiarkan tanpa ada yang meluruskan.\",\"D\":\"Paling ideal. Meluruskan dengan fakta, santun, dan membuka dialog.\",\"E\":\"Menghentikan penghinaan lambang negara itu tepat, tetapi narasi yang keliru tentang demokrasi belum diluruskan.\"},\"konsep\":\"**Kontra-narasi:** lawan narasi radikal dengan penjelasan yang santun, berbasis fakta sejarah dan hukum, serta membuka dialog. Menghapus konten menghentikan penyebaran, tetapi belum mengubah cara berpikir.\"},\"tips\":\"Dalam soal narasi yang menolak dasar negara, opsi bernilai 5 biasanya **meluruskan dengan fakta secara santun** dan **mengajak dialog**. Opsi menghapus atau melapor bernilai 4 jika tanpa penjelasan.\",\"rujukan\":[]},{\"id\":\"p03-109\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Seorang mantan narapidana kasus terorisme yang telah menjalani hukuman dan mengikuti program deradikalisasi kembali tinggal di lingkungan Anda. Sebagian warga menolak kehadirannya. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Ikut mengajak warga menolak kehadirannya agar lingkungan tetap aman\"},{\"huruf\":\"B\",\"teks\":\"Menghindarinya dan melarang keluarga Anda berinteraksi dengannya\"},{\"huruf\":\"C\",\"teks\":\"Tidak ikut campur karena urusan itu sudah ditangani pemerintah\"},{\"huruf\":\"D\",\"teks\":\"Menyapa dan bersikap biasa kepadanya seperti kepada tetangga lainnya, tanpa ikut membicarakan masa lalunya dengan warga di lingkungan tempat tinggal Anda\"},{\"huruf\":\"E\",\"teks\":\"Bersikap terbuka, mengajak tokoh masyarakat memfasilitasi dialog dengan warga, dan berkoordinasi dengan pendamping programnya\"}],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":2,\"C\":3,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Mantan narapidana yang telah menjalani hukuman dan mengikuti program deradikalisasi membutuhkan **penerimaan masyarakat** agar tidak kembali ke kelompok lamanya. Penolakan justru dapat mendorongnya kembali ke jaringan yang dulu menerimanya. Sikap terbaik adalah bersikap terbuka, mengajak tokoh masyarakat memfasilitasi **dialog** agar kekhawatiran warga tersampaikan, dan **berkoordinasi** dengan pendamping programnya. Reintegrasi yang baik menjaga keamanan dan kemanusiaan sekaligus.\",\"opsi\":{\"A\":\"Paling buruk. Penolakan beramai-ramai mengucilkan dan dapat mendorongnya kembali ke kelompok radikal.\",\"B\":\"Ikut mengucilkan, walaupun tidak secara terbuka. Reintegrasi menjadi lebih sulit. Sikap ini juga dapat memperkuat penolakan dari warga lain.\",\"C\":\"Pasif. Penerimaan masyarakat adalah bagian penting dari keberhasilan deradikalisasi, bukan hanya tugas pemerintah. Kekhawatiran warga juga dibiarkan berkembang tanpa ada yang menjembatani.\",\"D\":\"Bersikap baik secara pribadi, tetapi kekhawatiran warga dan penolakan di lingkungan tidak diatasi.\",\"E\":\"Paling ideal. Menerima, menjembatani kekhawatiran warga melalui dialog, dan melibatkan pihak yang mendampingi.\"},\"konsep\":\"**Deradikalisasi** tidak selesai di lembaga pemasyarakatan. Penerimaan keluarga dan masyarakat, dukungan ekonomi, dan pendampingan adalah kunci agar mantan pelaku tidak kembali ke jaringan lamanya.\"},\"tips\":\"Untuk soal reintegrasi, opsi bernilai 5 biasanya **menerima secara terbuka** sambil **melibatkan tokoh masyarakat dan pendamping**. Opsi yang menolak atau mengucilkan bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p03-110\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Anda mendapati bahwa sebuah akun media sosial bernama samaran yang menyebarkan ajakan melakukan kekerasan terhadap kelompok agama tertentu kemungkinan besar milik rekan kerja Anda. Foto dan cerita di akun itu sangat cocok dengan kehidupannya. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyimpan bukti unggahan, melaporkannya kepada atasan dan kanal aduan resmi, serta tidak menyebarkan buktinya ke pihak lain\"},{\"huruf\":\"B\",\"teks\":\"Melaporkan akun itu melalui fitur pelaporan di platform media sosial dan kanal aduan konten milik pemerintah agar unggahannya segera diturunkan\"},{\"huruf\":\"C\",\"teks\":\"Membagikan tangkapan layar akun itu ke grup kantor agar semua orang tahu siapa pemiliknya\"},{\"huruf\":\"D\",\"teks\":\"Diam saja karena belum tentu akun tersebut milik rekan kerja Anda\"},{\"huruf\":\"E\",\"teks\":\"Menegur rekan Anda secara langsung dan memintanya segera menghapus semua unggahan yang berisi ajakan kekerasan itu\"}],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":4,\"C\":1,\"D\":2,\"E\":3},\"pembahasan\":{\"inti\":\"Ajakan melakukan kekerasan terhadap kelompok agama adalah **hasutan yang berbahaya** dan dapat berujung pada tindak pidana. Pegawai yang menemukan bukti seperti itu perlu bertindak **tepat dan proporsional**. Bukti disimpan agar tidak hilang, lalu dilaporkan kepada atasan dan kanal aduan resmi yang berwenang memeriksa. Bukti tidak disebarkan ke pihak lain, karena kepastian pemilik akun belum dibuktikan dan penyebaran dapat merusak proses pemeriksaan.\",\"opsi\":{\"A\":\"Paling ideal. Bukti aman, laporan sampai kepada pihak berwenang, dan asas praduga tak bersalah tetap dijaga.\",\"B\":\"Membantu menghentikan penyebaran konten, tetapi instansi tidak mengetahui dugaan keterlibatan pegawainya.\",\"C\":\"Paling buruk. Menyebarkan tuduhan sebelum terbukti dapat menjadi pencemaran nama baik dan memicu konflik di kantor.\",\"D\":\"Membiarkan hasutan kekerasan tetap beredar. Keraguan seharusnya diserahkan kepada pihak yang berwenang memeriksa.\",\"E\":\"Berani, tetapi berisiko. Rekan dapat menghapus jejaknya dan berpindah akun, dan konten berbahaya tidak tercatat untuk ditindaklanjuti.\"},\"konsep\":\"**Menangani dugaan hasutan kekerasan:** amankan bukti, laporkan melalui jalur resmi, jangan menyebarluaskan, dan hormati praduga tak bersalah. Pemeriksaan adalah tugas pihak berwenang.\"},\"tips\":\"Dalam soal dugaan pelanggaran oleh rekan, opsi bernilai 5 biasanya **mengamankan bukti dan melapor melalui jalur resmi**. Opsi yang menyebarkan tuduhan ke publik selalu bernilai rendah.\",\"rujukan\":[]}],\"judul\":\"Paket 03\",\"format\":{\"urutan\":[\"TWK\",\"TIU\",\"TKP\"],\"sumber\":null,\"durasiResmiMenit\":null,\"subtes\":{\"TWK\":{\"jumlahSoal\":30,\"nilaiBenar\":5,\"nilaiSalah\":0,\"nilaiMaks\":150,\"ambangBatas\":null},\"TIU\":{\"jumlahSoal\":35,\"nilaiBenar\":5,\"nilaiSalah\":0,\"nilaiMaks\":175,\"ambangBatas\":null},\"TKP\":{\"jumlahSoal\":45,\"nilaiBenar\":0,\"nilaiSalah\":0,\"nilaiMaks\":225,\"ambangBatas\":null}}}}}]}]\n"])</script></body></html>
