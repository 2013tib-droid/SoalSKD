2,\"E\":1},\"pembahasan\":{\"inti\":\"Aspek pelayanan publik menilai kesediaan membantu warga sampai kebutuhannya terpenuhi, terutama warga yang kesulitan memakai layanan digital. Bantuan yang baik juga harus menjaga hak warga atas akun dan datanya sendiri, sehingga warga tetap bisa memakai layanan itu tanpa bergantung pada petugas.\",\"opsi\":{\"A\":\"Masalah selesai hari itu juga, akun atas nama Pak Sapto sendiri, dan ia memegang kata sandinya. Inilah pendampingan yang memberdayakan, bukan sekadar mengerjakan untuknya.\",\"B\":\"Tidak salah, tetapi pasif. Warga yang sudah kesulitan memakai ponsel kecil kemungkinan berhasil hanya dengan brosur, dan ia harus datang dua kali.\",\"C\":\"Niatnya baik karena melibatkan keluarga yang bisa membantu ke depannya, tetapi layanan tertunda padahal sebenarnya bisa diselesaikan hari itu dengan pendampingan Anda.\",\"D\":\"Melempar warga ke pihak luar yang belum tentu resmi, berisiko biaya tambahan dan praktik percaloan, padahal layanan ini tugas gerai Anda.\",\"E\":\"Tampak membantu, tetapi akun dan notifikasi usaha warga dikuasai petugas. Ini melanggar prinsip kepemilikan data dan membuat warga bergantung pada Anda.\"},\"konsep\":\"**Pola bobot:** 5 = tuntas hari itu + warga tetap memegang kendali akunnya; 4 = baik tetapi menunda; 3 = memberi informasi tanpa pendampingan; 2 = melempar ke pihak lain; 1 = mengambil alih akun atau data warga.\"},\"tips\":\"Pada soal layanan digital untuk warga yang kesulitan, cari opsi yang **mendampingi sampai selesai** dan **tetap menjaga akun atas nama warga**. Opsi yang paling cepat tetapi memakai data petugas biasanya justru bernilai terendah.\",\"rujukan\":[]},{\"id\":\"p06-067\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Bu Wati datang ke loket Disdukcapil untuk mengurus akta kelahiran anaknya dengan berkas sesuai daftar di situs web dinas. Papan informasi di loket ternyata mencantumkan satu syarat tambahan yang tidak ia bawa. Anda tahu syarat tambahan itu sudah dihapus sejak aturan diperbarui, tetapi papannya belum diganti. Langkah yang paling tepat Anda ambil adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melayani Bu Wati sesuai aturan terbaru, lalu menjelaskan kepada setiap warga yang bertanya bahwa syarat di papan itu sudah tidak berlaku lagi\"},{\"huruf\":\"B\",\"teks\":\"Menerima berkas Bu Wati, tetapi menyarankannya tetap membawa syarat tambahan itu pada kunjungan berikutnya untuk berjaga-jaga\"},{\"huruf\":\"C\",\"teks\":\"Melayani Bu Wati sesuai aturan terbaru, lalu menunggu pembaruan papan informasi yang biasanya dilakukan bagian umum pada akhir tahun\"},{\"huruf\":\"D\",\"teks\":\"Menolak berkas karena papan di loket adalah informasi resmi kantor yang berlaku sampai diganti, sehingga semua warga harus mengikutinya\"},{\"huruf\":\"E\",\"teks\":\"Melayani sesuai aturan terbaru, lalu melaporkan perbedaan informasi itu kepada atasan agar papan dan situs segera diseragamkan\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":4,\"B\":2,\"C\":3,\"D\":1,\"E\":5},\"pembahasan\":{\"inti\":\"Pelayanan publik menuntut kepastian: syarat layanan harus jelas, sama di semua kanal informasi, dan dipakai sesuai aturan yang berlaku. Petugas yang menemukan informasi tidak konsisten tidak cukup hanya melayani warga di depannya; ia juga perlu memperbaiki sumber kebingungan supaya warga lain tidak dirugikan.\",\"opsi\":{\"A\":\"Bu Wati terlayani dengan benar dan warga lain mendapat penjelasan, tetapi papan yang salah tetap terpasang. Kebingungan akan terus berulang setiap kali Anda tidak berada di loket.\",\"B\":\"Menyarankan syarat yang Anda tahu sudah tidak berlaku sama dengan memberi informasi keliru dan menambah beban warga, hanya untuk menghindari perbedaan pendapat.\",\"C\":\"Layanan benar, tetapi sikapnya pasif terhadap informasi yang jelas salah. Menunggu akhir tahun membiarkan warga lain bingung selama berbulan-bulan.\",\"D\":\"Kaku dan merugikan warga: berkas yang sudah memenuhi aturan terbaru ditolak karena papan yang usang. Aturan yang berlaku adalah aturan terbaru, bukan papan yang belum diganti.\",\"E\":\"Warga terlayani sesuai aturan, dan masalah informasi dilaporkan kepada pihak yang berwenang agar semua kanal diseragamkan. Masalah hari ini dan sumbernya sama-sama ditangani.\"},\"konsep\":\"**Standar pelayanan** wajib memuat persyaratan yang jelas dan dapat diakses publik. Ketidaksesuaian antarkanal informasi adalah masalah layanan yang perlu dilaporkan, bukan sekadar diakali di loket.\"},\"tips\":\"Bedakan opsi yang hanya menolong satu warga dengan opsi yang juga **memperbaiki sistem**. Jika keduanya sesuai aturan, opsi yang menangani sumber masalah biasanya bernilai 5.\",\"rujukan\":[]},{\"id\":\"p06-068\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Anda staf pengelola pengaduan di Dinas Perhubungan. Melalui kanal SP4N-LAPOR!, masuk aduan anonim bahwa petugas uji kendaraan bermotor di dinas Anda meminta “uang rokok” agar kendaraan dinyatakan lulus. Pelapor hanya menyebut hari dan jam kejadian, tanpa nama petugas. Kepala unit pengujian adalah senior yang cukup dekat dengan Anda. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Membalas aduan dengan meminta pelapor menyebutkan nama petugas lebih dahulu, karena aduan tanpa nama terlapor sulit untuk diproses lebih lanjut\"},{\"huruf\":\"B\",\"teks\":\"Menghubungi kepala unit pengujian secara pribadi agar ia menegur anak buahnya, sehingga aduan dapat ditutup tanpa menjadi persoalan besar\"},{\"huruf\":\"C\",\"teks\":\"Meneruskan aduan ke unit pengujian untuk ditanggapi sendiri, karena unit itulah yang paling memahami kegiatan pengujian di lapangan\"},{\"huruf\":\"D\",\"teks\":\"Mencatat aduan sesuai prosedur, mencocokkan jadwal petugas pada jam itu, lalu melaporkan hasilnya kepada atasan dan inspektorat tanpa membuka identitas pelapor\"},{\"huruf\":\"E\",\"teks\":\"Melaporkan aduan itu selengkapnya kepada atasan Anda dan inspektorat sebagai pihak yang berwenang memeriksa, lalu menyerahkan seluruh pemeriksaan dan tindak lanjutnya kepada mereka\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":2,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Pengelolaan pengaduan menilai apakah petugas menindaklanjuti aduan secara objektif, melindungi pelapor, dan membawa dugaan pelanggaran ke pihak yang berwenang memeriksa. Kedekatan pribadi dengan pihak terkait tidak boleh memengaruhi proses. Aduan anonim tetap bisa ditindaklanjuti jika memuat informasi yang dapat diverifikasi, seperti waktu dan tempat kejadian.\",\"opsi\":{\"A\":\"Meminta keterangan tambahan memang lazim, tetapi informasi hari dan jam sudah cukup untuk mulai memeriksa. Menjadikan nama petugas sebagai syarat bisa membuat pelapor takut dan aduan berhenti.\",\"B\":\"Menyelesaikan aduan pungli secara kekeluargaan menutupi dugaan pelanggaran, melemahkan pengawasan, dan dipengaruhi kedekatan pribadi. Ini konflik kepentingan.\",\"C\":\"Menyerahkan pemeriksaan kepada unit yang diadukan sama dengan meminta pihak terlapor memeriksa dirinya sendiri. Objektivitasnya hilang.\",\"D\":\"Aduan dicatat, informasi awal diverifikasi dengan data yang tersedia, hasilnya dibawa ke atasan dan inspektorat, dan identitas pelapor dijaga. Lengkap dan sesuai aturan.\",\"E\":\"Pihak yang dilibatkan sudah tepat, tetapi Anda tidak melakukan verifikasi awal yang menjadi tugas pengelola pengaduan, sehingga tindak lanjutnya lebih lambat.\"},\"konsep\":\"**Unsur pengelolaan aduan yang baik:** dicatat, diverifikasi, diteruskan ke pihak yang berwenang dan independen dari terlapor, serta kerahasiaan pelapor terjaga. Opsi yang “menyelesaikan secara internal” lewat jalur pribadi hampir selalu bernilai terendah.\"},\"tips\":\"Pada soal aduan terhadap rekan sendiri, coret dulu opsi yang menyerahkan pemeriksaan kepada pihak yang diadukan atau menyelesaikannya lewat kedekatan pribadi. Lalu pilih opsi yang memuat verifikasi, pelaporan ke pengawas, dan perlindungan pelapor.\",\"rujukan\":[]},{\"id\":\"p06-069\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Anda petugas pendaftaran di puskesmas. Seorang pria berbicara sendiri dengan suara keras dan mondar-mandir di ruang tunggu. Ia belum mendaftar dan tidak tampak membawa benda berbahaya. Beberapa pasien terlihat takut, dan seorang ibu meminta Anda “mengusir orang itu”. Yang sebaiknya Anda lakukan adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta satpam mengawasi pria itu dari dekat, sementara Anda melanjutkan pendaftaran pasien lain seperti biasa agar antrean tidak terganggu\"},{\"huruf\":\"B\",\"teks\":\"Menghampirinya dengan tenang, menanyakan keperluannya, lalu mengajak dokter atau petugas kesehatan jiwa menanganinya sambil menenangkan pasien lain\"},{\"huruf\":\"C\",\"teks\":\"Menyarankan ibu itu dan pasien lain menunggu sementara di luar ruangan sampai pria tersebut pergi dari ruang tunggu dengan sendirinya\"},{\"huruf\":\"D\",\"teks\":\"Mencari tahu identitasnya dan menghubungi keluarga atau ketua RT-nya, agar ada pendamping yang menjemput dan mengantarnya berobat ke layanan kesehatan jiwa terdekat\"},{\"huruf\":\"E\",\"teks\":\"Meminta satpam membawa pria itu keluar dari area puskesmas sesuai permintaan pasien, demi kenyamanan pasien lain yang sudah antre lama\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":2,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Fasilitas kesehatan wajib melayani semua orang, termasuk orang yang mungkin mengalami gangguan jiwa. Perilaku yang tidak biasa bukan alasan untuk menolak layanan, apalagi jika tidak ada tanda bahaya. Petugas yang baik menenangkan suasana, mendekati orang itu dengan hormat, dan melibatkan tenaga kesehatan yang kompeten, sambil tetap memperhatikan rasa aman pasien lain.\",\"opsi\":{\"A\":\"Menjaga keamanan, tetapi pria itu hanya diawasi, tidak dilayani. Kebutuhannya, yang mungkin berupa pertolongan kesehatan jiwa, tidak tersentuh.\",\"B\":\"Pria itu didekati sebagai calon pasien, ditangani tenaga yang tepat, dan pasien lain ditenangkan. Hak pria itu atas layanan dan rasa aman pasien lain sama-sama terjaga.\",\"C\":\"Menghindari masalah dengan memindahkan pasien, padahal puskesmas punya tenaga yang bisa membantu. Pria itu tetap tidak terlayani.\",\"D\":\"Melibatkan keluarga atau lingkungan sangat berguna untuk pendampingan jangka panjang, tetapi butuh waktu dan pria itu belum mendapat penanganan saat itu juga.\",\"E\":\"Mengusir orang dari fasilitas kesehatan karena perilakunya dianggap aneh adalah diskriminasi dan menolak layanan kepada orang yang mungkin justru paling membutuhkannya.\"},\"konsep\":\"**Pelayanan nondiskriminatif:** setiap warga berhak dilayani tanpa dibedakan karena kondisi kesehatan, termasuk kesehatan jiwa. Keamanan tetap diperhatikan, tetapi tindakannya proporsional dengan risiko yang nyata.\"},\"tips\":\"Hati-hati dengan opsi yang memenuhi permintaan warga lain secara harfiah (“mengusir”). Pada TKP, permintaan mayoritas yang merugikan hak seseorang bukan acuan. Pilih opsi yang melayani orang yang paling rentan dengan melibatkan tenaga yang tepat.\",\"rujukan\":[]},{\"id\":\"p06-070\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Di kantor Samsat, Anda mendahulukan seorang ibu hamil tua dan seorang lansia berkursi roda sesuai ketentuan layanan prioritas. Seorang pria di antrean memprotes dengan suara keras karena sudah menunggu dua jam. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta maaf atas lamanya antrean, lalu menjelaskan secara singkat bahwa ibu hamil dan lansia memang berhak didahulukan menurut ketentuan layanan prioritas\"},{\"huruf\":\"B\",\"teks\":\"Menunda layanan prioritas sebentar dan memanggil pria itu lebih dahulu supaya keributan di ruang tunggu tidak meluas ke pemohon lain\"},{\"huruf\":\"C\",\"teks\":\"Menjelaskan dengan sopan hak layanan prioritas, memberi tahu perkiraan gilirannya, dan menawarkan kanal yang lebih cepat bila tersedia untuk keperluannya\"},{\"huruf\":\"D\",\"teks\":\"Tetap melayani kelompok prioritas tanpa menanggapi protesnya, karena aturan layanan prioritas sudah jelas tertempel di dinding ruang tunggu\"},{\"huruf\":\"E\",\"teks\":\"Meminta satpam menenangkan pria itu agar Anda tetap dapat fokus melayani pemohon prioritas dan antrean berikutnya\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":4,\"B\":1,\"C\":5,\"D\":3,\"E\":2},\"pembahasan\":{\"inti\":\"UU 25/2009 tentang Pelayanan Publik mewajibkan penyelenggara memberi perlakuan khusus kepada kelompok rentan seperti ibu hamil, lansia, dan penyandang disabilitas. Petugas harus mempertahankan hak itu, tetapi juga menanggapi keluhan warga lain dengan sopan: menjelaskan alasannya, memberi kepastian waktu, dan bila mungkin menawarkan jalan keluar.\",\"opsi\":{\"A\":\"Sikap baik dan penjelasannya benar, tetapi pria itu belum mendapat kepastian kapan ia dilayani atau alternatif yang bisa mempercepat urusannya.\",\"B\":\"Mengorbankan hak kelompok rentan demi meredam keributan melanggar ketentuan layanan prioritas dan mengajarkan bahwa protes keras bisa menggeser antrean.\",\"C\":\"Hak prioritas dipertahankan, keluhan ditanggapi dengan hormat, dan pria itu mendapat kepastian serta alternatif. Ketiga unsur layanan yang baik terpenuhi.\",\"D\":\"Sesuai aturan, tetapi kaku. Mengabaikan protes membuat warga merasa tidak dihargai dan suasana bisa makin panas.\",\"E\":\"Menyerahkan komunikasi dengan warga kepada satpam berarti menghindari tugas menjelaskan, padahal petugas loket yang paling tahu alasan dan perkiraan antrean.\"},\"konsep\":\"**Pola keluhan antrean:** pertahankan aturan yang melindungi kelompok rentan + jelaskan dengan sopan + beri kepastian atau alternatif. Mengalah pada tekanan dan mengabaikan keluhan sama-sama keliru.\"},\"tips\":\"Pada soal antrean, opsi yang mengubah urutan demi meredam protes hampir selalu bernilai 1. Di antara opsi yang mempertahankan aturan, pilih yang paling lengkap menanggapi warga yang mengeluh.\",\"rujukan\":[]},{\"id\":\"p06-071\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Pak Joko terlambat dua bulan membayar pajak kendaraan karena dirawat di rumah sakit. Ia meminta Anda, petugas loket Samsat, menghapus dendanya. Daerah Anda memiliki program keringanan denda yang dapat diajukan dengan melampirkan surat keterangan rawat inap, tetapi Pak Joko tidak membawa surat itu. Dalam situasi ini, Anda akan ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menjelaskan bahwa denda dihitung otomatis oleh sistem sehingga Anda tidak dapat mengubahnya, lalu memproses pembayaran sesuai tagihan yang muncul\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan program keringanan beserta syaratnya, lalu membantunya mendapatkan surat dari rumah sakit atau mengatur waktu pengajuan setelah surat lengkap\"},{\"huruf\":\"C\",\"teks\":\"Menjelaskan program keringanan dan syaratnya, lalu memintanya kembali ke loket setelah surat keterangan rawat inap dari rumah sakit tersedia agar pengajuannya bisa diproses\"},{\"huruf\":\"D\",\"teks\":\"Menghapus denda secara manual di sistem karena alasannya jelas manusiawi dan nominal dendanya relatif kecil dibanding pokok pajaknya\"},{\"huruf\":\"E\",\"teks\":\"Menyarankannya mengajukan keberatan langsung kepada kepala kantor, karena keputusan keringanan denda bukan wewenang petugas loket\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":4,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Pelayanan yang baik memberi tahu warga semua hak yang tersedia, termasuk program keringanan, lalu membantu warga memenuhi syaratnya. Pada saat yang sama, petugas tidak boleh mengambil jalan pintas di luar prosedur, walaupun alasannya manusiawi. Empati diwujudkan dengan membantu menempuh jalur resmi, bukan dengan menabrak aturan.\",\"opsi\":{\"A\":\"Benar bahwa petugas tidak boleh mengubah denda, tetapi Pak Joko tidak diberi tahu adanya program keringanan yang sebenarnya bisa ia manfaatkan. Sesuai aturan, tetapi pelayanannya tidak lengkap.\",\"B\":\"Informasi lengkap, jalur resmi ditempuh, dan Anda aktif membantu warga memenuhi syaratnya. Empati dan kepatuhan pada aturan berjalan bersama.\",\"C\":\"Informasinya lengkap dan sesuai aturan, tetapi semua beban mengurus syarat diserahkan kepada warga tanpa bantuan tambahan.\",\"D\":\"Mengubah data tagihan di luar kewenangan dan prosedur adalah pelanggaran, berapa pun nominalnya dan sebaik apa pun niatnya.\",\"E\":\"Melempar warga ke pimpinan tanpa menjelaskan program yang sudah ada. Warga harus menempuh jalur yang lebih panjang tanpa perlu.\"},\"konsep\":\"**Empati yang profesional:** beri tahu hak warga (program keringanan), bantu memenuhi syaratnya, dan tetap di dalam prosedur. Opsi yang “menolong” dengan mengubah data di luar kewenangan selalu bernilai terendah.\"},\"tips\":\"Jika soal menyebut ada program atau jalur resmi yang relevan, opsi yang tidak menyebutnya kepada warga tidak mungkin bernilai 5. Bandingkan opsi yang menyebutnya: yang ikut membantu memenuhi syarat lebih tinggi daripada yang hanya menyuruh kembali.\",\"rujukan\":[]},{\"id\":\"p06-072\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Anda dokter di puskesmas. Seorang pemuda yang juga tetangga Anda meminta surat keterangan sehat untuk melamar kerja hari itu juga. Ia meminta tidak usah diperiksa karena menurutnya surat itu “cuma formalitas”, sedangkan antrean pemeriksaan hari itu panjang. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menjelaskan bahwa surat harus didasarkan pada hasil pemeriksaan, lalu memintanya mengantre pemeriksaan seperti pasien lain walaupun ia sedang mengejar tenggat lamaran\"},{\"huruf\":\"B\",\"teks\":\"Menyarankannya mencari klinik swasta yang antreannya lebih pendek agar ia tidak perlu menunggu lama di puskesmas\"},{\"huruf\":\"C\",\"teks\":\"Menerbitkan surat tanpa pemeriksaan karena Anda mengenalnya sebagai tetangga yang tampak sehat dan rutin berolahraga\"},{\"huruf\":\"D\",\"teks\":\"Memintanya datang kembali esok pagi ketika antrean pemeriksaan biasanya lebih sepi sehingga ia bisa dilayani lebih cepat\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan bahwa surat hanya terbit setelah pemeriksaan, memasukkannya ke antrean hari itu, dan memberi perkiraan waktu selesai\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":4,\"B\":2,\"C\":1,\"D\":3,\"E\":5},\"pembahasan\":{\"inti\":\"Surat keterangan sehat adalah dokumen resmi yang menyatakan hasil pemeriksaan. Menerbitkannya tanpa memeriksa berarti membuat keterangan yang tidak berdasar. Pelayanan yang baik tetap memegang prosedur itu, tetapi juga peduli pada kebutuhan warga: memastikan ia bisa diperiksa hari itu dan tahu perkiraan waktunya agar dapat mengatur rencananya.\",\"opsi\":{\"A\":\"Prosedur dipegang dan alasannya dijelaskan, tetapi kebutuhan waktu pemuda itu tidak ditanggapi. Ia tidak tahu apakah bisa selesai tepat waktu.\",\"B\":\"Mengalihkan warga ke tempat lain padahal puskesmas bisa melayaninya. Ini menghindari tugas, bukan menyelesaikan kebutuhannya.\",\"C\":\"Surat tanpa pemeriksaan adalah keterangan yang tidak berdasar, ditambah unsur kedekatan pribadi. Ini pelanggaran etika profesi dan integritas.\",\"D\":\"Tidak melanggar aturan, tetapi pasif dan berisiko membuatnya kehilangan kesempatan melamar hari itu, padahal masih bisa dilayani dalam antrean.\",\"E\":\"Prosedur ditegakkan, warga langsung masuk antrean hari itu, dan ia mendapat kepastian waktu. Integritas dan kepedulian berjalan bersama.\"},\"konsep\":\"**Dokumen resmi = hasil proses resmi.** Pada TKP, kedekatan pribadi (tetangga, kerabat, teman) adalah ujian integritas. Bobot 5 diberikan kepada opsi yang menolak jalan pintas tetapi tetap membantu warga sejauh aturan mengizinkan.\"},\"tips\":\"Jika ada kata “formalitas”, “kenal”, atau “tetangga”, cari dulu opsi yang menabrak prosedur (bobot 1). Lalu urutkan sisanya: melayani hari itu dengan kepastian waktu lebih tinggi daripada sekadar menyuruh antre atau datang besok.\",\"rujukan\":[]},{\"id\":\"p06-073\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Motor Pak Rudi hilang di parkiran kantor kecamatan ketika ia sedang mengurus surat. Ia meminta Anda, staf bagian umum yang mengelola kamera pengawas, menyalin rekaman CCTV ke flashdisk-nya agar ia bisa mencari pelakunya sendiri. Respons terbaik Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengamankan rekaman pada jam kejadian, membantu Pak Rudi melapor ke polisi, lalu menyerahkan rekaman kepada polisi lewat prosedur resmi atas izin pimpinan\"},{\"huruf\":\"B\",\"teks\":\"Memutar rekaman bersama Pak Rudi di ruang kantor untuk melihat kejadiannya tanpa menyalin file, lalu menyarankannya segera melapor ke polisi\"},{\"huruf\":\"C\",\"teks\":\"Menyarankan Pak Rudi langsung melapor ke polisi, karena keamanan kendaraan di parkiran bukan tanggung jawab bagian umum kecamatan\"},{\"huruf\":\"D\",\"teks\":\"Menyalin rekaman ke flashdisk Pak Rudi karena ia korban kejadian di kantor dan berhak mengetahui siapa pelaku pencurian motornya\"},{\"huruf\":\"E\",\"teks\":\"Melaporkan kejadian kepada pimpinan dan meminta petugas keamanan memeriksa rekaman pada jam itu, lalu mengabari Pak Rudi hasil pemeriksaannya melalui nomor telepon yang ia tinggalkan\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":2,\"D\":1,\"E\":4},\"pembahasan\":{\"inti\":\"Rekaman CCTV kantor adalah data instansi yang juga merekam banyak orang lain. Pengelolaannya harus mengikuti prosedur, dan bukti kejahatan diserahkan kepada aparat penegak hukum, bukan kepada korban untuk diusut sendiri. Di sisi lain, kantor ikut bertanggung jawab melayani warga yang dirugikan di lingkungannya, sehingga petugas perlu aktif mengamankan bukti dan membantu pelaporan.\",\"opsi\":{\"A\":\"Bukti diamankan sebelum tertimpa rekaman baru, warga dibantu melapor, dan rekaman diserahkan kepada pihak berwenang dengan izin pimpinan. Lengkap dan sesuai prosedur.\",\"B\":\"Membantu warga melihat kejadian, tetapi membuka rekaman berisi orang lain tanpa prosedur, dan bukti belum diamankan untuk penyidikan.\",\"C\":\"Lepas tangan. Kejadiannya di lingkungan kantor, dan kantor memegang bukti penting yang hanya bisa diamankan oleh pengelola CCTV.\",\"D\":\"Menyerahkan data rekaman kepada pihak pribadi melanggar prosedur pengelolaan data dan bisa memicu main hakim sendiri atau penyebaran wajah orang yang tidak bersalah.\",\"E\":\"Melibatkan pimpinan dan memeriksa rekaman sudah tepat, tetapi belum mengarahkan warga melapor ke polisi, padahal pencurian adalah tindak pidana yang perlu ditangani aparat.\"},\"konsep\":\"**Pola data instansi dan kejahatan:** amankan bukti → bantu warga melapor → serahkan bukti kepada penegak hukum lewat prosedur resmi. Menyerahkan data mentah kepada warga dan bersikap lepas tangan sama-sama keliru.\"},\"tips\":\"Pada soal yang melibatkan bukti kejahatan, opsi bernilai 5 hampir selalu menyebut **aparat penegak hukum** dan **prosedur resmi**. Opsi yang menyerahkan bukti kepada korban untuk “diusut sendiri” biasanya bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-074\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda ditunjuk sebagai narahubung kecamatan untuk simulasi evakuasi tsunami bersama BPBD kabupaten. Dua hari sebelum pelaksanaan, BPBD memajukan jadwal satu hari karena tim dari pusat hanya bisa hadir pada hari itu. Undangan untuk sekolah dan warga sudah tersebar dengan tanggal semula. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta BPBD tetap memakai jadwal semula karena undangan sudah tersebar luas, dan perubahan mendadak dua hari sebelumnya akan membingungkan sekolah serta warga\"},{\"huruf\":\"B\",\"teks\":\"Menyerahkan urusan pemberitahuan perubahan jadwal kepada BPBD, karena merekalah pihak yang memutuskan untuk mengubah jadwal\"},{\"huruf\":\"C\",\"teks\":\"Memastikan jadwal baru kepada BPBD, lalu bersama mereka menyebarkan pemberitahuan lewat sekolah, RT, dan grup warga serta mengonfirmasi kehadiran\"},{\"huruf\":\"D\",\"teks\":\"Segera mengabarkan jadwal baru kepada sekolah dan para ketua RT melalui pesan berantai, lalu melaporkan perubahan itu kepada camat sesudahnya\"},{\"huruf\":\"E\",\"teks\":\"Tetap menjalankan simulasi versi kecamatan pada tanggal semula tanpa BPBD, agar warga dan sekolah yang sudah diundang tidak merasa kecewa\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":2,\"C\":5,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Aspek jejaring kerja menilai kemampuan berkoordinasi dengan mitra saat rencana berubah. Narahubung bertugas menjembatani: memastikan informasi dari mitra akurat, lalu meneruskannya ke semua pihak dengan cara yang efektif. Perubahan dari mitra tidak ditolak secara kaku, tetapi juga tidak dibiarkan menjadi urusan mitra saja.\",\"opsi\":{\"A\":\"Alasannya masuk akal, tetapi kaku. Menolak perubahan berisiko simulasi kehilangan tim pusat yang justru penting bagi kualitas latihan.\",\"B\":\"Lepas tangan dari peran narahubung. BPBD tidak punya jalur komunikasi ke sekolah dan RT sebaik kecamatan.\",\"C\":\"Informasi dipastikan dulu, penyebaran dilakukan bersama mitra lewat banyak kanal, dan kehadiran dikonfirmasi. Koordinasi berjalan dua arah dan tuntas.\",\"D\":\"Cepat dan berinisiatif, tetapi tanpa memastikan ulang kepada BPBD dan tanpa konfirmasi kehadiran. Jika jadwal berubah lagi, informasi bisa simpang siur.\",\"E\":\"Menjalankan simulasi sendiri tanpa tim ahli membahayakan kualitas latihan evakuasi dan merusak kerja sama dengan mitra.\"},\"konsep\":\"**Peran narahubung:** memastikan informasi dari mitra, meneruskan ke semua pihak lewat kanal yang tepat, dan memantau tindak lanjutnya. Bobot 5 biasanya memuat ketiga langkah itu.\"},\"tips\":\"Pada soal perubahan rencana dari mitra, cari opsi yang **menerima perubahan sambil mengelola dampaknya bersama mitra**. Opsi yang menolak, melempar, atau berjalan sendiri bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p06-075\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Rina, teman seangkatan pelatihan dasar yang kini bertugas di dinas lain, meminta Anda memasukkan kegiatan pelatihan dinasnya ke rencana anggaran unit Anda karena anggaran dinasnya sudah habis. Kegiatannya bermanfaat bagi masyarakat, tetapi bukan bagian dari tugas dan fungsi unit Anda. Anda memutuskan untuk ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak permintaan itu dan tidak lagi menanggapi permintaan serupa dari Rina, supaya hubungan kerja antarinstansi tetap profesional\"},{\"huruf\":\"B\",\"teks\":\"Memasukkannya sebagai kegiatan unit Anda dengan nama yang disesuaikan agar lolos verifikasi, karena manfaatnya juga dirasakan masyarakat\"},{\"huruf\":\"C\",\"teks\":\"Menolak dengan sopan karena kegiatan tersebut bukan tugas dan fungsi unit Anda sehingga tidak dapat dianggarkan\"},{\"huruf\":\"D\",\"teks\":\"Menolak memasukkannya, lalu mengajak Rina menjajaki kegiatan bersama yang tiap instansi danai sesuai tugasnya masing-masing\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan batas tugas unit Anda dan menyarankan Rina mengusulkan kegiatan itu melalui perencanaan anggaran dinasnya pada tahun depan\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":1,\"C\":3,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Jejaring kerja yang sehat dibangun di atas aturan: setiap instansi hanya menganggarkan kegiatan sesuai tugas dan fungsinya. Menolak permintaan yang menyalahi aturan tidak berarti memutus hubungan. Pegawai dengan jejaring kerja yang baik justru mencari bentuk kerja sama yang sah, sehingga tujuan bersama tetap bisa dicapai tanpa melanggar aturan anggaran.\",\"opsi\":{\"A\":\"Tegas soal aturan, tetapi memutus komunikasi merugikan jejaring yang mungkin berguna untuk kerja sama sah di masa depan.\",\"B\":\"Menyamarkan nama kegiatan agar lolos verifikasi adalah manipulasi perencanaan anggaran. Manfaat kegiatan tidak membenarkan cara yang melanggar aturan.\",\"C\":\"Sesuai aturan dan sopan, tetapi berhenti pada penolakan tanpa membantu mencari jalan keluar.\",\"D\":\"Aturan dipegang, hubungan dijaga, dan tujuan bersama dicari lewat kolaborasi yang sah, yaitu tiap pihak mendanai bagian yang sesuai tugasnya.\",\"E\":\"Sesuai aturan dan memberi arah yang benar, tetapi solusi baru berlaku tahun depan dan tidak membuka peluang kolaborasi.\"},\"konsep\":\"**Pola permintaan dari jejaring yang menyalahi aturan:** tolak bagian yang melanggar → jaga hubungan → tawarkan jalur kolaborasi yang sah. Hubungan pribadi tidak boleh mengalahkan aturan, tetapi aturan juga tidak harus mematikan kerja sama.\"},\"tips\":\"Jika beberapa opsi sama-sama menolak, bedakan dari apa yang dilakukan **sesudah** menolak. Menawarkan kerja sama yang sah lebih tinggi daripada sekadar memberi saran, dan memberi saran lebih tinggi daripada menolak saja.\",\"rujukan\":[]},{\"id\":\"p06-076\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Sebuah komunitas relawan literasi menawarkan diri membuka pojok baca anak di kantor kelurahan tempat Anda bertugas. Mereka meminta satu ruang kecil yang selama ini dipakai untuk menyimpan arsip lama. Tanggapan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyampaikan bahwa ruang itu masih dipakai untuk menyimpan arsip lama, sehingga kerja sama belum dapat dilakukan untuk saat ini\"},{\"huruf\":\"B\",\"teks\":\"Mempersilakan mereka mencari tempat lain seperti balai warga, karena kantor kelurahan bukan tempat untuk kegiatan komunitas\"},{\"huruf\":\"C\",\"teks\":\"Menyambut baik tawaran itu dan langsung mengusulkannya kepada lurah agar kerja sama dapat disetujui secepatnya\"},{\"huruf\":\"D\",\"teks\":\"Menyetujui secara lisan dan menyerahkan kunci ruang kepada ketua komunitas agar kegiatan cepat berjalan, lalu melapor kepada lurah belakangan\"},{\"huruf\":\"E\",\"teks\":\"Menyambut tawaran itu, membahasnya dengan lurah, lalu menata arsip sesuai aturan dan menyusun kesepakatan pemakaian ruang bersama komunitas\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":3,\"B\":2,\"C\":4,\"D\":1,\"E\":5},\"pembahasan\":{\"inti\":\"Kemitraan dengan komunitas memperluas manfaat layanan pemerintah tanpa banyak biaya. Pegawai yang baik menyambut peluang itu, tetapi tetap menempuh jalur yang benar: keputusan pemakaian aset kantor ada pada pimpinan, arsip harus ditangani sesuai aturan kearsipan, dan kerja sama perlu dituangkan dalam kesepakatan agar jelas hak dan kewajiban kedua pihak.\",\"opsi\":{\"A\":\"Aman, tetapi melewatkan peluang kemitraan yang bermanfaat hanya karena kendala yang bisa diatasi.\",\"B\":\"Menolak dengan alasan yang keliru. Kantor kelurahan justru wajar menjadi simpul kegiatan warga.\",\"C\":\"Sikapnya terbuka dan melibatkan pimpinan, tetapi penataan arsip dan kesepakatan kerja sama belum dipikirkan.\",\"D\":\"Menyerahkan aset kantor tanpa izin pimpinan dan tanpa penataan arsip melanggar prosedur, dan arsip lama berisiko rusak atau hilang.\",\"E\":\"Peluang disambut, pimpinan dilibatkan, arsip ditangani sesuai aturan, dan kerja sama dibuat jelas. Semua unsur kemitraan yang sehat terpenuhi.\"},\"konsep\":\"**Kemitraan yang sehat:** terbuka pada tawaran, keputusan lewat pimpinan, aset dan arsip ditangani sesuai aturan, serta kesepakatan tertulis tentang pemakaian. Antusias tanpa prosedur tetap bernilai rendah.\"},\"tips\":\"Bedakan opsi yang **sama-sama menyambut**: yang menyerahkan aset tanpa izin bernilai paling rendah, sedangkan yang melibatkan pimpinan dan menyelesaikan kendala teknis (arsip, kesepakatan) bernilai paling tinggi.\",\"rujukan\":[]},{\"id\":\"p06-077\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Bidang lain meminjam drone pemetaan milik bidang Anda untuk survei lahan. Drone itu dikembalikan dengan baling-baling patah dan kamera yang bergoyang. Bidang Anda membutuhkan drone tersebut minggu depan untuk memetakan daerah rawan banjir. Kepala bidang peminjam adalah pejabat yang sangat dihormati di kantor. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mendokumentasikan kerusakan, membicarakannya baik-baik dengan bidang peminjam untuk perbaikan sesuai aturan barang milik negara, dan menyiapkan alat cadangan\"},{\"huruf\":\"B\",\"teks\":\"Melaporkan kerusakan kepada atasan Anda, lalu menunggu keputusan atasan tentang pihak yang harus menanggung biaya perbaikannya\"},{\"huruf\":\"C\",\"teks\":\"Memperbaiki drone itu dengan anggaran pemeliharaan bidang Anda sendiri, supaya tidak timbul gesekan dengan pejabat yang dihormati\"},{\"huruf\":\"D\",\"teks\":\"Menemui bidang peminjam, menunjukkan kerusakan drone secara langsung, dan meminta mereka memperbaikinya sebelum jadwal pemetaan daerah rawan banjir minggu depan dimulai\"},{\"huruf\":\"E\",\"teks\":\"Mengunggah foto drone yang rusak ke grup percakapan kantor agar semua pegawai tahu bidang mana yang ceroboh memakai barang pinjaman\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":2,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Kerja sama antarbidang membutuhkan rasa saling percaya, termasuk tanggung jawab atas barang yang dipinjam. Ketika terjadi kerusakan, masalahnya diselesaikan secara terbuka dan sesuai aturan pengelolaan barang milik negara, tanpa mempermalukan pihak lain dan tanpa membiarkan tugas penting terhambat. Jabatan pihak peminjam tidak mengubah cara penyelesaiannya.\",\"opsi\":{\"A\":\"Bukti dicatat, masalah dibicarakan langsung dengan sopan, penyelesaian mengikuti aturan, dan tugas pemetaan banjir diamankan dengan alat cadangan.\",\"B\":\"Melibatkan atasan itu wajar, tetapi sikapnya pasif. Tidak ada komunikasi dengan bidang peminjam dan tidak ada antisipasi untuk tugas minggu depan.\",\"C\":\"Menghindari pembicaraan yang canggung dengan menanggung sendiri biayanya. Tanggung jawab peminjam terabaikan dan anggaran bidang Anda terpakai untuk kerusakan pihak lain.\",\"D\":\"Langsung dan terbuka, tetapi belum memakai jalur aturan barang milik negara dan belum ada rencana cadangan jika perbaikan tidak selesai tepat waktu.\",\"E\":\"Mempermalukan bidang lain di forum terbuka merusak hubungan kerja dan tidak menyelesaikan kerusakan.\"},\"konsep\":\"**Konflik barang pinjaman:** dokumentasikan → bicarakan langsung dengan sopan → selesaikan sesuai aturan → amankan tugas yang terdampak. Rasa sungkan kepada pejabat bukan alasan untuk menghindar.\"},\"tips\":\"Jika soal menyebut pihak lain “dihormati” atau “senior”, itu ujian apakah Anda tetap menyelesaikan masalah secara profesional. Opsi yang mengalah demi menghindari gesekan biasanya bernilai 2.\",\"rujukan\":[]},{\"id\":\"p06-078\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda staf dinas kesehatan yang membina posyandu di satu kecamatan. Insentif kader yang bersumber dari dana desa terlambat tiga bulan karena administrasi desa belum selesai. Para kader mengancam berhenti menimbang balita bulan ini, padahal program penurunan stunting sedang berjalan. Cara Anda menyikapinya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menjelaskan kepada para kader bahwa insentif adalah urusan pemerintah desa sehingga dinas kesehatan tidak dapat berbuat banyak\"},{\"huruf\":\"B\",\"teks\":\"Mengambil alih penimbangan bulan ini bersama petugas puskesmas tanpa kader, supaya data program stunting tetap terkumpul\"},{\"huruf\":\"C\",\"teks\":\"Menalangi insentif kader dari dana kegiatan posyandu yang dikelola dinas, supaya kader tetap bekerja selama pencairan diproses\"},{\"huruf\":\"D\",\"teks\":\"Menemui kader untuk mendengar keluhan, lalu memfasilitasi pertemuan dengan desa dan puskesmas agar pencairan dipercepat dan jadwal disepakati\"},{\"huruf\":\"E\",\"teks\":\"Menghubungi kepala desa agar insentif para kader segera dicairkan sesuai ketentuan dana desa, lalu mengabarkan hasil pembicaraan itu kepada para kader posyandu\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":3,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Program kesehatan di tingkat desa berjalan lewat jejaring: dinas kesehatan, puskesmas, pemerintah desa, dan kader. Ketika satu simpul bermasalah, pegawai yang baik tidak mengambil alih semuanya atau melempar masalah, tetapi mempertemukan pihak-pihak yang berwenang agar akar masalah selesai dan program tetap berjalan. Kader juga perlu merasa didengar karena mereka mitra sukarela.\",\"opsi\":{\"A\":\"Secara kewenangan benar, tetapi lepas tangan. Program yang Anda bina terancam berhenti dan kader merasa tidak didukung.\",\"B\":\"Program tetap berjalan bulan ini, tetapi akar masalahnya tidak disentuh dan hubungan dengan kader bisa makin renggang.\",\"C\":\"Memakai dana kegiatan untuk membayar kewajiban pihak lain menyalahi peruntukan anggaran, walaupun niatnya menjaga program.\",\"D\":\"Kader didengar, pihak yang berwenang (desa dan puskesmas) dipertemukan, dan dua hal disepakati sekaligus: percepatan pencairan dan jadwal penimbangan.\",\"E\":\"Menyentuh akar masalah lewat kepala desa, tetapi kader tidak dilibatkan secara langsung dan jadwal penimbangan bulan ini belum dipastikan.\"},\"konsep\":\"**Peran fasilitator dalam jejaring:** dengarkan pihak yang terdampak, pertemukan pihak yang berwenang, sepakati solusi bersama. Mengambil alih tugas pihak lain atau menalangi dengan anggaran yang bukan peruntukannya tidak menyelesaikan masalah.\"},\"tips\":\"Jika masalahnya ada di pihak lain tetapi dampaknya ke program Anda, bobot 5 biasanya diberikan kepada opsi yang **mempertemukan** semua pihak terkait. Opsi yang menyelesaikan sendiri dengan cara di luar aturan bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-079\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Pak Herman, mantan atasan yang banyak berjasa dalam karier Anda, kini bertugas di instansi lain. Ia menelepon dan menanyakan apakah keponakannya lolos seleksi jabatan yang panitianya Anda ikuti. Hasil seleksi baru akan diumumkan secara resmi lusa. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengaku belum mengetahui hasilnya supaya Pak Herman tidak tersinggung dan hubungan baik di antara kalian tetap terjaga\"},{\"huruf\":\"B\",\"teks\":\"Menolak dengan hormat karena hasil seleksi rahasia sampai diumumkan, lalu memberi tahu jadwal dan kanal pengumuman resminya\"},{\"huruf\":\"C\",\"teks\":\"Menyatakan bahwa Anda tidak boleh membicarakan apa pun tentang seleksi itu, lalu segera mengakhiri percakapan telepon\"},{\"huruf\":\"D\",\"teks\":\"Memberi isyarat bahwa ia tidak perlu khawatir, tanpa menyebutkan hasil seleksi keponakannya secara langsung\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan bahwa Anda terikat kewajiban menjaga kerahasiaan sebagai panitia, dan memintanya menunggu pengumuman resmi lusa\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":3,\"D\":1,\"E\":4},\"pembahasan\":{\"inti\":\"Jejaring kerja dan hubungan baik harus dijaga, tetapi tidak dengan membocorkan informasi jabatan. Panitia seleksi wajib menjaga kerahasiaan hasil sampai diumumkan, demi keadilan bagi semua peserta. Cara menolaknya juga penting: jujur, sopan, menjelaskan alasan, dan tetap membantu sebatas yang boleh, misalnya memberi tahu kapan dan di mana hasil resmi diumumkan.\",\"opsi\":{\"A\":\"Tidak membocorkan, tetapi berbohong. Kebohongan kecil demi menjaga perasaan tetap merusak integritas dan menghindari penjelasan yang seharusnya diberikan.\",\"B\":\"Rahasia terjaga, alasan disampaikan dengan jujur dan hormat, dan Pak Herman tetap dibantu dengan informasi yang boleh dibagikan. Hubungan baik tetap terpelihara.\",\"C\":\"Kerahasiaan terjaga, tetapi caranya kaku dan bisa menyinggung orang yang dihormati. Hubungan kerja jangka panjang dirugikan.\",\"D\":\"Isyarat adalah bentuk pembocoran informasi secara tidak langsung. Peserta lain dirugikan karena ada pihak yang tahu lebih dulu.\",\"E\":\"Jujur dan menjaga rahasia, tetapi kurang membantu karena tidak memberi tahu kanal pengumuman resmi yang bisa dipantau.\"},\"konsep\":\"**Pola “orang dekat meminta informasi rahasia”:** 1 = membocorkan (langsung atau tersirat), 2 = berbohong untuk menghindar, 3 = menolak dengan kaku, 4 = menolak dengan alasan, 5 = menolak dengan alasan sambil tetap membantu lewat jalur resmi.\"},\"tips\":\"Waspadai opsi yang tampak tidak membocorkan, seperti “memberi isyarat”. Isyarat tetap bocoran. Di antara opsi yang benar-benar menjaga rahasia, pilih yang jujur dan paling membantu.\",\"rujukan\":[]},{\"id\":\"p06-080\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Anda panitia pameran produk UMKM yang diselenggarakan dinas bersama asosiasi pengusaha. Seorang perajin anyaman mengeluh di media sosial bahwa ia tidak pernah mendapat informasi pendaftaran, sementara peserta lain kebanyakan anggota asosiasi. Kuota stan hampir penuh. Langkah yang paling tepat Anda ambil adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Membalas unggahannya dengan penjelasan bahwa informasi sudah dikirim ke asosiasi, sehingga keterlambatan informasi bukan tanggung jawab panitia\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan kepada perajin bahwa kuota sudah hampir penuh, lalu mendaftarkannya sebagai calon peserta pameran tahun depan\"},{\"huruf\":\"C\",\"teks\":\"Menghubungi perajin langsung, mengakui informasi belum menjangkau nonanggota, mencarikan stan tersisa sesuai aturan, dan memperluas kanal pengumuman\"},{\"huruf\":\"D\",\"teks\":\"Menghubungi perajin itu secara pribadi untuk meminta maaf atas kejadian tersebut, lalu mencarikan stan yang masih tersisa di pameran tahun ini sesuai ketentuan panitia\"},{\"huruf\":\"E\",\"teks\":\"Meminta pengelola akun media sosial dinas melaporkan unggahan perajin itu sebagai konten negatif supaya segera dihapus oleh platform\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":2,\"B\":3,\"C\":5,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Jejaring kerja pemerintah tidak boleh hanya menjangkau kelompok yang sudah terorganisasi. Ketika ada pihak yang tertinggal informasi, pegawai yang baik mengakui kekurangan saluran komunikasi, membantu pihak yang dirugikan sejauh aturan memungkinkan, dan memperbaiki jangkauan jejaring agar kejadian serupa tidak terulang.\",\"opsi\":{\"A\":\"Membela diri di ruang publik dan menyalahkan pihak lain. Masalahnya tidak selesai dan kesan eksklusif makin kuat.\",\"B\":\"Sopan dan memberi kesempatan tahun depan, tetapi tidak mengakui masalah saluran informasi dan tidak mencari peluang tahun ini.\",\"C\":\"Komunikasi langsung, pengakuan yang jujur, solusi tahun ini sesuai aturan, dan perbaikan saluran informasi untuk ke depan.\",\"D\":\"Responsif dan mencari solusi, tetapi belum memperbaiki akar masalah, yaitu pengumuman yang hanya beredar lewat asosiasi.\",\"E\":\"Membungkam kritik warga dengan melaporkan unggahannya menyalahgunakan akun instansi dan merusak kepercayaan publik.\"},\"konsep\":\"**Jejaring yang inklusif:** informasi program publik harus menjangkau semua calon penerima, bukan hanya anggota organisasi mitra. Kritik adalah masukan untuk memperluas jejaring. Contoh perluasan kanal: pengumuman di akun resmi dinas, kantor desa, pasar, dan sentra perajin, bukan hanya melalui asosiasi.\"},\"tips\":\"Untuk keluhan di media sosial, opsi bernilai tinggi menghubungi warga **secara langsung** dan menindaklanjuti substansinya. Opsi yang membalas secara defensif di ruang publik atau membungkam kritik bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p06-081\",\"kategori\":\"TKP\",\"subtopik\":\"Jejaring Kerja\",\"pertanyaan\":\"Kantor Anda sering meminta bantuan juru bahasa isyarat dari komunitas tuli setempat untuk acara sosialisasi. Selama ini mereka membantu tanpa bayaran. Ketua komunitas akhirnya menyampaikan bahwa para relawannya kelelahan dan merasa tidak dihargai. Tanggapan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Berterima kasih atas masukannya, lalu mengusulkan kepada pimpinan agar jasa juru bahasa isyarat dianggarkan dan kerja sama dibuat secara resmi\"},{\"huruf\":\"B\",\"teks\":\"Meminta maaf dan berjanji kantor akan mengurangi frekuensi permintaan bantuan supaya para relawan komunitas tidak terlalu terbebani\"},{\"huruf\":\"C\",\"teks\":\"Mencari komunitas lain yang masih bersedia membantu tanpa bayaran, supaya acara sosialisasi kantor tetap berjalan seperti biasa tanpa perlu menambah anggaran kegiatan\"},{\"huruf\":\"D\",\"teks\":\"Memberikan uang transport dari iuran pribadi panitia kepada setiap relawan pada acara berikutnya sebagai bentuk apresiasi kantor\"},{\"huruf\":\"E\",\"teks\":\"Menyampaikan bahwa kegiatan sosial seharusnya dilakukan dengan ikhlas, sehingga keluhan tentang imbalan kurang pantas disampaikan\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":2,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"Kemitraan yang berkelanjutan harus adil bagi kedua pihak. Juru bahasa isyarat adalah layanan profesional yang membuat informasi pemerintah dapat diakses warga tuli, jadi kebutuhannya bersifat rutin dan sepatutnya menjadi tanggung jawab kantor. Masukan mitra perlu ditanggapi dengan perbaikan yang melembaga, bukan hanya dengan permintaan maaf.\",\"opsi\":{\"A\":\"Masukan dihargai, dan solusinya melembaga: layanan dianggarkan dan kerja sama dibuat resmi. Kemitraan menjadi adil dan berkelanjutan.\",\"B\":\"Menghormati beban relawan, tetapi mengurangi permintaan berarti mengurangi akses informasi bagi warga tuli. Masalah keadilan bagi mitra juga belum diselesaikan.\",\"C\":\"Menghindari masalah dengan berpindah mitra, sehingga pola memanfaatkan relawan tanpa imbalan berlanjut.\",\"D\":\"Ada penghargaan nyata, tetapi bersumber dari iuran pribadi sehingga tidak berkelanjutan dan bukan tanggung jawab kelembagaan.\",\"E\":\"Meremehkan keluhan mitra dan merusak hubungan dengan komunitas yang selama ini membantu kantor.\"},\"konsep\":\"**Kemitraan berkelanjutan:** saling menguntungkan, jelas hak dan kewajibannya, dan didukung kelembagaan (anggaran, kesepakatan). Solusi pribadi yang baik hati bernilai lebih rendah daripada solusi kelembagaan. Contoh pelembagaan: perjanjian kerja sama yang mengatur jadwal, jumlah juru bahasa, standar honorarium, dan pelatihan bagi pegawai kantor.\"},\"tips\":\"Jika mitra mengeluh soal keadilan kerja sama, bobot 5 biasanya diberikan kepada opsi yang mengubah **sistem** (anggaran, kesepakatan resmi), bukan sekadar meminta maaf atau memberi imbalan sekali.\",\"rujukan\":[]},{\"id\":\"p06-082\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Panitia lomba tujuh belasan di kantor Anda mengusulkan lomba “kostum suku nusantara” dengan konsep lucu-lucuan: peserta berdandan meniru suku tertentu secara berlebihan, termasuk mewarnai kulit dan menirukan logat. Anda anggota panitia, dan beberapa rekan kerja berasal dari suku yang kemungkinan akan ditirukan. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengikuti keputusan mayoritas panitia karena sudah disepakati bersama, sambil mengingatkan para peserta agar tidak terlalu berlebihan ketika berdandan, mewarnai kulit, dan menirukan logat\"},{\"huruf\":\"B\",\"teks\":\"Mendukung konsep itu karena lomba semacam ini dapat mengenalkan keragaman budaya kepada pegawai dengan cara yang menghibur\"},{\"huruf\":\"C\",\"teks\":\"Mengundurkan diri dari kepanitiaan agar Anda tidak ikut bertanggung jawab atas acara yang berpotensi menyinggung sebagian rekan\"},{\"huruf\":\"D\",\"teks\":\"Menjelaskan bahwa meniru ciri fisik dan logat bisa merendahkan, lalu mengusulkan lomba busana adat yang dikenakan dengan hormat setelah meminta masukan rekan terkait\"},{\"huruf\":\"E\",\"teks\":\"Mengusulkan kepada panitia agar konsep lomba diganti menjadi lomba busana adat nusantara yang dikenakan secara hormat dan sesuai pakem\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":2,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Aspek sosial budaya menilai kepekaan terhadap keberagaman. Menghargai budaya berbeda dengan menjadikannya bahan tertawaan. Meniru warna kulit atau logat secara berlebihan memperkuat stereotip dan dapat melukai rekan yang berasal dari suku itu, walaupun niatnya bercanda. Sikap terbaik adalah meluruskan konsep dengan alasan yang jelas, menawarkan alternatif yang menghormati budaya, dan melibatkan pihak yang paling terdampak.\",\"opsi\":{\"A\":\"Ada upaya membatasi, tetapi Anda tetap ikut menjalankan konsep yang pada dasarnya merendahkan. Mengikuti mayoritas tidak menghapus dampaknya.\",\"B\":\"Membenarkan candaan yang merendahkan dengan alasan mengenalkan budaya. Yang dikenalkan justru stereotip, bukan budaya.\",\"C\":\"Menghindar dari tanggung jawab. Acara tetap berjalan, dan Anda kehilangan kesempatan memperbaikinya dari dalam.\",\"D\":\"Alasan dijelaskan, alternatif yang menghormati budaya ditawarkan, dan rekan dari suku terkait dimintai masukan. Kepekaan dan solusi berjalan bersama.\",\"E\":\"Alternatifnya tepat, tetapi tanpa penjelasan mengapa konsep awal bermasalah, dan tanpa melibatkan rekan yang berasal dari budaya tersebut.\"},\"konsep\":\"**Menghormati vs. mengolok budaya:** memakai busana adat dengan pakem dan penghormatan = apresiasi; meniru ciri fisik, warna kulit, atau logat untuk ditertawakan = merendahkan. Libatkan pemilik budaya saat membuat acara bertema budaya.\"},\"tips\":\"Pada soal keberagaman di acara kantor, bedakan opsi yang **mengganti konsep dengan alasan dan melibatkan pihak terdampak** (5) dari opsi yang hanya mengganti konsep (4). Opsi yang membenarkan candaan atas ciri suku bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-083\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Saat memanggil antrean di kantor Disdukcapil, rekan di loket sebelah tertawa keras dan mengulang-ulang nama seorang warga yang menurutnya aneh. Warga itu tampak malu ketika maju ke loket. Yang sebaiknya Anda lakukan adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melanjutkan pekerjaan seperti biasa, lalu menegur rekan itu setelah antrean selesai agar suasana pelayanan di loket tidak terganggu\"},{\"huruf\":\"B\",\"teks\":\"Ikut tertawa sebentar agar warga menganggapnya candaan ringan yang tidak serius, lalu melanjutkan pelayanan seperti biasa\"},{\"huruf\":\"C\",\"teks\":\"Segera menegur rekan itu dengan suara pelan agar berhenti mengulang-ulang nama warga tersebut, lalu Anda melanjutkan pelayanan di loket seperti biasa\"},{\"huruf\":\"D\",\"teks\":\"Membiarkannya karena menegur rekan kerja di depan warga dianggap kurang sopan dan dapat mempermalukan rekan tersebut\"},{\"huruf\":\"E\",\"teks\":\"Meminta maaf kepada warga atas sikap rekan, melayaninya dengan hormat, lalu mengingatkan rekan secara pribadi agar tidak mengulanginya\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":3,\"B\":1,\"C\":4,\"D\":2,\"E\":5},\"pembahasan\":{\"inti\":\"Nama adalah identitas yang sering lahir dari bahasa, budaya, atau harapan keluarga tertentu. Menertawakannya di depan umum merendahkan martabat warga dan mencoreng pelayanan publik. Pegawai yang peka segera memulihkan rasa hormat kepada warga yang dirugikan, lalu meluruskan perilaku rekan dengan cara yang tidak mempermalukannya.\",\"opsi\":{\"A\":\"Rekan akhirnya ditegur, tetapi warga yang malu tidak mendapat pemulihan apa pun saat itu, dan candaan bisa berlanjut ke warga berikutnya.\",\"B\":\"Ikut tertawa memperparah rasa malu warga dan seolah membenarkan perilaku rekan.\",\"C\":\"Menghentikan perilaku rekan dengan cepat dan tidak mempermalukannya, tetapi warga yang tersinggung belum mendapat permintaan maaf.\",\"D\":\"Menghindar dengan alasan sopan santun, padahal warga yang menjadi korban justru dibiarkan.\",\"E\":\"Warga dipulihkan martabatnya lewat permintaan maaf dan layanan yang hormat, dan rekan diingatkan secara pribadi tanpa dipermalukan.\"},\"konsep\":\"**Urutan respons terhadap perilaku yang merendahkan warga:** pulihkan warga yang dirugikan → layani dengan hormat → luruskan perilaku rekan secara pribadi. Diam dan ikut tertawa bernilai rendah. Teguran pribadi menjaga martabat rekan sekaligus membuatnya lebih mudah menerima masukan.\"},\"tips\":\"Di soal sosial budaya, perhatikan siapa yang **dirugikan**. Opsi bernilai 5 biasanya memulihkan pihak yang dirugikan lebih dulu, lalu menangani pelakunya dengan cara yang santun.\",\"rujukan\":[]},{\"id\":\"p06-084\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Pak Yosef, anggota baru tim Anda, terbiasa berbicara dengan suara keras dan lugas, sesuai kebiasaan di lingkungan tempat ia dibesarkan. Dalam rapat, beberapa anggota tim menganggapnya sedang marah dan mulai enggan bekerja sama dengannya. Sebagai ketua tim, Anda akan ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Meminta Pak Yosef menurunkan nada bicaranya ketika rapat, supaya anggota tim lainnya merasa lebih nyaman saat berdiskusi dengannya\"},{\"huruf\":\"B\",\"teks\":\"Memindahkan Pak Yosef ke tugas yang dapat dikerjakannya sendiri, supaya tidak terjadi gesekan lagi dengan anggota tim lainnya\"},{\"huruf\":\"C\",\"teks\":\"Berbicara terpisah dengan Pak Yosef dan anggota tim tentang perbedaan gaya bicara, lalu menyepakati cara berdiskusi yang nyaman bagi semua\"},{\"huruf\":\"D\",\"teks\":\"Membiarkan keadaan itu, karena lama-kelamaan anggota tim akan terbiasa sendiri dengan gaya bicara Pak Yosef\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan kepada anggota tim dalam rapat berikutnya bahwa gaya bicara Pak Yosef adalah kebiasaan dari lingkungannya, bukan tanda bahwa ia sedang marah kepada siapa pun\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":1,\"C\":5,\"D\":2,\"E\":4},\"pembahasan\":{\"inti\":\"Perbedaan gaya komunikasi sering muncul di tim yang anggotanya beragam latar belakang. Masalahnya bukan siapa yang benar, tetapi salah paham yang tidak dibicarakan. Ketua tim yang peka budaya menjembatani kedua pihak: membantu tim memahami bahwa gaya itu bukan tanda permusuhan, dan membantu anggota baru memahami kesan yang ditangkap rekan-rekannya, lalu menyepakati cara berdiskusi bersama.\",\"opsi\":{\"A\":\"Mungkin meredakan suasana, tetapi seluruh beban penyesuaian ditimpakan kepada Pak Yosef, seolah gaya bicaranya salah.\",\"B\":\"Mengucilkan anggota karena perbedaan gaya bicara adalah perlakuan tidak adil dan merugikan kinerja tim.\",\"C\":\"Kedua pihak dibantu saling memahami, dan solusinya disepakati bersama sehingga tidak ada pihak yang dipojokkan.\",\"D\":\"Membiarkan salah paham berlarut-larut bisa merusak kerja sama dan membuat Pak Yosef makin terasing.\",\"E\":\"Meluruskan salah paham di pihak tim, tetapi Pak Yosef tidak diajak berdialog sehingga penyesuaian belum berjalan dua arah.\"},\"konsep\":\"**Kepekaan antarbudaya di tim kerja:** perbedaan gaya bukan kesalahan; salah paham diselesaikan dengan dialog dua arah dan kesepakatan bersama. Solusi yang hanya menuntut satu pihak berubah bernilai lebih rendah.\"},\"tips\":\"Untuk konflik karena perbedaan kebiasaan, cari opsi yang melibatkan **kedua pihak**. Opsi yang menyalahkan satu pihak bernilai sedang, dan opsi yang mengucilkan bernilai terendah.\",\"rujukan\":[]},{\"id\":\"p06-085\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda penyuluh pertanian yang dijadwalkan menyosialisasikan program asuransi tani di sebuah desa pukul 09.00. Warga baru berkumpul pukul 10.30 karena pagi itu ada acara adat. Pukul 13.00 Anda sudah dijadwalkan mengisi sosialisasi di desa lain. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memulai sosialisasi tepat pukul 09.00 dengan warga yang sudah hadir saat itu, agar jadwal di desa lain tidak ikut terganggu\"},{\"huruf\":\"B\",\"teks\":\"Memaklumi keterlambatan karena acara adat, menyampaikan materi inti secara ringkas, lalu menyepakati waktu tindak lanjut dengan tokoh desa\"},{\"huruf\":\"C\",\"teks\":\"Menunggu sampai warga berkumpul, menyampaikan materi selengkapnya, lalu meminta izin untuk datang terlambat ke sosialisasi di desa berikutnya\"},{\"huruf\":\"D\",\"teks\":\"Menunda sosialisasi ke minggu depan dan langsung berangkat ke desa lain, karena waktu yang tersisa tidak cukup untuk materi lengkap\"},{\"huruf\":\"E\",\"teks\":\"Menyampaikan di depan warga bahwa kebiasaan terlambat seperti ini menghambat program pemerintah, agar kejadian serupa tidak terulang\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":4,\"D\":2,\"E\":1},\"pembahasan\":{\"inti\":\"Bekerja di tengah masyarakat berarti menyesuaikan diri dengan kehidupan budaya setempat tanpa mengorbankan tujuan tugas. Acara adat adalah bagian penting kehidupan warga, sehingga keterlambatan karenanya perlu dimaklumi. Penyuluh yang baik tetap menyampaikan hal terpenting, menghormati jadwal yang lain, dan membangun kesepakatan agar sosialisasi berikutnya lebih tepat waktu.\",\"opsi\":{\"A\":\"Disiplin waktu, tetapi kaku. Sebagian besar warga sedang di acara adat, sehingga tujuan sosialisasi tidak tercapai.\",\"B\":\"Menghormati budaya setempat, materi penting tetap tersampaikan, jadwal lain terjaga, dan tindak lanjut disepakati bersama tokoh desa.\",\"C\":\"Menghormati warga dan materi lengkap, tetapi mengorbankan ketepatan waktu di desa lain yang juga sudah menunggu.\",\"D\":\"Menghindari penyesuaian. Warga yang sudah berkumpul dirugikan dan program tertunda seminggu.\",\"E\":\"Menegur warga di depan umum tentang acara adatnya merendahkan budaya setempat dan merusak hubungan dengan masyarakat.\"},\"konsep\":\"**Adaptasi budaya di lapangan:** maklumi kegiatan budaya warga, sesuaikan cara kerja (ringkas, fleksibel), lalu bangun kesepakatan dengan tokoh setempat untuk ke depan. Contoh kesepakatan: jadwal sosialisasi berikutnya disusun bersama kepala desa dengan memperhatikan kalender adat setempat.\"},\"tips\":\"Jika ada benturan antara jadwal kerja dan kegiatan budaya, pilih opsi yang **menyesuaikan cara kerja tanpa mengorbankan tugas lain** dan melibatkan tokoh setempat. Opsi yang menyalahkan budaya warga bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-086\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda petugas dinas sosial yang menyalurkan bantuan pascabanjir di sebuah kampung adat. Tokoh adat meminta seluruh bantuan diserahkan kepadanya untuk dibagikan menurut aturan adat. Aturan program mewajibkan bantuan diterima langsung oleh setiap kepala keluarga yang terdata. Dalam situasi ini, Anda akan ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyerahkan seluruh bantuan kepada tokoh adat dengan berita acara, supaya penyalurannya sesuai kebiasaan yang dihormati warga setempat\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan aturan program, lalu tetap membagikan bantuan langsung kepada setiap kepala keluarga meski tokoh adat masih keberatan\"},{\"huruf\":\"C\",\"teks\":\"Menemui tokoh adat, menjelaskan alasan aturan dengan hormat, dan mengajaknya ikut mendampingi penyerahan bantuan kepada setiap kepala keluarga\"},{\"huruf\":\"D\",\"teks\":\"Meminta kepala desa atau camat terlebih dahulu menjelaskan aturan program kepada tokoh adat, baru kemudian bantuan dibagikan langsung kepada setiap kepala keluarga yang terdata\"},{\"huruf\":\"E\",\"teks\":\"Menunda penyaluran sampai ada kesepakatan antara tokoh adat dan pemerintah desa, karena Anda tidak ingin menimbulkan konflik baru\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":1,\"B\":3,\"C\":5,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Soal ini mempertemukan dua hal yang sama-sama penting: aturan program yang menjamin bantuan sampai kepada setiap penerima, dan peran tokoh adat yang dihormati warga. Sikap terbaik tidak mengorbankan salah satunya. Aturan tetap dijalankan, tetapi tokoh adat dihormati dengan diberi penjelasan dan peran yang bermakna dalam proses penyaluran, sehingga warga menerima bantuan tanpa merasa adatnya dilangkahi.\",\"opsi\":{\"A\":\"Menyalahi aturan program. Bantuan tidak lagi bisa dipastikan sampai kepada setiap kepala keluarga yang terdata, dan petugas ikut bertanggung jawab jika terjadi penyimpangan.\",\"B\":\"Aturan dipegang, tetapi mengabaikan keberatan tokoh adat berisiko menimbulkan ketegangan dengan masyarakat setempat.\",\"C\":\"Aturan tetap berjalan, tokoh adat dihormati melalui penjelasan dan peran pendampingan, dan warga menerima bantuan secara langsung. Aturan dan budaya sama-sama dihargai.\",\"D\":\"Melibatkan pemerintah setempat itu baik, tetapi Anda sebagai petugas tidak membangun komunikasi langsung dan tokoh adat tidak diberi peran dalam penyaluran.\",\"E\":\"Menunda bantuan bagi korban banjir merugikan warga yang sedang membutuhkan, hanya untuk menghindari ketegangan.\"},\"konsep\":\"**Menjembatani aturan dan adat:** jalankan aturan yang melindungi hak warga, lalu hormati tokoh adat dengan penjelasan dan peran yang bermakna. Mengalah pada tuntutan yang melanggar aturan atau mengabaikan adat sama-sama bukan jawaban terbaik.\"},\"tips\":\"Jika aturan berbenturan dengan permintaan tokoh masyarakat, opsi bernilai 5 biasanya **tetap menjalankan aturan sambil mengajak tokoh itu berperan**. Opsi yang menyerahkan kendali sepenuhnya dan melanggar aturan bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-087\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Anda staf pemerintah kabupaten yang mendampingi mahasiswa KKN di sebuah desa binaan. Kepala dusun mengeluh bahwa beberapa mahasiswa berpakaian kurang sesuai dengan norma kesopanan desa itu dan sering bersuara keras di posko hingga larut malam. Warga mulai membicarakan mereka. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengajak koordinator mahasiswa dan kepala dusun bertemu untuk menjelaskan norma setempat dan menyepakati aturan posko, lalu memantau pelaksanaannya\"},{\"huruf\":\"B\",\"teks\":\"Mengumpulkan para mahasiswa di posko pada malam itu juga, lalu menjelaskan dengan tegas norma berpakaian serta jam tenang malam yang berlaku di desa tersebut\"},{\"huruf\":\"C\",\"teks\":\"Meneruskan keluhan kepala dusun kepada dosen pembimbing lapangan, agar dosen itulah yang menegur dan membina para mahasiswa\"},{\"huruf\":\"D\",\"teks\":\"Menyampaikan kepada kepala dusun bahwa mahasiswa hanya beberapa minggu di desa, sehingga sebaiknya perilaku mereka dimaklumi\"},{\"huruf\":\"E\",\"teks\":\"Meminta kepala dusun langsung menegur mahasiswa itu di hadapan warga, supaya mereka jera dan warga melihat ada tindakan nyata\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":4,\"C\":3,\"D\":2,\"E\":1},\"pembahasan\":{\"inti\":\"Pendatang, termasuk mahasiswa KKN, perlu menyesuaikan diri dengan norma masyarakat yang mereka tempati. Pendamping berperan menjembatani: membantu mahasiswa memahami norma setempat, menanggapi keluhan warga dengan serius, dan membangun kesepakatan yang dijalankan bersama, tanpa mempermalukan siapa pun.\",\"opsi\":{\"A\":\"Kedua pihak dipertemukan, norma dijelaskan oleh orang yang paling memahaminya, aturan disepakati bersama, dan pelaksanaannya dipantau.\",\"B\":\"Langsung menangani mahasiswa dengan informasi yang tepat, tetapi warga tidak dilibatkan dalam kesepakatan sehingga hubungan kedua pihak belum dipulihkan.\",\"C\":\"Dosen memang perlu tahu, tetapi Anda sebagai pendamping di lapangan menyerahkan seluruh penanganan kepada pihak lain.\",\"D\":\"Meremehkan keluhan warga dan membiarkan pelanggaran norma berlanjut, sehingga hubungan desa dan mahasiswa memburuk.\",\"E\":\"Teguran di depan umum mempermalukan mahasiswa dan bisa memicu konflik terbuka antara mahasiswa dan warga.\"},\"konsep\":\"**Menengahi pendatang dan warga setempat:** dengarkan keluhan, jelaskan norma lewat tokoh setempat, sepakati aturan bersama, dan pantau. Hindari meremehkan keluhan maupun mempermalukan pihak yang melanggar. Contoh aturan posko yang bisa disepakati: jam tenang mulai pukul 22.00, pakaian sopan saat keluar posko, dan izin kepada kepala dusun untuk kegiatan malam.\"},\"tips\":\"Untuk konflik antara pendatang dan warga, opsi yang **mempertemukan kedua pihak untuk membuat kesepakatan** biasanya bernilai 5. Opsi yang mempermalukan di depan umum bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-088\",\"kategori\":\"TKP\",\"subtopik\":\"Sosial Budaya\",\"pertanyaan\":\"Bu Laras, pegawai baru penyandang tunanetra, bergabung dengan tim Anda di bagian layanan informasi. Beberapa rekan meragukan kemampuannya dan menyarankan agar ia hanya diberi tugas ringan. Sebagai ketua tim yang membagi tugas, Anda akan ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memberinya tugas ringan sesuai saran rekan-rekan, supaya ia tidak terbebani dan pekerjaan tim tetap berjalan dengan lancar\"},{\"huruf\":\"B\",\"teks\":\"Membagi tugas dengan jumlah dan jenis yang sama persis seperti anggota lain, tanpa membicarakan kebutuhan kerja maupun alat bantunya terlebih dahulu\"},{\"huruf\":\"C\",\"teks\":\"Bertanya kepada Bu Laras tentang kemampuan dan alat bantu yang ia perlukan, lalu memberinya tugas sesuai hasil pembicaraan tersebut\"},{\"huruf\":\"D\",\"teks\":\"Membahas kemampuan dan alat bantu yang dibutuhkan Bu Laras, mengusulkan penyediaannya kepada kantor, lalu memberinya tugas setara rekan lain\"},{\"huruf\":\"E\",\"teks\":\"Mengusulkan kepada atasan agar Bu Laras ditempatkan di unit lain yang pekerjaannya dianggap lebih sesuai dengan kondisinya\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":3,\"C\":4,\"D\":5,\"E\":1},\"pembahasan\":{\"inti\":\"Penyandang disabilitas berhak atas kesempatan kerja yang setara dan akomodasi yang layak, misalnya perangkat pembaca layar. Ketua tim yang inklusif tidak menilai kemampuan dari asumsi, tetapi bertanya langsung kepada orangnya, menyediakan dukungan yang diperlukan, lalu memberi tanggung jawab yang setara dengan anggota lain.\",\"opsi\":{\"A\":\"Terdengar perhatian, tetapi membatasi peran berdasarkan asumsi. Bu Laras tidak diberi kesempatan menunjukkan kemampuannya.\",\"B\":\"Setara secara jumlah, tetapi tanpa akomodasi. Kesetaraan tanpa dukungan alat bantu bisa membuatnya gagal bukan karena kemampuannya.\",\"C\":\"Pendekatannya tepat karena bertanya langsung, tetapi penyediaan alat bantu oleh kantor belum diupayakan, dan tugasnya belum tentu setara.\",\"D\":\"Kebutuhan dibicarakan langsung, akomodasi diusulkan kepada kantor, dan tanggung jawabnya setara. Inilah inklusi yang utuh.\",\"E\":\"Memindahkan pegawai karena disabilitasnya, tanpa menilai kemampuan nyatanya, adalah diskriminasi.\"},\"konsep\":\"**Inklusi di tempat kerja = kesetaraan + akomodasi yang layak.** Tanyakan kepada orangnya, sediakan dukungan, beri tanggung jawab setara. Membatasi peran karena asumsi termasuk perlakuan diskriminatif walaupun niatnya melindungi. Contoh akomodasi yang layak: aplikasi pembaca layar, dokumen digital yang dapat dibaca perangkat, dan penataan meja yang mudah diakses.\"},\"tips\":\"Untuk soal rekan penyandang disabilitas, susun bobot dari yang mengucilkan (1), membatasi karena asumsi (2), setara tanpa dukungan (3), bertanya langsung (4), sampai bertanya, mengakomodasi, dan memberi peran setara (5).\",\"rujukan\":[]},{\"id\":\"p06-089\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Pukul 22.00, Anda sebagai admin media sosial dinas mendapati akun resmi dinas mengunggah promosi judi daring. Kata sandi akun sudah diganti oleh peretas, dan unggahan itu mulai dibagikan warga. Respons terbaik Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melaporkan kejadian itu kepada atasan malam itu juga, lalu menunggu arahannya sebelum melakukan tindakan apa pun terhadap akun\"},{\"huruf\":\"B\",\"teks\":\"Mengajukan pemulihan akun kepada platform malam itu juga, lalu mengumumkan lewat situs dan kanal resmi lainnya bahwa akun dinas sedang diretas dan unggahannya bukan dari dinas\"},{\"huruf\":\"C\",\"teks\":\"Menunggu sampai pagi agar tim TI yang menangani akun itu, karena urusan keamanan akun berada di luar keahlian Anda\"},{\"huruf\":\"D\",\"teks\":\"Membuat akun baru dengan nama yang mirip, lalu meminta warga berpindah mengikuti akun baru itu sebagai akun resmi dinas\"},{\"huruf\":\"E\",\"teks\":\"Mengajukan pemulihan akun, melapor kepada atasan dan tim keamanan siber instansi, lalu mengumumkan lewat kanal resmi lain agar warga mengabaikan unggahan itu\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":3,\"B\":4,\"C\":2,\"D\":1,\"E\":5},\"pembahasan\":{\"inti\":\"Insiden keamanan siber harus ditangani cepat, karena setiap jam unggahan berbahaya dibiarkan, makin banyak warga yang tertipu dan nama instansi makin rusak. Penanganan yang baik memuat tiga hal: memulihkan akses akun, melaporkan insiden kepada atasan dan tim keamanan siber agar ditangani sesuai prosedur, serta memperingatkan publik lewat kanal resmi lain.\",\"opsi\":{\"A\":\"Melapor itu tepat, tetapi menunggu tanpa melakukan langkah darurat apa pun membuat unggahan terus menyebar semalaman.\",\"B\":\"Langkah darurat sudah tepat, tetapi insiden tidak dilaporkan kepada atasan dan tim keamanan siber, sehingga penyebab peretasan dan risiko pada sistem lain tidak diperiksa.\",\"C\":\"Menunda dengan alasan bukan keahlian, padahal langkah awal seperti pemulihan akun dan peringatan publik bisa dilakukan admin.\",\"D\":\"Membuat akun tandingan tanpa izin membingungkan warga dan justru meniru pola akun palsu yang biasa dipakai penipu.\",\"E\":\"Akses dipulihkan, insiden dilaporkan kepada pihak berwenang, dan publik diperingatkan. Ketiga unsur penanganan insiden terpenuhi.\"},\"konsep\":\"**Respons insiden siber:** pulihkan dan amankan akses → laporkan kepada atasan dan tim keamanan siber (CSIRT) instansi → peringatkan publik lewat kanal resmi lain → evaluasi penyebabnya.\"},\"tips\":\"Pada soal insiden siber, opsi bernilai 5 bertindak **segera**, **melapor**, dan **melindungi publik** sekaligus. Opsi yang hanya melapor lalu menunggu, atau bertindak tanpa melapor, bernilai di tengah.\",\"rujukan\":[]},{\"id\":\"p06-090\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Bu Siti, seorang lansia, baru selesai mendaftar aplikasi layanan kesehatan dengan bantuan Anda di loket. Karena takut lupa, ia meminta Anda mencatat dan menyimpan kata sandi akunnya. Tanggapan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menolak menyimpan kata sandi itu, lalu menyarankannya meminta anak atau cucunya untuk membantu mengingatkan kata sandi tersebut\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan bahwa kata sandi sebaiknya hanya ia yang tahu, membantunya membuat kata sandi yang mudah diingat, dan menunjukkan cara memulihkannya\"},{\"huruf\":\"C\",\"teks\":\"Menolak dengan sopan menyimpan kata sandi, lalu membantunya menuliskan kata sandi itu di buku catatan pribadi yang ia simpan sendiri di tempat aman di rumahnya\"},{\"huruf\":\"D\",\"teks\":\"Mencatat kata sandinya di buku catatan loket, supaya petugas mana pun bisa membantunya masuk ke aplikasi setiap kali ia datang\"},{\"huruf\":\"E\",\"teks\":\"Mengatakan bahwa urusan kata sandi adalah tanggung jawab pemilik akun, lalu melanjutkan pelayanan ke warga di antrean berikutnya\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":4,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Kata sandi adalah kunci akun yang berisi data kesehatan pribadi. Petugas tidak boleh menyimpan kata sandi warga karena itu membuka peluang penyalahgunaan data. Namun penolakan saja tidak cukup; warga lansia perlu dibantu agar tetap bisa memakai akunnya sendiri dengan aman, misalnya lewat kata sandi yang mudah diingat dan cara memulihkan akun.\",\"opsi\":{\"A\":\"Prinsip keamanan dijaga, tetapi solusinya dilempar ke keluarga, dan Bu Siti tidak dibekali cara mengelola akunnya sendiri.\",\"B\":\"Keamanan data terjaga dan Bu Siti dibekali dua hal penting: kata sandi yang mudah ia ingat dan cara memulihkan akun jika lupa.\",\"C\":\"Petugas tidak menyimpan kata sandi dan warga tetap memegang kendali, tetapi catatan kertas masih berisiko hilang dan cara pemulihan akun belum diajarkan.\",\"D\":\"Menyimpan kata sandi warga di buku loket yang bisa dibaca banyak orang melanggar prinsip pelindungan data pribadi.\",\"E\":\"Benar secara prinsip, tetapi menolak membantu warga yang jelas membutuhkan pendampingan dan tergesa-gesa memindahkan layanan.\"},\"konsep\":\"**Literasi keamanan digital bagi warga:** kata sandi hanya diketahui pemiliknya, mudah diingat tetapi tidak mudah ditebak, dan pemilik tahu cara memulihkan akun. Petugas membantu tanpa pernah memegang kunci akun warga.\"},\"tips\":\"Pada soal TIK yang melibatkan warga kurang melek digital, opsi bernilai 5 **menjaga keamanan data sekaligus memberdayakan warga**. Opsi yang menyimpan data warga demi kemudahan bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-091\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Saat membuka situs web kecamatan, Anda menemukan lampiran pengumuman penerima bantuan berformat PDF yang memuat NIK lengkap dan alamat rumah warga. Pengumuman itu diunggah oleh bagian lain sebulan yang lalu. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memberi tahu rekan di bagian yang mengunggah pengumuman lewat pesan pribadi, agar ia memperbaiki lampiran berisi data warga itu ketika sudah ada waktu luang\"},{\"huruf\":\"B\",\"teks\":\"Membiarkannya karena pengumuman itu wewenang bagian lain, dan file tersebut juga sudah terlanjur tersebar selama sebulan\"},{\"huruf\":\"C\",\"teks\":\"Segera melapor kepada pengelola situs dan atasan agar lampiran diturunkan, diganti versi tersamarkan, dan kebocoran ditangani sesuai prosedur\"},{\"huruf\":\"D\",\"teks\":\"Meminta pengelola situs segera menurunkan lampiran itu dan menggantinya dengan versi baru yang NIK serta alamat warganya disamarkan\"},{\"huruf\":\"E\",\"teks\":\"Mengunduh salinan lampiran itu untuk arsip pribadi sebagai bukti, sebelum file tersebut diturunkan atau dihapus dari situs web\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":2,\"C\":5,\"D\":4,\"E\":1},\"pembahasan\":{\"inti\":\"NIK dan alamat adalah data pribadi yang dilindungi UU 27/2022 tentang Pelindungan Data Pribadi. Data seperti ini bisa disalahgunakan untuk penipuan atau pinjaman daring ilegal. Kebocoran perlu dihentikan secepatnya, digantikan versi yang aman, dan dilaporkan agar ditangani sesuai prosedur, termasuk menilai dampaknya. Fakta bahwa unggahan itu milik bagian lain tidak menghapus tanggung jawab pegawai yang menemukannya.\",\"opsi\":{\"A\":\"Ada tindakan, tetapi tidak mendesak dan lewat jalur informal. Data tetap terbuka entah berapa lama lagi.\",\"B\":\"Menghindar dengan alasan kewenangan. Kebocoran yang dibiarkan memperbesar risiko bagi warga setiap harinya.\",\"C\":\"Kebocoran dihentikan, diganti versi yang aman, dan dilaporkan kepada atasan agar ditangani sesuai prosedur. Cepat dan tuntas.\",\"D\":\"Menghentikan kebocoran dengan cepat dan tepat, tetapi tanpa melapor kepada atasan, sehingga dampak kebocoran selama sebulan tidak ditangani.\",\"E\":\"Menyimpan salinan data pribadi warga untuk arsip pribadi justru menambah titik kebocoran baru.\"},\"konsep\":\"**Respons kebocoran data:** hentikan akses → ganti dengan versi yang menyamarkan data → laporkan agar ditangani sesuai prosedur → cegah terulang. Pengumuman publik cukup memuat nama dan sebagian data yang disamarkan.\"},\"tips\":\"Pada soal kebocoran data, opsi bernilai 5 menghentikan kebocoran **dan** melapor. Opsi yang menyalin data, walaupun dengan alasan bukti, bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-092\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Anda memandu rapat koordinasi hibrida: sepuluh peserta hadir di ruang rapat, sementara delapan perwakilan desa mengikuti secara daring. Diskusi di ruangan berlangsung cepat, dan pertanyaan peserta daring di kolom obrolan tidak terbaca selama setengah jam. Anda memutuskan untuk ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menjeda diskusi untuk menanggapi pertanyaan di kolom obrolan, lalu menunjuk rekan memantau peserta daring dan memberi mereka giliran bicara\"},{\"huruf\":\"B\",\"teks\":\"Membacakan semua pertanyaan dari kolom obrolan pada akhir sesi, supaya diskusi yang sedang berlangsung di ruangan tidak terputus di tengah jalan\"},{\"huruf\":\"C\",\"teks\":\"Meminta salah satu rekan di ruangan memantau kolom obrolan dan menyampaikan kepada Anda pertanyaan-pertanyaan penting dari peserta daring\"},{\"huruf\":\"D\",\"teks\":\"Meminta peserta daring mengirimkan pertanyaan mereka lewat surel setelah rapat selesai, karena waktu rapat sudah terbatas\"},{\"huruf\":\"E\",\"teks\":\"Menonaktifkan kolom obrolan agar peserta daring fokus mendengarkan dan tidak mengganggu jalannya diskusi di ruang rapat\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":4,\"D\":2,\"E\":1},\"pembahasan\":{\"inti\":\"Rapat hibrida hanya efektif jika peserta daring punya kesempatan yang setara untuk didengar. Pemandu rapat bertanggung jawab memakai teknologi untuk menyatukan dua kelompok peserta, bukan membiarkan salah satunya menjadi penonton. Perwakilan desa yang ikut daring justru sering membawa informasi lapangan yang dibutuhkan rapat.\",\"opsi\":{\"A\":\"Ketertinggalan setengah jam segera dipulihkan, dan ada mekanisme yang menjaga keterlibatan peserta daring sampai rapat selesai.\",\"B\":\"Pertanyaan akhirnya dibacakan, tetapi terlambat. Peserta daring tidak ikut memengaruhi diskusi saat keputusan dibahas.\",\"C\":\"Ada mekanisme pemantauan, tetapi pertanyaan yang sudah tertunda setengah jam belum ditanggapi dan peserta daring belum mendapat giliran bicara.\",\"D\":\"Menghindari tugas memandu rapat hibrida. Peserta daring tidak dilibatkan sama sekali dalam diskusi.\",\"E\":\"Menutup satu-satunya saluran peserta daring sama dengan mengucilkan mereka dari rapat.\"},\"konsep\":\"**Rapat hibrida yang setara:** pantau kanal daring secara aktif (tunjuk pemantau), beri giliran bicara bergantian antara peserta di ruangan dan daring, dan pastikan materi terlihat oleh keduanya. Satu cara sederhana: setiap selesai satu topik, pemandu membuka giliran khusus untuk peserta daring sebelum pindah ke topik berikutnya.\"},\"tips\":\"Untuk soal rapat daring atau hibrida, opsi bernilai 5 biasanya **memulihkan keterlibatan peserta jarak jauh sekarang** dan **menyiapkan mekanisme** untuk sisa rapat. Opsi yang menunda atau menutup kanal bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p06-093\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Sebuah perusahaan rintisan menawarkan aplikasi antrean gratis selama setahun untuk kantor Anda, dengan syarat aplikasi itu dihubungkan ke data kependudukan warga agar pendaftaran lebih cepat. Atasan Anda tertarik dan meminta Anda menindaklanjutinya. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyarankan atasan menolak tawaran itu dan tetap memakai antrean manual, karena aplikasi dari pihak luar selalu membawa risiko kebocoran data\"},{\"huruf\":\"B\",\"teks\":\"Mengizinkan uji coba segera dengan data warga asli, karena aplikasinya gratis dan perusahaan sudah berjanji akan menjaga kerahasiaan data\"},{\"huruf\":\"C\",\"teks\":\"Meminta tim TI menilai keamanan aplikasi itu terlebih dahulu sebelum Anda memberikan rekomendasi kepada atasan tentang tawaran tersebut\"},{\"huruf\":\"D\",\"teks\":\"Memeriksa dasar hukum akses data kependudukan dan perjanjian pelindungan datanya, meminta tim TI menilai keamanan, lalu memberi rekomendasi tertulis\"},{\"huruf\":\"E\",\"teks\":\"Menyerahkan keputusan sepenuhnya kepada atasan, karena Anda tidak memahami aspek teknis aplikasi maupun teknologi yang dipakai perusahaan itu\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":1,\"C\":4,\"D\":5,\"E\":2},\"pembahasan\":{\"inti\":\"Inovasi digital patut didukung, tetapi data kependudukan adalah data pribadi yang aksesnya diatur ketat. Sebelum pihak ketiga diberi akses, perlu dipastikan ada dasar hukumnya, ada perjanjian yang mengikat tentang pelindungan data (sesuai UU 27/2022 tentang Pelindungan Data Pribadi), dan sistemnya aman secara teknis. Tugas pegawai adalah menyiapkan penilaian yang lengkap agar pimpinan memutuskan dengan informasi yang cukup.\",\"opsi\":{\"A\":\"Hati-hati terhadap data, tetapi menolak inovasi secara menyeluruh tanpa penilaian. Peluang memperbaiki layanan hilang.\",\"B\":\"Membuka data warga asli kepada pihak luar hanya berdasarkan janji, tanpa dasar hukum dan perjanjian, melanggar prinsip pelindungan data pribadi.\",\"C\":\"Penilaian teknis penting, tetapi aspek hukum (siapa boleh mengakses data kependudukan dan dengan perjanjian apa) belum dipe
