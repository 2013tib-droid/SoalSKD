\"kalimat (1)\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Gagasan utama paragraf ini adalah **penerapan antrean daring dan manfaatnya**. Kalimat (1) memperkenalkan antrean daring, (2) menjelaskan caranya, (4) menyebut manfaatnya, dan (5) menjelaskan pengecualian bagi lansia. Kalimat (3) membahas renovasi ruang tunggu, yang tidak berhubungan dengan sistem antrean. Buktinya, frasa *dengan cara itu* di kalimat (4) seharusnya merujuk pada cara memilih jadwal di kalimat (2); kalimat (3) memutus rujukan itu sehingga pembaca bisa salah mengira renovasi yang mengurangi penumpukan. Jadi, kalimat (3) adalah kalimat sumbang.\",\"opsi\":{\"B\":\"Distraktor terkuat karena diawali *meski begitu* dan tampak berbeda arah. Namun kalimat ini tetap membahas sistem antrean, yaitu layanan langsung bagi lansia yang mungkin kesulitan memakai aplikasi. Isinya memperjelas cakupan kebijakan.\",\"C\":\"Kalimat (4) menyatakan manfaat antrean daring dan berhubungan langsung dengan gagasan utama.\",\"D\":\"Kalimat (2) menjelaskan cara kerja antrean daring, jadi padu dengan kalimat (1).\",\"E\":\"Kalimat (1) adalah kalimat utama yang memperkenalkan topik paragraf.\"},\"konsep\":\"**Paragraf padu** memiliki satu gagasan utama, dan setiap kalimat penjelas mendukung gagasan itu. Kalimat sumbang biasanya membahas hal yang **masih satu latar** (sama-sama di kantor kecamatan) tetapi **beda topik**. Kata penghubung seperti *meski begitu* atau *namun* tidak otomatis menandakan kalimat sumbang.\"},\"tips\":\"Rumuskan dulu gagasan utama dalam satu frasa (di sini: “antrean daring”). Lalu uji setiap kalimat: apakah kalimat itu berbicara tentang frasa tersebut? Periksa juga kata rujukan seperti *dengan cara itu* atau *hal tersebut*; kalimat sumbang sering memutus rujukan ini.\",\"rujukan\":[]},{\"id\":\"p06-030\",\"kategori\":\"TWK\",\"subtopik\":\"Bahasa Indonesia\",\"pertanyaan\":\"Kalimat yang seluruh katanya dipakai dengan tepat, baik makna maupun bentuk bakunya, adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Petugas itu acuh terhadap keluhan warga sehingga warga merasa kecewa.\"},{\"huruf\":\"B\",\"teks\":\"Meskipun didesak kerumunan, petugas jaga itu tetap bergeming di depan gerbang.\"},{\"huruf\":\"C\",\"teks\":\"Walaupun didesak massa, petugas jaga itu tidak bergeming sedikit pun dari posisinya.\"},{\"huruf\":\"D\",\"teks\":\"Pagi ini saya sudah absen melalui aplikasi presensi sebelum pukul 07.30.\"},{\"huruf\":\"E\",\"teks\":\"Pemerintah daerah akan merubah jadwal layanan keliling mulai bulan depan.\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Soal ini menguji kata yang sering dipakai terbalik maknanya. Dalam KBBI, **bergeming** berarti *tidak bergerak sedikit pun; diam saja*. Kalimat B memakainya dengan tepat: meski didesak, petugas tetap diam di tempat. Kata lain di kalimat B juga baku. Perhatikan bahwa banyak orang menulis *tidak bergeming* untuk maksud “tidak bergerak”, padahal itu justru berarti “bergerak”. Opsi lain masing-masing mengandung satu kata yang maknanya terbalik atau bentuknya tidak baku.\",\"opsi\":{\"A\":\"*Acuh* dalam KBBI berarti *peduli; mengindahkan*. Untuk maksud tidak peduli, kata yang tepat adalah *tak acuh* atau *acuh tak acuh*.\",\"C\":\"*Tidak bergeming* berarti “bergerak”, bertentangan dengan maksud kalimat bahwa petugas tetap di posisinya. Cukup tulis *tetap bergeming* atau *tidak bergerak*.\",\"D\":\"*Absen* berarti *tidak hadir*. Maksud kalimat adalah sudah mengisi daftar hadir, jadi kata yang tepat adalah *presensi* atau *mengisi daftar hadir*.\",\"E\":\"*Merubah* tidak baku. Kata dasarnya *ubah*, sehingga bentuk yang benar *mengubah*. Kata *rubah* adalah nama hewan.\"},\"konsep\":\"**Kata yang sering terbalik maknanya:**\\n\\n| Kata | Makna KBBI | Salah kaprah |\\n|---|---|---|\\n| acuh | peduli | dipakai untuk “tidak peduli” |\\n| bergeming | diam, tidak bergerak | “tidak bergeming” untuk “diam” |\\n| absen | tidak hadir | dipakai untuk “mengisi daftar hadir” |\"},\"tips\":\"Untuk kata yang mencurigakan, ganti dengan definisi KBBI-nya lalu baca ulang kalimat. “Petugas itu *peduli* terhadap keluhan warga sehingga warga kecewa” terasa janggal, berarti kata *acuh* salah pakai. Cara ini juga cepat untuk menguji *bergeming* dan *absen*.\",\"rujukan\":[]},{\"id\":\"p06-031\",\"kategori\":\"TIU\",\"subtopik\":\"Sinonim\",\"pertanyaan\":\"IMPARSIAL = ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"sebagian\"},{\"huruf\":\"B\",\"teks\":\"tergesa-gesa\"},{\"huruf\":\"C\",\"teks\":\"tidak lengkap\"},{\"huruf\":\"D\",\"teks\":\"sementara\"},{\"huruf\":\"E\",\"teks\":\"tidak memihak\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Dalam KBBI, *imparsial* berarti **tidak memihak; netral**. Kata ini diserap dari bahasa Inggris *impartial*. Contoh pemakaian: “Panitia seleksi harus bersikap imparsial terhadap semua pelamar”, artinya panitia tidak boleh condong kepada pelamar tertentu. Kata ini sering dipakai dalam konteks hukum, pemilu, dan seleksi pegawai. Lawan katanya adalah *memihak* atau *partisan*. Uji dengan mengganti kata dalam kalimat: “Panitia seleksi harus bersikap **tidak memihak**” tetap bermakna sama, jadi E adalah sinonim yang tepat.\",\"opsi\":{\"A\":\"Jebakan bentuk kata. *Parsial* dalam bahasa Indonesia berarti “sebagian”, sehingga peserta mengira *imparsial* berhubungan dengan “sebagian”. Padahal makna *imparsial* diambil dari *impartial* dalam bahasa Inggris, yaitu tidak memihak.\",\"B\":\"“Tergesa-gesa” adalah makna kata *impulsif*, yang sama-sama berawalan *im-* sehingga mudah tertukar.\",\"C\":\"“Tidak lengkap” mendekati makna *parsial* atau *inkomplet*, bukan *imparsial*.\",\"D\":\"“Sementara” adalah makna kata *temporer*. Tidak ada hubungannya dengan sikap memihak.\"},\"konsep\":\"**Hati-hati dengan awalan serapan *im-/in-/ir-*.** Awalan ini memang sering berarti “tidak” (*imparsial, inkonsisten, irasional*), tetapi kata dasarnya harus dipahami menurut makna asal serapannya, bukan menurut kata Indonesia yang bentuknya mirip.\"},\"tips\":\"Untuk sinonim kata serapan, coba ingat kata asingnya (*impartial* = tidak memihak), lalu uji jawaban dengan mengganti kata dalam satu kalimat contoh. Jika makna kalimat tidak berubah, itulah sinonimnya.\",\"rujukan\":[]},{\"id\":\"p06-032\",\"kategori\":\"TIU\",\"subtopik\":\"Sinonim\",\"pertanyaan\":\"Pemerintah memberlakukan *moratorium* penerimaan pegawai di beberapa instansi.\\n\\nSinonim kata yang dicetak miring adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"penangguhan\"},{\"huruf\":\"B\",\"teks\":\"pelarangan\"},{\"huruf\":\"C\",\"teks\":\"pembatalan\"},{\"huruf\":\"D\",\"teks\":\"peninjauan ulang\"},{\"huruf\":\"E\",\"teks\":\"pembatasan\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"*Moratorium* dalam KBBI berarti **penangguhan** atau **penundaan**. Mula-mula istilah ini dipakai untuk penangguhan pembayaran utang, lalu meluas untuk penghentian **sementara** suatu kegiatan. Unsur kuncinya adalah sifat sementara: kegiatan dihentikan untuk jangka waktu tertentu dan dapat dilanjutkan kembali. Moratorium penerimaan pegawai berarti penerimaan ditunda dulu, bukan dihapus. Uji dalam kalimat: “Pemerintah memberlakukan **penangguhan** penerimaan pegawai” bermakna sama dengan kalimat soal.\",\"opsi\":{\"B\":\"Distraktor terkuat. Moratorium memang menghentikan kegiatan, tetapi *pelarangan* tidak mengandung unsur sementara dan biasanya berlaku sampai dicabut. Moratorium menekankan penundaan.\",\"C\":\"*Pembatalan* berarti meniadakan sesuatu sama sekali. Moratorium tidak meniadakan kegiatan, hanya menundanya.\",\"D\":\"*Peninjauan ulang* berarti memeriksa kembali suatu kebijakan atau keputusan. Peninjauan memang sering dilakukan selama moratorium berlaku, tetapi itu kegiatan yang menyertai, bukan arti kata moratorium.\",\"E\":\"*Pembatasan* berarti kegiatan tetap berjalan dengan jumlah atau syarat yang dikurangi. Moratorium justru menghentikan kegiatan untuk sementara.\"},\"konsep\":\"**Bedakan kata yang sama-sama berarti “menghentikan”:** penangguhan/penundaan (sementara, akan dilanjutkan), pembatalan (ditiadakan), pelarangan (tidak boleh dilakukan), pembatasan (tetap boleh, tetapi dikurangi). Contoh pemakaian lain: *moratorium izin pembukaan lahan gambut* berarti izin baru tidak dikeluarkan untuk sementara waktu, sambil pemerintah menata aturannya.\"},\"tips\":\"Saat beberapa opsi bermakna mirip, cari **ciri pembeda** kata soal. Di sini cirinya “sementara”. Opsi yang tidak memuat unsur sementara bisa dicoret walaupun maknanya berdekatan.\",\"rujukan\":[]},{\"id\":\"p06-033\",\"kategori\":\"TIU\",\"subtopik\":\"Antonim\",\"pertanyaan\":\"DIVERGEN \u003e\u003c ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"menyebar\"},{\"huruf\":\"B\",\"teks\":\"bercabang\"},{\"huruf\":\"C\",\"teks\":\"sejajar\"},{\"huruf\":\"D\",\"teks\":\"memusat\"},{\"huruf\":\"E\",\"teks\":\"berlawanan\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"*Divergen* berarti **bersifat menyebar dari satu titik** atau makin menjauh satu sama lain. Pasangan lawannya adalah *konvergen*, yang dalam KBBI berarti bersifat menuju satu titik pertemuan; **memusat**. Contoh: dalam diskusi, tahap *divergen* dipakai untuk mengumpulkan sebanyak mungkin gagasan, lalu tahap *konvergen* memusatkan gagasan menjadi satu keputusan. Contoh lain, lensa cekung bersifat divergen (menyebarkan cahaya), sedangkan lensa cembung bersifat konvergen (mengumpulkan cahaya ke satu titik). Jadi, antonim divergen adalah memusat.\",\"opsi\":{\"A\":\"*Menyebar* justru sinonim divergen. Soal antonim sering sengaja memasang sinonim sebagai pengecoh.\",\"B\":\"*Bercabang* juga bermakna dekat dengan divergen, karena cabang-cabang menjauh dari satu pangkal.\",\"C\":\"*Sejajar* berarti tidak menjauh dan tidak mendekat. Sejajar adalah keadaan di antara divergen dan konvergen, bukan lawannya.\",\"E\":\"*Berlawanan* menyatakan arah yang bertentangan, bukan arah menuju satu titik. Kata ini juga lebih dekat dengan makna menjauh.\"},\"konsep\":\"**Pasangan istilah serapan yang sering diuji:** divergen \u003e\u003c konvergen (memusat), eksplisit \u003e\u003c implisit, heterogen \u003e\u003c homogen, sentralisasi \u003e\u003c desentralisasi. Hafalkan berpasangan agar cepat.\"},\"tips\":\"Pada soal antonim, coret dulu opsi yang merupakan **sinonim** kata soal (di sini *menyebar* dan *bercabang*). Lalu bedakan lawan kata yang sebenarnya dari keadaan netral (*sejajar*).\",\"rujukan\":[]},{\"id\":\"p06-034\",\"kategori\":\"TIU\",\"subtopik\":\"Antonim\",\"pertanyaan\":\"Harga cabai di pasar tradisional sangat *fluktuatif* menjelang hari raya.\\n\\nLawan kata yang dicetak miring adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"naik-turun\"},{\"huruf\":\"B\",\"teks\":\"meningkat\"},{\"huruf\":\"C\",\"teks\":\"stabil\"},{\"huruf\":\"D\",\"teks\":\"menurun\"},{\"huruf\":\"E\",\"teks\":\"acak\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"*Fluktuatif* berarti **bersifat naik-turun atau berubah-ubah**, dari kata *fluktuasi* (gejala naik-turunnya harga, nilai, atau jumlah). Kalimat soal menggambarkan harga cabai yang tidak tetap: kadang naik, kadang turun dalam waktu singkat. Lawannya adalah keadaan yang **tetap, tidak berubah-ubah**, yaitu *stabil*. Uji kalimatnya: “Harga cabai di pasar tradisional sangat **stabil** menjelang hari raya” menyatakan keadaan yang berlawanan dengan kalimat soal. Perhatikan juga bahwa kata *sangat* di depan kata soal tidak mengubah jenis maknanya, hanya menguatkannya.\",\"opsi\":{\"A\":\"*Naik-turun* adalah makna fluktuatif itu sendiri, jadi sinonim, bukan antonim.\",\"B\":\"*Meningkat* hanya menyatakan satu arah perubahan. Harga yang terus meningkat tetap tidak stabil, jadi bukan lawan dari fluktuatif.\",\"D\":\"*Menurun* juga hanya satu arah perubahan dan tetap menunjukkan harga yang berubah.\",\"E\":\"*Acak* berarti tidak berpola. Maknanya justru dekat dengan berubah-ubah, bukan lawannya.\"},\"konsep\":\"**Antonim keadaan berubah:** fluktuatif, dinamis, labil \u003e\u003c stabil, statis, tetap. Kata yang menyatakan perubahan satu arah (naik, turun) bukan lawan dari “berubah-ubah”, karena keduanya sama-sama berubah. Contoh kalimat: “Nilai tukar rupiah cenderung **stabil** sepanjang pekan ini” bermakna tidak banyak berubah, berlawanan dengan “nilai tukar rupiah sangat **fluktuatif**”.\"},\"tips\":\"Jika soal memakai kalimat, baca konteksnya untuk memastikan makna kata. Lalu tanyakan: “keadaan apa yang membuat kalimat ini bermakna sebaliknya?”. Opsi yang hanya mengubah arah perubahan biasanya pengecoh.\",\"rujukan\":[]},{\"id\":\"p06-035\",\"kategori\":\"TIU\",\"subtopik\":\"Analogi\",\"pertanyaan\":\"WAKTU : DETIK = ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"suhu : termometer\"},{\"huruf\":\"B\",\"teks\":\"kuat arus listrik : ampere\"},{\"huruf\":\"C\",\"teks\":\"panjang : penggaris\"},{\"huruf\":\"D\",\"teks\":\"massa : timbangan\"},{\"huruf\":\"E\",\"teks\":\"kecepatan kendaraan : speedometer\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Rumuskan hubungannya dalam satu kalimat: **detik adalah satuan untuk mengukur waktu**. Pasangan yang setara harus berbentuk *besaran : satuannya*. Kuat arus listrik diukur dengan satuan **ampere**, sama seperti waktu diukur dalam detik. Keduanya juga termasuk satuan pokok dalam Sistem Internasional (SI). Empat opsi lain berbentuk *besaran : alat ukurnya*, yang terdengar mirip tetapi hubungannya berbeda: termometer, penggaris, timbangan, dan speedometer adalah benda, bukan satuan. Jadi, langkah terpentingnya adalah membedakan **satuan** (nama ukuran, seperti detik dan ampere) dari **alat** (benda yang dipakai untuk mengukur). Kedua hubungan ini sama-sama berkaitan dengan pengukuran sehingga mudah tertukar jika dibaca sekilas.\",\"opsi\":{\"A\":\"Termometer adalah **alat** untuk mengukur suhu. Satuan suhu adalah kelvin atau derajat Celsius.\",\"C\":\"Penggaris adalah alat ukur panjang. Satuan panjang adalah meter.\",\"D\":\"Timbangan adalah alat ukur massa. Satuan massa adalah kilogram.\",\"E\":\"Speedometer adalah alat ukur kecepatan kendaraan. Satuan kecepatan adalah meter per sekon atau kilometer per jam.\"},\"konsep\":\"**Besaran, satuan, dan alat ukur** sering sengaja dicampur dalam soal analogi. Contoh: panjang–meter–penggaris; massa–kilogram–timbangan; waktu–detik–stopwatch; suhu–kelvin–termometer; kuat arus–ampere–amperemeter.\"},\"tips\":\"Jangan berhenti pada hubungan “berkaitan dengan ukuran”. Buat kalimat yang tepat (“X adalah **satuan** untuk Y” atau “X adalah **alat** untuk mengukur Y”), lalu pakai kalimat itu untuk setiap opsi. Hanya satu opsi yang cocok persis.\",\"rujukan\":[]},{\"id\":\"p06-036\",\"kategori\":\"TIU\",\"subtopik\":\"Analogi\",\"pertanyaan\":\"SEPEDA : KENDARAAN = ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"kecapi : alat musik\"},{\"huruf\":\"B\",\"teks\":\"roda : sepeda\"},{\"huruf\":\"C\",\"teks\":\"gitar : senar\"},{\"huruf\":\"D\",\"teks\":\"piano : pemain piano\"},{\"huruf\":\"E\",\"teks\":\"biola : orkestra\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Hubungan pasangan soal adalah **jenis : golongannya**. Sepeda adalah salah satu jenis kendaraan; dalam istilah bahasa, *sepeda* adalah hiponim dan *kendaraan* adalah hipernim. Kalimat ujinya: “X adalah salah satu jenis Y.” Kecapi adalah salah satu jenis alat musik, jadi hubungannya sama persis. Urutan juga sama: yang lebih khusus di kiri, golongannya di kanan.\",\"opsi\":{\"B\":\"Hubungan **bagian : keseluruhan**. Roda adalah bagian dari sepeda, bukan jenis sepeda.\",\"C\":\"Hubungan **keseluruhan : bagian** (urutannya terbalik dari B). Senar adalah bagian dari gitar.\",\"D\":\"Hubungan **alat : pemakainya**. Pemain piano adalah orang yang memainkan piano, bukan golongan yang menaungi piano.\",\"E\":\"Distraktor terkuat. Biola memang berkaitan dengan orkestra, tetapi hubungannya **anggota/bagian : kelompok**. Orkestra adalah kelompok pemain musik, bukan golongan alat musik. Kalimat uji “biola adalah salah satu jenis orkestra” tidak benar.\"},\"konsep\":\"**Hubungan yang sering tertukar dalam analogi:** jenis–golongan (melati : bunga), bagian–keseluruhan (roda : sepeda), anggota–kelompok (pemain : tim), alat–pemakai (piano : pianis). Hubungan jenis–golongan selalu lolos uji kalimat “X adalah salah satu jenis Y”.\"},\"tips\":\"Buat kalimat uji dari pasangan soal, lalu terapkan ke setiap opsi **dengan urutan yang sama**. Banyak pengecoh hanya benar jika urutannya dibalik atau jika kalimat ujinya dilonggarkan.\",\"rujukan\":[]},{\"id\":\"p06-037\",\"kategori\":\"TIU\",\"subtopik\":\"Silogisme\",\"pertanyaan\":\"Tidak ada pegawai kontrak yang menerima tunjangan kinerja.\\nTidak ada penerima tunjangan kinerja yang bekerja paruh waktu.\\n\\nKesimpulan yang tepat adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tidak ada pegawai kontrak yang bekerja paruh waktu.\"},{\"huruf\":\"B\",\"teks\":\"Semua pegawai kontrak bekerja paruh waktu.\"},{\"huruf\":\"C\",\"teks\":\"Tidak dapat ditarik kesimpulan yang pasti.\"},{\"huruf\":\"D\",\"teks\":\"Sebagian pegawai kontrak bekerja paruh waktu.\"},{\"huruf\":\"E\",\"teks\":\"Sebagian pekerja paruh waktu bukan pegawai kontrak.\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Kedua premis berbentuk negatif (*tidak ada*). Premis 1 hanya menyatakan pegawai kontrak berada di luar kelompok penerima tunjangan; premis 2 hanya menyatakan pekerja paruh waktu juga berada di luar kelompok itu. Dua kelompok yang sama-sama berada di luar kelompok ketiga bisa beririsan, bisa juga tidak. Contoh: pegawai kontrak bisa saja semuanya bekerja paruh waktu, sebagian, atau tidak sama sekali; semua kemungkinan itu tetap memenuhi kedua premis. Karena itu, tidak ada kesimpulan yang **pasti** benar. Aturan silogisme: dari dua premis negatif tidak dapat ditarik kesimpulan.\",\"opsi\":{\"A\":\"Jebakan paling umum: mengira “tidak ada” bisa dirantai seperti “semua”. Premis tidak melarang pegawai kontrak bekerja paruh waktu.\",\"B\":\"Mungkin benar dalam satu keadaan, tetapi tidak dijamin premis.\",\"D\":\"Juga hanya mungkin. Premis tidak memberi informasi bahwa ada pegawai kontrak yang bekerja paruh waktu.\",\"E\":\"Tidak dijamin. Bisa saja semua pekerja paruh waktu adalah pegawai kontrak, dan keadaan itu tetap memenuhi kedua premis.\"},\"konsep\":\"**Aturan cepat silogisme kategoris:**\\n1. Dua premis negatif → tidak ada kesimpulan.\\n2. Dua premis *sebagian* → tidak ada kesimpulan.\\n3. Jika satu premis negatif, kesimpulan (bila ada) pasti negatif.\\n4. Term tengah harus tersebar minimal sekali.\"},\"tips\":\"Gambarkan diagram Venn: lingkaran tunjangan kinerja di tengah, dua lingkaran lain sama-sama di luarnya. Lalu coba gambar dua versi, satu dengan kedua lingkaran luar beririsan dan satu terpisah. Jika keduanya memenuhi premis, tidak ada kesimpulan pasti.\",\"rujukan\":[]},{\"id\":\"p06-038\",\"kategori\":\"TIU\",\"subtopik\":\"Silogisme\",\"pertanyaan\":\"Tidak ada aplikasi lama yang terhubung ke server pusat.\\nSemua aplikasi yang terhubung ke server pusat dilindungi enkripsi.\\nBeberapa aplikasi sudah terhubung ke server pusat.\\n\\nKesimpulan yang pasti benar adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tidak ada aplikasi lama yang dilindungi enkripsi.\"},{\"huruf\":\"B\",\"teks\":\"Sebagian aplikasi yang dilindungi enkripsi bukan aplikasi lama.\"},{\"huruf\":\"C\",\"teks\":\"Sebagian aplikasi lama tidak dilindungi enkripsi.\"},{\"huruf\":\"D\",\"teks\":\"Semua aplikasi yang dilindungi enkripsi terhubung ke server pusat.\"},{\"huruf\":\"E\",\"teks\":\"Sebagian aplikasi lama dilindungi enkripsi.\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Sebut L = aplikasi lama, S = terhubung ke server pusat, E = dilindungi enkripsi.\\n\\n- P1: Tidak ada L yang S.\\n- P2: Semua S adalah E.\\n- P3: Ada aplikasi S.\\n\\nAmbil aplikasi yang terhubung ke server (P3). Menurut P2, aplikasi itu dilindungi enkripsi. Menurut P1, aplikasi itu bukan aplikasi lama. Jadi, **ada aplikasi yang dilindungi enkripsi dan bukan aplikasi lama**, yaitu “sebagian aplikasi yang dilindungi enkripsi bukan aplikasi lama”. Kesimpulan tidak boleh bicara tentang aplikasi lama secara positif maupun negatif terhadap enkripsi, karena premis tidak memberi informasi itu.\",\"opsi\":{\"A\":\"Jebakan utama. P2 hanya menyatakan semua S masuk E, bukan semua E adalah S. Aplikasi lama tidak terhubung ke server, tetapi tetap bisa dilindungi enkripsi lewat cara lain. Kesalahan ini disebut *proses ilisit term mayor*.\",\"C\":\"Tidak dijamin. Bisa saja semua aplikasi lama ternyata dilindungi enkripsi; premis tidak melarangnya. Premis juga tidak menjamin aplikasi lama ada.\",\"D\":\"Ini *konversi* yang tidak sah dari P2. “Semua S adalah E” tidak sama dengan “semua E adalah S”.\",\"E\":\"Mungkin benar, tetapi tidak pasti. Premis tidak memberi informasi apa pun tentang enkripsi pada aplikasi lama.\"},\"konsep\":\"**Pola: Tidak ada L yang S + Semua S adalah E → Sebagian E bukan L.** Subjek kesimpulannya adalah E (kelompok yang lebih luas), bukan L. Pola ini sah karena premis “beberapa aplikasi terhubung ke server” menjamin kelompok S tidak kosong.\"},\"tips\":\"Gambarkan: lingkaran S di dalam lingkaran E; lingkaran L di luar S tetapi boleh memotong E. Lalu periksa setiap opsi: apakah opsi itu benar untuk **semua** posisi L yang mungkin? Hanya pernyataan tentang bagian E yang berisi S yang selalu benar.\",\"rujukan\":[]},{\"id\":\"p06-039\",\"kategori\":\"TIU\",\"subtopik\":\"Logika Proposisi\",\"pertanyaan\":\"Negasi dari pernyataan “Setiap pegawai mengikuti sedikitnya satu pelatihan tahun ini” adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Setiap pegawai tidak mengikuti pelatihan apa pun tahun ini.\"},{\"huruf\":\"B\",\"teks\":\"Ada pegawai yang mengikuti lebih dari satu pelatihan tahun ini.\"},{\"huruf\":\"C\",\"teks\":\"Ada pegawai yang mengikuti tepat satu pelatihan tahun ini.\"},{\"huruf\":\"D\",\"teks\":\"Setiap pegawai mengikuti paling banyak satu pelatihan tahun ini.\"},{\"huruf\":\"E\",\"teks\":\"Ada pegawai yang tidak mengikuti satu pun pelatihan tahun ini.\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Negasi dikerjakan dalam dua langkah. **Langkah 1, kuantor:** negasi dari “setiap ... (berlaku P)” adalah “ada ... yang (tidak berlaku P)”. **Langkah 2, isi pernyataan:** P adalah “mengikuti sedikitnya satu pelatihan”, artinya jumlah pelatihan ≥ 1. Negasi dari “≥ 1” adalah “\u003c 1”, yaitu 0 pelatihan, atau “tidak mengikuti satu pun pelatihan”. Gabungkan: **ada pegawai yang tidak mengikuti satu pun pelatihan tahun ini**. Cek kewajaran: pernyataan awal salah tepat ketika ditemukan satu saja pegawai yang tidak ikut pelatihan sama sekali.\",\"opsi\":{\"A\":\"Kuantornya tidak dinegasikan dengan benar. “Setiap ... tidak” adalah pernyataan yang jauh lebih kuat daripada negasi; ini *kontrari*, bukan negasi.\",\"B\":\"Mengikuti lebih dari satu pelatihan tetap memenuhi “sedikitnya satu”, jadi pernyataan ini sejalan dengan pernyataan awal, bukan negasinya.\",\"C\":\"Tepat satu pelatihan juga memenuhi “sedikitnya satu”. Opsi ini tidak membuat pernyataan awal salah.\",\"D\":\"Jebakan menegasikan “sedikitnya” menjadi “paling banyak”. Negasi dari ≥ 1 adalah \u003c 1 (yaitu 0), bukan ≤ 1.\"},\"konsep\":\"**Negasi kuantor dan batas jumlah:**\\n- ~(setiap x, P) ≡ ada x, ~P\\n- ~(ada x, P) ≡ setiap x, ~P\\n- ~(sedikitnya n) ≡ kurang dari n\\n- ~(paling banyak n) ≡ lebih dari n\"},\"tips\":\"Uji negasi dengan pertanyaan: “keadaan apa yang membuat pernyataan awal **salah**?”. Opsi yang masih bisa benar bersamaan dengan pernyataan awal (B dan C) pasti bukan negasinya.\",\"rujukan\":[]},{\"id\":\"p06-040\",\"kategori\":\"TIU\",\"subtopik\":\"Logika Proposisi\",\"pertanyaan\":\"Pernyataan yang ekuivalen dengan “Jika rapat diundur atau pimpinan berhalangan, maka laporan dikirim melalui surel” adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Jika rapat diundur, laporan dikirim melalui surel, atau jika pimpinan berhalangan, laporan dikirim melalui surel.\"},{\"huruf\":\"B\",\"teks\":\"Jika rapat diundur dan pimpinan berhalangan, maka laporan dikirim melalui surel.\"},{\"huruf\":\"C\",\"teks\":\"Jika laporan dikirim melalui surel, maka rapat diundur atau pimpinan berhalangan.\"},{\"huruf\":\"D\",\"teks\":\"Jika rapat diundur, laporan dikirim melalui surel, dan jika pimpinan berhalangan, laporan dikirim melalui surel.\"},{\"huruf\":\"E\",\"teks\":\"Jika laporan tidak dikirim melalui surel, maka rapat tidak diundur atau pimpinan tidak berhalangan.\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Misalkan p = rapat diundur, q = pimpinan berhalangan, r = laporan dikirim melalui surel. Pernyataan soal: (p ∨ q) → r.\\n\\n**Langkah 1:** ubah implikasi menjadi disjungsi: (p ∨ q) → r ≡ ~(p ∨ q) ∨ r ≡ (~p ∧ ~q) ∨ r.\\n\\n**Langkah 2:** distribusikan: (~p ∨ r) ∧ (~q ∨ r) ≡ (p → r) ∧ (q → r).\\n\\nJadi, pernyataan itu ekuivalen dengan **“jika p maka r, *dan* jika q maka r”**. Maknanya wajar: laporan dikirim lewat surel dalam **setiap** keadaan pemicunya, baik rapat diundur maupun pimpinan berhalangan. Bentuk ekuivalen lain yang juga benar adalah kontraposisinya: ~r → (~p ∧ ~q).\",\"opsi\":{\"A\":\"Jebakan kata hubung. (p → r) ∨ (q → r) ekuivalen dengan (p ∧ q) → r, yang lebih lemah. Contoh: rapat diundur, pimpinan hadir, dan laporan tidak dikirim lewat surel. Pernyataan awal salah, tetapi opsi A tetap benar karena q → r bernilai benar.\",\"B\":\"(p ∧ q) → r hanya menjamin surel dikirim jika kedua keadaan terjadi bersamaan. Pernyataan awal menjamin surel dikirim jika salah satu saja terjadi.\",\"C\":\"Ini *konvers*, yaitu r → (p ∨ q). Konvers tidak ekuivalen dengan pernyataan awal.\",\"E\":\"Kontraposisi yang negasinya keliru. ~(p ∨ q) seharusnya ~p **∧** ~q (De Morgan), bukan ~p ∨ ~q.\"},\"konsep\":\"**Dua identitas penting:**\\n- (p ∨ q) → r ≡ (p → r) ∧ (q → r)\\n- (p ∧ q) → r ≡ (p → r) ∨ (q → r)\\n\\nPerhatikan pertukaran kata hubungnya: “atau” di anteseden menjadi “dan” di antara dua implikasi, dan sebaliknya.\"},\"tips\":\"Cara cepat: cari satu keadaan yang membuat pernyataan awal **salah** (misalnya p benar, q salah, r salah), lalu uji setiap opsi pada keadaan itu. Opsi yang ekuivalen juga harus salah pada keadaan tersebut. Di sini hanya D yang ikut salah.\",\"rujukan\":[]},{\"id\":\"p06-041\",\"kategori\":\"TIU\",\"subtopik\":\"Penalaran Analitis\",\"pertanyaan\":\"Lima map berwarna merah, biru, hijau, kuning, dan putih ditumpuk satu di atas yang lain. Diketahui:\\n\\n1. Map kuning berada tepat di atas map hijau.\\n2. Map merah tidak berada di posisi paling atas maupun paling bawah.\\n3. Map putih berada di atas map biru (tidak harus tepat di atasnya).\\n4. Map merah bersebelahan dengan map kuning.\\n5. Map biru tidak bersebelahan dengan map hijau.\\n\\nMap pada urutan ketiga dari atas adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"merah\"},{\"huruf\":\"B\",\"teks\":\"biru\"},{\"huruf\":\"C\",\"teks\":\"kuning\"},{\"huruf\":\"D\",\"teks\":\"hijau\"},{\"huruf\":\"E\",\"teks\":\"putih\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Beri nomor posisi 1 (paling atas) sampai 5 (paling bawah).\\n\\n- Syarat 1: kuning tepat di atas hijau, jadi ada blok **K–H**.\\n- Syarat 4: merah bersebelahan dengan kuning. Bawah kuning sudah diisi hijau, jadi merah tepat di atas kuning: blok **M–K–H**.\\n- Syarat 2: merah bukan di posisi 1, jadi blok menempati posisi 2–3–4 atau 3–4–5.\\n- Jika posisi 2–3–4: putih dan biru mengisi posisi 1 dan 5. Syarat 3 memaksa putih di 1 dan biru di 5, tetapi biru (5) bersebelahan dengan hijau (4), melanggar syarat 5.\\n- Jika posisi 3–4–5: putih dan biru mengisi posisi 1 dan 2; syarat 3 memberi putih di 1 dan biru di 2. Biru (2) tidak bersebelahan dengan hijau (5). Semua syarat terpenuhi.\\n\\nUrutan: putih, biru, **merah**, kuning, hijau. Posisi ketiga adalah merah.\",\"opsi\":{\"B\":\"Biru di posisi ketiga muncul jika syarat 4 diabaikan, misalnya susunan putih, merah, biru, kuning, hijau. Susunan itu memenuhi syarat lain, tetapi merah (2) tidak bersebelahan dengan kuning (4).\",\"C\":\"Kuning berada di posisi ketiga hanya pada susunan putih, merah, kuning, hijau, biru, yang gugur oleh syarat 5. Ini jawaban bagi yang lupa memeriksa syarat terakhir.\",\"D\":\"Hijau di posisi ketiga muncul jika syarat 2 diabaikan, misalnya merah ditaruh paling atas. Susunan itu melanggar syarat 2.\",\"E\":\"Putih di posisi ketiga juga hanya mungkin jika syarat 4 diabaikan. Dengan blok merah–kuning–hijau yang utuh, putih selalu terdorong ke posisi paling atas.\"},\"konsep\":\"**Strategi soal urutan:** mulai dari syarat yang paling mengikat (blok tetap seperti “tepat di atas”), gabungkan dengan syarat kedekatan untuk memperbesar blok, lalu uji setiap posisi blok yang mungkin dengan syarat sisanya.\"},\"tips\":\"Cari pasangan syarat yang bisa digabung menjadi blok tiga unsur (di sini syarat 1 dan 4). Setelah blok terbentuk, kemungkinan susunannya tinggal sedikit dan bisa dicek satu per satu dalam kurang dari satu menit.\",\"rujukan\":[]},{\"id\":\"p06-042\",\"kategori\":\"TIU\",\"subtopik\":\"Penalaran Analitis\",\"pertanyaan\":\"Empat tim, yaitu P, Q, R, dan S, mengikuti kompetisi setengah putaran: setiap tim bertemu setiap tim lain tepat satu kali. Kemenangan bernilai 3, seri bernilai 1, dan kekalahan bernilai 0. Klasemen akhir menunjukkan poin P = 7, Q = 5, R = 2, dan S = 1.\\n\\nTim yang bermain seri melawan S adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"P\"},{\"huruf\":\"B\",\"teks\":\"Q\"},{\"huruf\":\"C\",\"teks\":\"tidak dapat ditentukan dari klasemen\"},{\"huruf\":\"D\",\"teks\":\"Q atau R, tetapi tidak dapat dipastikan yang mana\"},{\"huruf\":\"E\",\"teks\":\"R\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Setiap tim bermain 3 kali. **Langkah 1, uraikan poin:** P = 7 = 3 + 3 + 1 (2 menang, 1 seri); Q = 5 = 3 + 1 + 1 (1 menang, 2 seri); R = 2 = 1 + 1 + 0 (2 seri); S = 1 = 1 + 0 + 0 (1 seri). Jumlah keterlibatan seri 1 + 2 + 2 + 1 = 6, jadi ada 3 pertandingan seri.\\n\\n**Langkah 2, pasangkan seri:** S hanya seri sekali. Jika S seri dengan P, sisa seri Q dan R (masing-masing 2) harus dipenuhi dua pertandingan Q–R, padahal mereka hanya bertemu sekali. Jadi lawan seri S adalah Q atau R, dan pasangan seri membentuk rantai P–x–y–S.\\n\\n**Langkah 3, cek kemenangan:** jika rantainya P–R–Q–S, Q seri dengan R dan S lalu kalah dari P, sehingga Q tidak punya kemenangan (hanya 2 poin). Kontradiksi. Rantai yang benar P–Q–R–S: S seri dengan **R**.\",\"opsi\":{\"A\":\"Memasangkan dua tim yang sama-sama punya satu seri (P dan S) terasa wajar, tetapi membuat Q dan R harus seri dua kali satu sama lain. Tidak mungkin.\",\"B\":\"Rantai P–R–Q–S memang memenuhi jumlah seri, tetapi gagal di langkah kemenangan: Q tidak mendapat satu pun kemenangan sehingga poinnya 2, bukan 5.\",\"C\":\"Kesimpulan prematur bagi yang berhenti di langkah 1. Dengan memeriksa pasangan seri dan kemenangan, jawabannya tunggal.\",\"D\":\"Hasil bagi yang berhenti di langkah 2. Langkah 3 (memeriksa kemenangan Q) menyingkirkan kemungkinan Q.\"},\"konsep\":\"**Rumus cepat kompetisi:** setengah putaran n tim = n(n − 1)/2 pertandingan. Jika semua laga ada pemenangnya, total poin = 3 × jumlah laga. Setiap seri mengurangi total sebesar 1 (3 menjadi 1 + 1 = 2). Di sini 6 laga → maksimum 18 poin; total 15 → 3 seri.\"},\"tips\":\"Uraikan poin setiap tim menjadi kombinasi menang/seri/kalah dulu, karena uraiannya biasanya tunggal. Lalu cek dari dua sisi: pasangan seri harus konsisten, **dan** jumlah kemenangan setiap tim harus konsisten. Banyak pengecoh lolos dari cek pertama tetapi gagal di cek kedua.\",\"rujukan\":[]},{\"id\":\"p06-043\",\"kategori\":\"TIU\",\"subtopik\":\"Penalaran Analitis\",\"pertanyaan\":\"Enam petugas, yaitu A, B, C, D, E, dan F, ditempatkan di enam loket yang tersusun dalam dua baris (depan dan belakang). Setiap baris terdiri atas tiga loket: kiri, tengah, dan kanan. Ketentuannya:\\n\\n1. A dan B berada di baris yang sama dan loketnya bersebelahan.\\n2. C berada di loket tengah, tetapi tidak sebaris dengan A.\\n3. D berada tepat di depan atau tepat di belakang A.\\n4. E berada di baris depan.\\n5. F tidak berada di loket kiri.\\n\\nPernyataan yang **pasti benar** adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"A berada di baris depan.\"},{\"huruf\":\"B\",\"teks\":\"F berada di loket kanan baris belakang.\"},{\"huruf\":\"C\",\"teks\":\"D berada di baris belakang.\"},{\"huruf\":\"D\",\"teks\":\"C berada di baris depan.\"},{\"huruf\":\"E\",\"teks\":\"B bersebelahan dengan E di baris yang sama.\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"**Langkah 1:** C di loket tengah pada baris yang bukan baris A. D sekolom dengan A di baris lain, jadi D berada di baris yang sama dengan C. Karena loket tengah baris itu milik C, D tidak di tengah; berarti A juga tidak di tengah. Supaya A dan B bersebelahan, B pasti di tengah baris A.\\n\\n**Langkah 2:** jika A di kanan, loket yang tersisa adalah dua loket kiri (satu di tiap baris), dan salah satunya harus diisi F. Ini melanggar syarat 5. Jadi A di **kiri**, dan dua loket sisa adalah dua loket **kanan**.\\n\\n**Langkah 3:** E harus di baris depan, jadi E di kanan depan dan **F di kanan belakang**. Baris A sendiri boleh depan atau belakang, sehingga ada dua susunan:\\n\\n- Depan: A, B, E · Belakang: D, C, F\\n- Depan: D, C, E · Belakang: A, B, F\\n\\nDi kedua susunan, F selalu di loket kanan baris belakang.\",\"opsi\":{\"A\":\"Hanya benar pada susunan pertama. Pada susunan kedua, A di baris belakang.\",\"C\":\"D di baris belakang hanya pada susunan pertama; pada susunan kedua D di depan.\",\"D\":\"C di depan hanya pada susunan kedua. Pernyataan ini *mungkin* benar, bukan *pasti* benar.\",\"E\":\"Pada susunan pertama, B (tengah depan) bersebelahan dengan E (kanan depan). Pada susunan kedua, B di belakang sehingga tidak bersebelahan dengan E.\"},\"konsep\":\"**Soal “pasti benar” dengan lebih dari satu susunan:** cari semua susunan yang memenuhi syarat, lalu pilih pernyataan yang benar di **setiap** susunan. Pernyataan yang benar hanya di sebagian susunan adalah “mungkin benar” dan menjadi pengecoh.\"},\"tips\":\"Mulai dari unsur yang posisinya paling terkunci (C di tengah, D sekolom dengan A). Jika muncul dua kemungkinan simetris (baris depan atau belakang), jangan menebak satu; kerjakan keduanya, lalu bandingkan pernyataan yang tetap sama.\",\"rujukan\":[]},{\"id\":\"p06-044\",\"kategori\":\"TIU\",\"subtopik\":\"Deret Angka\",\"pertanyaan\":\"2, 3, 4, 9, 16, 29, 54, ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"83\"},{\"huruf\":\"B\",\"teks\":\"108\"},{\"huruf\":\"C\",\"teks\":\"99\"},{\"huruf\":\"D\",\"teks\":\"104\"},{\"huruf\":\"E\",\"teks\":\"45\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Setiap suku mulai suku keempat adalah **jumlah tiga suku sebelumnya**:\\n\\n- 2 + 3 + 4 = 9\\n- 3 + 4 + 9 = 16\\n- 4 + 9 + 16 = 29\\n- 9 + 16 + 29 = 54\\n- 16 + 29 + 54 = **99**\\n\\nPola ini mirip deret Fibonacci, tetapi yang dijumlahkan tiga suku, bukan dua. Petunjuknya: selisih antarsuku (1, 1, 5, 7, 13, 25) tidak membentuk pola sederhana, sedangkan suku-sukunya tumbuh hampir dua kali lipat. Kedua ciri itu khas deret penjumlahan beberapa suku sebelumnya.\",\"opsi\":{\"A\":\"54 + 29 = 83 adalah hasil pola Fibonacci (jumlah **dua** suku sebelumnya). Pola itu sudah gagal sejak awal: 3 + 4 = 7, bukan 9.\",\"B\":\"54 × 2 = 108 berasal dari dugaan pola “kali dua”. Pola itu tidak cocok dengan suku-suku sebelumnya, misalnya 29 × 2 = 58, bukan 54.\",\"D\":\"Selisih terakhir 25 dikalikan dua menjadi 50, lalu 54 + 50 = 104. Selisihnya memang hampir berlipat dua, tetapi tidak tepat (13 × 2 = 26, bukan 25).\",\"E\":\"45 adalah **selisih** berikutnya (7 + 13 + 25), bukan suku berikutnya. Selisih deret ini juga mengikuti pola jumlah tiga, tetapi yang ditanyakan adalah suku, yaitu 54 + 45 = 99.\"},\"konsep\":\"**Ciri deret penjumlahan suku sebelumnya:** pertumbuhan tidak tetap, rasio mendekati angka tertentu (sekitar 1,8 untuk jumlah tiga suku), dan selisih tidak berpola sederhana. Coba jumlah dua suku dulu; jika gagal, coba jumlah tiga suku.\"},\"tips\":\"Setelah menemukan pola, uji minimal pada **tiga** suku sebelum menghitung jawaban. Pengecoh deret biasanya hanya cocok untuk satu atau dua suku terakhir.\",\"rujukan\":[]},{\"id\":\"p06-045\",\"kategori\":\"TIU\",\"subtopik\":\"Deret Huruf\",\"pertanyaan\":\"AZ, CX, EV, GT, ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"HS\"},{\"huruf\":\"B\",\"teks\":\"IS\"},{\"huruf\":\"C\",\"teks\":\"JR\"},{\"huruf\":\"D\",\"teks\":\"IR\"},{\"huruf\":\"E\",\"teks\":\"HR\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Ubah huruf menjadi nomor urut alfabet (A = 1, Z = 26).\\n\\n- Huruf pertama: A(1), C(3), E(5), G(7) → **naik 2** → berikutnya 9 = **I**.\\n- Huruf kedua: Z(26), X(24), V(22), T(20) → **turun 2** → berikutnya 18 = **R**.\\n\\nJadi suku berikutnya **IR**. Perhatikan juga bahwa setiap pasangan saling mencerminkan: jumlah nomor kedua hurufnya selalu 27 (1 + 26, 3 + 24, 5 + 22, 7 + 20, 9 + 18). Sifat ini bisa dipakai sebagai cara cek cepat.\",\"opsi\":{\"A\":\"HS diperoleh jika kedua huruf hanya bergeser satu (G → H dan T → S), padahal setiap langkah bergeser dua.\",\"B\":\"Huruf pertama sudah benar (I), tetapi huruf kedua hanya mundur satu (T → S).\",\"C\":\"Huruf pertama melompat tiga (G → J). Huruf kedua R memang benar, tetapi jumlah posisinya 10 + 18 = 28, bukan 27.\",\"E\":\"Huruf pertama hanya maju satu (G → H). Jumlah posisinya 8 + 18 = 26, tidak sesuai pola cermin.\"},\"konsep\":\"**Pasangan cermin alfabet:** A–Z, B–Y, C–X, D–W, E–V, F–U, G–T, H–S, I–R, J–Q, K–P, L–O, M–N. Nomor urut setiap pasangan berjumlah 27.\"},\"tips\":\"Untuk deret pasangan huruf, pisahkan menjadi dua deret: huruf pertama dan huruf kedua. Jika satu naik dan yang lain turun dengan langkah sama, cek jumlah 27 untuk memastikan jawaban dalam hitungan detik.\",\"rujukan\":[]},{\"id\":\"p06-046\",\"kategori\":\"TIU\",\"subtopik\":\"Deret Huruf\",\"pertanyaan\":\"T, X, B, F, J, ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"M\"},{\"huruf\":\"B\",\"teks\":\"O\"},{\"huruf\":\"C\",\"teks\":\"N\"},{\"huruf\":\"D\",\"teks\":\"R\"},{\"huruf\":\"E\",\"teks\":\"T\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Tulis nomor urut alfabet: T = 20, X = 24. Langkahnya **+4**. Setelah X, 24 + 4 = 28 melewati Z (26), sehingga hitungan berputar kembali ke awal: 28 − 26 = 2 = **B**. Lalu B(2) + 4 = F(6), F + 4 = J(10), dan J + 4 = 14 = **N**.\\n\\nDeret ini sering terlihat acak karena lompatan dari X ke B. Kuncinya adalah memperlakukan alfabet sebagai **lingkaran**: setelah Z kembali ke A. Cara menghitung tanpa angka: dari J lompati K, L, M, lalu berhenti di N.\",\"opsi\":{\"A\":\"M diperoleh jika menghitung huruf J sebagai hitungan pertama (J, K, L, M), sehingga hanya maju tiga. Kesalahan hitung ini sangat umum pada deret huruf.\",\"B\":\"O berasal dari langkah +5, yaitu salah menghitung jarak T ke X sebagai lima huruf (T, U, V, W, X).\",\"D\":\"R muncul jika deret dibaca sebagai dua deret berselang (T, B, J dan X, F) lalu suku berikutnya dianggap milik deret pertama (J + 8). Padahal suku keenam milik deret kedua: F + 8 = N, hasilnya sama dengan pola +4.\",\"E\":\"T muncul jika deret dianggap berulang dari awal setelah lima suku. Tidak ada petunjuk perulangan; polanya +4 yang konsisten.\"},\"konsep\":\"**Alfabet melingkar:** nomor \u003e 26 dikurangi 26 (27 = A, 28 = B, dan seterusnya). Hafalkan posisi huruf penanda: E = 5, J = 10, O = 15, T = 20, Y = 25. Dengan penanda ini, nomor huruf lain cepat ditemukan.\"},\"tips\":\"Jika deret huruf tiba-tiba “melompat mundur” (misalnya dari X ke B), curigai putaran alfabet. Tambahkan 26 pada huruf yang tampak mundur, lalu periksa apakah selisihnya tetap.\",\"rujukan\":[]},{\"id\":\"p06-047\",\"kategori\":\"TIU\",\"subtopik\":\"Deret Huruf\",\"pertanyaan\":\"AC, DG, HL, MR, ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"RX\"},{\"huruf\":\"B\",\"teks\":\"SX\"},{\"huruf\":\"C\",\"teks\":\"TZ\"},{\"huruf\":\"D\",\"teks\":\"RW\"},{\"huruf\":\"E\",\"teks\":\"SY\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Ada dua pola yang berjalan bersamaan.\\n\\n**Pola 1, huruf pertama antarpasangan:** A(1), D(4), H(8), M(13). Lompatannya +3, +4, +5, sehingga berikutnya **+6** → 19 = **S**.\\n\\n**Pola 2, jarak di dalam pasangan:** A→C = +2, D→G = +3, H→L = +4, M→R = +5. Berikutnya **+6**: S(19) + 6 = 25 = **Y**.\\n\\nJadi suku berikutnya **SY**. Soal ini sulit karena kedua lompatan sama-sama bertambah satu; peserta yang hanya menemukan salah satu pola akan memilih pengecoh.\",\"opsi\":{\"A\":\"RX: huruf pertama dianggap tetap melompat +5 (M → R), jarak dalam pasangan sudah benar +6. Pola 1 belum ditemukan.\",\"B\":\"SX: huruf pertama benar, tetapi jarak dalam pasangan dianggap tetap +5. Pola 2 belum ditemukan.\",\"C\":\"TZ: salah hitung lompatan +6 dari M dengan ikut menghitung M (M, N, O, P, Q, R, S → berhenti di T), lalu T + 6 = Z.\",\"D\":\"RW: kedua lompatan dianggap tetap +5, sehingga M + 5 = R dan R + 5 = W.\"},\"konsep\":\"**Deret pasangan huruf** bisa menyimpan dua jenis pola: pola **antarpasangan** (huruf pertama ke huruf pertama) dan pola **dalam pasangan** (huruf pertama ke huruf kedua). Periksa keduanya, karena soal sulit biasanya menggerakkan keduanya sekaligus.\"},\"tips\":\"Tulis nomor urut di bawah setiap huruf, lalu buat dua baris selisih: satu untuk antarpasangan dan satu untuk dalam pasangan. Jangan memilih jawaban sebelum kedua baris selisih berpola jelas.\",\"rujukan\":[]},{\"id\":\"p06-048\",\"kategori\":\"TIU\",\"subtopik\":\"Aljabar\",\"pertanyaan\":\"Jika 4(x − 3) = 2(x + 5), nilai x² − 3x adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"88\"},{\"huruf\":\"B\",\"teks\":\"4\"},{\"huruf\":\"C\",\"teks\":\"154\"},{\"huruf\":\"D\",\"teks\":\"121\"},{\"huruf\":\"E\",\"teks\":\"46,75\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"**Langkah 1, selesaikan persamaan:**\\n4(x − 3) = 2(x + 5)\\n4x − 12 = 2x + 10\\n2x = 22\\nx = 11\\n\\n**Langkah 2, substitusi:**\\nx² − 3x = 11² − 3 × 11 = 121 − 33 = **88**.\\n\\nCara cek: masukkan x = 11 ke persamaan awal. Ruas kiri 4 × 8 = 32, ruas kanan 2 × 16 = 32. Sama, jadi x = 11 benar. Cara lain menghitung langkah 2 adalah memfaktorkan: x² − 3x = x(x − 3) = 11 × 8 = 88, yang lebih cepat dihitung di kepala.\",\"opsi\":{\"B\":\"Kesalahan membuka kurung: 4x − 3 = 2x + 5 (tidak mengalikan angka di dalam kurung), sehingga x = 4 dan 16 − 12 = 4.\",\"C\":\"Tanda salah pada langkah 2: x² + 3x = 121 + 33 = 154.\",\"D\":\"Hanya menghitung x² dan lupa mengurangkan 3x.\",\"E\":\"Hanya satu kurung yang dibuka dengan benar: 4x − 12 = 2x + 5, sehingga x = 8,5 dan 8,5² − 3 × 8,5 = 72,25 − 25,5 = 46,75.\"},\"konsep\":\"**Sifat distributif:** a(b + c) = ab + ac. Setiap suku di dalam kurung harus dikalikan. Untuk bentuk x² − 3x, memfaktorkan menjadi x(x − 3) sering mempercepat hitungan.\"},\"tips\":\"Setelah mendapat nilai x, selalu cek ke persamaan awal; cuma butuh beberapa detik. Jika ada bentuk kuadrat yang perlu dihitung, faktorkan dulu agar angka yang dikalikan lebih kecil.\",\"rujukan\":[]},{\"id\":\"p06-049\",\"kategori\":\"TIU\",\"subtopik\":\"Aljabar\",\"pertanyaan\":\"Tiga paket bantuan, yaitu A, B, dan C, ditimbang berpasangan. Berat A dan B adalah 17 kg, berat B dan C adalah 23 kg, serta berat A dan C adalah 20 kg. Berat paket B adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"7 kg\"},{\"huruf\":\"B\",\"teks\":\"10 kg\"},{\"huruf\":\"C\",\"teks\":\"13 kg\"},{\"huruf\":\"D\",\"teks\":\"30 kg\"},{\"huruf\":\"E\",\"teks\":\"8,5 kg\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Jumlahkan ketiga persamaan:\\n\\n(A + B) + (B + C) + (A + C) = 17 + 23 + 20\\n2(A + B + C) = 60\\nA + B + C = 30\\n\\nSetiap paket muncul **dua kali** dalam penjumlahan, sehingga hasilnya dibagi dua. Lalu kurangkan pasangan yang **tidak** memuat B:\\n\\nB = (A + B + C) − (A + C) = 30 − 20 = **10 kg**.\\n\\nCek: A = 30 − 23 = 7, C = 30 − 17 = 13. Maka A + B = 17, B + C = 23, dan A + C = 20. Semua cocok.\",\"opsi\":{\"A\":\"7 kg adalah berat paket **A** (30 − 23). Hasil benar untuk paket yang salah, biasanya karena mengurangkan pasangan B + C.\",\"C\":\"13 kg adalah berat paket **C** (30 − 17).\",\"D\":\"30 kg adalah berat ketiga paket sekaligus. Peserta berhenti setelah menemukan A + B + C.\",\"E\":\"8,5 kg diperoleh dengan membagi 17 dua, seolah-olah A dan B sama berat. Tidak ada informasi bahwa keduanya sama.\"},\"konsep\":\"**Pola jumlah berpasangan:** jika diketahui x + y, y + z, dan x + z, maka x + y + z = setengah dari jumlah ketiganya. Satu besaran = total − pasangan yang tidak memuatnya. Cara ini jauh lebih cepat daripada eliminasi satu per satu.\"},\"tips\":\"Jika tiga persamaan masing-masing memuat dua dari tiga variabel, langsung jumlahkan semuanya. Lalu baca ulang soal untuk memastikan variabel mana yang ditanyakan; dua pengecoh di sini adalah jawaban untuk variabel lain.\",\"rujukan\":[]},{\"id\":\"p06-050\",\"kategori\":\"TIU\",\"subtopik\":\"Aljabar\",\"pertanyaan\":\"Biaya sewa bus Rp360.000 ditanggung rata oleh semua peserta. Karena ada 3 orang lagi yang ikut, setiap peserta membayar Rp6.000 lebih sedikit daripada rencana semula. Banyak peserta yang akhirnya ikut adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"12 orang\"},{\"huruf\":\"B\",\"teks\":\"60 orang\"},{\"huruf\":\"C\",\"teks\":\"20 orang\"},{\"huruf\":\"D\",\"teks\":\"15 orang\"},{\"huruf\":\"E\",\"teks\":\"24 orang\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Misalkan banyak peserta semula n. Iuran semula 360.000/n dan iuran akhir 360.000/(n + 3).\\n\\n360.000/n − 360.000/(n + 3) = 6.000\\n\\nBagi kedua ruas dengan 6.000: 60/n − 60/(n + 3) = 1\\n60(n + 3) − 60n = n(n + 3)\\n180 = n² + 3n\\nn² + 3n − 180 = 0\\n(n + 15)(n − 12) = 0 → n = 12\\n\\nPeserta **semula** 12 orang, tetapi yang ditanyakan adalah peserta **akhir**: 12 + 3 = **15 orang**. Cek: 360.000/12 = 30.000 dan 360.000/15 = 24.000; selisihnya 6.000.\",\"opsi\":{\"A\":\"12 orang adalah banyak peserta semula. Perhitungannya benar, tetapi menjawab pertanyaan yang salah.\",\"B\":\"60 diperoleh dari 360.000 ÷ 6.000, yaitu membagi total biaya dengan selisih iuran. Selisih iuran bukan iuran per orang, jadi pembagian ini tidak bermakna.\",\"C\":\"20 diperoleh dari 60 ÷ 3, lanjutan dari kesalahan opsi B.\",\"E\":\"24 adalah iuran akhir per orang dalam ribuan rupiah (Rp24.000), bukan banyak peserta.\"},\"konsep\":\"**Bentuk n(n + k) = c** sering muncul pada soal pembagian rata. Faktorkan dengan mencari dua bilangan yang selisihnya k dan hasil kalinya c (di sini 12 × 15 = 180, selisih 3). Cara ini lebih cepat daripada rumus abc.\"},\"tips\":\"Cara uji cepat saat ujian: coba setiap opsi sebagai peserta akhir. Untuk 15 orang, iuran 24.000; peserta semula 12 orang, iuran 30.000; selisih 6.000. Cocok. Jangan lupa membedakan “semula” dan “akhirnya”.\",\"rujukan\":[]},{\"id\":\"p06-051\",\"kategori\":\"TIU\",\"subtopik\":\"Aljabar\",\"pertanyaan\":\"Tarif sebuah taksi terdiri atas biaya awal yang tetap ditambah biaya per kilometer yang juga tetap. Perjalanan 5 km bertarif Rp32.500, sedangkan perjalanan 12 km bertarif Rp62.250. Tarif untuk perjalanan 20 km adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Rp130.000\"},{\"huruf\":\"B\",\"teks\":\"Rp103.750\"},{\"huruf\":\"C\",\"teks\":\"Rp96.250\"},{\"huruf\":\"D\",\"teks\":\"Rp85.000\"},{\"huruf\":\"E\",\"teks\":\"Rp113.250\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Tulis tarif sebagai T = a + bx, dengan a = biaya awal dan b = biaya per km.\\n\\n**Langkah 1, cari b:** selisih tarif dibagi selisih jarak.\\nb = (62.250 − 32.500) ÷ (12 − 5) = 29.750 ÷ 7 = 4.250.\\n\\n**Langkah 2, cari a:** a = 32.500 − 5 × 4.250 = 32.500 − 21.250 = 11.250.\\n\\n**Langkah 3, hitung 20 km:** T = 11.250 + 20 × 4.250 = 11.250 + 85.000 = **Rp96.250**.\\n\\nCek dengan data kedua: 11.250 + 12 × 4.250 = 11.250 + 51.000 = 62.250. Cocok.\",\"opsi\":{\"A\":\"Rp130.000 diperoleh dengan menganggap tarif sebanding jarak: 32.500 × 4. Cara ini lupa bahwa biaya awal hanya dibayar sekali.\",\"B\":\"Rp103.750 juga dari anggapan sebanding: 62.250 × 20/12. Kesalahannya sama dengan A, hanya memakai data kedua.\",\"D\":\"Rp85.000 hanya biaya per km untuk 20 km (20 × 4.250). Biaya awal Rp11.250 terlupa.\",\"E\":\"Rp113.250 berasal dari biaya awal yang salah: 32.500 − 4.250 = 28.250 (hanya dikurangi biaya satu kilometer), lalu 28.250 + 85.000.\"},\"konsep\":\"**Hubungan linear tidak sama dengan sebanding.** Jika ada biaya tetap (a ≠ 0), menggandakan jarak tidak menggandakan tarif. Kemiringan b dihitung dari selisih: b = ΔT/Δx.\"},\"tips\":\"Jika soal menyebut “biaya awal” atau “biaya tetap”, jangan pakai perbandingan senilai. Hitung dulu biaya per satuan dari selisih dua data, lalu biaya tetapnya; terakhir cek dengan data yang belum dipakai.\",\"rujukan\":[]},{\"id\":\"p06-052\",\"kategori\":\"TIU\",\"subtopik\":\"Bilangan\",\"pertanyaan\":\"Bilangan asli terkecil yang bersisa 3 jika dibagi 4, dibagi 5, maupun dibagi 6, serta habis dibagi 7 adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"63\"},{\"huruf\":\"B\",\"teks\":\"60\"},{\"huruf\":\"C\",\"teks\":\"123\"},{\"huruf\":\"D\",\"teks\":\"3\"},{\"huruf\":\"E\",\"teks\":\"423\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"**Langkah 1, syarat sisa sama:** bilangan yang bersisa 3 jika dibagi 4, 5, dan 6 berbentuk (kelipatan KPK) + 3. KPK(4, 5, 6) = 60, jadi kandidatnya 3, 63, 123, 183, dan seterusnya (60k + 3).\\n\\n**Langkah 2, syarat habis dibagi 7:** periksa kandidat dari yang terkecil.\\n- 3 ÷ 7 tidak habis.\\n- 63 ÷ 7 = 9, habis.\\n\\nJadi jawabannya **63**. Cek ulang: 63 = 4 × 15 + 3, 63 = 5 × 12 + 3, 63 = 6 × 10 + 3. Semua sisanya 3.\",\"opsi\":{\"B\":\"60 adalah KPK(4, 5, 6) tanpa ditambah sisa 3. Bilangan ini habis dibagi 4, 5, dan 6, jadi sisanya 0, bukan 3. Juga tidak habis dibagi 7.\",\"C\":\"123 adalah kandidat berikutnya (60 × 2 + 3), tetapi 123 ÷ 7 = 17 sisa 4. Peserta yang tidak mengecek syarat habis dibagi 7 bisa memilih ini.\",\"D\":\"3 memang bersisa 3 jika dibagi 4, 5, dan 6 (karena 3 lebih kecil dari pembaginya), tetapi tidak habis dibagi 7. Syarat kedua terlewat.\",\"E\":\"423 berasal dari KPK(4, 5, 6, 7) = 420 lalu ditambah 3. Kesalahannya: syarat 7 diperlakukan sama dengan syarat lain (bersisa 3), padahal yang diminta habis dibagi 7. Lagi pula 423 bukan yang terkecil.\"},\"konsep\":\"**Rumus sisa sama:** jika n dibagi a, b, c selalu bersisa s, maka n = k × KPK(a, b, c) + s. Syarat tambahan diuji pada kandidat berurutan mulai dari yang terkecil.\"},\"tips\":\"Susun kandidat dengan rumus KPK + sisa, lalu uji syarat tambahan satu per satu. Untuk mengecek habis dibagi 7 secara cepat, kurangkan kelipatan 7 yang dekat (63 = 70 − 7).\",\"rujukan\":[]},{\"id\":\"p06-053\",\"kategori\":\"TIU\",\"subtopik\":\"Bilangan\",\"pertanyaan\":\"Banyak bilangan bulat dari 1 sampai 300 yang habis dibagi 4 atau 6, tetapi **tidak** habis dibagi 5, adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"100\"},{\"huruf\":\"B\",\"teks\":\"105\"},{\"huruf\":\"C\",\"teks\":\"75\"},{\"huruf\":\"D\",\"teks\":\"125\"},{\"huruf\":\"E\",\"teks\":\"80\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"**Langkah 1, kelipatan 4 atau 6** (inklusi-eksklusi):\\n- Kelipatan 4: 300 ÷ 4 = 75\\n- Kelipatan 6: 300 ÷ 6 = 50\\n- Kelipatan keduanya = kelipatan KPK(4, 6) = 12: 300 ÷ 12 = 25\\n- Kelipatan 4 atau 6 = 75 + 50 − 25 = 100\\n\\n**Langkah 2, buang yang habis dibagi 5** dari kelompok itu:\\n- Kelipatan 4 dan 5 = kelipatan 20: 15\\n- Kelipatan 6 dan 5 = kelipatan 30: 10\\n- Kelipatan ketiganya = kelipatan 60: 5\\n- Yang harus dibuang = 15 + 10 − 5 = 20\\n\\nHasil: 100 − 20 = **80**.\",\"opsi\":{\"A\":\"100 adalah hasil langkah 1 saja. Syarat “tidak habis dibagi 5” terlupa.\",\"B\":\"105 = 75 + 50 − 20: irisan kelipatan 12 lupa dikurangi, padahal kelipatan 5 sudah dibuang.\",\"C\":\"75 = 100 − 25: kelipatan 20 dan 30 dibuang tanpa mengurangi irisannya (kelipatan 60), sehingga 5 bilangan terbuang dua kali.\",\"D\":\"125 = 75 + 50, tanpa pengurangan apa pun. Kelipatan 12 terhitung dua kali dan syarat 5 diabaikan.\"},\"konsep\":\"**Inklusi-eksklusi:** |A ∪ B| = |A| + |B| − |A ∩ B|. Irisan kelipatan a dan b adalah kelipatan KPK(a, b), bukan kelipatan a × b (KPK(4, 6) = 12, bukan 24). Prinsip yang sama dipakai lagi saat membuang kelompok pengecualian.\"},\"tips\":\"Kerjakan bertahap dan tulis angka setiap tahap. Ingat dua jebakan klasik: irisan memakai **KPK**, dan setiap kali menggabungkan dua kelompok, irisannya harus dikurangi **sekali**.\",\"rujukan\":[]},{\"id\":\"p06-054\",\"kategori\":\"TIU\",\"subtopik\":\"Analogi Gambar\",\"pertanyaan\":\"Perhatikan hubungan antargambar berikut. Pilihan A–E ada pada gambar kedua.\\n\\nGambar yang tepat untuk mengisi tanda tanya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Gambar A\"},{\"huruf\":\"B\",\"teks\":\"Gambar B\"},{\"huruf\":\"C\",\"teks\":\"Gambar C\"},{\"huruf\":\"D\",\"teks\":\"Gambar D\"},{\"huruf\":\"E\",\"teks\":\"Gambar E\"}],\"gambar\":[{\"src\":\"$11\",\"alt\":\"Analogi: gambar pertama lingkaran hitam utuh; gambar kedua hanya setengah kiri lingkaran yang hitam, setengah kanan tinggal garis putus-putus; gambar ketiga bangun rumah hitam utuh (atap segitiga di atas badan persegi); gambar keempat bertanda tanya.\"},{\"src\":\"$12\",\"alt\":\"Pilihan, semuanya dengan garis putus-putus bentuk rumah utuh: A hanya setengah kanan yang hitam; B hanya setengah kiri yang hitam; C hanya setengah atas yang hitam; D hanya setengah bawah yang hitam; E rumah hitam utuh.\"}],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Gambar pertama: **lingkaran hitam utuh**. Gambar kedua: lingkaran yang sama, tetapi hanya **setengah kiri** yang masih hitam; setengah kanan tinggal garis putus-putus. Artinya, bangun dibelah dengan garis tegak di tengah, lalu hanya bagian kiri yang dipertahankan. Bentuk dan posisinya tidak berubah.\\n\\nTerapkan pada gambar ketiga, yaitu **rumah hitam utuh**. Belah dengan garis tegak di tengah dan sisakan bagian kiri: separuh kiri atap dan separuh kiri badan rumah tetap hitam, sedangkan separuh kanan tinggal garis putus-putus. Itu gambar **B**.\\n\\nGaris putus-putus membantu melihat bagian mana yang hilang, jadi yang perlu dicocokkan adalah **arah potongan** (tegak, bukan mendatar) dan **sisi yang disisakan** (kiri, bukan kanan).\",\"opsi\":{\"A\":\"Potongannya tegak, tetapi yang disisakan setengah kanan. Arah sisanya terbalik dari pasangan pertama.\",\"C\":\"Yang disisakan setengah atas. Ini hasil potongan mendatar, bukan tegak.\",\"D\":\"Yang disisakan setengah bawah, juga hasil potongan mendatar.\",\"E\":\"Rumah masih utuh. Tidak ada bagian yang dihilangkan, padahal pada pasangan pertama setengah bangun hilang.\"},\"konsep\":\"**Analogi pemotongan:** tentukan dua hal dari pasangan pertama, yaitu **arah garis potong** (tegak, mendatar, atau diagonal) dan **bagian yang disisakan**. Pada lingkaran, potongan tegak dan mendatar sama-sama menghasilkan setengah lingkaran, jadi perhatikan posisinya, bukan hanya bentuknya.\"},\"tips\":\"Untuk analogi gambar, tulis dulu perubahan dari gambar pertama ke kedua dalam kata-kata (misalnya \\\"diputar 90° searah jarum jam dan warnanya dibalik\\\"). Pastikan tafsiran lain tidak cocok, lalu terapkan perubahan yang sama persis pada gambar ketiga.\",\"rujukan\":[]},{\"id\":\"p06-055\",\"kategori\":\"TIU\",\"subtopik\":\"Bilangan\",\"pertanyaan\":\"Bilangan lima angka 3A75B habis dibagi 36, dengan A dan B masing-masing satu angka (0–9). Banyak pasangan (A, B) yang mungkin adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"1\"},{\"huruf\":\"B\",\"teks\":\"5\"},{\"huruf\":\"C\",\"teks\":\"11\"},{\"huruf\":\"D\",\"teks\":\"2\"},{\"huruf\":\"E\",\"teks\":\"20\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"36 = 4 × 9, dan 4 serta 9 tidak punya faktor persekutuan selain 1. Jadi bilangan itu harus habis dibagi 4 **dan** habis dibagi 9.\\n\\n**Syarat habis dibagi 4:** dua angka terakhir (5B) habis dibagi 4. Pilihan: 52 dan 56, jadi B = 2 atau B = 6.\\n\\n**Syarat habis dibagi 9:** jumlah angka 3 + A + 7 + 5 + B = 15 + A + B habis dibagi 9, sehingga A + B = 3 atau 12.\\n\\n- B = 2 → A = 1 (A + B = 3) atau A = 10 (tidak mungkin).\\n- B = 6 → A = 6 (A + B = 12); A + B = 3 tidak mungkin.\\n\\nAda **2** pasangan: 31752 dan 36756.\",\"opsi\":{\"A\":\"1 pasangan: berhenti setelah menemukan satu jawaban (biasanya 31752) tanpa memeriksa B = 6.\",\"B\":\"5 pasangan: syarat habis dibagi 4 diganti syarat genap (B = 0, 2, 4, 6, 8), sehingga pasangan (3, 0), (8, 4), dan (4, 8) ikut terhitung.\",\"C\":\"11 pasangan: hanya memakai syarat habis dibagi 9 (A + B = 3 ada 4 pasangan, A + B = 12 ada 7 pasangan).\",\"E\":\"20 pasangan: hanya memakai syarat habis dibagi 4 (B = 2 atau 6, dengan A bebas 0–9).\"},\"konsep\":\"**Habis dibagi bilangan gabungan:** pecah menjadi faktor yang saling prima, lalu terapkan semua cirinya. 36 = 4 × 9, 72 = 8 × 9, 45 = 5 × 9, 12 = 3 × 4. Jangan memakai 2 × 18 atau 6 × 6, karena faktornya tidak saling prima.\"},\"tips\":\"Kerjakan syarat yang paling membatasi dulu (di sini habis dibagi 4 langsung mempersempit B menjadi dua pilihan). Setelah itu, cek syarat jumlah angka untuk setiap pilihan B.\",\"rujukan\":[]},{\"id\":\"p06-056\",\"kategori\":\"TIU\",\"subtopik\":\"Ketidaksamaan Gambar\",\"pertanyaan\":\"Perhatikan lima gambar berikut.\\n\\nGambar yang **tidak** memiliki kesamaan pola dengan gambar lainnya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Gambar A\"},{\"huruf\":\"B\",\"teks\":\"Gambar B\"},{\"huruf\":\"C\",\"teks\":\"Gambar C\"},{\"huruf\":\"D\",\"teks\":\"Gambar D\"},{\"huruf\":\"E\",\"teks\":\"Gambar E\"}],\"gambar\":[{\"src\":\"$13\",\"alt\":\"Lima kisi 3 × 3 berlabel A sampai E (petak dinomori 1–9 dari kiri atas, baris demi baris), masing-masing dengan tiga petak hitam. A: petak 4, 5, 6. B: petak 1, 4, 7. C: petak 1, 5, 9. D: petak 3, 5, 7. E: petak 1, 5, 8.\"}],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Setiap kisi memiliki tepat tiga petak hitam, jadi banyak petak bukan pembedanya. Perhatikan **susunan** ketiga petak itu (petak dinomori 1–9 dari kiri atas):\\n\\n- A: 4, 5, 6, satu baris mendatar.\\n- B: 1, 4, 7, satu kolom tegak.\\n- C: 1, 5, 9, diagonal.\\n- D: 3, 5, 7, diagonal lainnya.\\n- E: 1, 5, 8, **tidak segaris**. Petak 1 dan 5 ada di diagonal, tetapi petak 8 keluar dari garis itu.\\n\\nJadi **E** yang tidak memiliki kesamaan dengan gambar lainnya.\",\"opsi\":{\"A\":\"Tiga petak segaris mendatar. Sesuai pola.\",\"B\":\"Tiga petak segaris tegak. Sesuai pola, meskipun posisinya di tepi.\",\"C\":\"Tiga petak segaris diagonal. Petak tengah dipakai, sama seperti A, D, dan E, jadi petak tengah bukan pembeda.\",\"D\":\"Tiga petak segaris pada diagonal lainnya. Sesuai pola.\"},\"konsep\":\"**Garis pada kisi 3 × 3:** ada tepat delapan garis lurus yang memuat tiga petak, yaitu 3 baris, 3 kolom, dan 2 diagonal. Hafalkan bentuknya agar susunan yang tidak segaris cepat dikenali.\"},\"tips\":\"Untuk ketidaksamaan gambar, jangan berhenti pada perbedaan yang paling mencolok (warna atau bentuk luar). Cari aturan yang dipenuhi **empat** gambar sekaligus. Jika suatu ciri hanya membuat satu gambar unik tetapi gambar lain juga unik dengan cara serupa, ciri itu bukan aturannya.\",\"rujukan\":[]},{\"id\":\"p06-057\",\"kategori\":\"TIU\",\"subtopik\":\"Peluang\",\"pertanyaan\":\"Data uji kompetensi 200 pegawai sebagai berikut.\\n\\n| Kelompok | Banyak pegawai | Lulus uji |\\n|---|---|---|\\n| Mengikuti pelatihan | 120 | 84 |\\n| Tidak mengikuti pelatihan | 80 | 32 |\\n\\nJika dipilih secara acak seorang pegawai **yang lulus uji**, peluang ia berasal dari kelompok yang mengikuti pelatihan adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"21/29\"},{\"huruf\":\"B\",\"teks\":\"7/10\"},{\"huruf\":\"C\",\"teks\":\"21/50\"},{\"huruf\":\"D\",\"teks\":\"3/5\"},{\"huruf\":\"E\",\"teks\":\"29/50\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Kata kunci soal: pegawai yang dipilih **sudah pasti lulus**. Jadi ruang sampelnya bukan 200 pegawai, melainkan hanya pegawai yang lulus.\\n\\n**Langkah 1, ruang sampel:** banyak pegawai lulus = 84 + 32 = 116.\\n\\n**Langkah 2, kejadian:** pegawai lulus yang mengikuti pelatihan = 84.\\n\\nPeluang = 84/116 = **21/29** (dibagi 4).\\n\\nIni peluang bersyarat P(ikut pelatihan | lulus). Hasilnya sekitar 0,72; tidak sama dengan P(lulus | ikut pelatihan) = 84/120 = 0,7, walaupun angkanya berdekatan.\",\"opsi\":{\"B\":\"7/10 = 84/120 adalah peluang **lulus jika mengikuti pelatihan**. Arah syaratnya terbalik: pembaginya kelompok pelatihan, bukan kelompok yang lulus.\",\"C\":\"21/50 = 84/200 adalah peluang seorang pegawai **mengikuti pelatihan dan lulus** dari seluruh pegawai. Syarat “yang lulus” diabaikan.\",\"D\":\"3/5 = 120/200 adalah peluang seorang pegawai mengikuti pelatihan tanpa memperhatikan hasil uji.\",\"E\":\"29/50 = 116/200 adalah peluang seorang pegawai lulus. Ini pembagi yang benar, tetapi dibagi lagi dengan 200.\"},\"konsep\":\"**Peluang bersyarat:** P(A | B) = n(A ∩ B) / n(B). Ruang sampel menyusut menjadi kejadian B. Pembeda soal: “di antara yang lulus, berapa yang ikut pelatihan?” (pembagi = lulus) berbeda dengan “di antara yang ikut pelatihan, berapa yang lulus?” (pembagi = ikut pelatihan).\"},\"tips\":\"Garis bawahi kata setelah “yang” atau “jika diketahui” dalam soal; itulah syaratnya dan itulah **pembaginya**. Lalu cari angka di tabel yang memenuhi syarat dan kejadian sekaligus sebagai pembilang.\",\"rujukan\":[]},{\"id\":\"p06-058\",\"kategori\":\"TIU\",\"subtopik\":\"Serial Gambar\",\"pertanyaan\":\"Perhatikan deret gambar berikut. Pilihan A–E ada pada gambar kedua.\\n\\nGambar yang tepat untuk mengisi tanda tanya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Gambar A\"},{\"huruf\":\"B\",\"teks\":\"Gambar B\"},{\"huruf\":\"C\",\"teks\":\"Gambar C\"},{\"huruf\":\"D\",\"teks\":\"Gambar D\"},{\"huruf\":\"E\",\"teks\":\"Gambar E\"}],\"gambar\":[{\"src\":\"$14\",\"alt\":\"Empat gambar berurutan. Setiap gambar memiliki bingkai persegi putus-putus dengan delapan titik letak: empat pojok dan empat tengah sisi. Ada satu lingkaran putih dan satu segitiga hitam. Gambar 1: lingkaran di pojok kiri atas, segitiga di tengah sisi bawah. Gambar 2: lingkaran di tengah sisi atas, segitiga di tengah sisi kanan. Gambar 3: lingkaran di pojok kanan atas, segitiga di tengah sisi atas. Gambar 4: lingkaran di tengah sisi kanan, segitiga di tengah sisi kiri. Sel kelima bertanda tanya.\"},{\"src\":\"$15\",\"alt\":\"Pilihan: A lingkaran di tengah sisi kanan, segitiga di tengah sisi bawah; B lingkaran di pojok kanan bawah, segitiga di tengah sisi kanan; C lingkaran di tengah sisi bawah, segitiga di pojok kanan bawah; D lingkaran di pojok kanan bawah, segitiga di tengah sisi bawah; E lingkaran di pojok kanan bawah, segitiga di tengah sisi kiri.\"}],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Bingkai memiliki delapan titik letak: empat pojok dan empat tengah sisi. Lacak setiap benda sendiri-sendiri:\\n\\n1. **Lingkaran putih:** kiri atas → tengah atas → kanan atas → tengah kanan. Maju **satu titik searah jarum jam**, jadi berikutnya **pojok kanan bawah**.\\n2. **Segitiga hitam:** tengah bawah → tengah kanan → tengah atas → tengah kiri. Mundur **dua titik berlawanan arah jarum jam** (melewati satu pojok setiap langkah), jadi berikutnya **tengah bawah**.\\n\\nGambar yang tepat: lingkaran di pojok kanan bawah dan segitiga di tengah bawah, yaitu gambar **D**.\",\"opsi\":{\"A\":\"Segitiganya benar, tetapi lingkaran tidak bergerak (tetap di tengah kanan).\",\"B\":\"Lingkarannya benar, tetapi segitiga bergerak searah jarum jam ke tengah kanan, berlawanan dengan arah geraknya selama ini.\",\"C\":\"Lingkaran maju dua titik dan segitiga di pojok kanan bawah. Langkah keduanya tertukar.\",\"E\":\"Lingkarannya benar, tetapi segitiga tidak bergerak (tetap di tengah kiri).\"},\"konsep\":\"**Dua benda, dua aturan:** pada serial sulit, benda yang berbeda sering bergerak dengan arah dan besar langkah yang berbeda. Beri nomor delapan titik letak (1–8 searah jarum jam) agar langkahnya bisa dihitung.\"},\"tips\":\"Untuk serial gambar, amati **satu unsur sekaligus**: arah, posisi, jumlah, bentuk, lalu warna. Catat perubahannya dari gambar 1 ke 2, 2 ke 3, dan seterusnya. Jika ada dua unsur yang berubah, lanjutkan keduanya secara terpisah, lalu cari opsi yang memenuhi **semua** aturan sekaligus.\",\"rujukan\":[]},{\"id\":\"p06-059\",\"kategori\":\"TIU\",\"subtopik\":\"Peluang\",\"pertanyaan\":\"Dari 20 kartu bernomor 1 sampai 20 diambil satu kartu secara acak. Peluang terambil kartu bernomor genap atau kelipatan 3 adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"4/5\"},{\"huruf\":\"B\",\"teks\":\"3/20\"},{\"huruf\":\"C\",\"teks\":\"13/20\"},{\"huruf\":\"D\",\"teks\":\"1/2\"},{\"huruf\":\"E\",\"teks\":\"3/10\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Gunakan rumus peluang gabungan: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).\\n\\n- Genap (A): 2, 4, …, 20 → 10 kartu.\\n- Kelipatan 3 (B): 3, 6, 9, 12, 15, 18 → 6 kartu.\\n- Genap **dan** kelipatan 3, yaitu kelipatan 6 (A ∩ B): 6, 12, 18 → 3 kartu.\\n\\nBanyak kartu yang memenuhi = 10 + 6 − 3 = 13.\\n\\nPeluang = **13/20**.\\n\\nIrisan harus dikurangi karena kartu 6, 12, dan 18 sudah terhitung di kelompok genap dan terhitung lagi di kelompok kelipatan 3.\",\"opsi\":{\"A\":\"4/5 = 16/20: 10 + 6 tanpa mengurangi irisan. Kartu 6, 12, dan 18 terhitung dua kali.\",\"B\":\"3/20 adalah peluang genap **dan** kelipatan 3 (irisan), bukan gabungan.\",\"D\":\"1/2 = 10/20 hanya kelompok genap.\",\"E\":\"3/10 = 6/20 hanya kelompok kelipatan 3.\"},\"konsep\":\"**Kata “atau” → gabungan, kata “dan” → irisan.** Kejadian yang beririsan memakai P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Hanya jika kedua kejadian saling lepas (tidak punya anggota bersama), irisannya nol dan peluang bisa langsung dijumlahkan.\"},\"tips\":\"Setelah menjumlahkan dua kelompok, selalu tanyakan: “ada anggota yang terhitung dua kali?”. Untuk kelipatan, irisannya adalah kelipatan KPK-nya (di sini 6).\",\"rujukan\":[]},{\"id\":\"p06-060\",\"kategori\":\"TIU\",\"subtopik\":\"Aritmetika\",\"pertanyaan\":\"Nilai dari (0,5)⁻² + ∛(27²) − ∜(16³) adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"1,25\"},{\"huruf\":\"B\",\"teks\":\"5\"},{\"huruf\":\"C\",\"teks\":\"14\"},{\"huruf\":\"D\",\"teks\":\"1\"},{\"huruf\":\"E\",\"teks\":\"0\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Hitung setiap suku secara terpisah.\\n\\n- **(0,5)⁻²:** pangkat negatif berarti kebalikan. 0,5 = 1/2, jadi (1/2)⁻² = 2² = **4**.\\n- **∛(27²):** akarkan dulu agar angkanya kecil: ∛27 = 3, lalu 3² = **9**.\\n- **∜(16³):** ∜16 = 2, lalu 2³ = **8**.\\n\\nHasil: 4 + 9 − 8 = **5**.\\n\\nMengakarkan lebih dulu sebelum memangkatkan menghindari angka besar: 27² = 729 dan 16³ = 4.096 jauh lebih repot diakarkan.\",\"opsi\":{\"A\":\"1,25 muncul jika (0,5)⁻² dihitung sebagai 0,5² = 0,25 (tanda negatif pada pangkat diabaikan): 0,25 + 9 − 8.\",\"C\":\"14 muncul jika ∛(27²) dihitung 27 × 2/3 = 18, yaitu mengalikan bilangan pokok dengan pangkat pecahan: 4 + 18 − 8.\",\"D\":\"1 muncul jika ∜(16³) dihitung 16 × 3/4 = 12 dengan kesalahan yang sama: 4 + 9 − 12.\",\"E\":\"0 muncul jika (0,5)⁻² dihitung −2 × 0,5 = −1, yaitu mengalikan dengan pangkat dan menganggap pangkat negatif membuat hasil negatif: −1 + 9 − 8.\"},\"konsep\":\"**Sifat pangkat:** a⁻ⁿ = 1/aⁿ (pangkat negatif tidak membuat hasil negatif), dan akar pangkat n dari aᵐ = (akar pangkat n dari a)ᵐ. Pangkat tidak pernah dikalikan dengan bilangan pokoknya.\"},\"tips\":\"Ubah desimal menjadi pecahan sebelum memangkatkan (0,5 = 1/2, 0,25 = 1/4, 0,2 = 1/5), dan selalu akarkan dulu baru pangkatkan. Dua kebiasaan ini membuat soal pangkat bisa dikerjakan di kepala.\",\"rujukan\":[]},{\"id\":\"p06-061\",\"kategori\":\"TIU\",\"subtopik\":\"Aritmetika Sosial\",\"pertanyaan\":\"Sebuah perusahaan air minum memakai tarif bertingkat (ilustrasi) sebagai berikut:\\n\\n| Blok pemakaian | Tarif per m³ |\\n|---|---|\\n| 0–10 m³ pertama | Rp2.000 |\\n| 10 m³ berikutnya (m³ ke-11 sampai ke-20) | Rp3.500 |\\n| Di atas 20 m³ | Rp5.000 |\\n\\nSetiap pelanggan juga membayar biaya abonemen Rp10.000 per bulan. Jika pemakaian air sebuah rumah 27 m³ dalam sebulan, tagihannya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Rp145.000\"},{\"huruf\":\"B\",\"teks\":\"Rp90.000\"},{\"huruf\":\"C\",\"teks\":\"Rp101.500\"},{\"huruf\":\"D\",\"teks\":\"Rp100.000\"},{\"huruf\":\"E\",\"teks\":\"Rp104.500\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pada tarif bertingkat, **setiap blok dihitung dengan tarifnya sendiri**. Pemakaian 27 m³ dibagi ke dalam blok:\\n\\n- Blok 1: 10 m³ × Rp2.000 = Rp20.000\\n- Blok 2: 10 m³ × Rp3.500 = Rp35.000\\n- Blok 3: (27 − 20) = 7 m³ × Rp5.000 = Rp35.000\\n\\nBiaya pemakaian = Rp90.000. Ditambah abonemen Rp10.000, tagihan = **Rp100.000**.\\n\\nCek: jumlah volume blok 10 + 10 + 7 = 27 m³, sesuai pemakaian.\",\"opsi\":{\"A\":\"Rp145.000 = 27 × 5.000 + 10.000: seluruh pemakaian dikenai tarif blok tertinggi. Ini kesalahan memahami tarif bertingkat; tarif tinggi hanya berlaku untuk kelebihan di atas 20 m³.\",\"B\":\"Rp90.000 adalah biaya pemakaian saja. Abonemen Rp10.000 terlupa.\",\"C\":\"Rp101.500 muncul jika blok 2 dihitung 9 m³ (20 − 11), padahal m³ ke-11 sampai ke-20 berjumlah 10 m³. Akibatnya blok 3 menjadi 8 m³: 20.000 + 31.500 + 40.000 + 10.000.\",\"E\":\"Rp104.500 = 27 × 3.500 + 10.000: seluruh pemakaian dikenai tarif blok tengah.\"},\"konsep\":\"**Tarif bertingkat (progresif per blok):** tarif lebih tinggi hanya dikenakan pada bagian yang melewati batas blok, bukan pada seluruh pemakaian. Pola yang sama dipakai pada tarif listrik bertingkat dan tarif pajak penghasilan berlapis. Angka tarif pada soal ini adalah ilustrasi.\"},\"tips\":\"Buat tabel kecil: volume per blok, tarif, hasil kali. Pastikan jumlah volume semua blok sama dengan total pemakaian, karena kesalahan menghitung banyaknya angka dari 11 sampai 20 (ada 10, bukan 9) sangat sering terjadi.\",\"rujukan\":[]},{\"id\":\"p06-062\",\"kategori\":\"TIU\",\"subtopik\":\"Perbandingan\",\"pertanyaan\":\"Perbandingan tabungan Dita dan Eka adalah 3 : 5. Setelah Dita menabung lagi Rp40.000 dan Eka mengambil Rp20.000 dari tabungannya, tabungan mereka menjadi sama banyak. Jumlah tabungan Dita dan Eka **mula-mula** adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Rp80.000\"},{\"huruf\":\"B\",\"teks\":\"Rp240.000\"},{\"huruf\":\"C\",\"teks\":\"Rp260.000\"},{\"huruf\":\"D\",\"teks\":\"Rp90.000\"},{\"huruf\":\"E\",\"teks\":\"Rp150.000\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Misalkan tabungan mula-mula Dita = 3k dan Eka = 5k.\\n\\nSetelah berubah: Dita = 3k + 40.000, Eka = 5k − 20.000. Keduanya sama:\\n\\n3k + 40.000 = 5k − 20.000\\n60.000 = 2k\\nk = 30.000\\n\\nDita mula-mula 90.000 dan Eka 150.000. Jumlah mula-mula = **Rp240.000**.\\n\\nCek: Dita menjadi 130.000 dan Eka menjadi 130.000. Sama. Cara cepatnya: selisih awal 2 bagian harus tertutup oleh 40.000 + 20.000 = 60.000, jadi 1 bagian = 30.000 dan total 8 bagian = 240.000.\",\"opsi\":{\"A\":\"Rp80.000 muncul jika perubahan diperlakukan searah: selisih dianggap 40.000 − 20.000 = 20.000, sehingga 1 bagian = 10.000 dan total 8 bagian = 80.000. Padahal Dita bertambah dan Eka berkurang, jadi selisihnya tertutup dari dua arah.\",\"C\":\"Rp260.000 adalah jumlah tabungan **sesudah** perubahan (130.000 + 130.000). Yang ditanyakan jumlah mula-mula.\",\"D\":\"Rp90.000 hanya tabungan Dita mula-mula.\",\"E\":\"Rp150.000 hanya tabungan Eka mula-mula.\"},\"konsep\":\"**Perbandingan dengan perubahan:** nyatakan nilai awal sebagai kelipatan k dari angka perbandingan, tulis keadaan akhir, lalu susun persamaan. Jika dua besaran bergerak saling mendekat, selisih awalnya sama dengan jumlah kedua perubahan.\"},\"tips\":\"Lihat arah perubahannya. Jika yang kecil bertambah dan yang besar berkurang hingga sama, **jumlahkan** kedua perubahan untuk menutup selisih. Lalu cek kembali apakah yang ditanya keadaan awal atau akhir.\",\"rujukan\":[]},{\"id\":\"p06-063\",\"kategori\":\"TIU\",\"subtopik\":\"Perbandingan Kuantitatif\",\"pertanyaan\":\"P = 2³⁰\\nQ = 3²⁰\\n\\nHubungan P dan Q yang tepat adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"P \u003e Q\"},{\"huruf\":\"B\",\"teks\":\"P = Q\"},{\"huruf\":\"C\",\"teks\":\"P \u003c Q\"},{\"huruf\":\"D\",\"teks\":\"P \u003c Q \u003c 2P\"},{\"huruf\":\"E\",\"teks\":\"Hubungan P dan Q tidak dapat ditentukan\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Bilangan pokok dan pangkatnya sama-sama berbeda, jadi samakan **pangkat**-nya. FPB(30, 20) = 10.\\n\\n- P = 2³⁰ = (2³)¹⁰ = 8¹⁰\\n- Q = 3²⁰ = (3²)¹⁰ = 9¹⁰\\n\\nKarena pangkatnya sama (10) dan 8 \u003c 9, maka 8¹⁰ \u003c 9¹⁰, sehingga **P \u003c Q**.\\n\\nSebagai gambaran besarnya: 2³⁰ ≈ 1,07 miliar dan 3²⁰ ≈ 3,49 miliar. Q lebih dari tiga kali P, walaupun bilangan pokoknya hanya berbeda 8 dan 9, karena selisih kecil itu dipangkatkan 10 kali.\",\"opsi\":{\"A\":\"Jebakan membandingkan pangkat saja: 30 \u003e 20 lalu disimpulkan P \u003e Q. Pangkat yang lebih besar tidak menjamin hasil lebih besar jika bilangan pokoknya lebih kecil.\",\"B\":\"Muncul dari kesalahan mengalikan bilangan pokok dengan pangkat: 2 × 30 = 60 dan 3 × 20 = 60. Perpangkatan bukan perkalian.\",\"D\":\"Bagian P \u003c Q benar, tetapi Q \u003c 2P salah. (9/8)¹⁰ ≈ 3,25, jadi Q ≈ 3,25P. Opsi ini menjebak peserta yang mengira selisih 8 dan 9 hanya menghasilkan perbedaan kecil.\",\"E\":\"P dan Q adalah bilangan tertentu tanpa variabel, sehingga hubungannya pasti dapat ditentukan.\"},\"konsep\":\"**Membandingkan aᵐ dan bⁿ:** samakan pangkat dengan FPB(m, n) jika memungkinkan, lalu bandingkan bilangan pokok barunya. Jika lebih mudah, samakan bilangan pokok (misalnya 4¹⁵ dan 8¹⁰ menjadi 2³⁰ dan 2³⁰).\"},\"tips\":\"Pada soal perbandingan kuantitatif tanpa variabel, opsi “tidak dapat ditentukan” hampir pasti salah. Fokuslah mengubah bentuk agar salah satu unsur (pangkat atau bilangan pokok) sama.\",\"rujukan\":[]},{\"id\":\"p06-064\",\"kategori\":\"TIU\",\"subtopik\":\"Perbandingan Kuantitatif\",\"pertanyaan\":\"Diketahui x bilangan real dengan 0 \u003c x \u003c 1.\\n\\nP = x/(1 + x)\\nQ = x²\\n\\nHubungan P dan Q yang tepat adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Hubungan P dan Q tidak dapat ditentukan dari informasi yang diberikan\"},{\"huruf\":\"B\",\"teks\":\"P \u003e Q\"},{\"huruf\":\"C\",\"teks\":\"P \u003c Q\"},{\"huruf\":\"D\",\"teks\":\"P = Q\"},{\"huruf\":\"E\",\"teks\":\"P \u003c Q untuk setiap x yang lebih dari 1/2\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Uji dua nilai x yang berbeda.\\n\\n- x = 1/2: P = (1/2)/(3/2) = 1/3 ≈ 0,33, Q = 1/4 = 0,25 → **P \u003e Q**.\\n- x = 0,9: P = 0,9/1,9 ≈ 0,47, Q = 0,81 → **P \u003c Q**.\\n\\nKarena hubungannya berubah tergantung nilai x, jawabannya **tidak dapat ditentukan**.\\n\\nAnalisis lengkapnya: P − Q = x(1 − x − x²)/(1 + x). Untuk 0 \u003c x \u003c 1, tandanya ditentukan oleh 1 − x − x². Bentuk ini bernilai nol saat x = (√5 − 1)/2 ≈ 0,618. P \u003e Q untuk x \u003c 0,618 dan P \u003c Q untuk x \u003e 0,618.\",\"opsi\":{\"B\":\"Jebakan jalan pintas: peserta hanya menguji satu nilai yang mudah, seperti x = 1/2, lalu langsung menyimpulkan. Nilai x yang dekat dengan 1 membalik hubungannya.\",\"C\":\"Hanya benar untuk x \u003e 0,618. Peserta yang menguji x = 0,9 saja akan memilih opsi ini.\",\"D\":\"P = Q hanya terjadi pada satu nilai x ≈ 0,618, bukan untuk semua x dalam rentang.\",\"E\":\"Batas pembaliknya bukan 1/2, melainkan sekitar 0,618. Contoh: x = 0,55 memberi P ≈ 0,355 dan Q ≈ 0,303, jadi P \u003e Q walaupun x \u003e 1/2.\"},\"konsep\":\"**Strategi soal perbandingan kuantitatif bervariabel:** uji minimal dua nilai, yaitu satu dekat batas bawah dan satu dekat batas atas rentang. Jika hubungannya berubah, jawabannya tidak dapat ditentukan.\"},\"tips\":\"Untuk rentang 0 \u003c x \u003c 1, uji x kecil (misalnya 0,1) dan x dekat 1 (misalnya 0,9). Bilangan kuadrat di rentang ini mengecil drastis saat x kecil, tetapi mendekati x saat x dekat 1, sehingga hubungannya sering berbalik.\",\"rujukan\":[]},{\"id\":\"p06-065\",\"kategori\":\"TIU\",\"subtopik\":\"Soal Cerita\",\"pertanyaan\":\"Dua pelari mulai berlari bersamaan dari garis start lintasan melingkar sepanjang 400 m, dengan arah yang sama. Kecepatan mereka tetap, masing-masing 5 m/detik dan 3 m/detik. Pelari yang lebih cepat menyusul pelari yang lebih lambat untuk **ketiga** kalinya (tidak termasuk saat start) setelah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"2,5 menit\"},{\"huruf\":\"B\",\"teks\":\"4 menit\"},{\"huruf\":\"C\",\"teks\":\"3⅓ menit\"},{\"huruf\":\"D\",\"teks\":\"6⅔ menit\"},{\"huruf\":\"E\",\"teks\":\"10 menit\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":null,\"pembahasan\":{\"inti\":\"Pada lintasan melingkar dengan arah sama, pelari cepat menyusul setiap kali ia unggul **satu putaran penuh** (400 m) dari pelari lambat.\\n\\n**Kecepatan relatif** = 5 − 3 = 2 m/detik.\\n\\n**Waktu sekali menyusul** = 400 ÷ 2 = 200 detik.\\n\\n**Menyusul ketiga kalinya** = 3 × 200 = 600 detik = **10 menit**.\\n\\nCek: dalam 600 detik, pelari cepat menempuh 3.000 m (7,5 putaran) dan pelari lambat 1.800 m (4,5 putaran). Selisihnya 1.200 m, tepat 3 putaran.\",\"opsi\":{\"A\":\"2,5 menit = 3 × 400 ÷ (5 + 3) detik: kecepatan dijumlahkan seperti pada arah berlawanan. Untuk arah sama, kecepatan dikurangkan.\",\"B\":\"4 menit adalah waktu pelari cepat menyelesaikan 3 putaran (1.200 ÷ 5 = 240 detik). Yang dibutuhkan adalah unggul 3 putaran, bukan menempuh 3 putaran.\",\"C\":\"3⅓ menit (200 detik) adalah waktu menyusul **pertama** kali.\",\"D\":\"6⅔ menit (400 detik) adalah waktu menyusul kedua kali. Hasil ini muncul jika saat start ikut dihitung sebagai pertemuan pertama.\"},\"konsep\":\"**Lintasan melingkar:** arah sama → bertemu setiap selisih jarak = satu keliling, waktu = keliling ÷ (v₁ − v₂). Arah berlawanan → bertemu setiap jumlah jarak = satu keliling, waktu = keliling ÷ (v₁ + v₂).\"},\"tips\":\"Bayangkan pelari lambat diam dan pelari cepat bergerak dengan kecepatan selisihnya. Setiap kali pelari cepat “menempuh” satu keliling relatif, terjadi satu kali susul. Perhatikan juga apakah soal menghitung saat start sebagai pertemuan.\",\"rujukan\":[]},{\"id\":\"p06-066\",\"kategori\":\"TKP\",\"subtopik\":\"Pelayanan Publik\",\"pertanyaan\":\"Pak Sapto, pedagang bakso keliling, datang ke gerai perizinan di Mal Pelayanan Publik tempat Anda bertugas untuk mengurus Nomor Induk Berusaha (NIB). Pendaftaran dilakukan secara daring dan mensyaratkan alamat surel, padahal Pak Sapto tidak punya surel dan kurang paham memakai ponsel pintar. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Membantunya membuat surel atas namanya sendiri, memandu pendaftaran NIB sampai selesai, lalu memastikan ia mencatat dan menyimpan sendiri kata sandinya\"},{\"huruf\":\"B\",\"teks\":\"Memberikan brosur panduan membuat surel dan mendaftar NIB, lalu memintanya kembali ke gerai setelah alamat surelnya siap dipakai\"},{\"huruf\":\"C\",\"teks\":\"Memintanya datang lagi esok hari bersama anak atau kerabat yang paham ponsel, agar pendaftaran dilakukan bersama Anda dan ia punya pendamping tetap untuk layanan daring\"},{\"huruf\":\"D\",\"teks\":\"Menyarankannya memakai jasa pengurusan izin di sekitar gedung agar lebih praktis dan ia tidak perlu mengantre lagi di gerai\"},{\"huruf\":\"E\",\"teks\":\"Mendaftarkan NIB memakai alamat surel Anda sendiri supaya cepat selesai, lalu meneruskan setiap pemberitahuan dari sistem kepadanya\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":3,\"C\":4,\"D\":
