riksa.\",\"D\":\"Aspek hukum, perjanjian pelindungan data, dan keamanan teknis dinilai, lalu hasilnya disampaikan sebagai rekomendasi tertulis. Mendukung inovasi dengan cara yang aman.\",\"E\":\"Atasan justru meminta Anda menindaklanjuti. Menyerahkan kembali tanpa kajian adalah menghindari tugas.\"},\"konsep\":\"**Menilai layanan digital pihak ketiga:** dasar hukum akses data, perjanjian pelindungan data, keamanan teknis, lalu rekomendasi kepada pimpinan. “Gratis” tidak pernah menjadi alasan untuk melewati langkah-langkah itu.\"},\"tips\":\"Pada soal inovasi yang menyentuh data warga, bobot 5 bukan menolak dan bukan menerima begitu saja, melainkan **menilai secara lengkap (hukum + teknis)** sebelum merekomendasikan.\",\"rujukan\":[]},{\"id\":\"p06-094\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Anda sedang membuat video edukasi layanan untuk akun resmi kantor. Seorang rekan menyarankan memakai potongan lagu populer agar video cepat ramai ditonton. Lagu itu dilindungi hak cipta dan kantor tidak memiliki lisensinya. Cara Anda menyikapinya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memakai potongan lagu itu, karena video instansi bersifat nonkomersial dan dibuat untuk kepentingan publik\"},{\"huruf\":\"B\",\"teks\":\"Membuat video itu tanpa musik sama sekali, supaya tidak ada risiko pelanggaran hak cipta di akun resmi kantor\"},{\"huruf\":\"C\",\"teks\":\"Memakai musik bebas royalti dari pustaka resmi platform yang lisensinya jelas, sehingga video tetap menarik ditonton\"},{\"huruf\":\"D\",\"teks\":\"Menyerahkan pemilihan musik kepada rekan yang mengusulkan lagu itu, supaya Anda tidak ikut bertanggung jawab atas pilihannya\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan risiko hak cipta kepada rekan, lalu memakai musik berlisensi atau meminta izin pemegang hak bila lagu itu memang penting\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":3,\"C\":4,\"D\":2,\"E\":5},\"pembahasan\":{\"inti\":\"Instansi pemerintah harus memberi contoh dalam menghormati hak kekayaan intelektual. Memakai lagu berhak cipta tanpa izin tetap pelanggaran walaupun videonya tidak dijual, dan akun resmi bisa diturunkan atau diblokir oleh platform. Sikap terbaik tetap menjaga tujuan video agar menarik, dengan cara yang sah, sambil membagikan pemahaman itu kepada rekan.\",\"opsi\":{\"A\":\"Anggapan bahwa pemakaian nonkomersial bebas dari hak cipta adalah salah kaprah yang umum. Pelanggaran tetap terjadi dan merusak citra instansi.\",\"B\":\"Aman dari pelanggaran, tetapi kaku. Tujuan agar video menarik dikorbankan, padahal ada pilihan musik yang sah.\",\"C\":\"Solusinya sah dan video tetap menarik, tetapi rekan tidak diberi penjelasan sehingga usulan serupa bisa terulang.\",\"D\":\"Menghindari tanggung jawab. Video tetap dibuat oleh Anda dan diunggah di akun resmi kantor.\",\"E\":\"Risiko dijelaskan kepada rekan, dan musik yang dipakai dipastikan sah, baik berlisensi maupun dengan izin pemegang hak. Tujuan dan aturan sama-sama terpenuhi.\"},\"konsep\":\"**Konten instansi yang taat hak cipta:** gunakan karya berlisensi jelas (bebas royalti, lisensi terbuka, atau dengan izin). Mencantumkan nama pencipta atau tujuan nonkomersial tidak sama dengan memiliki izin.\"},\"tips\":\"Hati-hati dengan alasan “untuk kepentingan publik” atau “nonkomersial”; itu bukan izin. Opsi bernilai 5 pada soal konten digital biasanya sah secara hukum, tetap mencapai tujuan komunikasi, dan mengedukasi rekan.\",\"rujukan\":[]},{\"id\":\"p06-095\",\"kategori\":\"TKP\",\"subtopik\":\"Teknologi Informasi dan Komunikasi\",\"pertanyaan\":\"Kepala bidang Anda sedang dinas luar. Ia mengirim pesan berisi passphrase tanda tangan elektroniknya dan meminta Anda menandatangani beberapa surat mendesak atas namanya melalui aplikasi persuratan. Tanggapan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menandatangani surat-surat itu sesuai permintaan, karena kepala bidang sendiri yang memberikan passphrase dan memintanya secara tertulis\"},{\"huruf\":\"B\",\"teks\":\"Menolak memakai passphrase itu, menyarankan ia menandatangani dari jauh atau menunjuk pelaksana harian, dan memintanya mengganti passphrase\"},{\"huruf\":\"C\",\"teks\":\"Menyampaikan bahwa passphrase tidak boleh dipakai orang lain, lalu menyiapkan surat-suratnya agar ia dapat menandatanganinya sendiri secara daring\"},{\"huruf\":\"D\",\"teks\":\"Tidak menandatangani surat-surat itu dan menunggu kepala bidang kembali dari dinas luar untuk menandatanganinya sendiri di kantor\"},{\"huruf\":\"E\",\"teks\":\"Meminta pendapat rekan yang lebih senior tentang boleh tidaknya passphrase itu dipakai, lalu mengikuti keputusan rekan tersebut\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":1,\"B\":5,\"C\":4,\"D\":3,\"E\":2},\"pembahasan\":{\"inti\":\"Tanda tangan elektronik melekat pada pribadi pemiliknya dan memiliki kekuatan hukum seperti tanda tangan basah. Memakai passphrase orang lain sama dengan memalsukan tanda tangannya, walaupun pemiliknya mengizinkan. Pegawai yang profesional menolak dengan sopan, membantu agar surat tetap bisa ditandatangani secara sah, dan mengingatkan bahwa passphrase yang sudah dibagikan perlu diganti.\",\"opsi\":{\"A\":\"Izin pemilik tidak membuat pemakaian passphrase orang lain menjadi sah. Dokumen yang ditandatangani dengan cara ini cacat secara hukum.\",\"B\":\"Aturan dijaga, dua jalan keluar yang sah ditawarkan, dan keamanan akun dipulihkan dengan mengganti passphrase yang sudah terbagi.\",\"C\":\"Menolak dengan alasan yang benar dan membantu menyiapkan surat, tetapi tidak mengingatkan bahwa passphrase yang sudah terkirim perlu diganti.\",\"D\":\"Tidak melanggar, tetapi pasif. Surat mendesak tertahan padahal ada cara sah untuk menyelesaikannya.\",\"E\":\"Melempar keputusan kepada rekan yang tidak berwenang atas tanda tangan kepala bidang.\"},\"konsep\":\"**Tanda tangan elektronik:** passphrase hanya untuk pemiliknya. Jika pejabat berhalangan, gunakan tanda tangan jarak jauh oleh pemilik sendiri atau penunjukan pelaksana harian/pelaksana tugas sesuai aturan. Passphrase yang sudah dibagikan wajib diganti.\"},\"tips\":\"Permintaan dari atasan tidak otomatis membuat tindakan sah. Pada soal identitas digital (akun, passphrase, tanda tangan elektronik), opsi yang memakai identitas orang lain bernilai 1, dan opsi bernilai 5 menawarkan **jalan keluar yang sah** sekaligus **memulihkan keamanan**.\",\"rujukan\":[]},{\"id\":\"p06-096\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Anda notulis rapat koordinasi. Saat memeriksa draf notula, pimpinan meminta Anda menghapus pernyataannya yang keliru tentang target anggaran karena “nanti bisa disalahpahami”. Notula akan dibagikan kepada semua peserta rapat. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menghapus pernyataan itu sesuai permintaan, karena notula belum dibagikan dan pimpinanlah yang nantinya mengesahkan notula tersebut\"},{\"huruf\":\"B\",\"teks\":\"Mempertahankan isi notula apa adanya dan menolak permintaan pimpinan, karena notula harus sesuai dengan kejadian dalam rapat\"},{\"huruf\":\"C\",\"teks\":\"Meminta pimpinan sendiri yang menyunting draf notula itu, supaya Anda tidak ikut bertanggung jawab atas perubahan isinya\"},{\"huruf\":\"D\",\"teks\":\"Menjelaskan bahwa notula harus mencatat pernyataan yang disampaikan, lalu menyarankan agar ralat dari pimpinan dicantumkan sebagai catatan tambahan\"},{\"huruf\":\"E\",\"teks\":\"Menjelaskan dengan santun fungsi notula, menyarankan koreksi angka dicantumkan sebagai ralat resmi pimpinan, lalu membagikannya setelah ia setuju\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":1,\"B\":3,\"C\":2,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Notula adalah catatan resmi jalannya rapat. Menghapus pernyataan yang benar-benar disampaikan berarti mengubah catatan resmi, walaupun pernyataannya keliru. Kekhawatiran pimpinan tetap masuk akal, karena angka yang salah memang bisa menyesatkan peserta. Jalan tengah yang profesional adalah mempertahankan catatan dan menambahkan ralat resmi, sehingga catatan tetap jujur dan informasi yang benar tetap sampai kepada peserta.\",\"opsi\":{\"A\":\"Mengubah catatan resmi agar sesuai keinginan pimpinan adalah manipulasi dokumen, walaupun alasannya mencegah salah paham.\",\"B\":\"Prinsipnya benar, tetapi kaku. Kekhawatiran pimpinan tentang angka yang menyesatkan tidak ditanggapi dengan solusi.\",\"C\":\"Menghindari tanggung jawab sebagai notulis. Masalah integritas dokumen tetap terjadi, hanya dipindahkan kepada orang lain.\",\"D\":\"Solusinya tepat, tetapi belum memastikan persetujuan pimpinan atas ralat tersebut sebelum notula dibagikan.\",\"E\":\"Fungsi notula dijelaskan dengan santun, kekhawatiran pimpinan dijawab dengan ralat resmi, dan notula dibagikan setelah disepakati. Integritas dan hubungan kerja sama-sama terjaga.\"},\"konsep\":\"**Mengoreksi dokumen resmi:** jangan menghapus, tetapi tambahkan ralat atau catatan yang jelas sumber dan waktunya. Cara ini menjaga kejujuran catatan sekaligus memperbaiki informasi.\"},\"tips\":\"Jika atasan meminta perubahan dokumen, bedakan **menghapus kejadian** (bobot rendah) dari **menambahkan koreksi** (bobot tinggi). Opsi terbaik biasanya menjelaskan prinsipnya dengan santun dan menawarkan cara koreksi yang sah.\",\"rujukan\":[]},{\"id\":\"p06-097\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Sertifikat kompetensi pengadaan barang/jasa yang wajib Anda miliki untuk menjalankan tugas akan habis masa berlakunya bulan depan. Ujian perpanjangannya dijadwalkan pada hari yang sama dengan tenggat laporan triwulan yang menjadi tanggung jawab Anda. Langkah yang paling tepat Anda ambil adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melewatkan ujian kali ini dan mengikuti jadwal berikutnya, meskipun sertifikat Anda sempat tidak berlaku selama beberapa waktu\"},{\"huruf\":\"B\",\"teks\":\"Mengatur ulang jadwal kerja agar laporan selesai sebelum hari ujian, memberi tahu atasan, lalu mengikuti ujian sesuai jadwal\"},{\"huruf\":\"C\",\"teks\":\"Memberi tahu atasan dan meminta izin mengikuti ujian, sambil meminta rekan setim membantu menyelesaikan sebagian laporan triwulan\"},{\"huruf\":\"D\",\"teks\":\"Mengikuti ujian, lalu menyelesaikan laporan sepulang ujian meskipun Anda harus lembur hingga larut malam pada hari tenggat\"},{\"huruf\":\"E\",\"teks\":\"Meminta rekan yang sertifikatnya masih aktif menandatangani dokumen pengadaan atas nama Anda selama sertifikat belum diperpanjang\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":4,\"D\":3,\"E\":1},\"pembahasan\":{\"inti\":\"Profesionalisme mencakup menjaga kompetensi yang menjadi syarat jabatan sekaligus menyelesaikan tanggung jawab tepat waktu. Bentrokan jadwal yang sudah diketahui jauh hari bisa diatasi dengan perencanaan: kerjakan lebih awal, komunikasikan kepada atasan, dan jalani keduanya tanpa mengorbankan salah satu.\",\"opsi\":{\"A\":\"Menghindari bentrokan dengan membiarkan sertifikat kedaluwarsa. Akibatnya Anda tidak sah menjalankan tugas pengadaan selama masa itu.\",\"B\":\"Perencanaan yang baik membuat keduanya tercapai, dan atasan mengetahui situasinya. Tanggung jawab dan pengembangan kompetensi sama-sama terpenuhi.\",\"C\":\"Komunikatif dan keduanya bisa tercapai, tetapi sebagian beban dialihkan kepada rekan, padahal bentrokan ini bisa diantisipasi sendiri.\",\"D\":\"Bertanggung jawab, tetapi tanpa perencanaan dan komunikasi. Laporan yang dikerjakan terburu-buru berisiko kurang berkualitas.\",\"E\":\"Meminjam kewenangan orang lain untuk menandatangani dokumen pengadaan melanggar aturan dan menyalahi kompetensi yang dipersyaratkan.\"},\"konsep\":\"**Profesionalisme = kompeten + tepat waktu + komunikatif.** Bentrokan yang bisa diperkirakan sebaiknya diselesaikan dengan perencanaan, bukan dengan mengorbankan salah satu tanggung jawab. Contoh perencanaan: memajukan tenggat internal laporan dua hari sebelum ujian dan menyampaikan jadwal itu kepada atasan sejak awal bulan.\"},\"tips\":\"Jika bentrokan jadwal diketahui lebih awal, opsi bernilai 5 biasanya berisi **perencanaan ulang + komunikasi dengan atasan**. Opsi yang meminjam nama atau kewenangan orang lain selalu bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-098\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Dalam tim penyusun laporan, Bagas selalu menyerahkan bagiannya dalam keadaan setengah jadi menjelang tenggat, sehingga Anda harus lembur untuk merapikannya. Kejadian ini sudah berulang tiga kali. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tetap merapikan bagian Bagas setiap kali hal itu terjadi, karena yang paling penting adalah laporan tim selesai tepat waktu\"},{\"huruf\":\"B\",\"teks\":\"Langsung melaporkan kebiasaan Bagas kepada atasan tanpa membicarakannya terlebih dahulu dengan Bagas secara pribadi\"},{\"huruf\":\"C\",\"teks\":\"Mengirimkan bagian Bagas apa adanya kepada atasan, supaya terlihat jelas bahwa kekurangan laporan berasal dari bagian Bagas\"},{\"huruf\":\"D\",\"teks\":\"Membicarakannya dengan Bagas untuk mencari penyebabnya, menyepakati tenggat antara yang lebih awal, dan melibatkan ketua tim bila terulang\"},{\"huruf\":\"E\",\"teks\":\"Mengajak Bagas berdiskusi tentang kesulitannya dan menawarkan bantuan agar bagian yang menjadi tanggung jawabnya bisa selesai lebih awal\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":2,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Masalah kinerja rekan yang berulang perlu diselesaikan, bukan terus ditutupi. Pegawai yang profesional membicarakannya langsung dengan rekan yang bersangkutan untuk memahami penyebabnya, menyepakati perbaikan yang terukur, dan menyiapkan langkah berikutnya bila tidak berhasil. Tujuannya kualitas kerja tim, bukan menyalahkan orang.\",\"opsi\":{\"A\":\"Laporan selesai, tetapi masalahnya terus berulang dan beban kerja tidak adil. Ini sikap aman yang pasif.\",\"B\":\"Melompati dialog langsung bisa merusak kepercayaan, dan Bagas tidak diberi kesempatan menjelaskan atau memperbaiki diri.\",\"C\":\"Mengorbankan kualitas laporan tim demi mempermalukan rekan merugikan organisasi.\",\"D\":\"Dialog langsung, perbaikan yang terukur (tenggat antara), dan jalur eskalasi yang jelas bila tidak berhasil. Masalah ditangani tuntas.\",\"E\":\"Dialog dan bantuan sudah baik, tetapi belum ada kesepakatan yang terukur dan rencana jika pola itu terulang.\"},\"konsep\":\"**Menangani masalah kinerja rekan:** bicarakan langsung → cari penyebab → sepakati perbaikan terukur → eskalasi ke ketua tim bila tetap berulang. Menutupi terus-menerus dan mempermalukan sama-sama tidak profesional. Tenggat antara berarti bagian kerja diserahkan bertahap, misalnya draf pertama seminggu sebelum tenggat akhir, sehingga masalah terlihat lebih awal.\"},\"tips\":\"Bandingkan dua opsi yang sama-sama mengajak berdiskusi: opsi yang memuat **kesepakatan konkret dan langkah lanjutan** lebih tinggi daripada yang hanya menawarkan bantuan.\",\"rujukan\":[]},{\"id\":\"p06-099\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Kantor Anda mulai memakai aplikasi perizinan baru, tetapi SOP tertulis masih menggambarkan alur manual. Rekan-rekan bingung alur mana yang harus diikuti, dan beberapa berkas pemohon tertahan. Revisi SOP biasanya memakan waktu sekitar dua bulan. Yang sebaiknya Anda lakukan adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tetap mengikuti alur manual sesuai SOP lama sampai revisi selesai, walaupun aplikasi baru sebenarnya sudah tersedia untuk dipakai\"},{\"huruf\":\"B\",\"teks\":\"Menyusun alur kerja sendiri yang menurut Anda paling praktis, lalu meminta rekan-rekan mengikutinya tanpa menunggu persetujuan\"},{\"huruf\":\"C\",\"teks\":\"Memetakan bagian SOP yang tidak sesuai, mengusulkan panduan sementara kepada atasan untuk ditetapkan, sambil mendorong revisi SOP\"},{\"huruf\":\"D\",\"teks\":\"Mengusulkan kepada atasan agar revisi SOP dipercepat, dan menyerahkan daftar perbedaan alur kerja yang Anda temukan di lapangan\"},{\"huruf\":\"E\",\"teks\":\"Menunggu arahan atasan, karena revisi SOP merupakan kewenangan bagian organisasi dan bukan bagian dari tugas Anda\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":1,\"C\":5,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Profesionalisme menuntut inisiatif ketika aturan kerja tertinggal dari perubahan, tetapi inisiatif itu tetap lewat jalur yang sah. Pegawai tidak boleh membuat aturan sendiri, namun bisa menyiapkan bahan dan mengusulkan solusi sementara kepada pimpinan agar layanan tidak tertahan selama revisi resmi berlangsung.\",\"opsi\":{\"A\":\"Patuh pada aturan tertulis, tetapi kaku. Berkas warga terus tertahan dan aplikasi baru tidak dimanfaatkan.\",\"B\":\"Membuat dan memberlakukan alur kerja tanpa penetapan pimpinan melampaui kewenangan dan bisa menimbulkan masalah hukum pada izin yang diterbitkan.\",\"C\":\"Inisiatif konkret (memetakan perbedaan), solusi jangka pendek yang ditetapkan pimpinan, dan dorongan perbaikan jangka panjang. Layanan berjalan dan tetap sah.\",\"D\":\"Memberi masukan yang berguna, tetapi tanpa solusi sementara selama dua bulan revisi, sehingga berkas tetap tertahan.\",\"E\":\"Menghindari inisiatif dengan alasan kewenangan, padahal Anda bisa memberi masukan berharga.\"},\"konsep\":\"**Inisiatif yang sah:** identifikasi masalah → siapkan usulan → minta penetapan pimpinan → dorong perbaikan permanen. Inisiatif tanpa persetujuan dan kepatuhan yang kaku sama-sama bukan jawaban terbaik. Panduan sementara cukup berupa alur singkat yang ditandatangani pimpinan sampai SOP resmi selesai direvisi.\"},\"tips\":\"Pada soal aturan yang tertinggal, cari opsi yang memadukan **solusi sementara yang disahkan pimpinan** dengan **perbaikan aturan permanen**. Opsi yang memberlakukan aturan buatan sendiri bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-100\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Sebuah kampus mengundang Anda menjadi narasumber seminar tentang program kerja instansi Anda. Seminar diadakan pada hari kerja, dan panitia menyediakan honorarium. Topiknya sesuai dengan bidang tugas Anda. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melapor kepada atasan untuk meminta izin atau surat tugas, lalu menerima honorarium hanya sesuai ketentuan yang berlaku bagi ASN\"},{\"huruf\":\"B\",\"teks\":\"Meminta izin atasan untuk hadir sebagai narasumber, tetapi menolak seluruh honorarium yang disediakan panitia agar terhindar dari masalah\"},{\"huruf\":\"C\",\"teks\":\"Menolak undangan itu karena seminar diadakan pada hari kerja dan Anda harus tetap berada di kantor selama jam kerja\"},{\"huruf\":\"D\",\"teks\":\"Mengambil cuti tanpa memberi tahu instansi, lalu hadir sebagai pribadi sehingga honorarium dapat diterima penuh\"},{\"huruf\":\"E\",\"teks\":\"Mengutus staf Anda untuk menggantikan Anda sebagai narasumber tanpa memberi tahu atasan, karena Anda sedang sibuk\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":4,\"C\":3,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Berbagi pengetahuan tentang program instansi kepada kampus bermanfaat dan sejalan dengan tugas ASN. Karena materinya menyangkut tugas jabatan dan diadakan pada jam kerja, kehadiran Anda harus diketahui instansi, misalnya melalui izin atau surat tugas. Honorarium boleh diterima selama sesuai ketentuan yang berlaku, dan bila ada kewajiban melapor, kewajiban itu dijalankan.\",\"opsi\":{\"A\":\"Kegiatan bermanfaat dijalankan secara terbuka dan resmi, dan penerimaan honorarium mengikuti aturan. Transparan dan sesuai ketentuan.\",\"B\":\"Terbuka kepada atasan dan sangat hati-hati, tetapi menolak seluruh honorarium tanpa memeriksa ketentuannya tidak diperlukan. Sikapnya sedikit berlebihan.\",\"C\":\"Aman, tetapi melewatkan kesempatan berbagi pengetahuan dan membangun hubungan dengan kampus, padahal ada jalur izin resmi.\",\"D\":\"Menyembunyikan kegiatan yang membawakan program instansi demi honorarium penuh tidak jujur dan berpotensi melanggar aturan gratifikasi.\",\"E\":\"Melempar undangan kepada staf tanpa sepengetahuan atasan. Kampus mengundang Anda, dan instansi tidak mengetahui siapa yang mewakilinya.\"},\"konsep\":\"**Kegiatan di luar kantor yang berkaitan dengan jabatan:** beri tahu atasan dan minta izin/surat tugas, terima imbalan hanya sesuai ketentuan, laporkan bila diwajibkan. Keterbukaan adalah kunci profesionalisme dan integritas.\"},\"tips\":\"Jika soal menyebut honorarium atau imbalan, cari opsi yang **terbuka kepada instansi** dan **mengikuti ketentuan**. Menolak semua imbalan bukan selalu jawaban terbaik; menyembunyikan kegiatan selalu bernilai terendah.\",\"rujukan\":[]},{\"id\":\"p06-101\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Atasan mendelegasikan kepada Anda penetapan jadwal layanan keliling ke desa-desa. Jadwal yang Anda tetapkan ternyata bertepatan dengan hari pasar di dua desa, sehingga hanya sedikit warga yang datang dan kedua kepala desa mengeluh. Atasan sedang dinas luar selama seminggu. Dalam situasi ini, Anda akan ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menunggu atasan kembali untuk membahas perubahan jadwal, karena jadwal layanan itu sudah diumumkan atas nama kantor\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan kepada kedua kepala desa bahwa jadwal sudah ditetapkan, dan warga yang berhalangan dapat datang ke kantor kecamatan\"},{\"huruf\":\"C\",\"teks\":\"Menyampaikan kepada kedua kepala desa bahwa jadwal itu ditetapkan oleh atasan, agar keluhan tidak diarahkan kepada Anda\"},{\"huruf\":\"D\",\"teks\":\"Mengakui kekeliruan kepada kepala desa, menyusun jadwal pengganti di luar hari pasar sesuai kewenangan yang didelegasikan, dan melapor kepada atasan\"},{\"huruf\":\"E\",\"teks\":\"Melaporkan masalah itu kepada atasan melalui telepon dan mengusulkan jadwal pengganti di luar hari pasar untuk ia setujui terlebih dahulu\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":3,\"B\":2,\"C\":1,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Pendelegasian wewenang membawa tanggung jawab: keputusan yang Anda buat adalah keputusan Anda, termasuk kekeliruannya. Pegawai yang profesional mengakui kesalahan, memperbaikinya dengan memakai kewenangan yang sudah didelegasikan, dan tetap melaporkan kepada atasan agar ia mengetahui perkembangannya.\",\"opsi\":{\"A\":\"Hati-hati, tetapi pasif. Warga dua desa kehilangan layanan selama seminggu, padahal Anda berwenang memperbaikinya.\",\"B\":\"Defensif dan memindahkan beban kepada warga, tanpa memperbaiki kekeliruan yang Anda buat.\",\"C\":\"Melempar kesalahan kepada atasan tidak jujur, karena jadwal itu Anda sendiri yang menetapkan atas pendelegasian.\",\"D\":\"Mengakui kesalahan, memperbaikinya segera sesuai wewenang yang didelegasikan, dan atasan tetap mendapat laporan. Tanggung jawab penuh.\",\"E\":\"Komunikatif dan berorientasi solusi, tetapi meminta persetujuan untuk hal yang sudah didelegasikan memperlambat perbaikan, dan belum ada pengakuan kepada kepala desa.\"},\"konsep\":\"**Tanggung jawab atas wewenang yang didelegasikan:** akui kesalahan, perbaiki dengan kewenangan yang ada, laporkan kepada pemberi delegasi. Menyalahkan orang lain dan menunggu tanpa bertindak sama-sama tidak profesional. Mengakui kekeliruan kepada mitra (kepala desa) juga memulihkan kepercayaan, sehingga perubahan jadwal lebih mudah diterima warga.\"},\"tips\":\"Perhatikan kata **didelegasikan** di soal. Itu tanda Anda berwenang bertindak. Opsi terbaik memakai kewenangan itu untuk memperbaiki keadaan, lalu tetap melapor.\",\"rujukan\":[]},{\"id\":\"p06-102\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Laporan yang Anda susun diperiksa oleh Nita, pegawai yang baru setahun bekerja. Ia menemukan belasan kesalahan angka dan menandainya dengan rinci di setiap halaman. Sikap Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Memperbaiki semua kesalahan yang ditandai Nita tanpa banyak berkomentar, supaya laporan itu dapat segera diselesaikan\"},{\"huruf\":\"B\",\"teks\":\"Meminta atasan agar laporan-laporan Anda berikutnya diperiksa oleh pegawai lain yang masa kerjanya lebih senior\"},{\"huruf\":\"C\",\"teks\":\"Memperbaiki hanya angka yang menurut Anda penting, lalu menyampaikan kepada atasan bahwa sebagian temuan Nita kurang relevan\"},{\"huruf\":\"D\",\"teks\":\"Berterima kasih kepada Nita atas ketelitiannya, lalu memperbaiki seluruh kesalahan yang ia temukan dalam laporan tersebut\"},{\"huruf\":\"E\",\"teks\":\"Berterima kasih kepada Nita, memperbaiki semua kesalahan, lalu mencari penyebabnya agar tidak terulang\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":3,\"B\":2,\"C\":1,\"D\":4,\"E\":5},\"pembahasan\":{\"inti\":\"Profesionalisme berarti menerima koreksi berdasarkan isinya, bukan berdasarkan senioritas orang yang mengoreksi. Pegawai yang profesional menghargai masukan, memperbaiki seluruh kesalahan, dan belajar dari polanya agar kualitas kerjanya meningkat. Sikap ini juga membangun budaya kerja yang membuat rekan junior berani menyampaikan temuan.\",\"opsi\":{\"A\":\"Kesalahan diperbaiki, tetapi tanpa apresiasi kepada pemeriksa dan tanpa upaya mencegah kesalahan serupa.\",\"B\":\"Menghindari koreksi dengan alasan senioritas. Kualitas pemeriksaan bukan ditentukan oleh masa kerja.\",\"C\":\"Membiarkan sebagian kesalahan dan meremehkan temuan yang benar merugikan kualitas laporan dan tidak jujur kepada atasan.\",\"D\":\"Menghargai masukan dan memperbaiki semuanya, tetapi belum belajar dari penyebab kesalahan.\",\"E\":\"Menghargai masukan, memperbaiki seluruhnya, dan mencari akar masalah agar tidak terulang. Lengkap dan berorientasi perbaikan.\"},\"konsep\":\"**Menerima koreksi secara profesional:** hargai pemberi masukan → perbaiki seluruh temuan yang benar → cari penyebab dan cegah terulang. Ego atau senioritas tidak menjadi ukuran. Mencari penyebab bisa berupa memeriksa ulang rumus lembar kerja, membuat daftar periksa sebelum menyerahkan laporan, atau meminta pemeriksaan silang secara rutin.\"},\"tips\":\"Pada soal menerima kritik atau koreksi, bobot tertinggi diberikan kepada opsi yang menambahkan **belajar dari penyebab** di atas sekadar memperbaiki. Opsi yang menolak koreksi karena senioritas bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p06-103\",\"kategori\":\"TKP\",\"subtopik\":\"Profesionalisme\",\"pertanyaan\":\"Dimas, teman seangkatan Anda sejak CPNS, baru dilantik menjadi kepala seksi tempat Anda bekerja. Beberapa rekan mulai bergunjing bahwa Anda akan diistimewakan, dan Dimas tampak canggung saat memberi tugas kepada Anda. Respons terbaik Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menjaga jarak dengan Dimas selama di kantor agar tidak muncul kesan pilih kasih di mata rekan kerja yang lain\"},{\"huruf\":\"B\",\"teks\":\"Mengajak Dimas membicarakan hubungan kerja yang profesional, menerima tugas seperti rekan lain, dan menunjukkan kinerja yang terukur\"},{\"huruf\":\"C\",\"teks\":\"Menjalankan setiap tugas dari Dimas dengan baik tanpa memperlihatkan keakraban di kantor, agar gunjingan rekan-rekan mereda dengan sendirinya\"},{\"huruf\":\"D\",\"teks\":\"Meminta Dimas memberi Anda tugas yang lebih ringan sebagai teman lama, karena Anda sedang sibuk mengurus keperluan keluarga\"},{\"huruf\":\"E\",\"teks\":\"Mengajukan permohonan pindah ke seksi lain agar Anda tidak perlu bekerja di bawah pimpinan teman seangkatan sendiri\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":3,\"B\":5,\"C\":4,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Hubungan pribadi tidak boleh memengaruhi hubungan kerja. Ketika teman menjadi atasan, kedua pihak perlu menyesuaikan diri. Pegawai yang profesional membantu atasan barunya dengan membicarakan batas hubungan kerja secara terbuka, menerima perlakuan yang sama dengan rekan lain, dan membuktikan lewat kinerja bahwa tidak ada perlakuan istimewa.\",\"opsi\":{\"A\":\"Mencegah kesan pilih kasih, tetapi menjauh justru bisa membuat kerja sama kaku. Kecanggungan Dimas juga tidak terselesaikan.\",\"B\":\"Kecanggungan dibicarakan secara terbuka, perlakuan disamakan dengan rekan lain, dan kinerja yang terukur menjawab gunjingan.\",\"C\":\"Profesional dalam bekerja, tetapi tidak membantu Dimas mengatasi kecanggungannya karena tidak ada pembicaraan terbuka.\",\"D\":\"Memanfaatkan pertemanan untuk mendapat keringanan adalah perlakuan istimewa yang tidak adil bagi rekan lain.\",\"E\":\"Menghindari situasi, padahal masalahnya bisa diselesaikan dengan komunikasi dan sikap profesional.\"},\"konsep\":\"**Teman menjadi atasan:** bicarakan batas hubungan kerja, minta diperlakukan sama, buktikan dengan kinerja. Menjaga jarak secara berlebihan atau meminta keistimewaan sama-sama keliru. Bagi atasan baru, dukungan terbuka dari teman lama justru memudahkannya bersikap adil kepada seluruh anggota seksi.\"},\"tips\":\"Jika ada hubungan pribadi dalam soal TKP (teman, saudara, sahabat), cari opsi yang **memisahkan hubungan pribadi dari urusan kerja secara terbuka**. Opsi yang memanfaatkan kedekatan bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-104\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Anda staf Badan Kesatuan Bangsa dan Politik kabupaten. Sebuah kelompok menyampaikan pemberitahuan kegiatan “pelatihan bela diri dan kajian”. Saat memeriksa akun media sosial kelompok itu, Anda menemukan unggahan yang menyebut aparat negara sebagai “musuh yang halal diperangi”. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mencatat pemberitahuan sesuai prosedur seperti biasa, karena kelompok tersebut belum terbukti melakukan pelanggaran hukum apa pun\"},{\"huruf\":\"B\",\"teks\":\"Mengunggah tangkapan layar akun kelompok itu ke media sosial pribadi Anda, supaya masyarakat luas segera waspada terhadap mereka\"},{\"huruf\":\"C\",\"teks\":\"Mendokumentasikan temuan dan melaporkannya kepada pimpinan untuk dikoordinasikan dengan kepolisian, sambil memproses berkas sesuai prosedur\"},{\"huruf\":\"D\",\"teks\":\"Melaporkan temuan itu kepada pimpinan, lalu menyarankan agar kegiatan kelompok tersebut ditunda dulu sampai ada penilaian dari aparat keamanan yang berwenang\"},{\"huruf\":\"E\",\"teks\":\"Meneruskan berkas itu kepada bagian lain di kantor, karena menilai ideologi suatu kelompok bukanlah bagian dari tugas Anda\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":1,\"C\":5,\"D\":4,\"E\":2},\"pembahasan\":{\"inti\":\"Unggahan yang menyebut aparat negara sebagai pihak yang “halal diperangi” adalah narasi yang membenarkan kekerasan dan merupakan tanda bahaya radikalisme. Pegawai yang menemukannya wajib mendokumentasikan dan melaporkan melalui jalur resmi agar aparat yang berwenang menilai dan menindaklanjuti. Di sisi lain, proses administrasi tetap dijalankan sesuai prosedur, tanpa tindakan sepihak di luar kewenangan.\",\"opsi\":{\"A\":\"Prosedural, tetapi mengabaikan tanda bahaya yang jelas. Informasi penting tidak sampai kepada pihak yang berwenang.\",\"B\":\"Menyebarkan temuan ke media sosial pribadi dapat memicu kepanikan, persekusi, atau membuat kelompok itu menghapus jejak sebelum diperiksa.\",\"C\":\"Bukti didokumentasikan, informasi dibawa ke pimpinan dan aparat lewat jalur resmi, dan proses administrasi tetap sesuai prosedur.\",\"D\":\"Melapor dengan tepat, tetapi mengusulkan penundaan sebelum ada penilaian aparat berarti mendahului kewenangan pihak yang berwenang.\",\"E\":\"Melempar tanggung jawab, padahal Anda yang menemukan informasi itu dan instansi Anda memang menangani kewaspadaan nasional.\"},\"konsep\":\"**Pola penanganan tanda radikalisme di tempat kerja:** dokumentasikan → laporkan lewat jalur resmi → koordinasikan dengan aparat berwenang → jalankan tugas sesuai prosedur. Hindari menyebarkan sendiri, mengabaikan, atau bertindak di luar kewenangan.\"},\"tips\":\"Pada soal antiradikalisme, opsi yang **menyebarkan temuan ke publik** atau **bertindak sendiri** biasanya bernilai 1. Opsi bernilai 5 membawa informasi kepada pihak yang berwenang lewat jalur resmi tanpa mengabaikan prosedur.\",\"rujukan\":[]},{\"id\":\"p06-105\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Rekan satu ruangan Anda membagikan berkas buku digital di grup percakapan kantor. Isinya mengajarkan bahwa orang yang tidak sepaham dengan kelompok tertentu, termasuk sesama pemeluk agama yang sama, boleh dianggap kafir dan dimusuhi. Anda memutuskan untuk ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengingatkan rekan secara pribadi tentang bahaya isi buku itu, meminta admin menghapus berkasnya, dan melapor kepada atasan untuk pembinaan\"},{\"huruf\":\"B\",\"teks\":\"Meminta admin grup segera menghapus berkas itu, lalu mengingatkan seluruh anggota grup agar tidak ikut menyebarkannya kembali\"},{\"huruf\":\"C\",\"teks\":\"Tidak membuka berkas itu dan keluar dari grup percakapan kantor supaya Anda tidak ikut terpapar paham semacam itu\"},{\"huruf\":\"D\",\"teks\":\"Melaporkan berkas itu kepada atasan dan menyerahkan seluruh penanganannya kepada atasan tanpa melakukan hal lain\"},{\"huruf\":\"E\",\"teks\":\"Membalas di grup dengan mengecam rekan itu sebagai penyebar paham sesat di hadapan semua anggota grup kantor\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":4,\"C\":2,\"D\":3,\"E\":1},\"pembahasan\":{\"inti\":\"Ajaran yang membenarkan pengafiran dan permusuhan terhadap orang yang berbeda pandangan dapat menjadi pintu masuk radikalisme. Penyebarannya di grup kantor perlu dihentikan. Rekan yang membagikan juga perlu diajak berdialog, karena ia mungkin sedang terpapar, dan penanganan lanjutannya diserahkan kepada atasan melalui pembinaan, bukan dengan mempermalukannya di depan umum.\",\"opsi\":{\"A\":\"Penyebaran dihentikan, rekan didekati secara pribadi, dan atasan dilibatkan untuk pembinaan. Pencegahan dan pendekatan manusiawi berjalan bersama.\",\"B\":\"Menghentikan penyebaran dengan cepat, tetapi rekan yang mungkin terpapar tidak didekati dan atasan tidak dilibatkan.\",\"C\":\"Melindungi diri sendiri, tetapi membiarkan anggota grup lain terpapar dan rekan itu tidak mendapat pembinaan.\",\"D\":\"Melapor itu tepat, tetapi pasif. Berkas tetap beredar di grup sampai atasan bertindak, dan rekan tidak diajak berdialog.\",\"E\":\"Mempermalukan rekan di depan umum bisa membuatnya makin defensif dan memicu perdebatan yang memperkeruh suasana kantor.\"},\"konsep\":\"**Menangani konten radikal dari rekan:** hentikan penyebaran → dekati rekan secara pribadi → libatkan atasan untuk pembinaan. Pendekatan yang mempermalukan sering justru mendorong orang makin dalam ke kelompok tertutup.\"},\"tips\":\"Bandingkan opsi berdasarkan tiga unsur: **menghentikan penyebaran**, **mendekati rekan secara pribadi**, dan **melibatkan pihak berwenang**. Opsi dengan ketiganya bernilai 5.\",\"rujukan\":[]},{\"id\":\"p06-106\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Rafi, siswa SMK yang magang di kantor Anda, menolak duduk satu meja dengan rekan yang berbeda agama karena menurutnya orang itu najis. Ia mengaku mendapat pandangan itu dari kajian daring yang rutin ia ikuti. Anda pembimbing magangnya. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Mengatur tugas Rafi agar ia tidak perlu bekerja bersama rekan yang berbeda agama sampai masa magangnya selesai\"},{\"huruf\":\"B\",\"teks\":\"Mengajak Rafi berdialog tentang sumber pandangannya, menjelaskan nilai saling menghormati, dan berkoordinasi dengan guru pembimbing sekolahnya\"},{\"huruf\":\"C\",\"teks\":\"Mengajak Rafi berdiskusi tentang sikap saling menghormati di tempat kerja, lalu memintanya tetap bekerja sama dengan semua rekan\"},{\"huruf\":\"D\",\"teks\":\"Melaporkan sikap Rafi kepada guru pembimbing di sekolahnya, agar pihak sekolah yang melakukan pembinaan lebih lanjut\"},{\"huruf\":\"E\",\"teks\":\"Menegur Rafi dengan keras di depan rekan-rekan kantor agar ia merasa malu dan tidak lagi mengulangi sikapnya\"}],\"gambar\":[],\"kunci\":\"B\",\"bobot\":{\"A\":2,\"B\":5,\"C\":4,\"D\":3,\"E\":1},\"pembahasan\":{\"inti\":\"Memandang orang berbeda agama sebagai najis dan menolak bergaul dengannya adalah sikap intoleran yang bisa berkembang menjadi radikalisme, terutama pada remaja yang aktif mengikuti kajian daring tertentu. Pembimbing perlu mendekati Rafi dengan dialog, karena ia masih belajar, sambil menanamkan nilai saling menghormati dan melibatkan sekolah agar pembinaannya berlanjut.\",\"opsi\":{\"A\":\"Menghindari gesekan dengan mengikuti sikap intoleran Rafi. Pandangannya justru makin kuat karena seolah dibenarkan.\",\"B\":\"Dialog yang menggali sumber pandangan, penanaman nilai saling menghormati, dan koordinasi dengan sekolah untuk pembinaan berkelanjutan.\",\"C\":\"Dialog dan arahan sudah tepat, tetapi sumber pandangannya tidak digali dan sekolah tidak dilibatkan.\",\"D\":\"Melibatkan sekolah itu tepat, tetapi Anda sebagai pembimbing di tempat magang tidak berdialog langsung dengan Rafi.\",\"E\":\"Mempermalukan remaja di depan umum dapat membuatnya merasa dimusuhi dan makin dekat dengan kelompok yang menanamkan pandangan itu.\"},\"konsep\":\"**Pencegahan radikalisme pada remaja:** dekati dengan dialog, pahami sumber pandangannya (termasuk kajian daring), tanamkan nilai saling menghormati, dan libatkan pihak yang membinanya (sekolah, keluarga).\"},\"tips\":\"Pada soal intoleransi yang melibatkan anak muda, opsi bernilai 5 biasanya memuat **dialog yang menggali sumber pandangan** dan **kerja sama dengan pihak pembina**. Opsi yang mempermalukan atau menuruti sikap intoleran bernilai rendah.\",\"rujukan\":[]},{\"id\":\"p06-107\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Seorang rekan menunjukkan kepada Anda pesan dari akun anonim yang mengajak ASN “hijrah” meninggalkan pekerjaan di pemerintahan, karena negara dianggap tidak sah dan gaji ASN disebut haram. Rekan itu tampak mulai ragu dan meminta pendapat Anda. Cara Anda menyikapinya adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyarankan rekan itu mengabaikan pesan tersebut, karena ajakan semacam itu sebenarnya tidak perlu dipikirkan terlalu serius\"},{\"huruf\":\"B\",\"teks\":\"Menjelaskan bahwa negara Indonesia sah berdasarkan konstitusi dan pekerjaan ASN merupakan pengabdian, lalu menyarankannya segera memblokir akun anonim tersebut\"},{\"huruf\":\"C\",\"teks\":\"Mengatakan kepada rekan itu bahwa keputusan untuk berhenti bekerja sepenuhnya merupakan urusan pribadinya sendiri\"},{\"huruf\":\"D\",\"teks\":\"Membalas pesan dari akun anonim itu dengan kata-kata kasar, supaya pengirimnya jera dan berhenti mengganggu para ASN\"},{\"huruf\":\"E\",\"teks\":\"Mendengarkan keraguannya, menjelaskan dasar sahnya negara, mengajaknya bertanya kepada tokoh agama moderat, dan melaporkan akun itu\"}],\"gambar\":[],\"kunci\":\"E\",\"bobot\":{\"A\":3,\"B\":4,\"C\":2,\"D\":1,\"E\":5},\"pembahasan\":{\"inti\":\"Narasi bahwa negara tidak sah dan bekerja untuk negara itu haram adalah salah satu pola rekrutmen kelompok radikal. Rekan yang mulai ragu perlu didampingi: didengarkan, diberi penjelasan yang benar, dan dihubungkan dengan rujukan keagamaan yang moderat dan tepercaya. Akun penyebar ajakan juga perlu dilaporkan agar tidak menjangkau orang lain.\",\"opsi\":{\"A\":\"Arah sarannya benar, tetapi keraguan rekan tidak dijawab. Keraguan yang dibiarkan mudah diisi oleh pihak yang mengajaknya.\",\"B\":\"Memberi penjelasan yang benar dan memutus kontak, tetapi tanpa mendengarkan keraguannya, tanpa rujukan keagamaan yang moderat, dan tanpa melaporkan akun.\",\"C\":\"Menghindar dari tanggung jawab moral, padahal rekan sedang menjadi sasaran ajakan yang berbahaya.\",\"D\":\"Membalas dengan kasar tidak menyelesaikan masalah, bisa memancing konflik, dan memberi bahan bagi kelompok itu untuk memojokkan ASN.\",\"E\":\"Rekan didengarkan, diberi penjelasan dan rujukan yang tepercaya, dan sumber ajakan dilaporkan. Pendampingan dan pencegahan berjalan bersama.\"},\"konsep\":\"**Menghadapi ajakan radikal yang menyasar rekan:** dengarkan → luruskan dengan penjelasan yang benar → hubungkan dengan rujukan moderat → laporkan sumber ajakan. Mengabaikan dan membalas dengan kasar sama-sama tidak efektif.\"},\"tips\":\"Jika soal menggambarkan rekan yang **mulai ragu**, opsi bernilai 5 biasanya diawali dengan **mendengarkan**. Opsi yang langsung menceramahi tanpa mendengar bernilai 4, dan yang membalas pelaku dengan emosi bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-108\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Anda staf kelurahan. Ketua RT melapor bahwa penghuni sebuah rumah kontrakan sering berganti, jarang bersosialisasi, menolak didata, dan pernah terlihat menurunkan banyak jeriken berisi bahan kimia pada malam hari. Warga mulai resah dan berencana menggerebek rumah itu bersama-sama. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Menyarankan ketua RT agar menenangkan warga dan menunggu sampai ada bukti yang lebih jelas sebelum melaporkan apa pun\"},{\"huruf\":\"B\",\"teks\":\"Mendukung rencana warga memeriksa rumah itu bersama-sama, asalkan pemeriksaan dilakukan dengan tertib dan tanpa kekerasan\"},{\"huruf\":\"C\",\"teks\":\"Meminta ketua RT mendata ulang penghuni sesuai aturan wajib lapor tamu, lalu menyerahkan hasil pendataan itu ke kelurahan\"},{\"huruf\":\"D\",\"teks\":\"Mencegah warga bertindak sendiri, mencatat keterangan ketua RT, lalu segera melapor kepada lurah dan Bhabinkamtibmas untuk ditindaklanjuti\"},{\"huruf\":\"E\",\"teks\":\"Segera melaporkan seluruh informasi dari ketua RT kepada lurah dan Bhabinkamtibmas, agar rumah kontrakan itu diperiksa oleh aparat keamanan yang berwenang\"}],\"gambar\":[],\"kunci\":\"D\",\"bobot\":{\"A\":2,\"B\":1,\"C\":3,\"D\":5,\"E\":4},\"pembahasan\":{\"inti\":\"Informasi warga tentang aktivitas yang mencurigakan perlu ditanggapi serius dan diteruskan kepada aparat yang berwenang, tanpa menuduh siapa pun lebih dulu. Ada dua risiko yang harus dicegah bersamaan: ancaman nyata yang terlambat ditangani, dan warga yang main hakim sendiri, yang bisa membahayakan warga sendiri maupun orang yang belum tentu bersalah.\",\"opsi\":{\"A\":\"Menunda pelaporan padahal tanda-tandanya cukup untuk diperiksa aparat. Jika memang ada ancaman, penundaan bisa berakibat fatal.\",\"B\":\"Penggerebekan oleh warga adalah main hakim sendiri. Selain melanggar hukum, tindakan ini berbahaya jika bahan kimia itu memang bahan peledak, dan merugikan penghuni jika ternyata tidak bersalah.\",\"C\":\"Pendataan sesuai aturan itu berguna, tetapi lambat dan tidak menjawab dua risiko utama: ancaman yang mungkin nyata dan rencana penggerebekan.\",\"D\":\"Rencana main hakim sendiri dicegah, keterangan dicatat, dan informasi segera disampaikan kepada lurah dan aparat keamanan di tingkat kelurahan.\",\"E\":\"Pelaporannya cepat dan tepat, tetapi rencana penggerebekan oleh warga belum dicegah.\"},\"konsep\":\"**Laporan aktivitas mencurigakan:** cegah tindakan sepihak warga → catat informasi → laporkan segera kepada aparat berwenang (Bhabinkamtibmas, polisi) → jangan menuduh atau menyebarkan identitas sebelum ada pemeriksaan.\"},\"tips\":\"Jika soal memuat dua masalah sekaligus (ancaman dan rencana warga bertindak sendiri), opsi bernilai 5 menangani **keduanya**. Opsi yang hanya melapor bernilai 4, dan opsi yang mendukung warga bertindak sendiri bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-109\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Di grup percakapan orang tua murid kelas anak Anda, seorang wali murid membagikan lembar kerja mewarnai untuk anak SD. Lembar kerja itu memuat kalimat kebencian terhadap pemeluk agama lain, dan beberapa orang tua menyukai unggahan tersebut. Langkah yang paling tepat Anda ambil adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Tidak memakai lembar kerja itu untuk anak Anda sendiri, dan memilih diam di grup agar tidak terjadi perdebatan\"},{\"huruf\":\"B\",\"teks\":\"Mengingatkan dengan santun di grup bahwa isi lembar kerja itu tidak pantas untuk anak-anak, dan meminta agar tidak disebarkan lagi\"},{\"huruf\":\"C\",\"teks\":\"Mengingatkan dengan santun di grup bahwa lembar kerja itu menanamkan kebencian, lalu menyampaikannya kepada wali kelas untuk ditindaklanjuti\"},{\"huruf\":\"D\",\"teks\":\"Menyebarkan tangkapan layar unggahan itu ke media sosial dengan menyebutkan nama wali murid yang membagikannya\"},{\"huruf\":\"E\",\"teks\":\"Keluar dari grup orang tua murid tersebut agar anak Anda tidak lagi terpengaruh oleh isi-isi semacam itu\"}],\"gambar\":[],\"kunci\":\"C\",\"bobot\":{\"A\":3,\"B\":4,\"C\":5,\"D\":1,\"E\":2},\"pembahasan\":{\"inti\":\"Menanamkan kebencian terhadap pemeluk agama lain sejak usia dini adalah benih intoleransi dan radikalisme. Orang tua yang menyadarinya perlu mengingatkan dengan santun agar penyebaran berhenti, dan melibatkan sekolah sebagai pihak yang berwenang membina lingkungan belajar anak. Caranya harus meredakan, bukan memperuncing perselisihan antarorang tua.\",\"opsi\":{\"A\":\"Anak Anda terlindungi, tetapi anak-anak lain tetap terpapar dan orang tua lain mengira isi itu wajar karena tidak ada yang mengingatkan.\",\"B\":\"Mengingatkan dengan santun dan menghentikan penyebaran, tetapi sekolah tidak dilibatkan untuk memastikan materi semacam itu tidak masuk ke kelas.\",\"C\":\"Teguran santun menghentikan penyebaran, dan sekolah dilibatkan untuk menindaklanjuti. Pencegahan berjalan di grup dan di lingkungan belajar anak.\",\"D\":\"Membuka nama orang di media sosial memicu perundungan dan konflik terbuka, tanpa menyelesaikan masalah di lingkungan sekolah.\",\"E\":\"Menghindar. Anak Anda mungkin aman dari grup, tetapi masalahnya tetap ada di kelas yang sama.\"},\"konsep\":\"**Mencegah intoleransi pada anak:** hentikan penyebaran materi kebencian dengan cara santun dan libatkan sekolah sebagai pembina. Hindari diam, menghindar, maupun mempermalukan pihak lain di ruang publik.\"},\"tips\":\"Pada soal antiradikalisme di lingkungan sehari-hari, opsi bernilai 5 biasanya **mengingatkan dengan santun** dan **melibatkan pihak berwenang** (sekolah, RT, atasan). Opsi yang menyebarkan identitas orang ke publik bernilai 1.\",\"rujukan\":[]},{\"id\":\"p06-110\",\"kategori\":\"TKP\",\"subtopik\":\"Antiradikalisme\",\"pertanyaan\":\"Anda anggota Satpol PP kecamatan. Sebuah organisasi kemasyarakatan berencana “menertibkan” warung makan yang buka pada siang hari selama Ramadan. Perda di daerah Anda tidak melarang warung buka, hanya mengatur agar warung memasang penutup. Beberapa pemilik warung meminta perlindungan. Tindakan Anda adalah ....\",\"opsi\":[{\"huruf\":\"A\",\"teks\":\"Melapor kepada atasan dan kepolisian, menjelaskan kepada ormas bahwa penertiban adalah wewenang aparat sesuai perda, dan mengingatkan warung memasang penutup\"},{\"huruf\":\"B\",\"teks\":\"Berkoordinasi dengan kepolisian untuk mengamankan warung-warung yang buka dan mencegah tindakan anggota ormas itu pada hari penertiban yang mereka rencanakan\"},{\"huruf\":\"C\",\"teks\":\"Mengingatkan para pemilik warung agar memasang penutup sesuai perda, tanpa menanggapi rencana ormas tersebut sama sekali\"},{\"huruf\":\"D\",\"teks\":\"Meminta pemilik warung menutup usahanya sementara selama Ramadan supaya tidak terjadi bentrokan dengan anggota ormas itu\"},{\"huruf\":\"E\",\"teks\":\"Mempersilakan ormas itu menertibkan warung asalkan tanpa kekerasan, karena tujuan mereka menghormati bulan suci Ramadan\"}],\"gambar\":[],\"kunci\":\"A\",\"bobot\":{\"A\":5,\"B\":4,\"C\":3,\"D\":2,\"E\":1},\"pembahasan\":{\"inti\":\"Penegakan peraturan adalah kewenangan aparat negara, bukan kelompok masyarakat, walaupun tujuannya terdengar baik. Membiarkan kelompok mana pun menertibkan warga lain atas nama keyakinan membuka jalan bagi kekerasan dan intoleransi. Aparat harus melindungi warga yang taat aturan, mencegah tindakan sepihak, dan tetap memastikan aturan yang berlaku dijalankan oleh semua pihak.\",\"opsi\":{\"A\":\"Pencegahan lewat jalur resmi, kewenangan dijelaskan kepada ormas secara dialogis, dan aturan perda tetap ditegakkan kepada pemilik warung. Adil bagi semua pihak.\",\"B\":\"Melindungi warga dengan tepat, tetapi tanpa dialog dengan ormas dan tanpa memastikan warung mematuhi ketentuan penutup.\",\"C\":\"Menegakkan perda, tetapi mengabaikan ancaman tindakan sepihak terhadap warga yang meminta perlindungan.\",\"D\":\"Menghindari konflik dengan membatasi hak usaha yang sah. Warga yang taat aturan justru menanggung kerugian.\",\"E\":\"Menyerahkan kewenangan penertiban kepada ormas membenarkan main hakim sendiri dan berisiko memicu kekerasan.\"},\"konsep\":\"**Negara hukum dan kerukunan:** penertiban hanya oleh aparat berwenang dan sesuai aturan; warga yang taat aturan dilindungi; kelompok yang ingin bertindak sendiri diajak dialog dan dicegah. Menghormati keyakinan tidak boleh diwujudkan dengan memaksa warga lain.\"},\"tips\":\"Jika soal menyebut kelompok masyarakat ingin “menertibkan” sesuatu sendiri, opsi yang **mempersilakan** selalu bernilai 1. Opsi bernilai 5 melindungi warga, berdialog dengan kelompok itu, dan menegakkan aturan yang berlaku secara adil.\",\"rujukan\":[]}],\"judul\":\"Paket 06\",\"format\":{\"urutan\":[\"TWK\",\"TIU\",\"TKP\"],\"sumber\":\"https://www.bkn.go.id/storage/2024/08/2024kepmenpanrb321-Nilai-Ambang-Batas.pdf\",\"durasiResmiMenit\":100,\"acuanDurasi\":\"SKD CPNS TA 2024 (KepmenPANRB No. 321 Tahun 2024)\",\"subtes\":{\"TWK\":{\"jumlahSoal\":30,\"nilaiBenar\":5,\"nilaiSalah\":0,\"nilaiMaks\":150,\"ambangBatas\":null},\"TIU\":{\"jumlahSoal\":35,\"nilaiBenar\":5,\"nilaiSalah\":0,\"nilaiMaks\":175,\"ambangBatas\":null},\"TKP\":{\"jumlahSoal\":45,\"nilaiBenar\":0,\"nilaiSalah\":0,\"nilaiMaks\":225,\"ambangBatas\":null}}}}}]}]\n"])</script></body></html>
