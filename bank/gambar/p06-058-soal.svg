<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 120" role="img"><title>Empat gambar berurutan. Setiap gambar memiliki bingkai persegi putus-putus dengan delapan titik letak: empat pojok dan empat tengah sisi. Ada satu lingkaran putih dan satu segitiga hitam. Gambar 1: lingkaran di pojok kiri atas, segitiga di tengah sisi bawah. Gambar 2: lingkaran di tengah sisi atas, segitiga di tengah sisi kanan. Gambar 3: lingkaran di pojok kanan atas, segitiga di tengah sisi atas. Gambar 4: lingkaran di tengah sisi kanan, segitiga di tengah sisi kiri. Sel kelima bertanda tanya.</title><rect width="568" height="120" fill="#FFFFFF"/><g transform="translate(10,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="16" y="16" width="68" height="68" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="16" cy="16" r="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/><polygon points="50,73 61.3,92.5 38.7,92.5" fill="#111827" stroke="#111827" stroke-width="2" stroke-linejoin="round"/></g><g transform="translate(122,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="16" y="16" width="68" height="68" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="50" cy="16" r="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/><polygon points="84,39 95.3,58.5 72.7,58.5" fill="#111827" stroke="#111827" stroke-width="2" stroke-linejoin="round"/></g><g transform="translate(234,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="16" y="16" width="68" height="68" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="84" cy="16" r="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/><polygon points="50,5 61.3,24.5 38.7,24.5" fill="#111827" stroke="#111827" stroke-width="2" stroke-linejoin="round"/></g><g transform="translate(346,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="16" y="16" width="68" height="68" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="84" cy="50" r="10" fill="#FFFFFF" stroke="#111827" stroke-width="3"/><polygon points="16,39 27.3,58.5 4.7,58.5" fill="#111827" stroke="#111827" stroke-width="2" stroke-linejoin="round"/></g><g transform="translate(458,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="50" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">?</text></g></svg>
