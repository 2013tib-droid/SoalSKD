<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 276" role="img"><title>Lima gambar berlabel A sampai E. Setiap gambar berisi satu lingkaran dan satu segitiga yang saling bertumpang tindih dengan posisi dan ukuran berbeda, serta satu titik hitam. Letak titik: A, B, C, dan D di dalam segitiga tetapi di luar lingkaran; E di dalam segitiga dan di dalam lingkaran.</title><rect width="352" height="276" fill="#FFFFFF"/><g transform="translate(10,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><circle cx="36" cy="38" r="24" fill="none" stroke="#111827" stroke-width="3"/><polygon points="54,20 88,84 24,84" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><circle cx="62" cy="68" r="5.5" fill="#111827"/></g><text x="60.0" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">A</text><g transform="translate(126,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><circle cx="64" cy="64" r="22" fill="none" stroke="#111827" stroke-width="3"/><polygon points="14,16 84,22 30,84" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="35" r="5.5" fill="#111827"/></g><text x="176.0" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">B</text><g transform="translate(242,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><circle cx="50" cy="30" r="21" fill="none" stroke="#111827" stroke-width="3"/><polygon points="50,40 88,88 12,88" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="69" r="5.5" fill="#111827"/></g><text x="292.0" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">C</text><g transform="translate(68.0,140