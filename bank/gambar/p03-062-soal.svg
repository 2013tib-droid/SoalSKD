<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 120" role="img"><title>Analogi dengan bangun dari persegi-persegi kecil. Gambar pertama: bangun hitam dari empat persegi, tiga tersusun tegak dan satu menempel di kanan persegi paling bawah. Gambar kedua: bangun yang sama berwarna putih, tiga persegi mendatar di atas dan satu menempel di bawah persegi paling kiri. Gambar ketiga: bangun putih dari lima persegi, blok 2 × 2 di kanan dan satu persegi di kiri baris atas. Gambar keempat bertanda tanya.</title><rect width="510" height="120" fill="#FFFFFF"/><g transform="translate(10,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="30" y="20" width="20" height="20" fill="#111827" stroke="#111827" stroke-width="2.5"/><rect x="30" y="40" width="20" height="20" fill="#111827" stroke="#111827" stroke-width="2.5"/><rect x="30" y="60" width="20" height="20" fill="#111827" stroke="#111827" stroke-width="2.5"/><rect x="50" y="60" width="20" height="20" fill="#111827" stroke="#111827" stroke-width="2.5"/></g><text x="125.0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">:</text><g transform="translate(140,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="20" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="20" y="50" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="40" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="60" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/></g><text x="255.0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">=</text><g transform="translate(270,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" /><rect x="20" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="40" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="40" y="50" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="60" y="30" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/><rect x="60" y="50" width="20" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/></g><text x="385.0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">:</text><g transform="translate(400,10)"><rect x="1" y="1" width="98" height="98" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="50" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">?</text></g></svg>
